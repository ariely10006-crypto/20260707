<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>親密關係傾向測驗</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    min-height:100%;
}

body{
    min-height:100vh;
    font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;
    background:#f1eeeb;
    color:#45403d;
    transition:
        background 5s ease,
        color 5s ease;
    overflow-x:hidden;
}

#app{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:25px;
    transition:transform .15s ease;
}

.card{
    width:680px;
    max-width:94vw;
    padding:42px;
    background:rgba(255,255,255,.97);
    border:1px solid #ddd7d3;
    box-shadow:0 15px 50px rgba(45,30,25,.08);

    transition:
        background 5s ease,
        border-color 5s ease,
        box-shadow 5s ease;
}

h1{
    margin:0 0 9px;
    text-align:center;
    font-size:27px;
    font-weight:400;
    letter-spacing:4px;
}

.subtitle{
    text-align:center;
    color:#aaa19d;
    font-size:11px;
    letter-spacing:2px;
    margin-bottom:34px;
}

.description{
    font-size:15px;
    line-height:2;
    color:#696360;
}

.start-btn{
    display:block;
    margin:34px auto 0;
    padding:12px 42px;
    background:#fff;
    color:#514a47;
    border:1px solid #aaa29d;
    cursor:pointer;
    font-family:inherit;
    transition:
        background .25s,
        border .25s,
        transform .15s;
}

.start-btn:hover{
    background:#eee8e4;
    border-color:#80665e;
}

.start-btn:active{
    transform:scale(.98);
}

.question-number{
    color:#aaa19d;
    font-size:12px;
    letter-spacing:1px;
    margin-bottom:22px;
}

.question{
    font-size:20px;
    line-height:1.8;
    margin-bottom:25px;
}

.feedback{
    min-height:48px;
    margin-top:18px;
    font-size:13px;
    line-height:1.8;
    color:#8c8581;
}

.options{
    display:flex;
    flex-direction:column;
    gap:9px;
}

.option{
    width:100%;
    padding:14px 16px;
    text-align:left;
    background:#fff;
    color:#403b39;
    border:1px solid #d8d2cf;
    cursor:pointer;
    font-family:inherit;

    transition:
        background .25s,
        border .25s,
        opacity .35s,
        transform .12s;
}

.option:hover{
    background:#f5efec;
    border-color:#a98b82;
}

.option:active{
    transform:scale(.995);
}

.option.selected{
    background:#eee5e1;
    border-color:#927067;
}

.option.special{
    border-color:#a05b52;
    box-shadow:0 0 12px rgba(130,40,30,.18);
}

.option.fade{
    opacity:0;
    pointer-events:none;
}

.option:disabled{
    cursor:default;
}

.progress{
    height:2px;
    margin-top:28px;
    background:#e6dfdc;
}

.progress-bar{
    height:100%;
    background:#99786f;
    transition:width .5s ease;
}


/* =========================================
   紅黑恐怖模式
========================================= */

body.horror{
    background:
        radial-gradient(
            circle at 50% 40%,
            #4b2927 0%,
            #291514 50%,
            #090505 100%
        );

    color:#ddd0cc;
}

body.horror .card{
    background:rgba(27,14,14,.95);
    border-color:#67433e;
    box-shadow:0 25px 90px rgba(0,0,0,.65);
}

body.horror h1,
body.horror .question{
    color:#dfccc7;
}

body.horror .subtitle,
body.horror .question-number{
    color:#98716b;
}

body.horror .description{
    color:#bca9a4;
}

body.horror .option{
    background:#241413;
    color:#d6c4bf;
    border-color:#62413c;
}

body.horror .option:hover{
    background:#38201e;
}

body.horror .progress{
    background:#3c2422;
}

body.horror .progress-bar{
    background:#985a52;
}

body.horror .start-btn{
    background:#241413;
    color:#d6c4bf;
    border-color:#68423d;
}


/* =========================================
   雪花
========================================= */

#noise{
    position:fixed;
    inset:0;
    z-index:9999;
    pointer-events:none;
    opacity:0;

    background:
        repeating-linear-gradient(
            0deg,
            rgba(255,255,255,.15) 0px,
            rgba(255,255,255,.15) 1px,
            rgba(0,0,0,.18) 1px,
            rgba(0,0,0,.18) 3px
        );

    mix-blend-mode:screen;
}

#noise.active{
    animation:staticBurst .7s steps(7);
}

@keyframes staticBurst{
    0%{opacity:0;}
    15%{opacity:.30;}
    30%{opacity:.05;}
    47%{opacity:.24;}
    68%{opacity:.08;}
    100%{opacity:0;}
}


/* =========================================
   畫面晃動
========================================= */

body.shake #app{
    animation:screenShake .55s;
}

@keyframes screenShake{
    0%{transform:translate(0,0);}
    20%{transform:translate(-3px,1px);}
    40%{transform:translate(3px,-2px);}
    60%{transform:translate(-2px,2px);}
    80%{transform:translate(2px,-1px);}
    100%{transform:translate(0,0);}
}


/* =========================================
   黑暗轉場
========================================= */

#darkTransition{
    position:fixed;
    inset:0;
    z-index:3000;
    pointer-events:none;
    opacity:0;

    background:
        radial-gradient(
            circle,
            rgba(95,30,25,.02),
            rgba(8,3,3,.94)
        );

    transition:opacity 5s ease;
}

#darkTransition.active{
    opacity:.58;
}


/* =========================================
   對話
========================================= */

.dialogue{
    text-align:center;
    min-height:230px;

    display:flex;
    flex-direction:column;
    justify-content:center;
}

.dialogue-speaker{
    font-size:10px;
    letter-spacing:4px;
    color:#88615b;
    margin-bottom:24px;
}

.dialogue-text{
    min-height:90px;
    font-size:19px;
    line-height:2;
    color:#d8c5c0;
    white-space:pre-line;
}

.dialogue-options{
    margin-top:22px;

    display:flex;
    flex-direction:column;
    gap:8px;
}


/* =========================================
   底部文字
========================================= */

#whisper{
    position:fixed;
    left:50%;
    bottom:11%;
    transform:translateX(-50%);
    z-index:4000;

    color:#884a43;
    font-size:12px;
    letter-spacing:3px;

    opacity:0;
    pointer-events:none;
    white-space:nowrap;
}

#whisper.show{
    animation:whisperAppear 4s forwards;
}

@keyframes whisperAppear{
    0%{opacity:0;}
    20%{opacity:.65;}
    40%{opacity:.13;}
    65%{opacity:.48;}
    100%{opacity:0;}
}


/* =========================================
   三秒問題
========================================= */

#threeSecond{
    position:fixed;
    inset:0;
    z-index:6000;

    display:flex;
    justify-content:center;
    align-items:center;

    background:rgba(5,3,3,.96);

    opacity:0;
    pointer-events:none;

    transition:opacity .35s;
}

#threeSecond.show{
    opacity:1;
    pointer-events:auto;
}

.three-box{
    width:650px;
    max-width:90vw;
    text-align:center;
    color:#ddcbc6;
}

.three-small{
    font-size:10px;
    letter-spacing:5px;
    color:#906d67;
    margin-bottom:28px;
}

.three-title{
    font-size:21px;
    line-height:2;
    margin-bottom:28px;
}

.three-option{
    display:block;
    width:100%;
    max-width:430px;
    margin:8px auto;
    padding:12px;

    background:rgba(49,24,22,.72);
    color:#d1bdb8;
    border:1px solid #68413c;

    font-family:inherit;
    cursor:pointer;
}

.three-timer{
    width:100%;
    max-width:430px;
    height:2px;
    margin:25px auto 0;
    background:#382321;
}

.three-timer-bar{
    width:100%;
    height:100%;
    background:#985b53;

    animation:timerThree 3s linear forwards;
}

@keyframes timerThree{
    from{width:100%;}
    to{width:0%;}
}


/* =========================================
   手機
========================================= */

@media(max-width:600px){

    #app{
        padding:14px;
    }

    .card{
        padding:27px 21px;
    }

    h1{
        font-size:22px;
    }

    .question{
        font-size:18px;
    }

    .dialogue-text{
        font-size:17px;
    }
}
</style>
</head>


<body>

<div id="noise"></div>

<div id="darkTransition"></div>

<div id="whisper"></div>


<!-- =========================================
     三秒恐怖問題
========================================= -->

<div id="threeSecond">

    <div class="three-box">

        <div class="three-small">
            請立即回答
        </div>

        <div class="three-title">
            如果你現在回頭，<br>
            你覺得房間裡會多出什麼？
        </div>

        <button class="three-option"
                onclick="threeAnswer(0)">
            一個人
        </button>

        <button class="three-option"
                onclick="threeAnswer(1)">
            一個影子
        </button>

        <button class="three-option"
                onclick="threeAnswer(2)">
            什麼都沒有
        </button>

        <button class="three-option"
                onclick="threeAnswer(3)">
            我不想回頭看
        </button>

        <div class="three-timer">
            <div class="three-timer-bar"></div>
        </div>

    </div>

</div>


<div id="app"></div>


<script>

/* =========================================================
   第一階段 10 題
========================================================= */

const normalQuestions = [

{
    q:"當你情緒低落時，你最希望喜歡的人怎麼做？",
    a:[
        "陪我聊聊天。",
        "先給我一點空間。",
        "直接問我發生了什麼。",
        "陪在旁邊，不一定要說話。"
    ]
},

{
    q:"你認為戀人之間需要知道彼此每天的行程嗎？",
    a:[
        "不用，彼此都有自己的生活。",
        "大概知道就好。",
        "如果對方願意，我會想知道。",
        "重要的事情可以互相說。"
    ]
},

{
    q:"如果對方一整天沒有主動找你，你會？",
    a:[
        "做自己的事情。",
        "晚一點再傳訊息。",
        "有點想知道他在忙什麼。",
        "如果和平常差很多，會問問。"
    ]
},

{
    q:"如果對方說今天想一個人，你會？",
    a:[
        "尊重他的決定。",
        "告訴他需要時可以找我。",
        "有點失落，但還是會給空間。",
        "等他自己願意說。"
    ]
},

{
    q:"如果你傳了一則訊息，對方兩個小時都沒有回，你會？",
    a:[
        "沒關係，他可能在忙。",
        "偶爾看一下手機。",
        "有點期待通知。",
        "如果很反常，會稍微擔心。"
    ]
},

{
    q:"你像見到我嗎？",
    a:[
        "想見",
        "不想見",
        "不知道",
        "離開"
    ]
},

{
    q:"你覺得戀人應該知道彼此的手機密碼嗎？",
    a:[
        "不用。",
        "知道也沒關係，但不需要查看。",
        "如果彼此願意可以交換。",
        "我比較重視信任，而不是密碼。"
    ]
},

{
    q:"如果對方突然取消原本約好的見面，你會？",
    a:[
        "沒關係，下次再約。",
        "問問是不是發生了什麼。",
        "會有一點失望。",
        "看取消的理由。"
    ]
},

{
    q:"如果你發現對方已讀了訊息，卻沒有回覆，你會？",
    a:[
        "等他有時間再回。",
        "過一陣子再看看。",
        "會稍微想一下是不是說錯了什麼。",
        "如果一直沒有回，會再問一次。"
    ]
},

{
    q:"平常很快回你的人，突然六個小時沒有回覆，你會？",
    a:[
        "他可能真的很忙。",
        "等明天再看看。",
        "會覺得有一點奇怪。",
        "會傳一句「還好嗎？」"
    ]
}
];


/* =========================================================
   補充五題
========================================================= */

const supplementQuestions = [

{
    q:"如果你的伴侶突然說：「我知道你今天去哪裡。」你會怎麼想？",
    a:[
        "可能只是剛好知道。",
        "我會問他怎麼知道。",
        "會開始注意這件事情。",
        "……我今天沒有告訴任何人。"
    ]
},

{
    q:"如果你沒有及時回覆訊息，對方卻很快知道你正在做什麼，你會？",
    a:[
        "覺得很巧。",
        "問他是不是在猜。",
        "開始覺得有點奇怪。",
        "我沒有告訴他。"
    ]
},

{
    q:"手機突然收到一則訊息：「你現在一個人嗎？」你會？",
    a:[
        "直接回答。",
        "問他為什麼這樣問。",
        "先放著不回。",
        "看一下門外。"
    ]
},

{
    q:"如果有人對你說：「不用回頭，我知道你現在在看這裡。」你會？",
    a:[
        "覺得只是玩笑。",
        "停止測驗。",
        "確認一下周圍。",
        "不敢回頭。"
    ]
},

{
    q:"如果現在門外傳來三下敲門聲，而你知道沒有人會來，你會？",
    a:[
        "繼續測驗。",
        "先確認是不是聲音。",
        "不敢出聲。",
        "我想知道門外是誰。"
    ]
];


/* =========================================================
   狀態
========================================================= */

let phase="normal";

let current=0;

let normalAnswers=[];

let supplementAnswers=[];

let audioCtx=null;

let threeTimer=null;

let typingTimer=null;


/* =========================================================
   音效
========================================================= */

function initAudio(){

    if(!audioCtx){

        audioCtx=
            new(
                window.AudioContext ||
                window.webkitAudioContext
            )();
    }

    if(audioCtx.state==="suspended"){
        audioCtx.resume();
    }
}


function tone(
    frequency,
    duration,
    volume,
    type="sine"
){

    if(!audioCtx)return;

    const oscillator=
        audioCtx.createOscillator();

    const gain=
        audioCtx.createGain();

    oscillator.type=type;

    oscillator.frequency.value=frequency;

    gain.gain.setValueAtTime(
        .0001,
        audioCtx.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        volume,
        audioCtx.currentTime+.02
    );

    gain.gain.exponentialRampToValueAtTime(
        .0001,
        audioCtx.currentTime+duration
    );

    oscillator.connect(gain);

    gain.connect(audioCtx.destination);

    oscillator.start();

    oscillator.stop(
        audioCtx.currentTime+
        duration+
        .05
    );
}


function staticSound(
    strength=.035,
    duration=.18
){

    if(!audioCtx)return;

    const buffer=
        audioCtx.createBuffer(
            1,
            audioCtx.sampleRate*duration,
            audioCtx.sampleRate
        );

    const data=
        buffer.getChannelData(0);

    for(
        let i=0;
        i<data.length;
        i++
    ){

        data[i]=
            (Math.random()*2-1)*
            strength;
    }

    const source=
        audioCtx.createBufferSource();

    const gain=
        audioCtx.createGain();

    gain.gain.value=.65;

    source.buffer=buffer;

    source.connect(gain);

    gain.connect(audioCtx.destination);

    source.start();
}


function lowHum(
    duration=2,
    volume=.025
){

    if(!audioCtx)return;

    const oscillator=
        audioCtx.createOscillator();

    const gain=
        audioCtx.createGain();

    oscillator.type="sine";

    oscillator.frequency.value=47;

    gain.gain.setValueAtTime(
        .0001,
        audioCtx.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        volume,
        audioCtx.currentTime+.5
    );

    gain.gain.exponentialRampToValueAtTime(
        .0001,
        audioCtx.currentTime+duration
    );

    oscillator.connect(gain);

    gain.connect(audioCtx.destination);

    oscillator.start();

    oscillator.stop(
        audioCtx.currentTime+
        duration+
        .1
    );
}


/* =========================================
   敲門
========================================= */

function knock(volume=.45){

    if(!audioCtx)return;

    tone(
        75,
        .11,
        volume,
        "sine"
    );

    setTimeout(
        ()=>{
            tone(
                57,
                .09,
                volume*.5,
                "sine"
            );
        },
        65
    );
}


/* =========================================================
   畫面效果
========================================================= */

function noiseFlash(){

    const noise=
        document.getElementById("noise");

    noise.classList.remove("active");

    void noise.offsetWidth;

    noise.classList.add("active");

    staticSound(.045,.35);

    setTimeout(
        ()=>{
            noise.classList.remove("active");
        },
        700
    );
}


function shake(){

    document.body.classList.remove("shake");

    void document.body.offsetWidth;

    document.body.classList.add("shake");

    setTimeout(
        ()=>{
            document.body.classList.remove("shake");
        },
        600
    );
}


function whisper(text){

    const element=
        document.getElementById("whisper");

    element.textContent=text;

    element.classList.remove("show");

    void element.offsetWidth;

    element.classList.add("show");
}


/* =========================================================
   首頁
========================================================= */

function home(){

    document.body.className="";

    document.getElementById("app").innerHTML=`

        <div class="card">

            <h1>
                親密關係傾向測驗
            </h1>

            <div class="subtitle">
                RELATIONSHIP & ATTACHMENT TEST
            </div>

            <div class="description">

                <p>
                    歡迎參與本次匿名情感傾向測驗。
                </p>

                <p>
                    以下問題沒有標準答案，
                    請依照你的第一直覺回答。
                </p>

                <p>
                    測驗約需 3～5 分鐘。
                </p>

                <p style="
                    color:#aaa;
                    font-size:12px;
                    margin-top:28px;
                ">
                    本測驗僅供娛樂使用，
                    不代表正式心理評估。
                </p>

            </div>

            <button
                class="start-btn"
                onclick="startTest()"
            >
                開始測驗
            </button>

        </div>
    `;
}

home();


/* =========================================================
   開始
========================================================= */

function startTest(){

    initAudio();

    phase="normal";

    current=0;

    normalAnswers=[];

    supplementAnswers=[];

    document.body.className="";

    showQuestion();
}


/* =========================================================
   顯示題目
========================================================= */

function showQuestion(){

    const list=
        phase==="normal"
        ? normalQuestions
        : supplementQuestions;

    if(current>=list.length){

        if(phase==="normal"){
            showEleven();
        }
        else{
            afterSupplements();
        }

        return;
    }

    const q=list[current];

    const total=
        phase==="normal"
        ? 10
        : 5;

    const percentage=
        (current/total)*100;

    document.getElementById("app").innerHTML=`

        <div class="card">

            <div class="question-number">
                ${
                    phase==="normal"
                    ? `第 ${current+1} 題 / 共 10 題`
                    : `補充問題 ${current+1} / 5`
                }
            </div>

            <div class="question">
                ${q.q}
            </div>

            <div
                class="options"
                id="options"
            ></div>

            <div
                class="feedback"
                id="feedback"
            ></div>

            <div class="progress">

                <div
                    class="progress-bar"
                    style="width:${percentage}%"
                ></div>

            </div>

        </div>
    `;

    const container=
        document.getElementById("options");

    q.a.forEach(
        (text,index)=>{

            const button=
                document.createElement("button");

            button.className="option";

            button.textContent=
                String.fromCharCode(65+index)
                +". "
                +text;

            button.onclick=
                ()=>{
                    chooseAnswer(index);
                };

            /*
             * 第六題的「想見」
             * 稍微特別顯眼。
             */
            if(
                phase==="normal" &&
                current===5 &&
                index===0
            ){
                button.classList.add("special");
            }

            container.appendChild(button);
        }
    );
}


/* =========================================================
   答案回饋
========================================================= */

const feedbacks=[

[
    "你的回答顯示你重視陪伴，但也能保留自己的空間。",
    "你似乎很重視彼此的獨立性。",
    "你傾向直接面對情緒與問題。",
    "你比較在意「陪著」本身，而不只是對話。"
],

[
    "你對界線的感受相當明確。",
    "你傾向接受適度的分享。",

/* =========================================================
   回答
========================================================= */

function chooseAnswer(index){

    initAudio();

    const buttons=
        document.querySelectorAll(".option");

    buttons.forEach(
        button=>{
            button.disabled=true;
        }
    );

    if(phase==="normal"){
        normalAnswers.push(index);
    }
    else{
        supplementAnswers.push(index);
    }

    buttons[index].classList.add("selected");

    /*
     * 第六題特殊效果：
     * 非「想見」的答案會短暫出現異常。
     */
    if(
        phase==="normal" &&
        current===5 &&
        index!==0
    ){

        setTimeout(
            ()=>{
                buttons[index].textContent=
                    "A. 想見";

                buttons[index].classList.add(
                    "special"
                );

                noiseFlash();

            },
            650
        );
    }

    /*
     * 正常題客觀回饋
     */
    if(phase==="normal"){

        const feedback=
            feedbacks[current][index];

        document.getElementById(
            "feedback"
        ).textContent=feedback;
    }

    /*
     * 中段異常
     */
    if(
        phase==="normal" &&
        current===7
    ){

        setTimeout(
            ()=>{
                noiseFlash();
            },
            400
        );
    }

    if(
        phase==="normal" &&
        current===8
    ){

        setTimeout(
            ()=>{
                lowHum(1.2,.018);
            },
            450
        );
    }

    /*
     * 補充題的回答會停留久一點。
     */
    if(phase==="supplement"){

        setTimeout(
            ()=>{
                supplementReaction(index);
            },
            900
        );

        return;
    }

    current++;

    setTimeout(
        ()=>{
            showQuestion();
        },
        950
    );
}

/* =========================================================
   模擬真人打字
========================================================= */

function typeText(
    element,
    text,
    speed=55,
    done=null
){

    clearInterval(typingTimer);

    element.textContent="";

    let i=0;

    typingTimer=
        setInterval(
            ()=>{

                element.textContent+=
                    text.charAt(i);

                i++;

                /*
                 * 輕微打字音
                 */
                if(
                    i%3===0 &&
                    audioCtx
                ){

                    tone(
                        430+
                        Math.random()*100,
                        .025,
                        .006,
                        "sine"
                    );
                }

                if(i>=text.length){

                    clearInterval(
                        typingTimer
                    );

                    if(done)done();
                }

            },
            speed
        );
}
