<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>親密關係傾向測驗</title>

<style>

*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    padding:0;
    min-height:100%;
}

body{
    min-height:100vh;

    font-family:
        "Noto Sans TC",
        "Microsoft JhengHei",
        sans-serif;

    background:#f3f0ed;
    color:#393535;

    transition:
        background 3s ease,
        color 3s ease;

    overflow-x:hidden;
}

#app{
    min-height:100vh;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:24px;
}

.card{
    width:680px;
    max-width:94vw;

    padding:42px;

    background:rgba(255,255,255,.95);

    border:1px solid #ddd7d3;

    box-shadow:
        0 15px 45px rgba(50,35,30,.08);

    transition:
        background 2s,
        border 2s,
        box-shadow 2s,
        color 2s;
}

h1{
    margin:0 0 8px;

    text-align:center;

    font-size:27px;
    font-weight:400;

    letter-spacing:3px;
}

.subtitle{
    text-align:center;

    color:#a19a96;

    font-size:12px;

    letter-spacing:1px;

    margin-bottom:34px;
}

.description{
    color:#696360;

    font-size:15px;

    line-height:2;
}

.start-btn{
    display:block;

    margin:34px auto 0;

    padding:12px 42px;

    background:#fff;

    color:#514a47;

    border:1px solid #aaa29d;

    cursor:pointer;

    font-family:inherit;

    transition:.25s;
}

.start-btn:hover{
    background:#eee8e4;
    border-color:#866b63;
}


/* =========================
   題目
========================= */

.question-number{
    color:#aaa19d;

    font-size:12px;

    margin-bottom:23px;

    letter-spacing:1px;
}

.question{
    font-size:20px;

    line-height:1.8;

    margin-bottom:25px;
}

.options{
    display:flex;

    flex-direction:column;

    gap:7px;
}

.option{
    width:100%;

    padding:14px 16px;

    text-align:left;

    background:#fff;

    color:#403b39;

    border:1px solid #d8d2cf;

    cursor:pointer;

    font-family:inherit;

    transition:
        background .2s,
        border .2s,
        opacity .35s;
}

.option:hover{
    background:#f5efec;

    border-color:#a98b82;
}

.option.selected{
    background:#eee6e2;

    border-color:#97736a;
}

.option:disabled{
    cursor:default;
}

.option.hidden{
    opacity:0;

    pointer-events:none;
}

.feedback{
    min-height:25px;

    margin-top:18px;

    color:#8d8581;

    font-size:13px;

    line-height:1.7;
}

.progress{
    height:2px;

    margin-top:28px;

    background:#e6dfdc;
}

.progress-bar{
    height:100%;

    background:#99786f;

    transition:width .45s;
}


/* =========================
   後期色調
========================= */

body.late{
    background:#d8ceca;
}

body.late .card{
    border-color:#bea69e;
}


body.dark{
    background:
        radial-gradient(
            circle at 50% 35%,
            #4d302e,
            #241514 65%,
            #100808
        );

    color:#ddd0cc;
}

body.dark .card{
    background:rgba(28,16,15,.94);

    border-color:#633f3a;

    box-shadow:
        0 25px 90px rgba(0,0,0,.55);
}

body.dark h1,
body.dark .question{
    color:#dcc9c4;
}

body.dark .question-number{
    color:#96736d;
}

body.dark .option{
    background:#271716;

    color:#d3c1bd;

    border-color:#67423d;
}

body.dark .option:hover{
    background:#3a211f;
}

body.dark .feedback{
    color:#a68a84;
}


/* =========================
   雪花屏
========================= */

#noise{
    position:fixed;

    inset:0;

    z-index:999;

    pointer-events:none;

    opacity:0;

    background:
        repeating-linear-gradient(
            0deg,
            rgba(255,255,255,.18) 0px,
            rgba(255,255,255,.18) 1px,
            rgba(0,0,0,.18) 1px,
            rgba(0,0,0,.18) 3px
        );

    mix-blend-mode:screen;
}

#noise.active{
    animation:
        staticBurst .8s steps(8);
}

@keyframes staticBurst{

    0%{opacity:0}

    7%{opacity:.65}

    13%{opacity:.12}

    21%{opacity:.82}

    29%{opacity:.18}

    38%{opacity:.72}

    46%{opacity:.08}

    58%{opacity:.55}

    69%{opacity:.15}

    77%{opacity:.65}

    88%{opacity:.12}

    100%{opacity:0}
}


/* =========================
   微小文字
========================= */

#whisper{
    position:fixed;

    left:50%;
    bottom:9%;

    transform:translateX(-50%);

    z-index:100;

    color:#74423c;

    font-size:12px;

    letter-spacing:3px;

    opacity:0;

    pointer-events:none;
}

#whisper.show{
    animation:
        whisperAppear 3.8s forwards;
}

@keyframes whisperAppear{

    0%{
        opacity:0;
    }

    20%{
        opacity:.65;
    }

    45%{
        opacity:.2;
    }

    65%{
        opacity:.5;
    }

    100%{
        opacity:0;
    }
}


/* =========================
   結尾
========================= */

.ending{
    line-height:2.25;

    font-size:15px;
}

.ending-line{
    opacity:0;

    animation:
        endingAppear 2.2s forwards;
}

@keyframes endingAppear{

    to{
        opacity:1;
    }
}

.final-choice{
    margin-top:30px;
}

.final-choice button{
    width:100%;

    padding:14px;

    margin-top:8px;

    background:transparent;

    color:inherit;

    border:1px solid #72504b;

    cursor:pointer;

    font-family:inherit;

    transition:.3s;
}

.final-choice button:hover{
    background:rgba(120,60,55,.18);
}


/* =========================
   恢復正常
========================= */

body.normal-again{
    background:#f3f0ed;

    color:#393535;

    transition:
        background 1.5s,
        color 1.5s;
}

body.normal-again .card{
    background:rgba(255,255,255,.96);

    border-color:#ddd7d3;

    box-shadow:
        0 15px 45px rgba(50,35,30,.07);
}

body.normal-again h1,
body.normal-again .question{
    color:#393535;
}


/* =========================
   小螢幕
========================= */

@media(max-width:600px){

    #app{
        padding:14px;
    }

    .card{
        padding:27px 22px;
    }

    .question{
        font-size:18px;
    }

    h1{
        font-size:23px;
    }
}

</style>
</head>


<body>

/* =====================================================
   狀態
===================================================== */

let current=0;

let answers=[];

let audioCtx=null;

let tension=0;


/* =====================================================
   音效系統
===================================================== */

function initAudio(){

    if(!audioCtx){

        audioCtx=
        new(
            window.AudioContext ||
            window.webkitAudioContext
        )();

    }

    if(audioCtx.state==="suspended"){

        audioCtx.resume();

    }
}


/* 一般音 */

function tone(
    frequency,
    duration,
    volume,
    type="sine"
){

    if(!audioCtx)return;

    const osc=
        audioCtx.createOscillator();

    const gain=
        audioCtx.createGain();

    osc.type=type;

    osc.frequency.value=frequency;

    gain.gain.setValueAtTime(
        .001,
        audioCtx.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        volume,
        audioCtx.currentTime+.025
    );

    gain.gain.exponentialRampToValueAtTime(
        .001,
        audioCtx.currentTime+duration
    );

    osc.connect(gain);

    gain.connect(
        audioCtx.destination
    );

    osc.start();

    osc.stop(
        audioCtx.currentTime+
        duration+.03
    );
}


/* =====================================================
   低頻嗡鳴
===================================================== */

function lowHum(){

    if(!audioCtx)return;

    const osc=
        audioCtx.createOscillator();

    const gain=
        audioCtx.createGain();

    osc.type="sine";

    osc.frequency.value=48;

    gain.gain.value=.0001;

    gain.gain.exponentialRampToValueAtTime(
        .035,
        audioCtx.currentTime+1
    );

    gain.gain.exponentialRampToValueAtTime(
        .0001,
        audioCtx.currentTime+3
    );

    osc.connect(gain);

    gain.connect(
        audioCtx.destination
    );

    osc.start();

    osc.stop(
        audioCtx.currentTime+3.1
    );
}


/* =====================================================
   雜訊
===================================================== */

function staticSound(
    strength=.03,
    duration=.35
){

    if(!audioCtx)return;

    const buffer=
        audioCtx.createBuffer(
            1,
            audioCtx.sampleRate*duration,
            audioCtx.sampleRate
        );

    const data=
        buffer.getChannelData(0);

    for(let i=0;i<data.length;i++){

        data[i]=
            (Math.random()*2-1)
            *strength;
    }

    const source=
        audioCtx.createBufferSource();

    const gain=
        audioCtx.createGain();

    gain.gain.value=.7;

    source.buffer=buffer;

    source.connect(gain);

    gain.connect(
        audioCtx.destination
    );

    source.start();
}


/* =====================================================
   敲門
===================================================== */

function knock(
    volume=.38
){

    tone(
        86,
        .22,
        volume,
        "sine"
    );

}


/* =====================================================
   金屬聲
===================================================== */

function strangeMetal(){

    tone(
        720,
        .18,
        .12,
        "triangle"
    );

    setTimeout(
        ()=>{
            tone(
                490,
                .28,
                .07,
                "triangle"
            );
        },
        80
    );
}


/* =====================================================
   雪花屏
===================================================== */

function noiseFlash(){

    const noise=
        document.getElementById("noise");

    noise.classList.remove("active");

    void noise.offsetWidth;

    noise.classList.add("active");

    staticSound(.09,.8);

    setTimeout(
        ()=>{
            noise.classList.remove("active");
        },
        850
    );
}


/* =====================================================
   微弱文字
===================================================== */

function whisper(text){

    const w=
        document.getElementById("whisper");

    w.textContent=text;

    w.classList.remove("show");

    void w.offsetWidth;

    w.classList.add("show");
}

===================================================== */

function home(){

document.getElementById("app").innerHTML=`

home();


/* =====================================================
   開始
===================================================== */

function startTest(){

    initAudio();

    current=0;

    answers=[];

    tension=0;

    document.body.className="";

    lowHum();

    showQuestion();

}


/* =====================================================
   題目
===================================================== */

function showQuestion(){

    if(current>=questions.length){

        showResult();

        return;
    }


    const q=
        questions[current];


    const percent=
        current/
        questions.length*
        100;


    document.getElementById("app").innerHTML=`

<div class="card">

<div class="question-number">

第 ${current+1} 題 /
共 ${questions.length} 題

</div>

<div class="question">

${q.q}

</div>

<div
class="options"
id="options"
>
</div>

<div
class="feedback"
id="feedback"
></div>

<div class="progress">

<div
class="progress-bar"
style="width:${percent}%"
>
</div>

</div>

</div>

`;


    const box=
        document.getElementById("options");


    q.a.forEach(
        (text,index)=>{

            const btn=
                document.createElement("button");

            btn.className="option";

            btn.textContent=
                String.fromCharCode(65+index)
                +". "
                +text;

            btn.onclick=
                ()=>{
                    choose(index);
                };

            box.appendChild(btn);

        }
    );

}


/* =====================================================
   選答案
===================================================== */

function choose(index){

    answers.push(index);

    const q=
        questions[current];


    const buttons=
        document.querySelectorAll(
            ".option"
        );


    buttons.forEach(
        b=>b.disabled=true
    );


    buttons[index]
        .classList.add("selected");


    buttons.forEach(
        (b,i)=>{

            if(i!==index){

                setTimeout(
                    ()=>{
                        b.classList.add(
                            "hidden"
                        );
                    },
                    160
                );

            }

        }
    );


    document.getElementById(
        "feedback"
    ).textContent=
        q.feedback[index];


    /*
       ==================================
       正常階段
       ==================================
    */

    if(current<=7){

        /*
           非常小的個別反應
        */

        if(index===3){

            tone(
                310,
                .12,
                .025,
                "sine"
            );

        }

    }


    /*
       ==================================
       9～10 題
       ==================================
    */

    if(current===8){

        tension++;

        document.body.classList.add(
            "late"
        );

        if(index>=2){

            setTimeout(
                ()=>{
                    lowHum();
                },
                400
            );

        }

    }


    if(current===9){

        tension+=2;

        if(index>=2){

            staticSound(
                .045,
                .25
            );

        }

        /*
           這裡偶爾讓聲音比畫面早
        */

        setTimeout(
            ()=>{
                tone(
                    63,
                    .5,
                    .055,
                    "sine"
                );
            },
            500
        );

    }


    /*
       ==================================
       第 11 題
       ==================================
    */

    if(current===10){

        tension+=2;

        document.body.classList.add(
            "late"
        );

        setTimeout(
            ()=>{
                noiseFlash();
            },
            500
        );

    }


    /*
       ==================================
       第 12 題
       ==================================
    */

    if(current===11){

        tension+=2;

        if(index===2){

            setTimeout(
                ()=>{
                    whisper(
                        "你剛才看過手機。"
                    );
                },
                700
            );

        }

    }


    /*
       ==================================
       第 13 題
       ==================================
    */

    if(current===12){

        tension+=3;

        document.body.classList.add(
            "dark"
        );


        /*
           背景低頻
        */

        setTimeout(
            ()=>{
                lowHum();
            },
            250
        );


        /*
           很短的金屬聲
        */

        if(index>=2){

            setTimeout(
                ()=>{
                    strangeMetal();
                },
                900
            );

        }

    }


    /*
       ==================================
       第 14 題
       ==================================
    */

    if(current===13){

        tension+=3;


        /*
           不讓玩家知道哪裡出問題
        */

        setTimeout(
            ()=>{
                staticSound(
                    .05,
                    .18
                );
            },
            500
        );


        if(index===2){

            setTimeout(
                ()=>{
                    whisper(
                        "你還記得嗎？"
                    );
                },
                900
            );

        }

    }


    /*
       ==================================
       第 15 題
       ==================================
    */

    if(current===14){

        tension+=4;

        setTimeout(
            ()=>{
                knock(.22);
            },
            850
        );

    }


    current++;


    /*
       正常題目快速
       後面稍慢
    */

    let delay=480;


    if(current>=9){
        delay=600;
    }

    if(current>=12){
        delay=680;
    }


    setTimeout(
        ()=>{
            showQuestion();
        },
        delay
    );

}
