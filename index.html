<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>親密關係傾向測驗 V24</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
    min-height:100vh;
    font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;
    background:#f1eeeb;
    color:#45403d;
    transition:background 2.5s ease,color 2.5s ease;
    overflow-x:hidden;
}
body.normal{background:#f1eeeb;color:#45403d}
#app{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:25px;
    transition:transform .15s ease;
}
.card{
    width:680px;
    max-width:94vw;
    padding:42px;
    background:rgba(255,255,255,.97);
    border:1px solid #ddd7d3;
    box-shadow:0 15px 50px rgba(45,30,25,.08);
    transition:background 1.8s ease,border-color 1.8s ease,box-shadow 1.8s ease;
}
h1{
    margin:0 0 9px;
    text-align:center;
    font-size:27px;
    font-weight:400;
    letter-spacing:4px;
}
.subtitle{
    text-align:center;
    color:#aaa19d;
    font-size:11px;
    letter-spacing:2px;
    margin-bottom:34px;
}
.description{
    font-size:15px;
    line-height:2;
    color:#696360;
}
.start-btn{
    display:block;
    margin:34px auto 0;
    padding:12px 42px;
    background:#fff;
    color:#514a47;
    border:1px solid #aaa29d;
    cursor:pointer;
    font-family:inherit;
    transition:background .25s,border .25s,transform .15s;
}
.start-btn:hover{
    background:#eee8e4;
    border-color:#80665e;
}
.start-btn:active{transform:scale(.98)}
.question-number{
    color:#aaa19d;
    font-size:12px;
    letter-spacing:1px;
    margin-bottom:22px;
}
.question{
    font-size:20px;
    line-height:1.8;
    margin-bottom:25px;
}
.feedback{
    min-height:28px;
    margin-top:18px;
    font-size:13px;
    line-height:1.8;
    color:#8c8581;
}
.options{
    display:flex;
    flex-direction:column;
    gap:9px;
}
.option{
    width:100%;
    padding:14px 16px;
    text-align:left;
    background:#fff;
    color:#403b39;
    border:1px solid #d8d2cf;
    cursor:pointer;
    font-family:inherit;
    transition:background .25s,border .25s,opacity .35s,transform .12s;
}
.option:hover{
    background:#f5efec;
    border-color:#a98b82;
}
.option:active{transform:scale(.995)}
.option.selected{
    background:#eee5e1;
    border-color:#927067;
}
.option.fade{
    opacity:0;
    pointer-events:none;
}
.option:disabled{cursor:default}
.progress{
    height:2px;
    margin-top:28px;
    background:#e6dfdc;
}
.progress-bar{
    height:100%;
    background:#99786f;
    transition:width .5s ease;
}

/* 恐怖模式 */
body.horror{
    background:radial-gradient(
        circle at 50% 40%,
        #4b2927 0%,
        #291514 50%,
        #090505 100%
    );
    color:#ddd0cc;
}
body.horror .card{
    background:rgba(27,14,14,.95);
    border-color:#67433e;
    box-shadow:0 25px 90px rgba(0,0,0,.65);
}
body.horror h1,
body.horror .question{
    color:#dfccc7;
}
body.horror .subtitle,
body.horror .question-number{
    color:#98716b;
}
body.horror .description{
    color:#bca9a4;
}
body.horror .option{
    background:#241413;
    color:#d6c4bf;
    border-color:#62413c;
}
body.horror .option:hover{background:#38201e}
body.horror .option.selected{
    background:#3b211f;
    border-color:#9b5d55;
}
body.horror .progress{background:#3c2422}
body.horror .progress-bar{background:#985a52}
body.horror .start-btn{
    background:#241413;
    color:#d6c4bf;
    border-color:#68423d;
}
body.horror .feedback{color:#aa8b85}

/* 雜訊 */
#noise{
    position:fixed;
    inset:0;
    z-index:9999;
    pointer-events:none;
    opacity:0;
    background:
        repeating-linear-gradient(
            0deg,
            rgba(255,255,255,.15) 0px,
            rgba(255,255,255,.15) 1px,
            rgba(0,0,0,.18) 1px,
            rgba(0,0,0,.18) 3px
        );
    mix-blend-mode:screen;
}
#noise.active{
    animation:staticBurst .7s steps(7);
}
@keyframes staticBurst{
    0%{opacity:0}
    15%{opacity:.30}
    30%{opacity:.05}
    47%{opacity:.24}
    68%{opacity:.08}
    100%{opacity:0}
}

/* 輕微畫面晃動 */
body.shake #app{animation:screenShake .55s}
@keyframes screenShake{
    0%{transform:translate(0,0)}
    20%{transform:translate(-3px,1px)}
    40%{transform:translate(3px,-2px)}
    60%{transform:translate(-2px,2px)}
    80%{transform:translate(2px,-1px)}
    100%{transform:translate(0,0)}
}

/* 慢慢變暗 */
#darkTransition{
    position:fixed;
    inset:0;
    z-index:3000;
    pointer-events:none;
    opacity:0;
    background:
        radial-gradient(
            circle,
            rgba(95,30,25,.02),
            rgba(8,3,3,.94)
        );
    transition:opacity 5s ease;
}
#darkTransition.active{opacity:.58}

    display:flex;
    flex-direction:column;
    justify-content:center;
}
.dialogue-speaker{

.dialogue-text{

.dialogue-options{

}

/* 低聲文字 */
#whisper{
    position:fixed;
    left:50%;
    bottom:11%;
    transform:translateX(-50%);
    z-index:4000;
    color:#884a43;
    font-size:12px;
    letter-spacing:3px;
    opacity:0;
    pointer-events:none;
    white-space:nowrap;
}
#whisper.show{animation:whisperAppear 4s forwards}
@keyframes whisperAppear{
    0%{opacity:0}
    20%{opacity:.65}
    40%{opacity:.13}
    65%{opacity:.48}
    100%{opacity:0}
}

/* 限時題 */

    inset:0;
    z-index:6000;
    display:flex;
    justify-content:center;
    align-items:center;

#threeSecond.show{

.three-small{

</style>

const storageKey = "relationship_v24_memory";

/* =========================================================
   多周目記憶
========================================================= */

function getMemory(){

    try{

        const raw = localStorage.getItem(storageKey);

        if(raw){

            return JSON.parse(raw);

        }

    }catch(e){}

    return {
        plays:0,
        endings:{
            open:0,
            closed:0,
            unknown:0,
            stop:0,
            special:0
        },
        choices:{},
        seenAll:false,
        specialSeen:false
    };

}

function saveMemory(memory){

    try{

        localStorage.setItem(
            storageKey,
            JSON.stringify(memory)
        );

    }catch(e){}

}

function incrementChoice(key){

    const memory = getMemory();

    memory.choices[key] =
        (memory.choices[key] || 0) + 1;

    saveMemory(memory);

}

function beginPlay(){

    const memory = getMemory();

    memory.plays =
        (memory.plays || 0) + 1;

    saveMemory(memory);

    playStart = Date.now();

}

/* =========================================================
   音效
========================================================= */

function initAudio(){

    if(!audioCtx){

        audioCtx =
            new(
                window.AudioContext ||
                window.webkitAudioContext
            )();

    }

    if(audioCtx.state === "suspended"){

        audioCtx.resume();

    }

}

function tone(
    frequency,
    duration,
    volume,
    type = "sine"
){

    if(!audioCtx)return;

    const oscillator =
        audioCtx.createOscillator();

    const gain =
        audioCtx.createGain();

    oscillator.type = type;

    oscillator.frequency.value =
        frequency;

    gain.gain.setValueAtTime(
        .0001,
        audioCtx.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        volume,
        audioCtx.currentTime + .025
    );

    gain.gain.exponentialRampToValueAtTime(
        .0001,
        audioCtx.currentTime + duration
    );

    oscillator.connect(gain);

    gain.connect(audioCtx.destination);

    oscillator.start();

    oscillator.stop(
        audioCtx.currentTime +
        duration +
        .04
    );

}

function staticSound(
    strength = .035,
    duration = .18
){

    if(!audioCtx)return;

    const buffer =
        audioCtx.createBuffer(
            1,
            audioCtx.sampleRate * duration,
            audioCtx.sampleRate
        );

    const data =
        buffer.getChannelData(0);

    for(
        let i = 0;
        i < data.length;
        i++
    ){

        data[i] =
            (Math.random() * 2 - 1) *
            strength;

    }

    const source =
        audioCtx.createBufferSource();

    const gain =
        audioCtx.createGain();

    gain.gain.value = .65;

    source.buffer = buffer;

    source.connect(gain);

    gain.connect(audioCtx.destination);

    source.start();

}

function lowHum(
    duration = 2.2,
    volume = .025
){

    if(!audioCtx)return;

    const oscillator =
        audioCtx.createOscillator();

    const gain =
        audioCtx.createGain();

    oscillator.type = "sine";

    oscillator.frequency.value = 47;

    gain.gain.setValueAtTime(
        .0001,
        audioCtx.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        volume,
        audioCtx.currentTime + .55
    );

    gain.gain.exponentialRampToValueAtTime(
        .0001,
        audioCtx.currentTime + duration
    );

    oscillator.connect(gain);

    gain.connect(audioCtx.destination);

    oscillator.start();

    oscillator.stop(
        audioCtx.currentTime +
        duration +
        .1
    );

}

function knock(volume = .28){

    if(!audioCtx)return;

    tone(
        83,
        .12,
        volume,
        "sine"
    );

    setTimeout(
        () => tone(
            61,
            .08,
            volume * .35,
            "sine"
        ),
        65
    );

}

function footstep(volume = .12){

    if(!audioCtx)return;

    tone(
        72,
        .08,
        volume,
        "sine"
    );

    setTimeout(
        () => tone(
            58,
            .07,
            volume * .7,
            "sine"
        ),
        95
    );

    setTimeout(
        () => tone(
            72,
            .07,
            volume * .8,
            "sine"
        ),
        205
    );

}

    const noise =

    noise.classList.remove("active");

    void noise.offsetWidth;

    noise.classList.add("active");

    staticSound(
        .045,
        .35
    );

    setTimeout(
        () => noise.classList.remove("active"),
        700
    );

}

function shake(){

    document.body.classList.remove("shake");

    void document.body.offsetWidth;

    document.body.classList.add("shake");

    setTimeout(
        () => document.body.classList.remove("shake"),
        600
    );

}

function whisper(text){

    const element =
        document.getElementById("whisper");

    element.textContent = text;

    element.classList.remove("show");

    void element.offsetWidth;

    element.classList.add("show");

}

/* =========================================================
   題目
========================================================= */

function showQuestion(){

    const list =
        phase === "normal"
            ? normalQuestions
            : supplementQuestions;

    if(current >= list.length){

        if(phase === "normal"){

            showEleven();

        }else{

            afterSupplements();

        }

        return;

    }

    const q = list[current];

    let displayQuestion = q.q;

    /*
        補充第 5 題依照第 3 題回答分支。
    */

    if(
        phase === "supplement" &&
        current === 4
    ){

        const q3 =
            supplementAnswers[2];

        if(q3 === 0){

            displayQuestion =
                "那你現在在哪裡？";

        }else if(q3 === 1){

            displayQuestion =
                "那……你身邊的人知道你正在做什麼嗎？";

        }else if(q3 === 2){

            displayQuestion =
                "你真的不知道自己是不是一個人嗎？";

        }else{

            displayQuestion =
                "那你現在在哪裡？";

        }

    }

    /*
        題數顯示永遠維持：
        正常題：第 X 題 / 共 10 題
        補充題：補充問題 X / 5

        第 11 題不走這裡。
    */

    const percentage =
        (current / list.length) * 100;

    document.getElementById(
        "app"
    ).innerHTML = `

        <div class="card">

            <div class="question-number">

                ${
                    phase === "normal"
                    ? `第 ${current + 1} 題 / 共 10 題`
                    : `補充問題 ${current + 1} / 5`
                }

            </div>

            <div class="question">
                ${displayQuestion}
            </div>

            <div
                class="options"
                id="options"
            ></div>

            <div
                class="feedback"
                id="feedback"
            ></div>

            ${
                phase === "normal"
                ? `
                    <div class="progress">
                        <div
                            class="progress-bar"
                            style="width:${percentage}%"
                        ></div>
                    </div>
                `
                : ""
            }

        </div>

    `;

    const container =
        document.getElementById("options");

    q.a.forEach(
        (text,index) => {

            const button =
                document.createElement("button");

            button.className = "option";

            button.textContent =
                String.fromCharCode(65 + index) +
                ". " +
                text;

            button.onclick =
                () => chooseAnswer(index);

            container.appendChild(button);

        }
    );

}

/* =========================================================
   一般回答
========================================================= */

function chooseAnswer(index){

    const buttons =
        document.querySelectorAll(
            ".option"
        );

    buttons.forEach(
        button => {
            button.disabled = true;
        }
    );

    if(phase === "normal"){

        normalAnswers.push(index);

    }else{

        supplementAnswers.push(index);

    }

    buttons[index]
        .classList
        .add("selected");

    const feedback =
        document.getElementById(
            "feedback"
        );

    if(
        phase === "normal" &&
        normalFeedback[current]
    ){

        feedback.textContent =
            normalFeedback[current][index] ||
            "回答已記錄。";

    }else{

        feedback.textContent =
            "回答已記錄。";

    }

    buttons.forEach(
        (button,i) => {

            if(i !== index){

                setTimeout(
                    () => {
                        button.classList.add("fade");
                    },
                    100
                );

            }

        }
    );

    /*
        正常題的存在感。
    */

    if(phase === "normal"){

        if(current === 2){

            setTimeout(
                () => whisper("……知道了。"),
                650
            );

        }

        if(current === 5){

            setTimeout(
                () => whisper("我會記得。"),
                650
            );

        }

        if(current === 7){

            setTimeout(
                () => whisper(
                    "你剛才選的是「" +
                    String.fromCharCode(65 + index) +
                    "」。"
                ),
                650
            );

        }

        if(current === 8){

            setTimeout(
                () => lowHum(
                    1.1,
                    .015
                ),
                500
            );

            setTimeout(
                () => whisper("我也是。"),
                900
            );

        }

        if(current === 9){

            setTimeout(
                () => whisper(
                    "你的答案，我都記得。"
                ),
                700
            );

        }

    }else{

        /*
            補充題的反應。
            注意：
            補充階段不呼叫 noiseFlash。
        */

        if(current === 0){

            setTimeout(
                () => whisper(
                    "我只是想知道而已。"
                ),
                650
            );

        }

        if(current === 1){

            if(index === 2 || index === 3){

                setTimeout(
                    () => whisper(
                        "你不喜歡被一直問。"
                    ),
                    650
                );

            }else{

                setTimeout(
                    () => whisper(
                        "你回答得很快。"
                    ),
                    650
                );

            }

        }

        if(current === 2){

            const words = [

                "原來你是一個人。",

                "原來你不是一個人。",

                "你不知道？",

                "……你為什麼不回答？"

            ];

            setTimeout(
                () => whisper(
                    words[index]
                ),
                650
            );

        }

        if(current === 3){

            if(index === 3){

                setTimeout(
                    () => whisper(
                        "你開始注意到了。"
                    ),
                    650
                );

            }else{

                setTimeout(
                    () => whisper(
                        "你還是相信只是巧合。"
                    ),
                    650
                );

            }

        }

        if(current === 4){

            /*
                第 5 題：
                腳步聲。
                這裡不使用雜訊。
            */

            setTimeout(
                () => footstep(.10),
                550
            );

            setTimeout(
                () => footstep(.08),
                900
            );

            if(index === 2){

                setTimeout(
                    () => whisper(
                        "你說你在學校。"
                    ),
                    1200
                );

            }

        }

    }

    current++;

    setTimeout(
        showQuestion,
        720
    );

}

/* =========================================================
   第 6 題反應
========================================================= */

function answerLike(index){

    const selected =
        likeOptions[index];

    incrementChoice(
        "like_" + selected
    );

    /*
        喜歡：
        立即進下一個頁面。
    */

    if(selected === "喜歡"){

        const feedback =
            document.getElementById(
                "likeFeedback"
            );

        if(feedback){

            feedback.textContent =
                "嗯。這樣就好了。";

        }

        document
            .querySelectorAll(
                "#likeOptions .option"
            )
            .forEach(
                button => {
                    button.disabled = true;
                }
            );

        setTimeout(
            () => {

                showDialogue(
                    "我就知道。",
                    () => {

                        setTimeout(
                            doorDialogueStart,
                            1000
                        );

                    }
                );

            },
            650
        );

        return;

    }

    /*
        不喜歡：
        明顯比舊版強烈。
    */

    if(selected === "不喜歡"){

        renderLikeReaction(
            "不喜歡？\n\n你剛才不是這樣回答的。",
            "……再想一次。"
        );

        return;

    }

    /*
        不知道：
        表現出不耐與執著。
    */

    if(selected === "不知道"){

        renderLikeReaction(
            "不知道？\n\n你怎麼會不知道？",
            "這個問題明明很簡單。"
        );

        return;

    }

    /*
        討厭：
        最強烈的反應。
    */

    if(selected === "討厭"){

        renderLikeReaction(
            "討厭我？\n\n你真的要這樣說嗎？",
            "……我不喜歡這個答案。"
        );

        return;

    }

}

function renderLikeReaction(
    mainText,
    secondText
){

    const box =
        document.getElementById(
            "likeOptions"
        );

    const feedback =
        document.getElementById(
            "likeFeedback"
        );

    if(feedback){

        feedback.textContent =
            mainText;

    }

    /*
        這裡不把選項變成「喜歡」，
        也不要求四個選項全部點過。
    */

    if(box){

        box.querySelectorAll(
            ".option"
        ).forEach(
            button => {
                button.disabled = true;
            }
        );

    }

    setTimeout(
        () => {

            whisper(
                secondText
            );

            shake();

        },
        450
    );

    setTimeout(
        () => {

            if(box){

                box.querySelectorAll(
                    ".option"
                ).forEach(
                    button => {
                        button.disabled = false;
                    }
                );

            }

        },
        1250
    );

}

/* =========================================================
   門外劇情
========================================================= */

function doorDialogueStart(){

    const memory =
        getMemory();

    const q3 =
        supplementAnswers[2];

    let remembered =
        "我記得你剛才的回答。";

    if(q3 === 0){

        remembered =
            "你剛才說你是一個人。";

    }else if(q3 === 1){

        remembered =
            "你剛才說你不是一個人。";

    }else if(q3 === 2){

        remembered =
            "你剛才說你不知道。";

    }else if(q3 === 3){

        remembered =
            "你剛才沒有好好回答我。";

    }

    /*
        第 5 題「學校」分支
    */

    const q5 =
        supplementAnswers[4];

    if(q5 === 2){

        remembered +=
            "\n\n而且……你說你在學校。";

    }

    /*
        多周目
    */

    if(memory.plays >= 2){

        remembered +=
            "\n\n而且……你以前也來過。";

    }

    showDialogue(

        remembered +
        "\n\n剛才……門那邊是不是有聲音？",

        null,

        [

            {
                text:"好像有。",
                action:() =>
                    doorAnswer("heard")
            },

            {
                text:"沒有吧。",
                action:() =>
                    doorAnswer("notheard")
            },

            {
                text:"我不知道。",
                action:() =>
                    doorAnswer("unsure")
            }

        ]

    );

}

function doorAnswer(type){

    if(type === "heard"){

        setTimeout(
            () => knock(.32),
            500
        );

        setTimeout(
            () => {

                showDialogue(
                    "……對。\n\n就在那裡。",
                    () => {

                        setTimeout(
                            nextDoorChoice,
                            900
                        );

                    }
                );

            },
            1000
        );

        return;

    }

    if(type === "notheard"){

        showDialogue(
            "沒有嗎？\n\n可能是我聽錯了。",
            () => {

                setTimeout(
                    () => {

                        knock(.36);

                        setTimeout(
                            nextDoorChoice,
                            1100
                        );

                    },
                    700
                );

            }
        );

        return;

    }

    showDialogue(
        "不知道也沒關係。\n\n再聽一次就好了。",
        () => {

            setTimeout(
                () => {

                    knock(.29);

                    setTimeout(
                        () => knock(.29),
                        700
                    );

                    setTimeout(
                        nextDoorChoice,
                        1700
                    );

                },
                700
            );

        }
    );

}

/* =========================================================
   特殊結局判定
========================================================= */

/*
    這裡使用「答案順序」觸發特殊結局。

    特殊順序：
    補充第 3 題 =「是」
    補充第 5 題 =「在學校」
    門外第一題 =「好像有」
    門外第二題 =「我會回答你」

    這四個條件同時成立，
    才會開啟特殊結局。

    其他玩家仍然可以走四個普通結局。
*/

let specialDoorFirst = false;
let specialDoorSecond = false;

function doorFinalQuestion(){

    const memory =
        getMemory();

    let extra = "";

    if(memory.plays >= 5){

        extra =
            "\n\n這次……你還要換一個答案嗎？";

    showDialogue(

        extra,

        null,

                action:() =>
                    doorFinalAnswer("open")
            },

            {
                text:"不會。",
                action:() =>
                    doorFinalAnswer("closed")
            },

            {

                action:() =>

}

/* =========================================================
   最終答案
========================================================= */

function doorFinalAnswer(type){

    doorAnswerType = type;

    const memory =
        getMemory();

    memory.endings[type] =
        (memory.endings[type] || 0) + 1;

    if(
        Object.values(
            memory.endings
        ).slice(0,4).every(
            value => value > 0
        )
    ){

        memory.seenAll = true;

    }

    saveMemory(memory);

    /*
        特殊結局條件。
        這裡保留玩家選擇順序。
    */

    const q3 =
        supplementAnswers[2];

    const q5 =
        supplementAnswers[4];

    const schoolPath =
        q5 === 2;

    const alonePath =
        q3 === 0;

    /*
        第一門外問題的結果由 doorAnswer
        記錄。
        第二門外問題由 doorSecondAnswer
        記錄。
        下面以目前流程記錄的旗標判斷。
    */

    const special =
        alonePath &&
        schoolPath &&
        specialDoorFirst &&
        specialDoorSecond &&
        type === "unknown";

    if(special){

        memory.endings.special =
            (memory.endings.special || 0) + 1;

        memory.specialSeen = true;

        saveMemory(memory);

        endingSpecial();

        return;

    }

    if(type === "open"){

        endingOpen();

    }else if(type === "closed"){

        endingClosed();

    }else if(type === "unknown"){

        endingUnknown();

    }else{

        endingStop();

    }

}
