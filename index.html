<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>親密關係傾向測驗</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    min-height: 100%;
}

body {
    min-height: 100vh;
    font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    background: #f1eeeb;
    color: #45403d;
    overflow-x: hidden;
    transition: background 2.5s ease, color 2.5s ease;
}

body.normal {
    background: #f1eeeb;
    color: #45403d;
}

body.horror {
    background: radial-gradient(
        circle at 50% 40%,
        #4b2927 0%,
        #291514 50%,
        #090505 100%
    );
    color: #ddd0cc;
}

#app {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 25px;
    transition: transform 0.15s ease;
}

.card {
    width: 680px;
    max-width: 94vw;
    padding: 42px;
    background: rgba(255, 255, 255, 0.97);
    border: 1px solid #ddd7d3;
    box-shadow: 0 15px 50px rgba(45, 30, 25, 0.08);
    transition:
        background 1.8s ease,
        border-color 1.8s ease,
        box-shadow 1.8s ease;
}

body.horror .card {
    background: rgba(27, 14, 14, 0.95);
    border-color: #67433e;
    box-shadow: 0 25px 90px rgba(0, 0, 0, 0.65);
}

h1 {
    margin: 0 0 9px;
    text-align: center;
    font-size: 27px;
    font-weight: 400;
    letter-spacing: 4px;
}

.subtitle {
    text-align: center;
    color: #aaa19d;
    font-size: 11px;
    letter-spacing: 2px;
    margin-bottom: 34px;
}

body.horror .subtitle {
    color: #98716b;
}

.description {
    font-size: 15px;
    line-height: 2;
    color: #696360;
}

body.horror .description {
    color: #bca9a4;
}

.start-btn {
    display: block;
    margin: 34px auto 0;
    padding: 12px 42px;
    background: #fff;
    color: #514a47;
    border: 1px solid #aaa29d;
    cursor: pointer;
    font-family: inherit;
    transition:
        background 0.25s,
        border 0.25s,
        transform 0.15s;
}

.start-btn:hover {
    background: #eee8e4;
    border-color: #80665e;
}

.start-btn:active {
    transform: scale(0.98);
}

body.horror .start-btn {
    background: #241413;
    color: #d6c4bf;
    border-color: #68423d;
}

.question-number {
    color: #aaa19d;
    font-size: 12px;
    letter-spacing: 1px;
    margin-bottom: 22px;
}

body.horror .question-number {
    color: #98716b;
}

.question {
    font-size: 20px;
    line-height: 1.8;
    margin-bottom: 25px;
}

body.horror .question {
    color: #dfccc7;
}

.feedback {
    min-height: 42px;
    margin-top: 18px;
    font-size: 14px;
    line-height: 1.9;
    color: #8c8581;
    white-space: pre-line;
}

body.horror .feedback {
    color: #c29b93;
}

.options {
    display: flex;
    flex-direction: column;
    gap: 9px;
}

.option {
    width: 100%;
    padding: 14px 16px;
    text-align: left;
    background: #fff;
    color: #403b39;
    border: 1px solid #d8d2cf;
    cursor: pointer;
    font-family: inherit;
    transition:
        background 0.25s,
        border 0.25s,
        opacity 0.35s,
        transform 0.12s;
}

.option:hover {
    background: #f5efec;
    border-color: #a98b82;
}

.option:active {
    transform: scale(0.995);
}

.option.selected {
    background: #eee5e1;
    border-color: #927067;
}

.option.fade {
    opacity: 0;
    pointer-events: none;
}

.option:disabled {
    cursor: default;
}

body.horror .option {
    background: #241413;
    color: #d6c4bf;
    border-color: #62413c;
}

body.horror .option:hover {
    background: #38201e;
}

body.horror .option.selected {
    background: #3b211f;
    border-color: #9b5d55;
}

.progress {
    height: 2px;
    margin-top: 28px;
    background: #e6dfdc;
}

.progress-bar {
    height: 100%;
    background: #99786f;
    transition: width 0.5s ease;
}

body.horror .progress {
    background: #3c2422;
}

body.horror .progress-bar {
    background: #985a52;
}

#noise {
    position: fixed;
    inset: 0;
    z-index: 9999;
    pointer-events: none;
    opacity: 0;
    background:
        repeating-linear-gradient(
            0deg,
            rgba(255, 255, 255, 0.15) 0px,
            rgba(255, 255, 255, 0.15) 1px,
            rgba(0, 0, 0, 0.18) 1px,
            rgba(0, 0, 0, 0.18) 3px
        );
    mix-blend-mode: screen;
}

#noise.active {
    animation: staticBurst 0.7s steps(7);
}

@keyframes staticBurst {
    0% {
        opacity: 0;
    }

    15% {
        opacity: 0.3;
    }

    30% {
        opacity: 0.05;
    }

    47% {
        opacity: 0.24;
    }

    68% {
        opacity: 0.08;
    }

    100% {
        opacity: 0;
    }
}

body.shake #app {
    animation: screenShake 0.55s;
}

@keyframes screenShake {
    0% {
        transform: translate(0, 0);
    }

    20% {
        transform: translate(-5px, 2px);
    }

    40% {
        transform: translate(5px, -3px);
    }

    60% {
        transform: translate(-3px, 3px);
    }

    80% {
        transform: translate(3px, -2px);
    }

    100% {
        transform: translate(0, 0);
    }
}

#darkTransition {
    position: fixed;
    inset: 0;
    z-index: 3000;
    pointer-events: none;
    opacity: 0;
    background:
        radial-gradient(
            circle,
            rgba(95, 30, 25, 0.02),
            rgba(8, 3, 3, 0.94)
        );
    transition: opacity 5s ease;
}

#darkTransition.active {
    opacity: 0.58;
}

#whisper {
    position: fixed;
    left: 50%;
    bottom: 11%;
    transform: translateX(-50%);
    z-index: 4000;
    color: #884a43;
    font-size: 12px;
    letter-spacing: 3px;
    opacity: 0;
    pointer-events: none;
    white-space: nowrap;
}

#whisper.show {
    animation: whisperAppear 4s forwards;
}

@keyframes whisperAppear {
    0% {
        opacity: 0;
    }

    20% {
        opacity: 0.72;
    }

    40% {
        opacity: 0.13;
    }

    65% {
        opacity: 0.52;
    }

    100% {
        opacity: 0;
    }
}

/* 第11題：快速閃現 */
#elevenFlash {
    position: fixed;
    inset: 0;
    z-index: 7000;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #070303;
    opacity: 0;
    pointer-events: none;
}

#elevenFlash.show {
    animation: elevenFlashIn 1.15s forwards;
}

.eleven-box {
    width: 680px;
    max-width: 90vw;
    text-align: center;
    color: #e3d0cb;
}

.eleven-small {
    font-size: 10px;
    letter-spacing: 5px;
    color: #906d67;
    margin-bottom: 26px;
}

.eleven-title {
    font-size: 22px;
    line-height: 2;
}

.eleven-warning {
    margin-top: 25px;
    color: #7f4a44;
    font-size: 11px;
    letter-spacing: 3px;
}

@keyframes elevenFlashIn {
    0% {
        opacity: 0;
    }

    8% {
        opacity: 1;
    }

    68% {
        opacity: 1;
    }

    100% {
        opacity: 0;
    }
}

/* 最後限時題 */
#threeSecond {
    position: fixed;
    inset: 0;
    z-index: 6000;
    display: flex;
    justify-content: center;
    align-items: center;
    background: rgba(5, 3, 3, 0.96);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.35s;
}

#threeSecond.show {
    opacity: 1;
    pointer-events: auto;
}

.three-box {
    width: 650px;
    max-width: 90vw;
    text-align: center;
    color: #ddcbc6;
}

.three-small {
    font-size: 10px;
    letter-spacing: 5px;
    color: #906d67;
    margin-bottom: 28px;
}

.three-title {
    font-size: 21px;
    line-height: 2;
    margin-bottom: 28px;
}

.three-option {
    display: block;
    width: 100%;
    max-width: 430px;
    margin: 8px auto;
    padding: 12px;
    background: rgba(49, 24, 22, 0.72);
    color: #d1bdb8;
    border: 1px solid #68413c;
    font-family: inherit;
    cursor: pointer;
}

.three-timer {
    width: 100%;
    max-width: 430px;
    height: 2px;
    margin: 25px auto 0;
    background: #382321;
}

.three-timer-bar {
    width: 100%;
    height: 100%;
    background: #985b53;
}

@keyframes timerThree {
    from {
        width: 100%;
    }

    to {
        width: 0%;
    }
}

.dialogue {
    text-align: center;
    min-height: 230px;
    display: flex;
    flex-direction: column;
    justify-content: center;
}

.dialogue-speaker {
    font-size: 10px;
    letter-spacing: 4px;
    color: #88615b;
    margin-bottom: 24px;
}

.dialogue-text {
    min-height: 90px;
    font-size: 19px;
    line-height: 2;
    color: #d8c5c0;
    white-space: pre-line;
}

.dialogue-options {
    margin-top: 22px;
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.ending-line {
    margin-top: 26px;
    text-align: center;
    color: #9a756e;
    font-size: 13px;
    line-height: 2;
    min-height: 52px;
}

.meta-note {
    text-align: center;
    color: #9a756e;
    font-size: 11px;
    letter-spacing: 1px;
    min-height: 18px;
    margin-top: 18px;
}

/* 最後的文字填滿 */
#eternalWait {
    position: fixed;
    inset: 0;
    z-index: 8500;
    overflow: hidden;
    background: #090505;
    color: #b56b62;
    opacity: 0;
    pointer-events: none;
}

#eternalWait.show {
    opacity: 1;
    pointer-events: auto;
}

.wait-word {
    position: absolute;
    white-space: nowrap;
    user-select: none;
    animation: waitPulse 3s ease-in-out infinite;
}

@keyframes waitPulse {
    0% {
        opacity: 0.18;
    }

    50% {
        opacity: 0.8;
    }

    100% {
        opacity: 0.18;
    }
}

.wait-center {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    z-index: 2;
    width: 100%;
    text-align: center;
    color: #e2c7c2;
    font-size: clamp(22px, 5vw, 48px);
    letter-spacing: 8px;
    text-shadow: 0 0 18px rgba(150, 65, 55, 0.45);
}

@media (max-width: 600px) {
    #app {
        padding: 14px;
    }

    .card {
        padding: 27px 21px;
    }

    h1 {
        font-size: 22px;
    }

    .question {
        font-size: 18px;
    }

    .dialogue-text {
        font-size: 17px;
    }
}
</style>
</head>

<body class="normal">

<div id="noise"></div>
<div id="darkTransition"></div>
<div id="whisper"></div>

<div id="elevenFlash">
    <div class="eleven-box">
        <div class="eleven-small">第 11 個回答</div>
        <div class="eleven-title">
            如果現在有人站在你身後，<br>
            你會回頭嗎？
        </div>
        <div class="eleven-warning">
            請立即回答
        </div>
    </div>
</div>

<div id="threeSecond">
    <div class="three-box">
        <div class="three-small">請立即回答</div>
        <div class="three-title" id="threeTitle">
            如果我現在就在門外，<br>
            你覺得我會做什麼？
        </div>

        <button class="three-option" onclick="threeAnswer(0)">
            敲門
        </button>

        <button class="three-option" onclick="threeAnswer(1)">
            叫你的名字
        </button>

        <button class="three-option" onclick="threeAnswer(2)">
            什麼都不做
        </button>

        <button class="three-option" onclick="threeAnswer(3)">
            我不想知道
        </button>

        <div class="three-timer">
            <div class="three-timer-bar" id="threeTimerBar"></div>
        </div>
    </div>
</div>

<div id="eternalWait">
    <div id="waitWords"></div>
    <div class="wait-center">
        我永遠等你。
    </div>
</div>

<div id="app"></div>

<script>
/* =========================================================
   V25 狀態
   重要：
   - 題目顯示仍以「10題」為主
   - 第11題是快速閃現驚嚇
   - 補充題共7題
========================================================= */

const normalQuestions = [
    {
        q: "當你情緒低落時，你最希望喜歡的人怎麼做？",
        a: [
            "陪我聊聊天。",
            "先給我一點空間。",
            "直接問我發生了什麼。",
            "陪在旁邊，不一定要說話。"
        ]
    },
    {
        q: "你認為戀人之間需要知道彼此每天的行程嗎？",
        a: [
            "不用，彼此都有自己的生活。",
            "大概知道就好。",
            "如果對方願意，我會想知道。",
            "重要的事情可以互相說。"
        ]
    },
    {
        q: "如果對方一整天沒有主動找你，你會？",
        a: [
            "做自己的事情。",
            "晚一點再傳訊息。",
            "有點想知道他在忙什麼。",
            "如果和平常差很多，會問問。"
        ]
    },
    {
        q: "如果對方說今天想一個人，你會？",
        a: [
            "尊重他的決定。",
            "告訴他需要時可以找我。",
            "有點失落，但還是會給空間。",
            "等他自己願意說。"
        ]
    },
    {
        q: "如果你傳了一則訊息，對方兩個小時都沒有回，你會？",
        a: [
            "沒關係，他可能在忙。",
            "偶爾看一下手機。",
            "有點期待通知。",
            "如果很反常，會稍微擔心。"
        ]
    },
    {
        q: "你覺得戀人應該知道彼此的手機密碼嗎？",
        a: [
            "不用。",
            "知道也沒關係，但不需要查看。",
            "如果彼此願意可以交換。",
            "我比較重視信任，而不是密碼。"
        ]
    },
    {
        q: "如果對方突然取消原本約好的見面，你會？",
        a: [
            "沒關係，下次再約。",
            "問問是不是發生了什麼。",
            "會有一點失望。",
            "看取消的理由。"
        ]
    },
    {
        q: "如果你發現對方已讀了訊息，卻沒有回覆，你會？",
        a: [
            "等他有時間再回。",
            "過一陣子再看看。",
            "會稍微想一下是不是說錯了什麼。",
            "如果一直沒有回，會再問一次。"
        ]
    },
    {
        q: "平常很快回你的人，突然六個小時沒有回覆，你會？",
        a: [
            "他可能真的很忙。",
            "等明天再看看。",
            "會覺得有一點奇怪。",
            "會傳一句「還好嗎？」"
        ]
    },
    {
        q: "你認為一段健康的關係最重要的是什麼？",
        a: [
            "信任。",
            "溝通。",
            "陪伴。",
            "彼此尊重。"
        ]
    }
];

const normalFeedback = [
    [
        "你似乎比較重視陪伴，而不是立即得到答案。",
        "你會給對方空間。",
        "你希望對方直接理解你的情緒。",
        "你在意有人安靜地陪著你。"
    ],
    [
        "你重視自己的生活界線。",
        "你願意分享，但不希望被要求交代。",
        "你對彼此的生活有一定程度的好奇。",
        "你傾向把重要的事情說清楚。"
    ],
    [
        "你不太容易被單次的沉默影響。",
        "你會先觀察，再決定要不要聯絡。",
        "你會注意對方的動向。",
        "異常的改變會讓你想確認對方是否安好。"
    ],
    [
        "你願意尊重對方的獨處時間。",
        "你會留下聯絡的可能。",
        "你雖然失落，但仍會給空間。",
        "你比較傾向等對方主動。"
    ],
    [
        "你會把沒有回覆理解成可能的忙碌。",
        "你會留意手機，但不一定會追問。",
        "你會期待通知。",
        "你會根據平常的習慣判斷是否異常。"
    ],
    [
        "你把信任和界線分得很清楚。",
        "你接受透明，但不認為查看是必要的。",
        "你願意在雙方同意下分享。",
        "你更看重互相信任。"
    ],
    [
        "你能接受計畫改變。",
        "你會先確認原因。",
        "你會感到失望，但不一定追究。",
        "你會依照情況判斷。"
    ],
    [
        "你傾向給對方時間。",
        "你會再觀察。",
        "你可能會反思自己是不是說了什麼。",
        "你會希望得到一個明確回覆。"
    ],
    [
        "你會先相信對方可能正在忙。",
        "你願意等待。",
        "你會注意和平常不同的地方。",
        "你會主動確認狀況。"
    ],
    [
        "你把關係建立在多個因素上，而不是單一答案。",
        "你很重視說清楚。",
        "你在意彼此的陪伴。",
        "你重視界線與尊重。"
    ]
];

/*
    補充題共7題。

    補1：
    使用最新版原本的「你喜歡我嗎？」互動。

    補2：
    你現在是一個人嗎？

    補3：
    你現在在哪裡？

    補4：
    依照補2與補3進行分支。

    補5：
    位置／環境延伸。

    補6：
    她開始更明顯記得玩家說過的內容。

    補7：
    腳步聲與最後確認。
*/

const supplementQuestions = [
    {
        q: "你現在是一個人嗎？",
        a: [
            "是。",
            "不是。",
            "我不知道。",
            "不想回答。"
        ]
    },
    {
        q: "你現在在哪裡？",
        a: [
            "家裡。",
            "房間。",
            "學校。",
            "外面。",
            "不告訴你。"
        ]
    },
    {
        q: "如果我知道你現在在哪裡，你會覺得奇怪嗎？",
        a: [
            "會。",
            "不會。",
            "有一點。",
            "我不想知道。"
        ]
    },
    {
        q: "你覺得我現在離你很近嗎？",
        a: [
            "很近。",
            "不近。",
            "不知道。",
            "不要問了。"
        ]
    },
    {
        q: "如果你現在聽到腳步聲，你會先做什麼？",
        a: [
            "確認聲音從哪裡來。",
            "繼續做自己的事情。",
            "安靜下來聽。",
            "離開現在的位置。"
        ]
    },
    {
        q: "你剛才說的話，我有全部記住。你相信嗎？",
        a: [
            "相信。",
            "不相信。",
            "不知道。",
            "我不想相信。"
        ]
    },
    {
        q: "如果我現在就在你附近，你希望我離開嗎？",
        a: [
            "希望。",
            "不用。",
            "我不知道。",
            "不要再問了。"
        ]
    }
];

let phase = "normal";
let current = 0;

let normalAnswers = [];
let supplementAnswers = [];

let audioCtx = null;
let threeTimer = null;
let threeResolved = false;

let flashTimer = null;
let flashResolved = false;

let likeRepeated = {};
let selectedLocation = null;
let selectedAlone = null;

const storageKey = "relationship_v25_memory";

function getMemory() {
    try {
        const raw = localStorage.getItem(storageKey);

        if (raw) {
            return JSON.parse(raw);
        }
    } catch (error) {
    }

    return {
        plays: 0,
        endings: {
            open: 0,
            closed: 0,
            unknown: 0,
            stop: 0
        },
        special: {},
        seenAll: false
    };
}

function saveMemory(memory) {
    try {
        localStorage.setItem(
            storageKey,
            JSON.stringify(memory)
        );
    } catch (error) {
    }
}

function beginPlay() {
    const memory = getMemory();

    memory.plays = (memory.plays || 0) + 1;

    saveMemory(memory);
}

function incrementSpecial(key) {
    const memory = getMemory();

    memory.special[key] =
        (memory.special[key] || 0) + 1;

    saveMemory(memory);
}

/* =========================================================
   音效
========================================================= */

function initAudio() {
    try {
        if (!audioCtx) {
            audioCtx =
                new (
                    window.AudioContext ||
                    window.webkitAudioContext
                )();
        }

        if (audioCtx.state === "suspended") {
            audioCtx.resume();
        }
    } catch (error) {
    }
}

function tone(
    frequency,
    duration,
    volume,
    type = "sine"
) {
    if (!audioCtx) {
        return;
    }

    const oscillator =
        audioCtx.createOscillator();

    const gain =
        audioCtx.createGain();

    oscillator.type = type;

    oscillator.frequency.value =
        frequency;

    gain.gain.setValueAtTime(
        0.0001,
        audioCtx.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        volume,
        audioCtx.currentTime + 0.025
    );

    gain.gain.exponentialRampToValueAtTime(
        0.0001,
        audioCtx.currentTime + duration
    );

    oscillator.connect(gain);

    gain.connect(
        audioCtx.destination
    );

    oscillator.start();

    oscillator.stop(
        audioCtx.currentTime +
        duration +
        0.04
    );
}

function staticSound(
    strength = 0.035,
    duration = 0.18
) {
    if (!audioCtx) {
        return;
    }

    const buffer =
        audioCtx.createBuffer(
            1,
            audioCtx.sampleRate * duration,
            audioCtx.sampleRate
        );

    const data =
        buffer.getChannelData(0);

    for (
        let i = 0;
        i < data.length;
        i++
    ) {
        data[i] =
            (Math.random() * 2 - 1) *
            strength;
    }

    const source =
        audioCtx.createBufferSource();

    const gain =
        audioCtx.createGain();

    gain.gain.value = 0.65;

    source.buffer = buffer;

    source.connect(gain);

    gain.connect(
        audioCtx.destination
    );

    source.start();
}

function lowHum(
    duration = 2.2,
    volume = 0.025
) {
    if (!audioCtx) {
        return;
    }

    const oscillator =
        audioCtx.createOscillator();

    const gain =
        audioCtx.createGain();

    oscillator.type = "sine";

    oscillator.frequency.value = 47;

    gain.gain.setValueAtTime(
        0.0001,
        audioCtx.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        volume,
        audioCtx.currentTime + 0.55
    );

    gain.gain.exponentialRampToValueAtTime(
        0.0001,
        audioCtx.currentTime + duration
    );

    oscillator.connect(gain);

    gain.connect(
        audioCtx.destination
    );

    oscillator.start();

    oscillator.stop(
        audioCtx.currentTime +
        duration +
        0.1
    );
}

function knock(volume = 0.28) {
    if (!audioCtx) {
        return;
    }

    tone(
        83,
        0.12,
        volume,
        "sine"
    );

    setTimeout(
        () =>
            tone(
                61,
                0.08,
                volume * 0.35,
                "sine"
            ),
        65
    );
}

function footstep(volume = 0.12) {
    if (!audioCtx) {
        return;
    }

    tone(
        72,
        0.08,
        volume,
        "sine"
    );

    setTimeout(
        () =>
            tone(
                58,
                0.07,
                volume * 0.7,
                "sine"
            ),
        95
    );

    setTimeout(
        () =>
            tone(
                72,
                0.07,
                volume * 0.8,
                "sine"
            ),
        205
    );
}

function answerLike(

        options[index];

        selected;

        (likeRepeated[key] || 0) +
        1;

    const count =
        likeRepeated[key];

    const feedback =
        document.getElementById(
            "likeFeedback"
        );

    /*

    if (selected === "喜歡") {
        feedback.textContent =
            "……我就知道。";

        setTimeout(
            doorDialogueStart,
            1200
        );

        return;
    }

    /*
        玩家選其他答案：
        不會卡死。
        反應依同一答案被重複選取次數增加。
    */

    const reactionTable = {
        "不喜歡": [
            "……你再說一次。",
            "你剛才不是這樣回答我的。",
            "不要這樣說。",

            "再選一次。",
            "我不喜歡聽見這個答案。"
        ]
    };

    const lines =
        reactionTable[selected];

    feedback.textContent =
        lines[
            Math.min(
                count - 1,
                lines.length - 1
            )
        ];

    screenShake();

    setTimeout(
        () => {
            tone(
                68,
                0.25,
                0.035
            );
        },
        160
    );

    /*
        不管玩家選什麼非喜歡，
        都把該選項改成「喜歡」。

    options[index] =

/* =========================================================
   特殊結局條件
========================================================= */

function hasSequence(
    array,
    sequence
) {
    if (
        sequence.length >
        array.length
    ) {
        return false;
    }

    for (
        let i = 0;
        i <=
        array.length -
        sequence.length;
        i++
    ) {
        let match = true;

        for (
            let j = 0;
            j < sequence.length;
            j++
        ) {
            if (
                array[i + j] !==
                sequence[j]
            ) {
                match = false;

                break;
            }
        }

        if (match) {
            return true;
        }
    }

    return false;
}

function getSpecialEnding() {
    /*
        這裡讓玩家的前10題答案
        成為特殊結局條件。

        不是每個人都必須走同一條。
    */

    if (
        hasSequence(
            normalAnswers,
            [0, 0, 0]
        )
    ) {
        return "quiet";
    }

    if (
        hasSequence(
            normalAnswers,
            [3, 3, 3]
        )
    ) {
        return "close";
    }

    if (
        selectedLocation === 2 &&
        hasSequence(
            normalAnswers,
            [1, 2, 3]
        )
    ) {
        return "school";
    }

    if (
        normalAnswers[5] === 0 &&
        normalAnswers[7] === 2 &&
        normalAnswers[9] === 1
    ) {
        return "remember";
    }

    return null;
}

function doorFinalAnswer(
    type
) {
    const memory =
        getMemory();

    memory.endings[type] =
        (memory.endings[type] || 0) +
        1;

    memory.seenAll =
        Object.values(
            memory.endings
        ).every(
            value => value > 0
        );

    saveMemory(memory);

    if (type === "open") {
        endingOpen();

        return;
    }

    if (type === "closed") {
        endingClosed();

        return;
    }

    if (type === "unknown") {
        endingUnknown();

        return;
    }

    endingStop();
}

            <h1>
                親密關係傾向測驗
            </h1>

            <div class="subtitle">
                RELATIONSHIP & ATTACHMENT TEST
            </div>

            <div class="description">
                <p>
                    測驗已完成。
                </p>

                <p
                    style="
                        color:#aaa;
                        margin-top:28px;
                    "
                >
                    系統運作正常。
                </p>
            </div>

            <button
                class="start-btn"
                onclick="goAgain()"
            >
                再次測試
            </button>

        </div>
    `;

    /*
        這裡延遲出現「我永遠等你」，
        讓玩家先以為一切真的恢復正常。
    */
    setTimeout(
        showEternalWait,
        1700
    );
}

function showEternalWait() {
    const overlay =
        document.getElementById(
            "eternalWait"
        );

    const words =
        document.getElementById(
            "waitWords"
        );

    words.innerHTML = "";

    /*
        文字逐步增加，
        最後把整個畫面填滿。
    */
    const total =
        window.innerWidth < 600
            ? 95
            : 180;

    for (
        let i = 0;
        i < total;
        i++
    ) {
        const span =
            document.createElement(
                "div"
            );

        span.className =
            "wait-word";

        span.textContent =
            "我永遠等你。";

        const size =
            10 +
            Math.random() * 16;

        span.style.fontSize =
            size + "px";

        span.style.left =
            Math.random() * 100 +
            "%";

        span.style.top =
            Math.random() * 100 +
            "%";

        span.style.transform =
            "translate(-50%, -50%) rotate(" +
            (
                Math.random() * 8 -
                4
            ) +
            "deg)";

        span.style.animationDelay =
            Math.random() * 3 +
            "s";

        words.appendChild(
            span
        );
    }

    overlay.classList.add(
        "show"
    );

    lowHum(
        6,
        0.018
    );
}

function goAgain() {
    /*
        保留多周目記憶。
        不清除 localStorage。
    */
    home();
}
</script>
