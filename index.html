<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>親密關係傾向測驗｜V24</title>

<style>

/* =========================================================
   V24 基礎
========================================================= */

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    min-height:100%;
}

body{
    min-height:100vh;

    font-family:
        "Noto Sans TC",
        "Microsoft JhengHei",
        sans-serif;

    background:#f1eeeb;
    color:#45403d;

    transition:
        background 5s ease,
        color 5s ease;

    overflow-x:hidden;
}

#app{
    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:25px;

    transition:
        transform .15s ease,
        filter 1s ease;
}

.card{
    width:680px;
    max-width:94vw;

    padding:42px;

    background:rgba(255,255,255,.97);

    border:1px solid #ddd7d3;

    box-shadow:
        0 15px 50px rgba(45,30,25,.08);

    transition:
        background 5s ease,
        border-color 5s ease,
        box-shadow 5s ease,
        opacity .5s ease,
        filter .5s ease;
}

h1{
    margin:0 0 9px;

    text-align:center;

    font-size:27px;
    font-weight:400;

    letter-spacing:4px;
}

.subtitle{
    text-align:center;

    color:#aaa19d;

    font-size:11px;

    letter-spacing:2px;

    margin-bottom:34px;
}

.description{
    font-size:15px;

    line-height:2;

    color:#696360;
}

.start-btn{
    display:block;

    margin:34px auto 0;

    padding:12px 42px;

    background:#fff;

    color:#514a47;

    border:1px solid #aaa29d;

    cursor:pointer;

    font-family:inherit;

    transition:
        background .25s,
        border .25s,
        transform .15s,
        box-shadow .25s;
}

.start-btn:hover{
    background:#eee8e4;

    border-color:#80665e;

    box-shadow:
        0 5px 18px rgba(60,30,25,.08);
}

.start-btn:active{
    transform:scale(.98);
}


/* =========================================================
   題目
========================================================= */

.question-number{
    color:#aaa19d;

    font-size:12px;

    letter-spacing:1px;

    margin-bottom:22px;
}

.question{
    font-size:20px;

    line-height:1.8;

    margin-bottom:25px;

    white-space:pre-line;
}

.feedback{
    min-height:28px;

    margin-top:18px;

    font-size:13px;

    line-height:1.8;

    color:#8c8581;

    opacity:0;

    transition:
        opacity .45s ease;
}

.feedback.show{
    opacity:1;
}

.options{
    display:flex;

    flex-direction:column;

    gap:9px;
}

.option{
    width:100%;

    padding:14px 16px;

    text-align:left;

    background:#fff;

    color:#403b39;

    border:1px solid #d8d2cf;

    cursor:pointer;

    font-family:inherit;

    transition:
        background .25s,
        border .25s,
        opacity .35s,
        transform .12s,
        box-shadow .3s;
}

.option:hover{
    background:#f5efec;

    border-color:#a98b82;
}

.option:active{
    transform:scale(.995);
}

.option.selected{
    background:#eee5e1;

    border-color:#927067;

    box-shadow:
        0 0 0 1px rgba(146,112,103,.08);
}

.option.fade{
    opacity:0;

    pointer-events:none;
}

.option:disabled{
    cursor:default;
}


/* =========================================================
   進度
========================================================= */

.progress{
    height:2px;

    margin-top:28px;

    background:#e6dfdc;
}

.progress-bar{
    height:100%;

    background:#99786f;

    transition:
        width .5s ease;
}


/* =========================================================
   紅黑恐怖模式
========================================================= */

body.horror{
    background:
        radial-gradient(
            circle at 50% 40%,
            #4b2927 0%,
            #291514 50%,
            #090505 100%
        );

    color:#ddd0cc;
}

body.horror .card{
    background:rgba(27,14,14,.95);

    border-color:#67433e;

    box-shadow:
        0 25px 90px rgba(0,0,0,.65);
}

body.horror h1,
body.horror .question{
    color:#dfccc7;
}

body.horror .subtitle,
body.horror .question-number{
    color:#98716b;
}

body.horror .description{
    color:#bca9a4;
}

body.horror .option{
    background:#241413;

    color:#d6c4bf;

    border-color:#62413c;
}

body.horror .option:hover{
    background:#38201e;
}

body.horror .option.selected{
    background:#43211f;

    border-color:#9a5a51;
}

body.horror .progress{
    background:#3c2422;
}

body.horror .progress-bar{
    background:#985a52;
}

body.horror .start-btn{
    background:#241413;

    color:#d6c4bf;

    border-color:#68423d;
}

body.horror .feedback{
    color:#a97a72;
}


/* =========================================================
   更深恐怖
========================================================= */

body.deep-horror{
    background:
        radial-gradient(
            circle at 50% 45%,
            #321311 0%,
            #100606 45%,
            #000 100%
        );
}

body.deep-horror .card{
    background:
        rgba(13,5,5,.96);

    border-color:#4b2926;

    box-shadow:
        0 30px 110px rgba(0,0,0,.85);
}


/* =========================================================
   雪花
========================================================= */

#noise{
    position:fixed;

    inset:0;

    z-index:9999;

    pointer-events:none;

    opacity:0;

    background:
        repeating-linear-gradient(
            0deg,
            rgba(255,255,255,.15) 0px,
            rgba(255,255,255,.15) 1px,
            rgba(0,0,0,.18) 1px,
            rgba(0,0,0,.18) 3px
        );

    mix-blend-mode:screen;
}

#noise.active{
    animation:
        staticBurst .7s steps(7);
}

@keyframes staticBurst{

    0%{
        opacity:0;
    }

    15%{
        opacity:.30;
    }

    30%{
        opacity:.05;
    }

    47%{
        opacity:.24;
    }

    68%{
        opacity:.08;
    }

    100%{
        opacity:0;
    }
}


/* =========================================================
   畫面晃動
========================================================= */

body.shake #app{
    animation:
        screenShake .55s;
}

@keyframes screenShake{

    0%{
        transform:translate(0,0);
    }

    20%{
        transform:translate(-3px,1px);
    }

    40%{
        transform:translate(3px,-2px);
    }

    60%{
        transform:translate(-2px,2px);
    }

    80%{
        transform:translate(2px,-1px);
    }

    100%{
        transform:translate(0,0);
    }
}


/* =========================================================
   黑暗轉場
========================================================= */

#darkTransition{
    position:fixed;

    inset:0;

    z-index:3000;

    pointer-events:none;

    opacity:0;

    background:
        radial-gradient(
            circle,
            rgba(95,30,25,.02),
            rgba(8,3,3,.94)
        );

    transition:
        opacity 6s ease;
}

#darkTransition.active{
    opacity:.58;
}


/* =========================================================
   異常紅光
========================================================= */

#redPulse{
    position:fixed;

    inset:0;

    z-index:3500;

    pointer-events:none;

    opacity:0;

    background:
        radial-gradient(
            circle,
            rgba(130,30,25,.20),
            rgba(80,0,0,0)
        );
}

#redPulse.active{
    animation:
        redPulseAnim .8s ease;
}

@keyframes redPulseAnim{

    0%{
        opacity:0;
    }

    35%{
        opacity:.8;
    }

    55%{
        opacity:.15;
    }

    100%{
        opacity:0;
    }
}


/* =========================================================
   門外對話
========================================================= */

.dialogue{
    text-align:center;

    min-height:230px;

    display:flex;

    flex-direction:column;

    justify-content:center;
}

.dialogue-speaker{
    font-size:10px;

    letter-spacing:4px;

    color:#88615b;

    margin-bottom:24px;
}

.dialogue-text{
    min-height:90px;

    font-size:19px;

    line-height:2;

    color:#d8c5c0;

    white-space:pre-line;
}

.dialogue-options{
    margin-top:22px;

    display:flex;

    flex-direction:column;

    gap:8px;
}


/* =========================================================
   打字游標
========================================================= */

.typing-cursor{
    display:inline-block;

    width:7px;

    height:19px;

    margin-left:3px;

    background:#9b6961;

    vertical-align:-2px;

    animation:
        cursorBlink .7s infinite;
}

@keyframes cursorBlink{

    0%,50%{
        opacity:1;
    }

    51%,100%{
        opacity:0;
    }
}


/* =========================================================
   Whisper
========================================================= */

#whisper{
    position:fixed;

    left:50%;

    bottom:11%;

    transform:translateX(-50%);

    z-index:4000;

    color:#884a43;

    font-size:12px;

    letter-spacing:3px;

    opacity:0;

    pointer-events:none;

    white-space:nowrap;
}

#whisper.show{
    animation:
        whisperAppear 4s forwards;
}

@keyframes whisperAppear{

    0%{
        opacity:0;
    }

    20%{
        opacity:.65;
    }

    40%{
        opacity:.13;
    }

    65%{
        opacity:.48;
    }

    100%{
        opacity:0;
    }
}


/* =========================================================
   第11題特殊
========================================================= */

.single-answer{
    width:220px;

    margin:35px auto 0;

    text-align:center;
}

#elevenTimer{
    width:220px;

    height:2px;

    margin:18px auto 0;

    background:#e5dedb;

    overflow:hidden;
}

#elevenTimerBar{
    width:100%;

    height:100%;

    background:#927067;
}

body.horror #elevenTimer{
    background:#3c2422;
}

body.horror #elevenTimerBar{
    background:#a35249;
}

.eleven-warning{
    text-align:center;

    color:#a28c87;

    font-size:11px;

    margin-top:12px;

    letter-spacing:1px;
}


/* =========================================================
   三秒問題
========================================================= */

#threeSecond{
    position:fixed;

    inset:0;

    z-index:6000;

    display:flex;

    justify-content:center;

    align-items:center;

    background:rgba(5,3,3,.96);

    opacity:0;

    pointer-events:none;

    transition:
        opacity .35s;
}

#threeSecond.show{
    opacity:1;

    pointer-events:auto;
}

.three-box{
    width:650px;

    max-width:90vw;

    text-align:center;

    color:#ddcbc6;
}

.three-small{
    font-size:10px;

    letter-spacing:5px;

    color:#906d67;

    margin-bottom:28px;
}

.three-title{
    font-size:21px;

    line-height:2;

    margin-bottom:28px;
}

.three-option{
    display:block;

    width:100%;

    max-width:430px;

    margin:8px auto;

    padding:12px;

    background:rgba(49,24,22,.72);

    color:#d1bdb8;

    border:1px solid #68413c;

    font-family:inherit;

    cursor:pointer;

    transition:
        background .2s,
        transform .15s;
}

.three-option:hover{
    background:#42211f;

    transform:translateY(-1px);
}

.three-timer{
    width:100%;

    max-width:430px;

    height:2px;

    margin:25px auto 0;

    background:#382321;
}

.three-timer-bar{
    width:100%;

    height:100%;

    background:#985b53;

    animation:
        timerThree 3s linear forwards;
}

@keyframes timerThree{

    from{
        width:100%;
    }

    to{
        width:0%;
    }
}


/* =========================================================
   結果數值
========================================================= */

.result-grid{
    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:12px;

    margin-top:25px;
}

.result-item{
    padding:15px;

    border:1px solid #ddd7d3;

    background:#faf8f7;
}

.result-label{
    font-size:11px;

    color:#99918d;

    margin-bottom:8px;

    letter-spacing:1px;
}

.result-value{
    font-size:14px;

    color:#5d504b;
}

.result-bar{
    width:100%;

    height:3px;

    margin-top:10px;

    background:#e4dedb;
}

.result-bar-inner{
    height:100%;

    background:#99786f;

    transition:
        width 1s ease;
}

body.horror .result-item{
    background:#241413;

    border-color:#54322f;
}

body.horror .result-label{
    color:#98716b;
}

body.horror .result-value{
    color:#d4c0bb;
}

body.horror .result-bar{
    background:#3c2422;
}

body.horror .result-bar-inner{
    background:#985a52;
}


/* =========================================================
   404
========================================================= */

.error-page{
    text-align:center;
}

.error-code{
    font-size:64px;

    letter-spacing:7px;

    color:#8e4d46;

    margin-bottom:15px;
}

.error-small{
    font-size:10px;

    color:#8d6c67;

    letter-spacing:3px;
}


/* =========================================================
   手機
========================================================= */

@media(max-width:600px){

    #app{
        padding:14px;
    }

    .card{
        padding:27px 21px;
    }

    h1{
        font-size:22px;
    }

    .question{
        font-size:18px;
    }

    .dialogue-text{
        font-size:17px;
    }

    .result-grid{
        grid-template-columns:1fr;
    }

    .three-title{
        font-size:18px;
    }
}

</style>
</head>


<body>

<div id="noise"></div>

<div id="darkTransition"></div>

<div id="redPulse"></div>

<div id="whisper"></div>


<!-- =========================================================
     三秒問題
========================================================= -->

<div id="threeSecond">

    <div class="three-box">

        <div class="three-small">
            請立即回答
        </div>

        <div class="three-title">
            如果你現在回頭，<br>
            你覺得房間裡會多出什麼？
        </div>

        <button
            class="three-option"
            onclick="threeAnswer(0)"
        >
            一個人
        </button>

        <button
            class="three-option"
            onclick="threeAnswer(1)"
        >
            一個影子
        </button>

        <button
            class="three-option"
            onclick="threeAnswer(2)"
        >
            什麼都沒有
        </button>

        <button
            class="three-option"
            onclick="threeAnswer(3)"
        >
            我不想回頭看
        </button>

        <div class="three-timer">

            <div
                class="three-timer-bar"
                id="threeTimerBar"
            ></div>

        </div>

    </div>

</div>


<div id="app"></div>


<script>

/* =========================================================
   V24｜正常 10 題
========================================================= */

const normalQuestions = [

{
    q:"當你情緒低落時，你最希望喜歡的人怎麼做？",

    a:[
        "陪我聊聊天。",
        "先給我一點空間。",
        "直接問我發生了什麼。",
        "陪在旁邊，不一定要說話。"
    ]
},

{
    q:"你認為戀人之間需要知道彼此每天的行程嗎？",

    a:[
        "不用，彼此都有自己的生活。",
        "大概知道就好。",
        "如果對方願意，我會想知道。",
        "重要的事情可以互相說。"
    ]
},

{
    q:"如果對方一整天沒有主動找你，你會？",

    a:[
        "做自己的事情。",
        "晚一點再傳訊息。",
        "有點想知道他在忙什麼。",
        "如果和平常差很多，會問問。"
    ]
},

{
    q:"如果對方說今天想一個人，你會？",

    a:[
        "尊重他的決定。",
        "告訴他需要時可以找我。",
        "有點失落，但還是會給空間。",
        "等他自己願意說。"
    ]
},

{
    q:"如果你傳了一則訊息，對方兩個小時都沒有回，你會？",

    a:[
        "沒關係，他可能在忙。",
        "偶爾看一下手機。",
        "有點期待通知。",
        "如果很反常，會稍微擔心。"
    ]
},

{
    q:"你覺得戀人應該知道彼此的手機密碼嗎？",

    a:[
        "不用。",
        "知道也沒關係，但不需要查看。",
        "如果彼此願意可以交換。",
        "我比較重視信任，而不是密碼。"
    ]
},

{
    q:"如果對方突然取消原本約好的見面，你會？",

    a:[
        "沒關係，下次再約。",
        "問問是不是發生了什麼。",
        "會有一點失望。",
        "看取消的理由。"
    ]
},

{
    q:"如果你發現對方已讀了訊息，卻沒有回覆，你會？",

    a:[
        "等他有時間再回。",
        "過一陣子再看看。",
        "會稍微想一下是不是說錯了什麼。",
        "如果一直沒有回，會再問一次。"
    ]
},

{
    q:"平常很快回你的人，突然六個小時沒有回覆，你會？",

    a:[
        "他可能真的很忙。",
        "等明天再看看。",
        "會覺得有一點奇怪。",
        "會傳一句「還好嗎？」"
    ]
},

{
    q:"你認為一段健康的關係最重要的是什麼？",

    a:[
        "信任。",
        "溝通。",
        "陪伴。",
        "彼此尊重。"
    ]
}

];


/* =========================================================
   補充 5 題
========================================================= */

const supplementQuestions = [

{
    q:"如果你的伴侶希望知道你每天去了哪裡，你會覺得？",

    a:[
        "這很正常，偶爾分享就好。",
        "可以說，但不需要事事交代。",
        "如果對方一直追問，我會有點不舒服。",
        "我會希望彼此保有自己的空間。"
    ]
},

{
    q:"如果你沒有及時回覆訊息，對方一直問你去了哪裡，你會？",

    a:[
        "解釋自己剛才在做什麼。",
        "告訴對方自己現在有事情。",
        "覺得有點煩，但還是會回答。",
        "希望對方理解我不可能隨時在線。"
    ]
},

{
    q:"如果對方說：「我只是想知道你現在在哪裡。」你會怎麼想？",

    a:[
        "他可能只是擔心我。",
        "我會直接告訴他。",
        "要看他用什麼方式問。",
        "如果這變成習慣，我會覺得不舒服。"
    ]
},

{
    q:"如果你發現對方總能很快知道你今天去了哪些地方，你會？",

    a:[
        "覺得只是剛好。",
        "問問他怎麼知道的。",
        "開始注意這件事。",
        "覺得有點不舒服。"
    ]
},

{
    q:"如果你正在做這份測驗，而你最在乎的人突然問你：「你現在一個人嗎？」",

    a:[
        "是。",
        "不是。",
        "我不知道。",
        "……為什麼問這個？"
    ]
}

];


/* =========================================================
   狀態
========================================================= */

let phase="normal";

let current=0;

let normalAnswers=[];

let supplementAnswers=[];

let finalNormalAnswered=false;

let audioCtx=null;

let threeTimer=null;

let elevenTimer=null;

let elevenTriggered=false;

let typingTimer=null;

let score={

    trust:0,

    independence:0,

    sensitivity:0,

    communication:0

};


/* =========================================================
   音效
========================================================= */

function initAudio(){

    if(!audioCtx){

        audioCtx=
            new(
                window.AudioContext ||
                window.webkitAudioContext
            )();
    }

    if(audioCtx.state==="suspended"){
        audioCtx.resume();
    }
}


function tone(
    frequency,
    duration,
    volume,
    type="sine"
){

    if(!audioCtx) return;

    const oscillator=
        audioCtx.createOscillator();

    const gain=
        audioCtx.createGain();

    oscillator.type=type;

    oscillator.frequency.value=
        frequency;

    gain.gain.setValueAtTime(
        .0001,
        audioCtx.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        volume,
        audioCtx.currentTime+.025
    );

    gain.gain.exponentialRampToValueAtTime(
        .0001,
        audioCtx.currentTime+duration
    );

    oscillator.connect(gain);

    gain.connect(audioCtx.destination);

    oscillator.start();

    oscillator.stop(
        audioCtx.currentTime+
        duration+
        .04
    );
}


/* =========================================================
   雜訊
   注意：
   補充題階段不呼叫此功能
========================================================= */

function staticSound(
    strength=.035,
    duration=.18
){

    if(!audioCtx) return;

    const buffer=
        audioCtx.createBuffer(
            1,
            audioCtx.sampleRate*duration,
            audioCtx.sampleRate
        );

    const data=
        buffer.getChannelData(0);

    for(
        let i=0;
        i<data.length;
        i++
    ){

        data[i]=
            (Math.random()*2-1)*
            strength;
    }

    const source=
        audioCtx.createBufferSource();

    const gain=
        audioCtx.createGain();

    gain.gain.value=.65;

    source.buffer=buffer;

    source.connect(gain);

    gain.connect(audioCtx.destination);

    source.start();
}


/* =========================================================
   低頻
========================================================= */

function lowHum(
    duration=2.2,
    volume=.025
){

    if(!audioCtx) return;

    const oscillator=
        audioCtx.createOscillator();

    const gain=
        audioCtx.createGain();

    oscillator.type="sine";

    oscillator.frequency.value=47;

    gain.gain.setValueAtTime(
        .0001,
        audioCtx.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        volume,
        audioCtx.currentTime+.55
    );

    gain.gain.exponentialRampToValueAtTime(
        .0001,
        audioCtx.currentTime+duration
    );

    oscillator.connect(gain);

    gain.connect(audioCtx.destination);

    oscillator.start();

    oscillator.stop(
        audioCtx.currentTime+
        duration+
        .1
    );
}

function typeText(
    element,
    text,
    speed=38,
    callback=null
){

    clearInterval(typingTimer);

    element.innerHTML=
        '<span class="typing-cursor"></span>';

    let index=0;

    typingTimer=
        setInterval(
            ()=>{

                if(index>=text.length){

                    clearInterval(typingTimer);

                    element.textContent=text;

                    if(callback){
                        callback();
                    }

                    return;
                }

                element.innerHTML=
                    text.slice(0,index+1)
                    +
                    '<span class="typing-cursor"></span>';

                index++;

            },
            speed
        );
}

function updateScore(questionIndex,answerIndex){

    /*
     * 這不是正式心理測驗。
     * 只是讓答案真正影響 V24 的結果。
     */

    if(answerIndex===0){

        score.trust+=2;

        score.independence+=1;

    }

    if(answerIndex===1){

        score.independence+=2;

        score.communication+=1;

    }

    if(answerIndex===2){

        score.sensitivity+=2;

        score.communication+=1;

    }

    if(answerIndex===3){

        score.communication+=2;

        score.trust+=1;

    }


    /*
     * 某些題目給額外權重
     */

    if(questionIndex===1 && answerIndex===0){
        score.independence+=2;
    }

    if(questionIndex===5 && answerIndex===3){
        score.trust+=2;
        score.independence+=1;
    }

    if(questionIndex===8 && answerIndex===3){
        score.sensitivity+=2;
    }

    if(questionIndex===9 && answerIndex===3){
        score.communication+=2;
    }
}


function getResultType(){

    const values=[
        {
            name:"穩定陪伴型",
            value:score.trust+score.communication
        },

        {
            name:"獨立空間型",
            value:score.independence+score.trust
        },

        {
            name:"敏感觀察型",
            value:score.sensitivity+score.communication
        },

        {
            name:"溝通重視型",
            value:score.communication+score.trust
        }
    ];

    values.sort(
        (a,b)=>b.value-a.value
    );

    return values[0].name;
}

            <div class="dialogue">

                <div class="dialogue-speaker">
                    SYSTEM
                </div>

                <div
                    class="dialogue-text"
                    id="dialogueText"
                ></div>

                <div
                    class="dialogue-options"
                    id="dialogueOptions"
                ></div>

            </div>

        </div>
    `;


    const textElement=
        document.getElementById(
            "dialogueText"
        );


    typeText(
        textElement,
        text,
        32,
        ()=>{
            const box=
                document.getElementById(
                    "dialogueOptions"
                );

            if(options.length){

                options.forEach(
                    option=>{

                        const button=
                            document.createElement(
                                "button"
                            );

                        button.className=
                            "option";

                        button.textContent=
                            option.text;

                        button.onclick=
                            option.action;

                        box.appendChild(
                            button
                        );
                    }
                );

            }
            else if(next){

                setTimeout(
                    next,
                    1100
                );
            }
        }
    );
}


/* =========================================================
   門外開始
========================================================= */

function doorDialogueStart(){

    let remembered="";


    if(normalAnswers.length>0){

        const last=
            normalAnswers[
                normalAnswers.length-1
            ];


        if(last===0){

            remembered=
                "你最後一次的回答，我記得。";

        }
        else if(last===1){

            remembered=
                "你最後一次回答得很快。";

        }
        else if(last===2){

            remembered=
                "你想了很久。";

        }
        else{

            remembered=
                "你似乎很在意答案。";

        }
    }
    else{

        remembered=
            "我記得你剛才的回答。";
    }


    /*
     * V24：
     * 如果玩家在前面比較重視空間，
     * 後面的文字會記住這件事。
     */

    if(score.independence>=score.communication){

        remembered+=
            "\n\n你不是很喜歡自己的空間嗎？";

    }
    else if(score.sensitivity>score.trust){

        remembered+=
            "\n\n你其實一直都有注意到吧。";

    }


    showDialogue(

        `${remembered}

剛才……門那邊是不是有聲音？`,

        null,

        [

            {
                text:"好像有。",
                action:()=>doorAnswer("heard")
            },

            {
                text:"沒有吧。",
                action:()=>doorAnswer("notheard")
            },

            {
                text:"我不知道。",
                action:()=>doorAnswer("unsure")
            }

        ]
    );
}


/* =========================================================
   門外第一次回答
========================================================= */

function doorAnswer(type){

    if(type==="heard"){

        setTimeout(
            ()=>{
                knock(.32);
            },
            500
        );


        setTimeout(
            ()=>{

                showDialogue(
                    "……對。\n\n就在那裡。",
                    ()=>{
                        setTimeout(
                            ()=>{
                                nextDoorChoice();
                            },
                            900
                        );
                    }
                );

            },
            1000
        );

        return;
    }


    if(type==="notheard"){

        showDialogue(
            "沒有嗎？\n\n可能是我聽錯了。",
            ()=>{
                setTimeout(
                    ()=>{
                        knock(.36);

                        setTimeout(
                            ()=>{
                                nextDoorChoice();
                            },
                            1100
                        );
                    },
                    700
                );
            }
        );

        return;
    }


    showDialogue(
        "不知道也沒關係。\n\n再聽一次就好了。",
        ()=>{
            setTimeout(
                ()=>{

                    knock(.29);

                    setTimeout(
                        ()=>{
                            knock(.29);
                        },
                        700
                    );

                    setTimeout(
                        ()=>{
                            nextDoorChoice();
                        },
                        1700
                    );

                },
                700
            );
        }
    );
}


/* =========================================================
   門外第二段
========================================================= */

function nextDoorChoice(){

    showDialogue(

        "我在外面。\n\n你不用開門。\n我只是想跟你說幾句話。",

        null,

        [

            {
                text:"我會回答你。",
                action:()=>doorSecondAnswer()
            },

            {
                text:"你是誰？",
                action:()=>doorSecondAnswer()
            },

            {
                text:"離開。",
                action:()=>doorSecondAnswer()
            }

        ]
    );
}


function doorSecondAnswer(){

    showDialogue(

        "沒關係。\n\n我只是想聽你說話。",

        ()=>{

            setTimeout(
                ()=>{
                    doorMemoryLine();
                },
                1300
            );

        }
    );
}


/* =========================================================
   V24：根據前面答案記憶
========================================================= */

function doorMemoryLine(){

    let line="";


    if(score.independence>=score.trust){

        line=
            "你不是說過嗎？\n\n有些時候，你喜歡一個人。";

    }
    else if(score.sensitivity>=score.trust){

        line=
            "你其實一直都在注意。\n\n只是你沒有說出來。";

    }
    else if(score.communication>=score.independence){

        line=
            "你很重視溝通。\n\n所以我才想再問你一次。";

    }
    else{

        line=
            "我記得你的回答。\n\n每一個。";

    }


    showDialogue(
        line,
        ()=>{
            setTimeout(
                ()=>{
                    doorFinalQuestion();
                },
                1100
            );
        }
    );
}


/* =========================================================
   最後問題
========================================================= */

function doorFinalQuestion(){

    showDialogue(

        "最後一個問題。\n\n如果我現在敲門，\n你會開門嗎？",

        null,

        [

            {
                text:"會。",
                action:()=>doorFinalAnswer()
            },

            {
                text:"不會。",
                action:()=>doorFinalAnswer()
            },

            {
                text:"我不知道。",
                action:()=>doorFinalAnswer()
            },

            {
                text:"不要再問了。",
                action:()=>doorFinalAnswer()
            }

        ]
    );
}


/* =========================================================
   不論回答什麼
========================================================= */

function doorFinalAnswer(){

    showDialogue(

}

/* =========================================================
   三秒問題
========================================================= */

function showThreeSecondQuestion(){

    const popup=
        document.getElementById(
            "threeSecond"
        );

    popup.classList.add("show");

    lowHum(
        3,
        .035
    );

    clearTimeout(threeTimer);

    threeTimer=
        setTimeout(
            ()=>{
                finishThreeSecond();
            },
            3000
        );
}


function threeAnswer(answer){

    clearTimeout(threeTimer);


    const responses=[

        "你選得很快。",

        "你真的不想回頭嗎？",

        "嗯……什麼都沒有。",

        "那就別回頭。"

    ];


    hideThreeSecond();


    whisper(
        responses[answer]
    );


    if(answer===0){

        setTimeout(
            ()=>{
                knock(.25);
            },
            700
        );

    }


    if(answer===1){

        setTimeout(
            ()=>{
                lowHum(
                    1.6,
                    .025
                );
            },
            500
        );

    }


    setTimeout(
        ()=>{
            fakeEnding();
        },
        1300
    );
}


function finishThreeSecond(){

    hideThreeSecond();

    whisper(
        "時間到了。"
    );


    setTimeout(
        ()=>{
            fakeEnding();
        },
        1100
    );
}


function hideThreeSecond(){

    document
        .getElementById("threeSecond")
        .classList
        .remove("show");
}
