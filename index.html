<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>親密關係傾向測驗</title>

<style>

/* =====================================================
   基本
===================================================== */

*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    padding:0;
    min-height:100%;
}

body{
    min-height:100vh;
    font-family:
        "Noto Sans TC",
        "Microsoft JhengHei",
        sans-serif;

    background:#f3f0ed;
    color:#393535;

    transition:
        background-color 3s ease,
        color 3s ease;

    overflow-x:hidden;
}

#app{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:24px;
}

.card{
    width:680px;
    max-width:94vw;

    background:rgba(255,255,255,.94);

    padding:42px;

    border:1px solid #ddd7d3;

    box-shadow:
        0 15px 45px rgba(50,35,30,.07);

    transition:
        background-color 2s ease,
        border-color 2s ease,
        box-shadow 2s ease,
        opacity .6s ease;
}

h1{
    margin:0 0 8px;
    text-align:center;

    font-size:27px;
    font-weight:400;
    letter-spacing:3px;
}

.subtitle{
    text-align:center;
    color:#a19a96;
    font-size:12px;
    letter-spacing:1px;
    margin-bottom:34px;
}

.description{
    color:#696360;
    font-size:15px;
    line-height:2;
}

.description p{
    margin:8px 0;
}

.start-btn{
    display:block;
    margin:34px auto 0;

    padding:12px 42px;

    background:#fff;
    color:#514a47;

    border:1px solid #aaa29d;

    cursor:pointer;

    transition:
        background .25s,
        border .25s,
        color .25s;
}

.start-btn:hover{
    background:#eee8e4;
    border-color:#866b63;
}


/* =====================================================
   題目
===================================================== */

.question-number{
    color:#aaa19d;
    font-size:12px;
    margin-bottom:23px;
    letter-spacing:1px;
}

.question{
    font-size:20px;
    line-height:1.8;
    margin-bottom:25px;
}

.options{
    display:flex;
    flex-direction:column;
    gap:7px;
}

.option{
    width:100%;

    padding:14px 16px;

    text-align:left;

    background:#fff;
    color:#403b39;

    border:1px solid #d8d2cf;

    cursor:pointer;

    font-family:inherit;

    transition:
        background .2s,
        border-color .2s,
        opacity .35s,
        transform .2s;
}

.option:hover{
    background:#f5efec;
    border-color:#a98b82;
}

.option.selected{
    background:#eee6e2;
    border-color:#97736a;
}

.option.hidden{
    opacity:0;
    pointer-events:none;
}

.option:disabled{
    cursor:default;
}

.feedback{
    min-height:25px;

    margin-top:18px;

    color:#8d8581;

    font-size:13px;

    line-height:1.7;
}

.progress{
    height:2px;

    margin-top:28px;

    background:#e6dfdc;
}

.progress-bar{
    height:100%;
    width:0%;

    background:#99786f;

    transition:
        width .45s ease;
}


/* =====================================================
   後段背景
===================================================== */

body.late{
    background:#ded3cf;
}

body.late .card{
    border-color:#c1a9a1;
}

body.deep{
    background:
        radial-gradient(
            circle at 50% 35%,
            #4b3532 0%,
            #2d1b1a 55%,
            #180c0c 100%
        );

    color:#ded1cd;
}

body.deep .card{
    background:rgba(29,17,16,.91);
    border-color:#62403b;

    box-shadow:
        0 20px 80px rgba(0,0,0,.45);
}

body.deep .question,
body.deep h1{
    color:#d9c8c3;
}

body.deep .question-number{
    color:#927773;
}

body.deep .option{
    background:rgba(36,21,20,.9);
    color:#d2c2be;
    border-color:#64413c;
}

body.deep .option:hover{
    background:#3a2220;
}

body.deep .feedback{
    color:#9f8984;
}


/* =====================================================
   雪花訊號
===================================================== */

#noise{
    position:fixed;
    inset:0;

    pointer-events:none;

    z-index:999;

    opacity:0;

    background:
        repeating-linear-gradient(
            0deg,
            rgba(255,255,255,.08) 0px,
            rgba(255,255,255,.08) 1px,
            rgba(0,0,0,.12) 1px,
            rgba(0,0,0,.12) 3px
        );

    mix-blend-mode:screen;
}

#noise.active{
    animation:noiseFlash .65s steps(7);
}

@keyframes noiseFlash{

    0%{
        opacity:0;
    }

    12%{
        opacity:.42;
    }

    19%{
        opacity:.08;
    }

    29%{
        opacity:.55;
    }

    38%{
        opacity:.13;
    }

    51%{
        opacity:.35;
    }

    67%{
        opacity:.06;
    }

    82%{
        opacity:.25;
    }

    100%{
        opacity:0;
    }
}


/* =====================================================
   非常細微的文字異常
===================================================== */

.whisper{
    position:fixed;

    bottom:8%;

    left:50%;

    transform:translateX(-50%);

    color:#74423c;

    font-size:12px;

    letter-spacing:3px;

    opacity:0;

    pointer-events:none;

    z-index:50;
}

.whisper.show{
    animation:whisperIn 3.5s ease forwards;
}

@keyframes whisperIn{

    0%{
        opacity:0;
    }

    20%{
        opacity:.5;
    }

    55%{
        opacity:.25;
    }

    100%{
        opacity:0;
    }
}


/* =====================================================
   結尾
===================================================== */

.ending{
    line-height:2.2;
    font-size:15px;
}

.ending-line{
    opacity:0;

    animation:
        endingAppear 2s ease forwards;
}

@keyframes endingAppear{
    to{
        opacity:1;
    }
}

.final-choice{
    margin-top:28px;
}

.final-choice button{
    width:100%;

    padding:14px;

    margin-top:8px;

    background:transparent;

    color:inherit;

    border:1px solid #72504b;

    cursor:pointer;

    font-family:inherit;

    transition:.3s;
}

.final-choice button:hover{
    background:rgba(120,60,55,.16);
}


/* =====================================================
   小螢幕
===================================================== */

@media(max-width:600px){

    #app{
        padding:14px;
    }

    .card{
        padding:27px 22px;
    }

    .question{
        font-size:18px;
    }

    h1{
        font-size:23px;
    }
}

</style>
</head>


<body>

<div id="noise"></div>
<div id="whisper" class="whisper"></div>

<div id="app"></div>


<script>

/* =====================================================
   題庫
===================================================== */

const questions = [

{
    q:"當你情緒低落時，你最希望喜歡的人怎麼做？",
    a:[
        "陪我聊聊天。",

    ],

    feedback:[

},

{

        "你比較在意「和平常不一樣」這件事。"
    ]
},

{
    q:"如果對方說今天想一個人，你會？",

        "失落和理解可以同時存在。",
        "有些事情確實需要自己說出口。"
    ]
},

{
    q:"如果你傳了一則訊息，對方兩個小時都沒有回，你會？",
    a:[
        "沒關係，他可能在忙。",
        "偶爾看一下手機。",
        "有點期待通知。",
        "如果很反常，會稍微擔心。"
    ],

    feedback:[
        "你不太容易因為短暫的沉默焦慮。",
        "等待的時候，你還是會注意手機。",
        "你會期待自己在意的人回覆。",

    ]
},

{
    q:"你覺得戀人應該知道彼此的手機密碼嗎？",
    a:[
        "不用。",
        "知道也沒關係，但不需要查看。",
        "如果彼此願意可以交換。",

    feedback:[
        "信任不一定需要密碼證明。",
        "知道和使用是兩件不同的事情。",
        "重要的是雙方都願意。",

},

{
    q:"如果對方突然取消原本約好的見面，你會？",
    a:[
        "沒關係，下次再約。",
        "問問是不是發生了什麼。",
        "會有一點失望。",
        "看取消的理由。"
    ],

    feedback:[
        "你比較能接受計畫改變。",
        "你會想理解事情背後的原因。",
        "失望並不代表不理解。",
        "你比較重視事情發生的原因。"

},

{
    q:"如果你發現對方已讀了訊息，卻沒有回覆，你會？",
    a:[
        "等他有時間再回。",

        "會稍微想一下是不是說錯了什麼。",

    feedback:[
        "一次已讀並不代表什麼。",
        "你比較習慣觀察一段時間。",
        "你會回頭檢查自己說過的話。",
        "你希望事情至少有一個明確的回應。"
    ]
},

/* =====================================================
   這裡開始，只有非常細微的不對勁
===================================================== */

{
    q:"如果平常很快回你的人，突然六個小時沒有回覆，你會？",
    a:[
        "他可能真的很忙。",
        "等明天再看看。",
        "會有一點奇怪。",
        "會傳一句「還好嗎？」"

    feedback:[

        "有些事情隔天再處理也可以。",
        "和平常不同，確實容易讓人注意。",
        "有時候一句簡單的確認就夠了。"
    ]
},

{
    q:"你知道對方的手機還有電，但訊息一直沒有回覆，你會？",
    a:[
        "那也可能只是沒看。",
        "應該有自己的事情。",
        "會有點疑惑。",
        "會想知道他是不是故意不回。"
    ],

    feedback:[

        "你開始注意到一些細節了。",
        "「故意」其實很難判斷。"

},

{
    q:"如果你在晚上 11:47 傳了一句「晚安」，一直沒有收到回覆，你會？",
    a:[
        "他應該睡了。",
        "明天再說。",
        "可能會再看一次手機。",

    feedback:[
        "很晚了，睡著很正常。",
        "有些問題留到明天也沒關係。",

    ]
},

{
    q:"如果隔天你發現，對方凌晨 2:13 曾經在線上，你會？",
    a:[
        "可能只是短暫上線。",
        "不會特別在意。",
        "會覺得有一點奇怪。",
        "會想問他昨天為什麼那麼晚還醒著。"
    ],

    feedback:[
        "在線上不代表一定看到了訊息。",
        "你沒有必要把每件事都聯想到自己。",
        "……你記得時間嗎？",
        "也許真的只是睡不著。"
    ]
},

{
    q:"如果你突然發現，剛才有一題的答案和你記得的不太一樣，你會？",
    a:[
        "應該是我記錯了。",
        "不太確定。",
        "會回想剛才選了什麼。",
        "我會想確認一下。"
    ],

    feedback:[
        "記錯一個答案很正常。",
        "有時候注意力會讓記憶變得模糊。",
        "……你剛才確定是那個答案嗎？",
        "不用太在意。"
    ]
},

{
    q:"最後一題：如果一個人知道你現在正在做什麼，你會覺得？",
    a:[
        "只要是我信任的人，就沒關係。",
        "要看他怎麼知道。",
        "如果我沒有告訴他，我會覺得奇怪。",
        "我希望他先問過我。"
    ],

    feedback:[
        "信任通常建立在彼此願意分享。",
        "知道答案之前，最重要的是知道原因。",
        "……你也會覺得奇怪，對吧？",
        "界線有時候比親近更重要。"
    ]
}

];


/* =====================================================
   狀態
===================================================== */

let current = 0;
let answers = [];

let audioCtx = null;


/* =====================================================
   音效
===================================================== */

function initAudio(){

    if(!audioCtx){

        audioCtx =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();
    }

    if(audioCtx.state === "suspended"){
        audioCtx.resume();
    }
}


function createTone(
    frequency,
    duration,
    volume,
    type="sine"
){

    if(!audioCtx) return;

    const osc =
        audioCtx.createOscillator();

    const gain =
        audioCtx.createGain();

    osc.type = type;

    osc.frequency.value = frequency;

    gain.gain.setValueAtTime(
        0.001,
        audioCtx.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        volume,
        audioCtx.currentTime + .025
    );

    gain.gain.exponentialRampToValueAtTime(
        .001,
        audioCtx.currentTime + duration
    );

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start();

    osc.stop(
        audioCtx.currentTime + duration + .02
    );
}


/* 很輕的電流 */

function staticSound(){

    if(!audioCtx) return;

    const buffer =
        audioCtx.createBuffer(
            1,
            audioCtx.sampleRate * .18,
            audioCtx.sampleRate
        );

    const data =
        buffer.getChannelData(0);

    for(let i=0;i<data.length;i++){

        data[i] =
            (Math.random()*2-1) * .018;
    }

    const source =
        audioCtx.createBufferSource();

    const gain =
        audioCtx.createGain();

    gain.gain.value=.22;

    source.buffer=buffer;

    source.connect(gain);

    gain.connect(
        audioCtx.destination
    );

    source.start();
}


/* 敲門 */

function knock(){

    if(!audioCtx) return;

    createTone(
        92,
        .24,
        .32,
        "sine"
    );
}


/* =====================================================
   雪花
===================================================== */

function noiseFlash(){

    const n =
        document.getElementById("noise");

    n.classList.remove("active");

    void n.offsetWidth;

    n.classList.add("active");

    setTimeout(()=>{

        n.classList.remove("active");

    },700);
}


/* =====================================================
   微小文字
===================================================== */

function whisper(text){

    const w =
        document.getElementById("whisper");

    w.textContent=text;

    w.classList.remove("show");

    void w.offsetWidth;

    w.classList.add("show");
}


/* =====================================================
   首頁
===================================================== */

function home(){

    document.getElementById("app").innerHTML=`

        <div class="card">

            <h1>
                親密關係傾向測驗
            </h1>

            <div class="subtitle">
                RELATIONSHIP & ATTACHMENT TEST
            </div>

            <div class="description">

                <p>
                    歡迎參與本次匿名情感傾向測驗。
                </p>

                <p>
                    以下問題沒有標準答案，
                    請依照第一直覺回答。
                </p>

                <p>
                    測驗約需 3～5 分鐘。
                </p>

                <p style="
                    font-size:12px;
                    color:#aaa;
                    margin-top:24px;
                ">
                    本測驗僅供娛樂使用，
                    不代表正式心理評估。
                </p>

            </div>

            <button
                class="start-btn"
                onclick="startTest()"
            >
                開始測驗
            </button>

        </div>
    `;
}

home();


/* =====================================================
   開始
===================================================== */

function startTest(){

    initAudio();

    current=0;

    answers=[];

    document.body.className="";

    showQuestion();
}


/* =====================================================
   顯示題目
===================================================== */

function showQuestion(){

    if(current >= questions.length){

        showResult();

        return;
    }

    const q =
        questions[current];

    const percent =
        (current /
        questions.length) * 100;


    document.getElementById("app").innerHTML=`

        <div class="card" id="questionCard">

            <div class="question-number">
                第 ${current+1} 題 / 共 ${questions.length} 題
            </div>

            <div class="question">
                ${q.q}
            </div>

            <div class="options" id="options"></div>

            <div
                class="feedback"
                id="feedback"
            ></div>

            <div class="progress">

                <div
                    class="progress-bar"
                    style="width:${percent}%"
                ></div>

            </div>

        </div>
    `;


    const box =
        document.getElementById("options");


    q.a.forEach(
        (text,index)=>{

            const btn =
                document.createElement("button");

            btn.className="option";

            btn.textContent =
                String.fromCharCode(65+index)
                + ". "
                + text;

            btn.onclick=()=>{

                choose(index);
            };

            box.appendChild(btn);
        }
    );
}


/* =====================================================
   選擇答案
===================================================== */

function choose(index){

    answers.push(index);

    const q =
        questions[current];

    const buttons =
        document.querySelectorAll(".option");


    buttons.forEach(
        b=>b.disabled=true
    );


    buttons[index]
        .classList.add("selected");


    buttons.forEach(
        (b,i)=>{

            if(i!==index){

                setTimeout(
                    ()=>{
                        b.classList.add("hidden");
                    },
                    180
                );
            }
        }
    );


    const feedback =
        document.getElementById("feedback");


    feedback.textContent =
        q.feedback[index];


    /*
       不同答案真的有不同反應
    */

    if(current===1 && index===2){

        /*
           願意分享位置
           非常輕微的畫面變化
        */

        document.body.classList.add("late");

    }


    if(current===4 && index===3){

        /*
           比較在意反常行為
           很輕的提示音
        */

        createTone(
            520,
            .18,
            .045,
            "triangle"
        );

    }


    /*
       第 9 題開始
    */

    if(current===8){

        document.body.classList.add("late");

    }


    /*
       第 10 題
       如果選比較敏感的答案
       只給很輕微的電流聲
    */

    if(current===9 && index>=2){

        setTimeout(
            ()=>{
                staticSound();
            },
            250
        );

    }


    /*
       第 11 題
       只出現一次短雪花
    */

    if(current===10){

        setTimeout(
            ()=>{

                staticSound();

                noiseFlash();

            },
            350
        );

    }


    /*
       第 12 題
       不嚇玩家
       只在底部短暫出現一句
    */

    if(current===11){

        setTimeout(
            ()=>{

                if(index===2){

                    whisper(
                        "你記得時間。"
                    );

                }

            },
            700
        );

    }


    /*
       第 13 題
       畫面非常慢地變暗
    */

    if(current===12){

        document.body.classList.add("deep");

    }


    /*
       第 14 題
       不做紅屏
       只讓回饋稍微延遲
    */

    let delay=520;


    if(current>=8){

        delay=620;
    }


    if(current===11){

        delay=680;
    }


    if(current===12){

        delay=720;
    }


    /*
       第 15 題之後進結果
    */

    current++;


    setTimeout(
        ()=>{
            showQuestion();
        },
        delay
    );
}


/* =====================================================
   結果頁
===================================================== */

function showResult(){

    document.getElementById("app").innerHTML=`

/* =====================================================

function realEnding(){

    document.getElementById("app").innerHTML=`

            <div class="ending">

                    style="animation-delay:6s"
                >
                    你現在是一個人嗎？

/* =====================================================
   最後選擇
===================================================== */

function finalAnswer(answer){

    const app =
        document.getElementById("app");


    document
        .getElementById("finalChoice")
        .style.display="none";


    /*
       不是立即嚇人
    */

    app.innerHTML=`

        <div class="card">

            <div class="ending">

                <p>
                    ……
                </p>

            </div>

        </div>
    `;


    /*
       第一次敲門
    */

    setTimeout(
        ()=>{
            knock();
        },
        2600
    );


    /*
       停很久
    */

    setTimeout(
        ()=>{
            app.querySelector(".ending")
                .innerHTML+=`
                    <p class="ending-line">
                        剛才……
                    </p>
                `;
        },
        4400
    );


    /*
       第二次敲門
    */

    setTimeout(
        ()=>{
            knock();
            staticSound();
        },
        6500
    );


    /*
       不立即解釋
    */

    setTimeout(
        ()=>{
            app.querySelector(".ending")
                .innerHTML+=`
                    <p class="ending-line">
                        你有聽到嗎？
                    </p>
                `;
        },
        8200
    );


    /*
       最後才出現真正的選擇
    */

    setTimeout(
        ()=>{
            app.querySelector(".ending")
                .innerHTML+=`

                    <p
                        class="ending-line"
                        style="margin-top:35px"
                    >
                        要不要看看？
                    </p>

                    <div class="final-choice">

                        <button
                            onclick="finalLook()"
                        >
                            看
                        </button>

                        <button
                            onclick="finalStay()"
                        >
                            不看
                        </button>

                    </div>
                `;
        },
        11000
    );
}
