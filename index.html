<!DOCTYPE html>
<html lang="zh-TW">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>戀愛關係傾向測驗</title>

<style>

/* =====================================================
   基本
===================================================== */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    min-height: 100%;
}

body {

    font-family:
        "Microsoft JhengHei",
        "Noto Sans TC",
        sans-serif;

    background:
        radial-gradient(
            circle at center,
            #ffffff 0%,
            #f7f5f5 60%,
            #eeeaea 100%
        );

    color: #333;

    transition:
        background 4s ease,
        color 4s ease;

}


/* =====================================================
   階段顏色
===================================================== */

body.stage2 {

    background:
        radial-gradient(
            circle at center,
            #f5eeee,
            #eee3e3
        );

}

body.stage3 {

    background:
        radial-gradient(
            circle at center,
            #eee0e0,
            #d9c8c8
        );

}

body.stage4 {

    background:
        radial-gradient(
            circle at center,
            #d8baba,
            #b59a9a
        );

    color: #2e2020;

}

body.stage5 {

    background:
        radial-gradient(
            circle at center,
            #633c3c,
            #251515
        );

    color: #d3bebe;

}

body.stage6 {

    background:
        radial-gradient(
            circle at center,
            #321515,
            #100808
        );

    color: #b99b9b;

}


/* =====================================================
   紅色氣氛光
===================================================== */

body.stage4::before,
body.stage5::before,
body.stage6::before {

    content: "";

    position: fixed;

    inset: 0;

    pointer-events: none;

    background:
        radial-gradient(
            ellipse at center,
            transparent 35%,
            rgba(70,0,0,.16)
        );

    z-index: 0;

}


/* =====================================================
   主卡片
===================================================== */

.wrapper {

    min-height: 100vh;

    display: flex;

    justify-content: center;

    align-items: center;

    padding: 25px;

    position: relative;

    z-index: 1;

}


.card {

    width: 720px;

    max-width: 96vw;

    background: rgba(255,255,255,.96);

    border: 1px solid #ddd;

    padding: 42px;

    box-shadow:
        0 10px 40px rgba(40,0,0,.07);

    transition:
        background 4s,
        border-color 4s,
        box-shadow 4s;

}


.stage3 .card {

    box-shadow:
        0 12px 45px rgba(70,0,0,.12);

}


.stage4 .card {

    background: rgba(240,229,229,.96);

    border-color: #b59a9a;

}


.stage5 .card,
.stage6 .card {

    background: rgba(29,13,13,.96);

    border-color: #5c3030;

    box-shadow:
        0 15px 70px rgba(0,0,0,.6);

}


/* =====================================================
   標題
===================================================== */

.title {

    text-align: center;

    font-size: 28px;

    font-weight: 500;

    letter-spacing: 2px;

    margin-bottom: 12px;

}

.subtitle {

    text-align: center;

    color: #999;

    font-size: 13px;

    margin-bottom: 40px;

}

.stage4 .subtitle {

    color: #8d7777;

}

.stage5 .subtitle,
.stage6 .subtitle {

    color: #765858;

}


/* =====================================================
   介紹
===================================================== */

.introduction {

    line-height: 2;

    color: #666;

}

.stage4 .introduction {

    color: #665555;

}

.stage5 .introduction,
.stage6 .introduction {

    color: #8b6d6d;

}


/* =====================================================
   開始按鈕
===================================================== */

.start {

    display: block;

    margin: 35px auto 0;

    padding: 13px 45px;

    background: #fff;

    border: 1px solid #aaa;

    color: #333;

    cursor: pointer;

    font-size: 15px;

    transition: .3s;

}

.start:hover {

    background: #f3eeee;

    border-color: #8d6666;

}


.stage5 .start,
.stage6 .start {

    background: #251515;

    color: #c7a5a5;

    border-color: #704040;

}


/* =====================================================
   題目
===================================================== */

.question-number {

    font-size: 13px;

    color: #999;

    margin-bottom: 25px;

    letter-spacing: 1px;

}


.question {

    font-size: 21px;

    line-height: 1.8;

    margin-bottom: 28px;

}


.stage4 .question,
.stage5 .question,
.stage6 .question {

    color: #d3bebe;

}


/* =====================================================
   選項
===================================================== */

.option {

    width: 100%;

    display: block;

    margin: 10px 0;

    padding: 15px 17px;

    text-align: left;

    background: rgba(255,255,255,.9);

    border: 1px solid #d4d4d4;

    color: #333;

    cursor: pointer;

    font-size: 15px;

    line-height: 1.5;

    transition:
        background .25s,
        transform .25s,
        border-color .25s;

}


.option:hover {

    background: #f6eeee;

    border-color: #a88383;

    transform: translateX(4px);

}


.option:disabled {

    cursor: default;

}


/* 後期不要突然黑掉 */

.stage4 .option {

    background: #eee1e1;

    color: #3a2929;

    border-color: #aa8585;

}


.stage5 .option,
.stage6 .option {

    background: #2a1717;

    color: #c7a9a9;

    border-color: #704040;

}


.stage5 .option:hover,
.stage6 .option:hover {

    background: #381b1b;

    border-color: #9b5a5a;

}


/* =====================================================
   進度條
===================================================== */

.progress-container {

    margin-top: 32px;

}

.progress-info {

    display: flex;

    justify-content: space-between;

    color: #aaa;

    font-size: 11px;

    margin-bottom: 6px;

}


.progress {

    width: 100%;

    height: 3px;

    background: #e6dddd;

}


.progress-bar {

    height: 100%;

    width: 0%;

    background: #8b6a6a;

    transition: width .7s ease;

}


.stage5 .progress,
.stage6 .progress {

    background: #321c1c;

}


.stage5 .progress-bar,
.stage6 .progress-bar {

    background: #754040;

}


/* =====================================================
   回應
===================================================== */

.response {

    min-height: 25px;

    margin-top: 22px;

    padding-top: 18px;

    border-top: 1px solid #eee;

    color: #999;

    font-size: 13px;

    line-height: 1.9;

}


.stage4 .response,
.stage5 .response,
.stage6 .response {

    border-color: #593434;

    color: #947777;

}


/* =====================================================
   小文字
===================================================== */

.small {

    font-size: 12px;

    color: #aaa;

    line-height: 1.8;

}


.whisper {

    color: #765454;

    font-style: italic;

}


.stage5 .whisper,
.stage6 .whisper {

    color: #9b6666;

}


/* =====================================================
   淡入
===================================================== */

.fade {

    animation:
        fadeIn .55s ease;

}


@keyframes fadeIn {

    from {

        opacity: 0;

        transform:
            translateY(7px);

    }

    to {

        opacity: 1;

        transform:
            translateY(0);

    }

}


/* =====================================================
   輕微閃爍
   不會黑掉，只會短暫降低亮度
===================================================== */

.screen-flicker {

    animation:
        flicker 1.2s ease;

}


@keyframes flicker {

    0% {
        filter: brightness(1);
    }

    20% {
        filter: brightness(.72);
    }

    28% {
        filter: brightness(1);
    }

    42% {
        filter: brightness(.82);
    }

    55% {
        filter: brightness(1);
    }

    100% {
        filter: brightness(1);
    }

}


/* =====================================================
   結果
===================================================== */

.result-title {

    text-align: center;

    font-size: 24px;

    margin-bottom: 30px;

}


.result-box {

    padding: 22px;

    background: #f8f4f4;

    border: 1px solid #ddd;

    line-height: 2;

}


.stage5 .result-box,
.stage6 .result-box {

    background: #211414;

    border-color: #593232;

}


.result-bar {

    margin: 7px 0 20px;

    height: 5px;

    background: #ddd;

}


.result-fill {

    height: 100%;

    background: #966060;

}


/* =====================================================
   最終文字
===================================================== */

.final {

    line-height: 2.2;

}


.final-line {

    opacity: 0;

    margin-top: 22px;

    animation:
        finalAppear 1.8s forwards;

}


@keyframes finalAppear {

    from {

        opacity: 0;

    }

    to {

        opacity: 1;

    }

}


/* =====================================================
   補充問題特殊區
===================================================== */

.supplement {

    border-left:
        2px solid #713b3b;

    padding-left: 20px;

}


.supplement-title {

    color: #a16c6c;

    font-size: 13px;

    letter-spacing: 2px;

    margin-bottom: 25px;

}


/* =====================================================
   手機
===================================================== */

@media(max-width:600px) {

    .card {

        padding: 27px;

    }

    .question {

        font-size: 18px;

    }

}

</style>
</head>


<body>

<div class="wrapper">

<div class="card">

<div id="content">


    <!-- =============================================
         開始畫面
    ============================================== -->

    <div class="title">

        戀愛關係傾向測驗

    </div>


    <div class="subtitle">

        Relationship & Attachment Test

    </div>


    <div class="introduction">

        <p>
            這份測驗將透過一系列生活情境，
            分析你在親密關係中的互動方式。
        </p>

        <p>
            沒有正確或錯誤的答案，
            請依照你最自然的想法回答。
        </p>

        <p>
            測驗約需 5～8 分鐘。
        </p>

        <p class="small">

            本測驗為娛樂性質，
            結果不代表正式心理評估。

        </p>

    </div>


    <button
        class="start"
        onclick="startTest()">

        開始測驗

    </button>


</div>

</div>
</div>


<script>


/* =====================================================
   題目
===================================================== */

const questions = [

/* ---------- 1～10：正常心理測驗 ---------- */

{
q:"當你喜歡的人沒有立即回覆訊息時，你通常會？",
options:[
"先做自己的事情，等對方有空再回覆。",
"過一陣子再看看有沒有收到訊息。",
"有一點在意，但通常不會多想。",
"如果過了很久，會主動問問對方是不是還好。"
]
},

{
q:"在一段關係中，你認為最重要的是？",
options:[
"彼此信任。",
"穩定的陪伴。",
"能夠坦白溝通。",
"在重要的事情上互相支持。"
]
},

{
q:"如果對方今天看起來心情不好，你會？",
options:[
"給他一些空間。",
"問問他是不是發生了什麼。",
"陪他做一些輕鬆的事情。",
"等他願意說的時候再聽他說。"
]
},

{
q:"你覺得戀人應該保有自己的私人空間嗎？",
options:[
"當然，每個人都需要自己的生活。",
"應該有，同時也要保持溝通。",
"我比較喜歡有事情互相分享。",
"只要彼此信任，多少空間都可以。"
]
},

{
q:"如果你和戀人發生爭執，你通常會？",
options:[
"先冷靜一下，再找時間談。",
"希望能盡快把問題說清楚。",
"看雙方的情緒再決定。",
"如果對方需要時間，我會先讓他冷靜。"
]
},

{
q:"如果戀人和一個你不認識的人變得很熟，你會？",
options:[
"覺得這很正常。",
"有點好奇那個人是誰。",
"有機會的話會想認識對方。",
"如果沒有影響到我們的關係，我不會太在意。"
]
},

{
q:"如果戀人一天都沒有主動找你，你會？",
options:[
"不會特別在意。",
"會有一點想念對方。",
"可能會主動傳訊息。",
"如果平常不是這樣，會問問對方是不是有事情。"
]
},

{
q:"如果對方說：「我今天想一個人。」",
options:[
"我會尊重他的決定。",
"會問問是不是發生了什麼。",
"會有一點失落，但還是會給他空間。",
"等他準備好了再陪他。"
]
},

{
q:"你發現戀人刪掉了一則訊息，你會？",
options:[
"不太在意。",
"有點好奇，但不會追問。",
"如果關係允許，我可能會問問。",
"如果看起來很反常，我會稍微注意。"
]
},

{
q:"你認為戀人之間應該知道彼此所有事情嗎？",
options:[
"不需要，每個人都可以有自己的秘密。",
"重要的事情互相知道就好。",
"大部分事情可以分享。",
"我比較喜歡坦白的關係。"
]
},


/* ---------- 11～15：生活刺激 ---------- */

{
q:"如果對方已讀你的訊息，你通常多久會開始覺得有點奇怪？",
options:[
"通常不會特別注意。",
"幾個小時後可能會想一下。",
"如果到了晚上還沒有回覆，我會有點在意。",
"如果平常不是這樣，我會主動確認。"
]
},

{
q:"如果你看到對方「在線上」，但過了兩個小時仍然沒有回覆，你會怎麼想？",
options:[
"可能正在忙其他事情。",
"可能只是看到訊息後忘了回。",
"會有點好奇他正在做什麼。",
"會等他有空再問問。"
]
},

{
q:"如果原本每天都會聊天的人，突然一天沒有出現，你會？",
options:[
"等他回來。",
"傳一句「還好嗎？」。",
"會有一點擔心。",
"如果隔天仍然沒有消息，會再次確認。"
]
},

{
q:"如果對方說：「最近可能會比較忙。」你會？",
options:[
"理解他的情況。",
"提醒他有空再聯絡。",
"會有一點失落。",
"會觀察接下來一陣子的聯絡狀況。"
]
},

{
q:"如果你發現對方最近常常在晚上很晚的時候才回覆，你會？",
options:[
"可能只是作息改變。",
"有點好奇最近是不是比較忙。",
"有機會會問問他最近在做什麼。",
"如果持續一段時間，我會和他聊聊。"
]
},


/* ---------- 16～20：開始不太對勁 ---------- */

{
q:"如果一個平常很快回覆你的人，突然過了六個小時沒有回覆，你第一個念頭會是？",
options:[
"可能臨時有事情。",
"可能手機不在身邊。",
"會想知道是不是發生了什麼。",
"如果平常真的很少這樣，我會主動問問。"
]
},

{
q:"如果你傳了一句「你還好嗎？」過了很久仍然沒有回覆，你會？",
options:[
"先等對方有時間。",
"隔天再看看。",
"會開始有點擔心。",
"會確認其他方式能不能聯絡到他。"
]
},

{
q:"如果你剛好看到對方在線上，而你的訊息仍然沒有被回覆，你會？",
options:[
"可能只是剛好上線。",
"等一下再看看。",
"會稍微在意。",
"如果這種情況常發生，我會找時間談談。"
]
},

{
q:"如果對方突然把社群上的一些內容設成私人，你會？",
options:[
"覺得這是他的選擇。",
"有點好奇。",
"如果和以前差很多，會問問原因。",
"我會等適合的時候和他談談。"
]
},

{
q:"如果對方說：「最近想安靜一點。」你會？",
options:[
"尊重他的需要。",
"告訴他有需要可以找我。",
"會有點擔心。",
"會等一段時間再確認他的狀況。"
]
},


/* ---------- 21～25：恐怖逐漸進入 ---------- */

{
q:"如果你已經等了八個小時，對方仍然沒有回覆，你會？",
options:[
"先去做其他事情。",
"晚上再看看。",
"傳一句簡單的訊息。",
"如果真的和平常差很多，會確認他是否平安。"
]
},

{
q:"如果你在晚上 11:47 傳了一則訊息，直到凌晨仍然沒有收到回覆，你會？",
options:[
"明天再看看。",
"可能已經睡了。",
"會有一點擔心。",
"會希望至少知道他沒事。"
]
},

{
q:"如果隔天早上，你發現對方昨晚其實有上線，你會？",
options:[
"可能只是短暫看了一下手機。",
"不會特別在意。",
"會有點疑惑。",
"如果情況持續，我會直接問問。"
]
},

{
q:"如果你發現自己剛才回答的一個選項，和你記得的答案不太一樣，你會？",
options:[
"可能是自己記錯了。",
"重新想一下。",
"會覺得有一點奇怪。",
"回頭確認剛才的答案。"
]
},

{
q:"現在回頭看，你覺得這份測驗和一開始有什麼不同嗎？",
options:[
"沒有，還是普通的測驗。",
"好像有一點變化。",
"氣氛好像變得不太一樣。",
"我不知道。"
]
}

];


/* =====================================================
   狀態
===================================================== */

let currentQuestion = 0;

let answers = [];

let totalScore = 0;

let audio = null;


/* =====================================================
   音效
===================================================== */

function initAudio() {

    try {

        audio =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();

    } catch(e) {

        audio = null;

    }

}


function sound(freq, volume, duration) {

    if(!audio) return;

    const oscillator =
        audio.createOscillator();

    const gain =
        audio.createGain();

    oscillator.frequency.value =
        freq;

    gain.gain.setValueAtTime(
        volume,
        audio.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        0.001,
        audio.currentTime + duration
    );

    oscillator.connect(gain);

    gain.connect(audio.destination);

    oscillator.start();

    oscillator.stop(
        audio.currentTime + duration
    );

}


/* =====================================================
   階段
===================================================== */

function updateStage() {

    document.body.className = "";

    if(currentQuestion >= 10)
        document.body.classList.add("stage2");

    if(currentQuestion >= 15)
        document.body.classList.add("stage3");

    if(currentQuestion >= 19)
        document.body.classList.add("stage4");

    if(currentQuestion >= 22)
        document.body.classList.add("stage5");

}


/* =====================================================
   開始
===================================================== */

function startTest() {

    initAudio();

    if(audio &&
       audio.state === "suspended") {

        audio.resume();

    }

    currentQuestion = 0;

    answers = [];

    totalScore = 0;

    showQuestion();

}


/* =====================================================
   題目
===================================================== */

function showQuestion() {

    updateStage();

    const q =
        questions[currentQuestion];

    const content =
        document.getElementById("content");

    const percent =
        currentQuestion /
        questions.length * 100;


    content.className = "fade";


    let html = `

        <div class="question-number">

            第 ${currentQuestion + 1}
            ／
            ${questions.length} 題

        </div>

        <div class="question">

            ${q.q}

        </div>

    `;


    q.options.forEach(
        (option,index) => {

            html += `

                <button
                    class="option"
                    onclick="answerQuestion(${index})">

                    ${option}

                </button>

            `;

        }
    );


    html += `

        <div
            class="response"
            id="response">

        </div>

        <div class="progress-container">

            <div class="progress-info">

                <span>
                    測驗進度
                </span>

                <span>
                    ${Math.round(percent)}%
                </span>

            </div>

            <div class="progress">

                <div
                    class="progress-bar"
                    style="width:${percent}%">

                </div>

            </div>

        </div>

    `;


    content.innerHTML = html;

}


/* =====================================================
   小刺激
===================================================== */

function smallStimulus() {

    /*
       偶爾才出現
       不要每題都有
    */

    const chance =
        Math.random();

    if(chance < .32) {

        document.body.classList.add(
            "screen-flicker"
        );

        setTimeout(
            () => {

                document.body.classList.remove(
                    "screen-flicker"
                );

            },
            1250
        );

    }

}


/* =====================================================
   回答
===================================================== */

function answerQuestion(index) {

    answers.push(index);

    totalScore += index;


    const buttons =
        document.querySelectorAll(".option");


    buttons.forEach(
        button => {

            button.disabled = true;

        }
    );


    sound(
        currentQuestion >= 15
            ? 110
            : 180,

        currentQuestion >= 15
            ? .025
            : .015,

        .12
    );


    const response =
        document.getElementById(
            "response"
        );


    /* ---------- 1～10 ---------- */

    if(currentQuestion < 10) {

        const normal = [

            "已記錄你的回答。",
            "了解。",
            "好的。",
            "謝謝你的回答。"

        ];

        response.innerText =
            normal[
                currentQuestion %
                normal.length
            ];

    }


    /* ---------- 11～15 ---------- */

    else if(currentQuestion < 15) {

        response.innerText =
            "已記錄。";

        setTimeout(
            () => {

                response.innerHTML +=
                    "<br><span class='whisper'>有時候等待本身就會讓人開始思考。</span>";

            },
            900
        );

    }


    /* ---------- 16～19 ---------- */

    else if(currentQuestion < 19) {

        response.innerText =
            "嗯。";

        setTimeout(
            () => {

                response.innerHTML +=
                    "<br><span class='whisper'>六個小時……其實已經很久了。</span>";

            },
            850
        );

        smallStimulus();

    }


    /* ---------- 20～22 ---------- */

    else if(currentQuestion < 22) {

        response.innerText =
            "已記錄。";

        setTimeout(
            () => {

                response.innerHTML +=
                    "<br><span class='whisper'>你還記得自己剛才選了什麼嗎？</span>";

            },
            1000
        );

        smallStimulus();

    }


    /* ---------- 23～25 ---------- */

    else {

        response.innerText =
            "……";

        setTimeout(
            () => {

                response.innerHTML +=
                    "<br><span class='whisper'>快結束了。</span>";

            },
            900
        );

        smallStimulus();

    }


    /*
       不要太久
    */

    let delay = 1100;


    if(currentQuestion >= 15)
        delay = 1500;


    setTimeout(
        () => {

            currentQuestion++;


            if(
                currentQuestion >=
                questions.length
            ) {

                showResult();

            }

            else {

                showQuestion();

            }

        },
        delay
    );

}


/* =====================================================
   正常結果
===================================================== */

function showResult() {

    document.body.className = "";

    const content =
        document.getElementById("content");


    const average =
        totalScore /
        questions.length;


    let type;

    let description;


    if(average < 1.1) {

        type = "穩定信任型";

        description =
            "你通常願意給予伴侶足夠的空間，也相信關係需要建立在彼此信任的基礎上。";

    }

    else if(average < 2.1) {

        type = "溫和陪伴型";

        description =
            "你重視陪伴與交流，同時也希望兩個人能夠保有自己的生活。";

    }

    else if(average < 3) {

        type = "安全感需求型";

        description =
            "你相當重視關係中的回應與安全感，也容易注意到對方情緒上的變化。";

    }

    else {

        type = "高度關係敏感型";

        description =
            "你很重視親密關係，對於聯絡頻率、語氣與互動上的變化比較敏感。";

    }


    content.innerHTML = `

        <div class="result-title">

            測驗完成

        </div>


        <div class="result-box">

            <h2>
                ${type}
            </h2>

            <p>
                ${description}
            </p>


            <p>
                信任程度
            </p>

            <div class="result-bar">

                <div
                    class="result-fill"
                    style="
                    width:
                    ${Math.max(
                        25,
                        100 - totalScore * 1.5
                    )}%">

                </div>

            </div>


            <p>
                陪伴需求
            </p>

            <div class="result-bar">

                <div
                    class="result-fill"
                    style="
                    width:
                    ${Math.min(
                        95,
                        35 + totalScore * 1.2
                    )}%">

                </div>

            </div>


            <p>
                關係安全感
            </p>

            <div class="result-bar">

                <div
                    class="result-fill"
                    style="
                    width:
                    ${Math.min(
                        95,
                        40 + totalScore
                    )}%">

                </div>

            </div>

        </div>


        <p class="small"
           style="margin-top:25px;">

            以上結果僅供娛樂參考。

        </p>


        <button
            class="start"
            onclick="supplementIntro()">

            查看完整分析

        </button>

    `;

}
