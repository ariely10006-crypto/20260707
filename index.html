<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    min-height:100%;
}

body{

}

.card{

    border:1px solid #ddd7d3;

    transition:
        background 5s ease,
        border-color 5s ease,
        box-shadow 5s ease;
}

h1{
    margin:0 0 9px;
    text-align:center;
    font-size:27px;
    font-weight:400;
    letter-spacing:4px;
}

.subtitle{
    text-align:center;
    color:#aaa19d;
    font-size:11px;
    letter-spacing:2px;
    margin-bottom:34px;
}

.description{
    font-size:15px;
    line-height:2;
    color:#696360;
}

.start-btn{
    display:block;
    margin:34px auto 0;
    padding:12px 42px;
    background:#fff;
    color:#514a47;
    border:1px solid #aaa29d;
    cursor:pointer;
    font-family:inherit;
    transition:background .25s,border .25s,transform .15s;
}

.start-btn:hover{
    background:#eee8e4;
    border-color:#80665e;
}

.start-btn:active{
    transform:scale(.98);
}

.question-number{
    color:#aaa19d;
    font-size:12px;
    letter-spacing:1px;
    margin-bottom:22px;
}

.question{
    font-size:20px;
    line-height:1.8;
    margin-bottom:25px;

}

.feedback{
    min-height:28px;
    margin-top:18px;
    font-size:13px;
    line-height:1.8;
    color:#8c8581;
    opacity:0;
    transition:opacity .35s ease;
}

.feedback.show{
    opacity:1;
}

.options{
    display:flex;
    flex-direction:column;
    gap:9px;
}

.option{
    width:100%;
    padding:14px 16px;

.option:hover{

    border-color:#a98b82;
}

.option:active{
    transform:scale(.995);
}

.option.selected{
    background:#eee5e1;
    border-color:#927067;
}

.option.fade{
    opacity:0;
    pointer-events:none;
}

.option:disabled{
    cursor:default;
}

.progress{
    height:2px;
    margin-top:28px;
    background:#e6dfdc;
}

.progress-bar{
    height:100%;
    background:#99786f;
    transition:width .5s ease;
}


/* =========================
   恐怖模式
========================= */

/* =========================
   雪花
========================= */

#noise{
    position:fixed;
    inset:0;
    z-index:9999;
    pointer-events:none;
    opacity:0;

    background:
        repeating-linear-gradient(
            0deg,
            rgba(255,255,255,.15) 0px,
            rgba(255,255,255,.15) 1px,
            rgba(0,0,0,.18) 1px,
            rgba(0,0,0,.18) 3px
        );

    mix-blend-mode:screen;
}

#noise.active{
    animation:staticBurst .7s steps(7);
}

@keyframes staticBurst{
    0%{opacity:0;}
    15%{opacity:.30;}
    30%{opacity:.05;}
    47%{opacity:.24;}
    68%{opacity:.08;}
    100%{opacity:0;}
}


/* =========================
   畫面晃動
========================= */

body.shake #app{
    animation:screenShake .55s;
}

@keyframes screenShake{
    0%{transform:translate(0,0);}
    20%{transform:translate(-3px,1px);}
    40%{transform:translate(3px,-2px);}
    60%{transform:translate(-2px,2px);}
    80%{transform:translate(2px,-1px);}
    100%{transform:translate(0,0);}
}

/* =========================================================
   音效
========================================================= */

function initAudio(){

    if(!audioCtx){

        audioCtx=new(
            window.AudioContext ||
            window.webkitAudioContext
        )();

    }

    if(audioCtx.state==="suspended"){
        audioCtx.resume();
    }
}


function tone(
    frequency,
    duration,
    volume,
    type="sine"
){

    if(!audioCtx)return;

    const oscillator=
        audioCtx.createOscillator();

    const gain=
        audioCtx.createGain();

    oscillator.type=type;

    oscillator.frequency.value=frequency;

    gain.gain.setValueAtTime(
        .0001,
        audioCtx.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        volume,
        audioCtx.currentTime+.025
    );

    gain.gain.exponentialRampToValueAtTime(
        .0001,
        audioCtx.currentTime+duration
    );

    oscillator.connect(gain);

    gain.connect(audioCtx.destination);

    oscillator.start();

    oscillator.stop(
        audioCtx.currentTime+
        duration+
        .04
    );
}


function staticSound(
    strength=.035,
    duration=.18
){

    if(!audioCtx)return;

    const buffer=
        audioCtx.createBuffer(
            1,
            audioCtx.sampleRate*duration,
            audioCtx.sampleRate
        );

    const data=
        buffer.getChannelData(0);

    for(let i=0;i<data.length;i++){

        data[i]=
            (Math.random()*2-1)*
            strength;

    }

    const source=
        audioCtx.createBufferSource();

    const gain=
        audioCtx.createGain();

    gain.gain.value=.65;

    source.buffer=buffer;

    source.connect(gain);

    gain.connect(audioCtx.destination);

    source.start();
}


function lowHum(
    duration=2.2,
    volume=.025
){

    if(!audioCtx)return;

    const oscillator=
        audioCtx.createOscillator();

    const gain=
        audioCtx.createGain();

    oscillator.type="sine";

    oscillator.frequency.value=47;

    gain.gain.setValueAtTime(
        .0001,
        audioCtx.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        volume,
        audioCtx.currentTime+.55
    );

    gain.gain.exponentialRampToValueAtTime(
        .0001,
        audioCtx.currentTime+duration
    );

    oscillator.connect(gain);

    gain.connect(audioCtx.destination);

    oscillator.start();

    oscillator.stop(
        audioCtx.currentTime+
        duration+
        .1
    );
}


/* =========================================================
   敲門聲
========================================================= */

function knock(volume=.60){

    if(!audioCtx)return;

    tone(83,.16,volume,"sine");

    setTimeout(
        ()=>{
            tone(
                61,
                .11,
                volume*.42,
                "sine"
            );
        },
        70
    );
}


/* =========================================================
   腳步聲
========================================================= */

function footsteps(){

    if(!audioCtx)return;

    /*
     * 從遠到近：
     * 聲音逐漸變大
     */

    const steps=[
        {delay:0,    volume:.18, freq:72},
        {delay:430,  volume:.24, freq:69},
        {delay:850,  volume:.31, freq:67},
        {delay:1280, volume:.40, freq:64},
        {delay:1710, volume:.50, freq:61},
        {delay:2140, volume:.62, freq:58},
        {delay:2570, volume:.74, freq:55},
        {delay:3000, volume:.88, freq:52}
    ];

    steps.forEach(step=>{

        setTimeout(
            ()=>{

                tone(
                    step.freq,
                    .18,
                    step.volume,
                    "triangle"
                );

                setTimeout(
                    ()=>{
                        tone(
                            step.freq*.72,
                            .10,
                            step.volume*.42,
                            "sine"
                        );
                    },
                    90
                );

            },
            step.delay
        );

    });
}

function noiseFlash(){

    const noise=
        document.getElementById("noise");

    noise.classList.remove("active");

    void noise.offsetWidth;

    noise.classList.add("active");

    staticSound(.045,.35);

    setTimeout(
        ()=>{
            noise.classList.remove("active");
        },
        700
    );
}


function shake(){

    document.body.classList.remove("shake");

    void document.body.offsetWidth;

    document.body.classList.add("shake");

    setTimeout(
        ()=>{
            document.body.classList.remove("shake");
        },
        600
    );
}


function whisper(text){

    const element=
        document.getElementById("whisper");

    element.textContent=text;

    element.classList.remove("show");

    void element.offsetWidth;

    element.classList.add("show");
}

/* =========================================================
   開始
========================================================= */

function startTest(){

    initAudio();

    phase="normal";

    current=0;

    normalAnswers=[];

    supplementAnswers=[];

    document.body.className="";

    showQuestion();
}


/* =========================================================
   第 3 題分支
========================================================= */

function getBranchQuestion(){

    const answer=
        supplementAnswers[1];

    const branches={

        0:{
            q:"你說你現在在家……\n\n現在家裡的環境安靜嗎？",

            a:[
                "很安靜。",
                "有一點聲音。",
                "有點吵。",
                "我沒有特別注意。"
            ]
        },

        1:{
            q:"你說你現在在學校……\n\n現在周圍聽得到聲音嗎？",

            a:[
                "聽得到。",
                "很安靜。",
                "有一點聲音。",
                "我沒有注意。"
            ]
        },

        2:{
            q:"你說你現在在外面……\n\n你現在附近的環境聽起來怎麼樣？",

            a:[
                "很安靜。",
                "有車子的聲音。",
                "人很多。",
                "我沒有特別注意。"
            ]
        },

        3:{
            q:"你說你在其他地方……\n\n那裡現在的環境安靜嗎？",

            a:[
                "很安靜。",
                "還好。",
                "有一點吵。",
                "我沒有注意。"
            ]
        }

    };

    return branches[answer]||branches[3];
}


/* =========================================================
   第 4 題
========================================================= */

function getFourthQuestion(){

    const location=
        supplementAnswers[1];

    const third=
        supplementAnswers[2];

    if(location===0){

        if(third===0){

            return {
                q:"你說現在周圍很安靜。\n\n如果這份測驗突然出現一個你沒看過的問題，你會繼續回答嗎？",

                a:[
                    "會。",
                    "先看看。",
                    "不會。",
                    "我不知道。"
                ]
            };

        }

        return {
            q:"如果你現在聽見門外有人叫你的名字，你會怎麼做？",

            a:[
                "確認是誰。",
                "不理會。",
                "先聽聽看。",
                "把門鎖好。"
            ]
        };
    }


    if(location===1){

        return {
            q:"你剛才說你在學校。\n\n如果現在突然變得非常安靜，你會注意到嗎？",

            a:[
                "會。",
                "可能會。",
                "不會特別注意。",
                "我不知道。"
            ]
        };
    }


    if(location===2){

        return {
            q:"你說你現在在外面。\n\n如果身後突然傳來很近的腳步聲，你會回頭嗎？",

            a:[
                "會。",
                "不會。",
                "先走快一點。",
                "先確認聲音從哪裡來。"
            ]
        };
    }


    return {
        q:"你剛才說你在其他地方。\n\n如果附近突然安靜下來，你會注意嗎？",

        a:[
            "會。",
            "可能會。",
            "不會。",
            "不知道。"
        ]
    };
}


/* =========================================================
   第 5 題
========================================================= */

function getFifthQuestion(){

    const first=
        supplementAnswers[0];

    const second=
        supplementAnswers[1];

    if(first===0 && second===0){

        return {
            q:"如果你現在真的只有一個人在家……\n\n你會確認一下門有沒有鎖嗎？",

            a:[
                "會。",
                "不用。",
                "剛才已經鎖了。",
                "……現在會。"
            ]
        };
    }


    if(second===1){

        return {
            q:"如果你現在突然在學校看見一個熟悉的人影……\n\n你會走過去嗎？",

            a:[
                "會。",
                "不會。",
                "先看看。",
                "我不想知道。"
            ]
        };
    }


    if(second===2){

        return {
            q:"你現在在外面。\n\n如果身後傳來腳步聲，而且聲音越來越近，你會？",

            a:[
                "回頭看看。",
                "繼續往前走。",
                "先停下來聽。",
                "我會走到人多的地方。"
            ]
        };
    }


    return {
        q:"如果現在有人知道你正在做這份測驗……\n\n你會覺得奇怪嗎？",

        a:[
            "會。",
            "不會。",
            "有一點。",
            "你到底是誰？"
        ]
    };
}


/* =========================================================
   顯示題目
========================================================= */

function showQuestion(){

    let q;

    let total;

    if(phase==="normal"){

        total=11;

        if(current>=10){

            showEleven();

            return;
        }

        q=normalQuestions[current];

    }
    else{

        total=5;

        if(current===0 ||
           current===1){

            q=supplementQuestions[current];

        }
        else if(current===2){

            q=getBranchQuestion();

        }
        else if(current===3){

            q=getFourthQuestion();

        }
        else if(current===4){

            q=getFifthQuestion();

        }
        else{

            afterSupplements();

            return;
        }
    }


    const percentage=
        (current/total)*100;


    document.getElementById("app").innerHTML=`

        <div class="card">

            <div class="question-number">

                ${
                    phase==="normal"
                    ? `第 ${current+1} 題 / 共 11 題`
                    : `補充問題 ${current+1} / 5`
                }

            </div>

            <div class="question">
                ${q.q}
            </div>

            <div
                class="options"
                id="options"
            ></div>

            <div
                class="feedback"
                id="feedback"
            ></div>

            <div class="progress">

                <div
                    class="progress-bar"
                    style="width:${percentage}%"
                ></div>

            </div>

        </div>
    `;


    const container=
        document.getElementById("options");


    q.a.forEach(
        (text,index)=>{

            const button=
                document.createElement("button");

            button.className="option";

            button.textContent=
                String.fromCharCode(65+index)
                +". "
                +text;

            button.onclick=()=>{
                chooseAnswer(index);
            };

            container.appendChild(button);
        }
    );
}

/* =========================================================
   一般題回答
========================================================= */

function chooseAnswer(index){

    const buttons=
        document.querySelectorAll(".option");


    buttons.forEach(
        button=>{
            button.disabled=true;
        }
    );


    if(phase==="normal"){

        normalAnswers[current]=index;

    }
    else{

        supplementAnswers[current]=index;

    }


    buttons[index].classList.add("selected");


    buttons.forEach(
        (button,i)=>{

            if(i!==index){

                setTimeout(
                    ()=>{
                        button.classList.add("fade");
                    },
                    100
                );
            }
        }
    );


    /*
     * 1～10 題顯示客觀回覆
     */

    if(
        phase==="normal" &&
        current<10
    ){

        const feedback=
            normalFeedback[current][index];

        const element=
            document.getElementById("feedback");

        if(element){

            element.textContent=
                feedback;

            setTimeout(
                ()=>{
                    element.classList.add("show");
                },
                120
            );
        }

    }


    if(
        phase==="normal" &&
        current===8
    ){

        setTimeout(
            ()=>{
                noiseFlash();
            },
            300
        );
    }


    if(
        phase==="normal" &&
        current===9
    ){

        setTimeout(
            ()=>{
                lowHum(1.1,.015);
            },
            500
        );
    }


    /*
     * 補充題逐漸增加異常感
     */

    if(
        phase==="supplement" &&
        current===1
    ){

        setTimeout(
            ()=>{
                noiseFlash();
            },
            500
        );

    }


    if(
        phase==="supplement" &&
        current===2
    ){

        setTimeout(
            ()=>{
                lowHum(1.4,.025);
            },
            400
        );

    }


    if(
        phase==="supplement" &&
        current===3
    ){

        setTimeout(
            ()=>{
                noiseFlash();
            },
            400
        );

    }


    /*
     * 第五題改成逐漸靠近的腳步聲
     */

    if(
        phase==="supplement" &&
        current===4
    ){

        setTimeout(
            ()=>{
                footsteps();
            },
            350
        );

    }


    current++;


    /*
     * 補充題稍微停留久一點，
     * 讓腳步聲可以完整播放。
     */

    const delay=
        phase==="supplement"
        ? 1700
        : 1150;


    setTimeout(
        ()=>{
            showQuestion();
        },
        delay
    );
}

function showDialogue(
    text,
    next=null,
    options=[]
){

    document.getElementById("app").innerHTML=`

            <div class="dialogue">

                <div class="dialogue-speaker">
                    SYSTEM

                    ${text}
                </div>

                <div
                    class="dialogue-options"
                    id="dialogueOptions"
                ></div>

            </div>

    `;


    const box=
        document.getElementById(
            "dialogueOptions"
        );


    if(options.length){

        options.forEach(
            option=>{

                const button=
                    document.createElement("button");

                button.className="option";

                button.textContent=
                    option.text;

                button.onclick=
                    option.action;

                box.appendChild(button);
            }
        );

    }
    else if(next){

        setTimeout(
            next,
            1000
        );
    }
}

/* =========================================================

========================================================= */

function showThreeSecondQuestion(){

    const popup=
        document.getElementById(
            "threeSecond"
        );

    popup.classList.add("show");

    lowHum(1.2,.035);

    clearTimeout(threeTimer);

    threeTimer=
        setTimeout(
            finishThreeSecond,
            1000
        );
}


function threeAnswer(answer){

    clearTimeout(threeTimer);

    const responses=[

        "你選得很快。",

        "你真的不想回頭嗎？",

        "嗯……什麼都沒有。",

        "那就別回頭。"

    ];


    hideThreeSecond();

    whisper(
        responses[answer]
    );


    setTimeout(
        fakeEnding,
        1000
    );
}


function finishThreeSecond(){

    hideThreeSecond();

    whisper(
        "時間到了。"
    );


    setTimeout(
        fakeEnding,
        1000
    );
}


function hideThreeSecond(){

    document
        .getElementById("threeSecond")
        .classList
        .remove("show");
}


/* =========================================================
   假結束
========================================================= */

function fakeEnding(){

    document.body.className="horror";


    document.getElementById("app").innerHTML=`

        <div class="card">

            <h1>
                測驗結束
            </h1>

            <div class="subtitle">
                ANALYSIS COMPLETE
            </div>

            <div
                class="description"
                style="text-align:center;"
            >

                <p>
                    所有問題均已完成。
                </p>

                <p>
                    感謝你的參與。
                </p>

                <p style="
                    color:#9a756e;
                    margin-top:35px;
                ">
                    ……
                </p>

            </div>

        </div>
    `;


    setTimeout(
        finalEndingGlitch,
        1900
    );
}


/* =========================================================
   最後雪花
========================================================= */

function finalEndingGlitch(){

    whisper("……");

    setTimeout(
        ()=>{
            lowHum(3,.035);
        },
        200
    );


    /*
     * 結尾再加入越來越近的腳步感
     */

    setTimeout(
        ()=>{
            tone(62,.16,.35,"triangle");
        },
        600
    );

    setTimeout(
        ()=>{
            tone(59,.16,.46,"triangle");
        },
        1050
    );

    setTimeout(
        ()=>{
            tone(56,.16,.58,"triangle");
        },
        1500
    );


    setTimeout(
        ()=>{
            knock(.72);
        },
        2000
    );

    setTimeout(
        ()=>{
            knock(.80);
        },
        2900
    );

    setTimeout(
        noiseFlash,
        3600
    );

    setTimeout(
        shake,
        4100
    );

    setTimeout(
        noiseFlash,
        4500
    );

    setTimeout(
        returnNormal,
        5100
    );
}


/* =========================================================
   回到正常首頁
========================================================= */

function returnNormal(){

    document.body.className="";

    document.body.style.background="";

    document.getElementById("app").style.opacity="1";


    document.getElementById("app").innerHTML=`

        <div class="card">

            <h1>
