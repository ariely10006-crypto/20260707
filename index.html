<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>親密關係傾向測驗</title>

<style>

/* =========================================================
   V24 基礎設定
========================================================= */

*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    min-height:100%;
}

body{
    min-height:100vh;
    font-family:
        "Noto Sans TC",
        "Microsoft JhengHei",
        sans-serif;

    background:#f1eeeb;
    color:#45403d;

    transition:
        background 5s ease,
        color 5s ease;

    overflow-x:hidden;
}

button{
    font-family:inherit;
}

#app{
    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:25px;

    transition:
        transform .15s ease;
}

.card{
    width:680px;
    max-width:94vw;

    padding:42px;

    background:rgba(255,255,255,.97);

    border:1px solid #ddd7d3;

    box-shadow:
        0 15px 50px
        rgba(45,30,25,.08);

    transition:
        background 5s ease,
        border-color 5s ease,
        box-shadow 5s ease;
}

h1{
    margin:0 0 9px;

    text-align:center;

    font-size:27px;
    font-weight:400;

    letter-spacing:4px;
}

.subtitle{
    text-align:center;

    color:#aaa19d;

    font-size:11px;
    letter-spacing:2px;

    margin-bottom:34px;
}

.description{
    font-size:15px;
    line-height:2;

    color:#696360;
}

.description p{
    margin:12px 0;
}

.start-btn{
    display:block;

    margin:34px auto 0;

    padding:12px 42px;

    background:#fff;

    color:#514a47;

    border:1px solid #aaa29d;

    cursor:pointer;

    transition:
        background .25s,
        border .25s,
        transform .15s;
}

.start-btn:hover{
    background:#eee8e4;
    border-color:#80665e;
}

.start-btn:active{
    transform:scale(.98);
}


/* =========================================================
   題目
========================================================= */

.question-number{
    color:#aaa19d;

    font-size:12px;
    letter-spacing:1px;

    margin-bottom:22px;
}

.question{
    font-size:20px;
    line-height:1.8;

    margin-bottom:25px;
}

.feedback{
    min-height:42px;

    margin-top:18px;

    font-size:13px;
    line-height:1.8;

    color:#8c8581;

    white-space:pre-line;
}

.options{
    display:flex;
    flex-direction:column;

    gap:9px;
}

.option{
    width:100%;

    padding:14px 16px;

    text-align:left;

    background:#fff;

    color:#403b39;

    border:1px solid #d8d2cf;

    cursor:pointer;

    transition:
        background .25s,
        border .25s,
        opacity .35s,
        transform .12s;
}

.option:hover{
    background:#f5efec;
    border-color:#a98b82;
}

.option:active{
    transform:scale(.995);
}

.option.selected{
    background:#eee5e1;
    border-color:#927067;
}

.option.fade{
    opacity:0;
    pointer-events:none;
}

.option:disabled{
    cursor:default;
}

.progress{
    height:2px;

    margin-top:28px;

    background:#e6dfdc;
}

.progress-bar{
    height:100%;

    background:#99786f;

    transition:width .5s ease;
}


/* =========================================================
   V24 正常系統小字
========================================================= */

.system-footer{
    margin-top:18px;

    display:flex;
    justify-content:space-between;
    gap:10px;

    color:#aaa19d;

    font-size:9px;
    letter-spacing:1px;

    text-transform:uppercase;
}

.system-note{
    margin-top:10px;

    color:#b2aaa6;

    font-size:9px;
    letter-spacing:1px;

    text-align:right;
}


/* =========================================================
   V24 系統分析畫面
========================================================= */

.analysis{
    min-height:250px;

    display:flex;
    flex-direction:column;

    justify-content:center;
}

.analysis-code{
    color:#aaa19d;

    font-size:9px;
    letter-spacing:3px;

    margin-bottom:25px;

    text-align:center;
}

.analysis-line{
    min-height:30px;

    text-align:center;

    font-size:13px;

    color:#6e6763;

    opacity:0;

    animation:
        analysisAppear .6s forwards;
}

.analysis-line.abnormal{
    color:#8b5f59;
}

@keyframes analysisAppear{

    from{
        opacity:0;
        transform:translateY(5px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}


/* =========================================================
   紅黑恐怖模式
========================================================= */

body.horror{

    background:
        radial-gradient(
            circle at 50% 40%,
            #4b2927 0%,
            #291514 50%,
            #090505 100%
        );

    color:#ddd0cc;
}

body.horror .card{

    background:rgba(27,14,14,.95);

    border-color:#67433e;

    box-shadow:
        0 25px 90px
        rgba(0,0,0,.65);
}

body.horror h1,
body.horror .question{

    color:#dfccc7;
}

body.horror .subtitle,
body.horror .question-number{

    color:#98716b;
}

body.horror .description{

    color:#bca9a4;
}

body.horror .feedback{

    color:#9c7d77;
}

body.horror .option{

    background:#241413;

    color:#d6c4bf;

    border-color:#62413c;
}

body.horror .option:hover{

    background:#38201e;
}

body.horror .option.selected{

    background:#412321;

    border-color:#9a5d54;
}

body.horror .progress{

    background:#3c2422;
}

body.horror .progress-bar{

    background:#985a52;
}

body.horror .start-btn{

    background:#241413;

    color:#d6c4bf;

    border-color:#68423d;
}

body.horror .system-footer,
body.horror .system-note{

    color:#775651;
}

body.horror .analysis-line{

    color:#bca09a;
}


/* =========================================================
   系統狀態
========================================================= */

.system-status{

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:18px;

    padding-bottom:9px;

    border-bottom:1px solid #e4ddda;

    color:#aaa19d;

    font-size:9px;

    letter-spacing:2px;
}

body.horror .system-status{

    border-color:#4b302d;

    color:#805c56;
}

.status-dot{

    display:inline-block;

    width:5px;
    height:5px;

    margin-right:6px;

    border-radius:50%;

    background:#8c817c;
}

body.horror .status-dot{

    background:#98534c;

    box-shadow:
        0 0 8px
        rgba(160,70,60,.7);
}


/* =========================================================
   雪花
========================================================= */

#noise{

    position:fixed;

    inset:0;

    z-index:9999;

    pointer-events:none;

    opacity:0;

    background:
        repeating-linear-gradient(
            0deg,
            rgba(255,255,255,.15) 0px,
            rgba(255,255,255,.15) 1px,
            rgba(0,0,0,.18) 1px,
            rgba(0,0,0,.18) 3px
        );

    mix-blend-mode:screen;
}

#noise.active{

    animation:
        staticBurst .7s steps(7);
}

@keyframes staticBurst{

    0%{opacity:0;}
    15%{opacity:.30;}
    30%{opacity:.05;}
    47%{opacity:.24;}
    68%{opacity:.08;}
    100%{opacity:0;}
}


/* =========================================================
   畫面晃動
========================================================= */

body.shake #app{

    animation:
        screenShake .55s;
}

@keyframes screenShake{

    0%{
        transform:translate(0,0);
    }

    20%{
        transform:translate(-3px,1px);
    }

    40%{
        transform:translate(3px,-2px);
    }

    60%{
        transform:translate(-2px,2px);
    }

    80%{
        transform:translate(2px,-1px);
    }

    100%{
        transform:translate(0,0);
    }
}


/* =========================================================
   黑暗轉場
========================================================= */

#darkTransition{

    position:fixed;

    inset:0;

    z-index:3000;

    pointer-events:none;

    opacity:0;

    background:
        radial-gradient(
            circle,
            rgba(95,30,25,.02),
            rgba(8,3,3,.94)
        );

    transition:
        opacity 6s ease;
}

#darkTransition.active{

    opacity:.58;
}


/* =========================================================
   Whisper
========================================================= */

#whisper{

    position:fixed;

    left:50%;
    bottom:11%;

    transform:translateX(-50%);

    z-index:4000;

    color:#884a43;

    font-size:12px;

    letter-spacing:3px;

    opacity:0;

    pointer-events:none;

    white-space:nowrap;
}

#whisper.show{

    animation:
        whisperAppear 4s forwards;
}

@keyframes whisperAppear{

    0%{opacity:0;}
    20%{opacity:.65;}
    40%{opacity:.13;}
    65%{opacity:.48;}
    100%{opacity:0;}
}


/* =========================================================
   對話
========================================================= */

.dialogue{

    text-align:center;

    min-height:230px;

    display:flex;

    flex-direction:column;

    justify-content:center;
}

.dialogue-speaker{

    font-size:10px;

    letter-spacing:4px;

    color:#88615b;

    margin-bottom:24px;
}

.dialogue-text{

    min-height:90px;

    font-size:19px;

    line-height:2;

    color:#d8c5c0;

    white-space:pre-line;
}

.dialogue-options{

    margin-top:22px;

    display:flex;

    flex-direction:column;

    gap:8px;
}


/* =========================================================
   V24 角色名稱
========================================================= */

.speaker-system{
    color:#876a64;
}

.speaker-unknown{
    color:#a65c54;
}

.speaker-user{
    color:#c5aaa4;
}


/* =========================================================
   一秒限時題
========================================================= */

#timedQuestion{

    position:fixed;

    inset:0;

    z-index:6000;

    display:flex;

    justify-content:center;

    align-items:center;

    background:rgba(5,3,3,.96);

    opacity:0;

    pointer-events:none;

    transition:
        opacity .2s;
}

#timedQuestion.show{

    opacity:1;

    pointer-events:auto;
}

.timed-box{

    width:650px;

    max-width:90vw;

    text-align:center;

    color:#ddcbc6;
}

.timed-small{

    font-size:10px;

    letter-spacing:5px;

    color:#906d67;

    margin-bottom:28px;
}

.timed-title{

    font-size:21px;

    line-height:2;

    margin-bottom:28px;
}

.timed-option{

    display:block;

    width:100%;

    max-width:430px;

    margin:8px auto;

    padding:12px;

    background:rgba(49,24,22,.72);

    color:#d1bdb8;

    border:1px solid #68413c;

    font-family:inherit;

    cursor:pointer;
}

.timed-timer{

    width:100%;

    max-width:430px;

    height:2px;

    margin:25px auto 0;

    background:#382321;
}

.timed-timer-bar{

    width:100%;

    height:100%;

    background:#985b53;

    animation:
        timerOneSecond 1s linear forwards;
}

@keyframes timerOneSecond{

    from{
        width:100%;
    }

    to{
        width:0%;
    }
}


/* =========================================================
   V24 第 11 題
========================================================= */

.eleven-screen{

    min-height:300px;

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    text-align:center;
}

.eleven-number{

    color:#8e615a;

    font-size:10px;

    letter-spacing:4px;

    margin-bottom:35px;
}

.eleven-question{

    color:#e1ccc7;

    font-size:26px;

    letter-spacing:3px;

    margin-bottom:38px;
}

.eleven-button{

    width:240px;

    padding:14px;

    background:#2b1514;

    color:#dfcbc6;

    border:1px solid #74443e;

    cursor:pointer;

    transition:
        background .25s,
        border .25s,
        transform .15s;
}

.eleven-button:hover{

    background:#47211f;

    border-color:#a05b52;
}

.eleven-button:active{

    transform:scale(.98);
}


/* =========================================================
   V24 補充第 6 題
========================================================= */

.love-question{

    text-align:center;

    min-height:330px;

    display:flex;

    flex-direction:column;

    justify-content:center;
}

.love-question-title{

    color:#dfccc7;

    font-size:22px;

    line-height:1.9;

    margin-bottom:30px;
}

.love-question-note{

    color:#87635d;

    font-size:10px;

    letter-spacing:2px;

    min-height:18px;

    margin-bottom:20px;
}

.love-options{

    display:flex;

    flex-direction:column;

    gap:8px;

    width:100%;

    max-width:430px;

    margin:0 auto;
}

.love-option{

    padding:13px;

    background:#241413;

    color:#d6c4bf;

    border:1px solid #62413c;

    cursor:pointer;

    transition:
        background .25s,
        border .25s,
        opacity .25s;
}

.love-option:hover{

    background:#38201e;

    border-color:#9b5d55;
}

.love-option.changed{

    animation:
        optionChange .55s;
}

@keyframes optionChange{

    0%{
        opacity:.2;
        transform:translateX(5px);
    }

    50%{
        opacity:.5;
    }

    100%{
        opacity:1;
        transform:translateX(0);
    }
}


/* =========================================================
   V24 異常紀錄
========================================================= */

.log-box{

    margin-top:25px;

    padding:14px;

    border:1px solid #ddd7d3;

    background:#faf8f7;

    font-family:
        Consolas,
        monospace;

    font-size:10px;

    line-height:1.9;

    color:#8c8581;
}

body.horror .log-box{

    background:#180c0c;

    border-color:#4b302d;

    color:#8d6660;
}

.log-line{

    min-height:19px;
}


/* =========================================================
   404 預備畫面
========================================================= */

.fake-error{

    text-align:center;

    color:#d5c0bb;
}

.fake-error-code{

    font-size:48px;

    letter-spacing:5px;

    margin-bottom:20px;
}


/* =========================================================
   手機
========================================================= */

@media(max-width:600px){

    #app{
        padding:14px;
    }

    .card{
        padding:27px 21px;
    }

    h1{
        font-size:22px;
    }

    .question{
        font-size:18px;
    }

    .dialogue-text{
        font-size:17px;
    }

    .eleven-question{
        font-size:22px;
    }

    .system-footer{
        flex-direction:column;
    }

    .system-note{
        text-align:left;
    }
}

</style>
</head>


<body>

<div id="noise"></div>

<div id="darkTransition"></div>

<div id="whisper"></div>

<div id="timedQuestion">

    <div class="timed-box">

        <div class="timed-small">
            RESPONSE TIME : 1 SECOND
        </div>

        <div class="timed-title">
            如果你現在回頭，<br>
            你覺得房間裡會多出什麼？
        </div>

        <button
            class="timed-option"
            onclick="timedAnswer(0)"
        >
            一個人
        </button>

        <button
            class="timed-option"
            onclick="timedAnswer(1)"
        >
            一個影子
        </button>

        <button
            class="timed-option"
            onclick="timedAnswer(2)"
        >
            什麼都沒有
        </button>

        <button
            class="timed-option"
            onclick="timedAnswer(3)"
        >
            我不想回頭看
        </button>

        <div class="timed-timer">
            <div class="timed-timer-bar"></div>
        </div>

    </div>

</div>


<div id="app"></div>


<script>

/* =========================================================
   V24 題目
========================================================= */

const normalQuestions = [

{
    q:"當你情緒低落時，你最希望喜歡的人怎麼做？",
    a:[
        "陪我聊聊天。",
        "先給我一點空間。",
        "直接問我發生了什麼。",
        "陪在旁邊，不一定要說話。"
    ]
},

{
    q:"你認為戀人之間需要知道彼此每天的行程嗎？",
    a:[
        "不用，彼此都有自己的生活。",
        "大概知道就好。",
        "如果對方願意，我會想知道。",
        "重要的事情可以互相說。"
    ]
},

{
    q:"如果對方一整天沒有主動找你，你會？",
    a:[
        "做自己的事情。",
        "晚一點再傳訊息。",
        "有點想知道他在忙什麼。",
        "如果和平常差很多，會問問。"
    ]
},

{
    q:"如果對方說今天想一個人，你會？",
    a:[
        "尊重他的決定。",
        "告訴他需要時可以找我。",
        "有點失落，但還是會給空間。",
        "等他自己願意說。"
    ]
},

{
    q:"如果你傳了一則訊息，對方兩個小時都沒有回，你會？",
    a:[
        "沒關係，他可能在忙。",
        "偶爾看一下手機。",
        "有點期待通知。",
        "如果很反常，會稍微擔心。"
    ]
},

{
    q:"你覺得戀人應該知道彼此的手機密碼嗎？",
    a:[
        "不用。",
        "知道也沒關係，但不需要查看。",
        "如果彼此願意可以交換。",
        "我比較重視信任，而不是密碼。"
    ]
},

{
    q:"如果對方突然取消原本約好的見面，你會？",
    a:[
        "沒關係，下次再約。",
        "問問是不是發生了什麼。",
        "會有一點失望。",
        "看取消的理由。"
    ]
},

{
    q:"如果你發現對方已讀了訊息，卻沒有回覆，你會？",
    a:[
        "等他有時間再回。",
        "過一陣子再看看。",
        "會稍微想一下是不是說錯了什麼。",
        "如果一直沒有回，會再問一次。"
    ]
},

{
    q:"平常很快回你的人，突然六個小時沒有回覆，你會？",
    a:[
        "他可能真的很忙。",
        "等明天再看看。",
        "會覺得有一點奇怪。",
        "會傳一句「還好嗎？」"
    ]
},

{
    q:"你認為一段健康的關係最重要的是什麼？",
    a:[
        "信任。",
        "溝通。",
        "陪伴。",
        "彼此尊重。"
    ]
}
];


/* =========================================================
   補充 1～5
========================================================= */

const supplementQuestions = [

{
    q:"如果你的伴侶希望知道你每天去了哪裡，你會覺得？",
    a:[
        "這很正常，偶爾分享就好。",
        "可以說，但不需要事事交代。",
        "如果對方一直追問，我會有點不舒服。",
        "我會希望彼此保有自己的空間。"
    ]
},

{
    q:"如果你沒有及時回覆訊息，對方一直問你去了哪裡，你會？",
    a:[
        "解釋自己剛才在做什麼。",
        "告訴對方自己現在有事情。",
        "覺得有點煩，但還是會回答。",
        "希望對方理解我不可能隨時在線。"
    ]
},

{
    q:"如果對方說：「我只是想知道你現在在哪裡。」你會怎麼想？",
    a:[
        "他可能只是擔心我。",
        "我會直接告訴他。",
        "要看他用什麼方式問。",
        "如果這變成習慣，我會覺得不舒服。"
    ]
},

{
    q:"如果你發現對方總能很快知道你今天去了哪些地方，你會？",
    a:[
        "覺得只是剛好。",
        "問問他怎麼知道的。",
        "開始注意這件事。",
        "覺得有點不舒服。"
    ]
},

{
    q:"如果你正在做這份測驗，而你最在乎的人突然問你：「你現在一個人嗎？」",
    a:[
        "是。",
        "不是。",
        "我不知道。",
        "……為什麼問這個？"
    ]
}
];


/* =========================================================
   V24 狀態
========================================================= */

let phase="normal";

let current=0;

let normalAnswers=[];

let supplementAnswers=[];

let finalNormalAnswered=false;

let audioCtx=null;

let timedTimer=null;

let timedAnswered=false;

let supplementSixAnswer=null;


/* =========================================================
   V24 玩家資訊記憶
========================================================= */

let playerIsAlone=null;

let playerLocation="";

let locationDetail="";

let loveChanged=[false,false,false,false];

let loveLabels=[
    "喜歡",
    "不喜歡",
    "不知道",
    "討厭"
];


/* =========================================================
   音效系統
========================================================= */

function initAudio(){

    if(!audioCtx){

        audioCtx=
            new(
                window.AudioContext ||
                window.webkitAudioContext
            )();
    }

    if(audioCtx.state==="suspended"){

        audioCtx.resume();
    }
}


function tone(
    frequency,
    duration,
    volume,
    type="sine"
){

    if(!audioCtx)return;

    const oscillator=
        audioCtx.createOscillator();

    const gain=
        audioCtx.createGain();

    oscillator.type=type;

    oscillator.frequency.value=
        frequency;

    gain.gain.setValueAtTime(
        .0001,
        audioCtx.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        volume,
        audioCtx.currentTime+.025
    );

    gain.gain.exponentialRampToValueAtTime(
        .0001,
        audioCtx.currentTime+duration
    );

    oscillator.connect(gain);

    gain.connect(
        audioCtx.destination
    );

    oscillator.start();

    oscillator.stop(
        audioCtx.currentTime+
        duration+
        .04
    );
}


function staticSound(
    strength=.035,
    duration=.18
){

    if(!audioCtx)return;

    const buffer=
        audioCtx.createBuffer(
            1,
            audioCtx.sampleRate*duration,
            audioCtx.sampleRate
        );

    const data=
        buffer.getChannelData(0);

    for(
        let i=0;
        i<data.length;
        i++
    ){

        data[i]=
            (Math.random()*2-1)*
            strength;
    }

    const source=
        audioCtx.createBufferSource();

    const gain=
        audioCtx.createGain();

    gain.gain.value=.65;

    source.buffer=buffer;

    source.connect(gain);

    gain.connect(
        audioCtx.destination
    );

    source.start();
}


function lowHum(
    duration=2.2,
    volume=.025
){

    if(!audioCtx)return;

    const oscillator=
        audioCtx.createOscillator();

    const gain=
        audioCtx.createGain();

    oscillator.type="sine";

    oscillator.frequency.value=47;

    gain.gain.setValueAtTime(
        .0001,
        audioCtx.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        volume,
        audioCtx.currentTime+.55
    );

    gain.gain.exponentialRampToValueAtTime(
        .0001,
        audioCtx.currentTime+duration
    );

    oscillator.connect(gain);

    gain.connect(
        audioCtx.destination
    );

    oscillator.start();

    oscillator.stop(
        audioCtx.currentTime+
        duration+
        .1
    );
}

function objectiveFeedback(
    index
){

        "你的回答顯示你重視情緒上的陪伴。",
        "你的回答較重視個人空間與自主性。",
        "你的回答顯示你會注意關係中的變化。",

    ];

    ];

/* =========================================================
   回答
========================================================= */

function chooseAnswer(index){

    const buttons=
        document.querySelectorAll(
            ".option"
        );

    buttons.forEach(
        button=>{
            button.disabled=true;
        }
    );


    if(phase==="normal"){

        normalAnswers.push(index);

    }
    else{

        supplementAnswers.push(index);

        if(current===4){

            playerIsAlone=
                index===0;

            if(index===0){

                locationDetail=
                    "目前判定為單獨狀態";

            }
            else if(index===1){

                locationDetail=
                    "目前判定為非單獨狀態";

            }
            else if(index===2){

                locationDetail=
                    "無法確認目前狀態";

            }
            else{

                locationDetail=
                    "受測者拒絕明確回答";

            }
        }
    }


    buttons[index].classList.add(
        "selected"
    );


    buttons.forEach(
        (button,i)=>{

            if(i!==index){

                setTimeout(
                    ()=>{
                        button.classList.add(
                            "fade"
                        );
                    },
                    100
                );
            }
        }
    );


    const feedback=
        document.getElementById(
            "feedback"
        );


    if(feedback){

        if(phase==="normal"){

            feedback.textContent=
                objectiveFeedback(index);

        }
        else{

            feedback.textContent=
                "SYSTEM：回答已記錄。";
        }
    }


    /*
     * 第 9 題後出現微小異常
     */

    if(
        phase==="normal" &&
        current===8
    ){

        setTimeout(
            ()=>{
                noiseFlash();
            },
            300
        );

        setTimeout(
            ()=>{
                whisper(
                    "RESPONSE PATTERN CONFIRMED"
                );
            },
            700
        );
    }


    /*
     * 第 10 題前出現低頻
     */

    if(
        phase==="normal" &&
        current===9
    ){

        setTimeout(
            ()=>{
                lowHum(
                    1.1,
                    .015
                );
            },
            500
        );
    }


    current++;


    setTimeout(
        ()=>{
            showQuestion();
        },
        650
    );
}

        else if(last===1){

            remembered=
                "你最後一次回答得很快。";

        }
        else if(last===2){

            remembered=
                "你想了很久。";

        }
        else{

            remembered=
                "你似乎很在意答案。";
        }

    }
    else{

        remembered=
            "我記得你剛才的回答。";
    }


    /*
     * 讀取補充題資料
     */

    let locationLine="";

    if(playerIsAlone===true){

        locationLine=
            "\n\n系統顯示：你現在是一個人。";

    }
    else if(playerIsAlone===false){

        locationLine=
            "\n\n系統顯示：你身邊還有人。";

    }
    else{

        locationLine=
            "\n\n系統無法確認你目前的狀態。";
    }


    showDialogue(

        `${remembered}${locationLine}\n\n剛才……門那邊是不是有聲音？`,

        null,

        [

            {
                text:"好像有。",
                action:()=>doorAnswer("heard")
            },

            {
                text:"沒有吧。",
                action:()=>doorAnswer("notheard")
            },

            {
                text:"我不知道。",
                action:()=>doorAnswer("unsure")
            }

        ],

        "UNKNOWN"
    );
}


/* =========================================================
   門外第一次回答
========================================================= */

function doorAnswer(type){

    if(type==="heard"){

        setTimeout(
            ()=>{
                knock(.32);
            },
            500
        );


        setTimeout(
            ()=>{

                showDialogue(

                    "……對。\n\n就在那裡。",

                    ()=>{
                        setTimeout(
                            ()=>{
                                nextDoorChoice();
                            },
                            900
                        );
                    },

                    [],

                    "UNKNOWN"
                );

            },
            1000
        );

        return;
    }


    if(type==="notheard"){

        showDialogue(

            "沒有嗎？\n\n可能是我聽錯了。",

            ()=>{
                setTimeout(
                    ()=>{

                        knock(.36);

                        setTimeout(
                            ()=>{
                                nextDoorChoice();
                            },
                            1100
                        );

                    },
                    700
                );
            },

            [],

            "UNKNOWN"
        );

        return;
    }


    showDialogue(

        "不知道也沒關係。\n\n再聽一次就好了。",

        ()=>{
            setTimeout(
                ()=>{

                    knock(.29);

                    setTimeout(
                        ()=>{
                            knock(.29);
                        },
                        700
                    );

                    setTimeout(
                        ()=>{
                            nextDoorChoice();
                        },
                        1700
                    );

                },
                700
            );
        },

        [],

        "UNKNOWN"
    );
}


/* =========================================================
   門外第二段
========================================================= */

function nextDoorChoice(){

    /*
     * 根據玩家是否一個人
     * 產生不同內容
     */

    let realityLine="";

    if(playerIsAlone===true){

        realityLine=
            "你現在確實是一個人。";

    }
    else if(playerIsAlone===false){

        realityLine=
            "你身邊不是還有人嗎？";

    }
    else{

        realityLine=
            "你自己都不知道身邊有沒有其他人。";
    }


    showDialogue(

        `我在外面。\n\n${realityLine}\n\n你不用開門。\n我只是想跟你說幾句話。`,

        null,

        [

            {
                text:"我會回答你。",
                action:()=>doorSecondAnswer(
                    "answer"
                )
            },

            {
                text:"你是誰？",
                action:()=>doorSecondAnswer(
                    "who"
                )
            },

            {
                text:"離開。",
                action:()=>doorSecondAnswer(
                    "leave"
                )
            }

        ],

        "UNKNOWN"
    );
}


/* =========================================================
   第二段分支
========================================================= */

function doorSecondAnswer(type){

    if(type==="answer"){

        showDialogue(

            "好。\n\n我就知道你會回答。",

            ()=>{
                setTimeout(
                    ()=>{
                        doorFinalQuestion();
                    },
                    1300
                );
            },

            [],

            "UNKNOWN"
        );

        return;
    }


    if(type==="who"){

        showDialogue(

            "你不是已經知道了嗎？\n\n剛才不是你自己選的嗎？",

            ()=>{
                setTimeout(
                    ()=>{
                        doorFinalQuestion();
                    },
                    1300
                );
            },

            [],

            "UNKNOWN"
        );

        return;
    }


    showDialogue(

        "好。\n\n我不打擾你。",

        ()=>{
            setTimeout(
                ()=>{
                    footstep(.12);

                    setTimeout(
                        ()=>{
                            footstepsSequence();
                        },
                        650
                    );

                    setTimeout(
                        ()=>{
                            doorFinalQuestion();
                        },
                        2500
                    );

                },
                800
            );
        },

        [],

        "UNKNOWN"
    );
}


/* =========================================================
   最後問題
========================================================= */

function doorFinalQuestion(){

    showDialogue(

        "最後一個問題。\n\n如果我現在敲門，\n你會開門嗎？",

        null,

        [

            {
                text:"會。",
                action:()=>doorFinalAnswer(
                    "open"
                )
            },

            {
                text:"不會。",
                action:()=>doorFinalAnswer(
                    "closed"
                )
            },

            {
                text:"我不知道。",
                action:()=>doorFinalAnswer(
                    "unsure"
                )
            },

            {
                text:"不要再問了。",
                action:()=>doorFinalAnswer(
                    "stop"
                )
            }

        ],

        "UNKNOWN"
    );
}


/* =========================================================
   開門問題真正分支
========================================================= */

function doorFinalAnswer(type){

    if(type==="open"){

        showDialogue(

            "我就知道你會開。",

            ()=>{
                setTimeout(
                    ()=>{
                        finalDoorSequence(
                            "open"
                        );
                    },
                    1200
                );
            },

            [],

            "UNKNOWN"
        );

        return;
    }


    if(type==="closed"){

        showDialogue(

            "不會嗎？\n\n沒關係。\n\n我可以等。",

            ()=>{
                setTimeout(
                    ()=>{
                        finalDoorSequence(
                            "closed"
                        );
                    },
                    1400
                );
            },

            [],

            "UNKNOWN"
        );

        return;
    }


    if(type==="unsure"){

        showDialogue(

            "不知道？\n\n那就等你想好了再說。",

            ()=>{
                setTimeout(
                    ()=>{
                        finalDoorSequence(
                            "unsure"
                        );
                    },
                    1400
                );
            },

            [],

            "UNKNOWN"
        );

        return;
    }


    showDialogue(

        "好。\n\n我不問了。",

        ()=>{
            setTimeout(
                ()=>{
                    showDialogue(

                        "你自己聽就好。",

                        ()=>{
                            setTimeout(
                                ()=>{
                                    finalDoorSequence(
                                        "stop"
                                    );
                                },
                                1200
                            );
                        },

                        [],

                        "UNKNOWN"
                    );
                },
                1000
            );
        },

        [],

        "UNKNOWN"
    );
}


/* =========================================================
   最後敲門
========================================================= */

function finalDoorSequence(type){

    document.getElementById(
        "app"
    ).innerHTML=`

        <div class="card">

            ${systemStatus(
                "WAITING",
                "PHASE 06"
            )}

            <div class="dialogue">

                <div class="dialogue-speaker">
                    UNKNOWN
                </div>

                <div class="dialogue-text">
                    ……
                </div>

                <div class="system-note">
                    DOOR STATUS : CLOSED
                </div>

            </div>

        </div>
    `;


    /*
     * 不同回答造成不同節奏
     */

    if(type==="open"){

        setTimeout(
            ()=>{
                knock(.40);
            },
            700
        );

        setTimeout(
            ()=>{
                knock(.43);
            },
            1700
        );

    }
    else if(type==="closed"){

        setTimeout(
            ()=>{
                knock(.28);
            },
            1100
        );

        setTimeout(
            ()=>{
                footstep(.13);
            },
            2100
        );

        setTimeout(
            ()=>{
                footstep(.11);
            },
            2600
        );

    }
    else if(type==="unsure"){

        setTimeout(
            ()=>{
                knock(.30);
            },
            1000
        );

        setTimeout(
            ()=>{
                knock(.30);
            },
            1800
        );

    }
    else{

        setTimeout(
            ()=>{
                footstep(.13);
            },
            800
        );

        setTimeout(
            ()=>{
                footstepsSequence();
            },
            1400
        );
    }


    setTimeout(
        ()=>{
            showTimedQuestion();
        },
        3600
    );
}


/* =========================================================
   一秒限時題
========================================================= */

function showTimedQuestion(){

    timedAnswered=false;

    const popup=
        document.getElementById(
            "timedQuestion"
        );

    popup.classList.add("show");

    lowHum(
        1.2,
        .035
    );

    clearTimeout(
        timedTimer
    );

    timedTimer=
        setTimeout(
            ()=>{
                finishTimedQuestion();
            },
            1000
        );
}


function timedAnswer(answer){

    if(timedAnswered)return;

    timedAnswered=true;

    clearTimeout(
        timedTimer
    );

    const responses=[

        "你選得很快。",
        "你真的不想回頭嗎？",
        "嗯……什麼都沒有。",
        "那就別回頭。"
    ];


    hideTimedQuestion();

    whisper(
        responses[answer]
    );


    setTimeout(
        ()=>{
            fakeEnding();
        },
        1100
    );
}


function finishTimedQuestion(){

    if(timedAnswered)return;

    timedAnswered=true;

    hideTimedQuestion();

    whisper(
        "時間到了。"
    );


    setTimeout(
        ()=>{
            fakeEnding();
        },
        1100
    );
}


function hideTimedQuestion(){

    document
        .getElementById(
            "timedQuestion"
        )
        .classList
        .remove("show");
}


/* =========================================================
   假結束
========================================================= */

function fakeEnding(){

    document.body.className="horror";


    document.getElementById(

    ).innerHTML=`

    );

        },

    );
