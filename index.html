<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>親密關係傾向測驗｜第三十七版</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  min-height:100vh;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;
  background:#f1eeeb;color:#45403d;transition:background 2.5s ease,color 2.5s ease;
  overflow-x:hidden
}
body.normal{background:#f1eeeb;color:#45403d}
body.horror{
  background:radial-gradient(circle at 50% 40%,#4b2927 0%,#291514 50%,#090505 100%);
  color:#ddd0cc
}
#app{min-height:100vh;display:flex;justify-content:center;align-items:center;padding:25px;transition:transform .15s ease}
.card{
  width:680px;max-width:94vw;padding:42px;background:rgba(255,255,255,.97);
  border:1px solid #ddd7d3;box-shadow:0 15px 50px rgba(45,30,25,.08);
  transition:background 1.8s,border-color 1.8s,box-shadow 1.8s
}
body.horror .card{background:rgba(27,14,14,.95);border-color:#67433e;box-shadow:0 25px 90px rgba(0,0,0,.65)}
h1{margin:0 0 9px;text-align:center;font-size:27px;font-weight:400;letter-spacing:4px}
.subtitle{text-align:center;color:#aaa19d;font-size:11px;letter-spacing:2px;margin-bottom:34px}
.description{font-size:15px;line-height:2;color:#696360}
body.horror h1,body.horror .question{color:#dfccc7}
body.horror .subtitle,body.horror .question-number{color:#98716b}
body.horror .description{color:#bca9a4}
.start-btn{
  display:block;margin:34px auto 0;padding:12px 42px;background:#fff;color:#514a47;
  border:1px solid #aaa29d;cursor:pointer;font-family:inherit
}
body.horror .start-btn{background:#241413;color:#d6c4bf;border-color:#68423d}
.question-number{color:#aaa19d;font-size:12px;letter-spacing:1px;margin-bottom:22px}
.question{font-size:20px;line-height:1.8;margin-bottom:25px}
.feedback{min-height:28px;margin-top:18px;font-size:13px;line-height:1.8;color:#8c8581;white-space:pre-line}
body.horror .feedback{color:#aa8b85}
.options{display:flex;flex-direction:column;gap:9px}
.option{
  width:100%;padding:14px 16px;text-align:left;background:#fff;color:#403b39;
  border:1px solid #d8d2cf;cursor:pointer;font-family:inherit;transition:.25s
}
.option:hover{background:#f5efec;border-color:#a98b82}
.option.selected{background:#eee5e1;border-color:#927067}
.option.fade{opacity:0;pointer-events:none}
.option:disabled{cursor:default}
body.horror .option{background:#241413;color:#d6c4bf;border-color:#62413c}
body.horror .option:hover{background:#38201e}
body.horror .option.selected{background:#3b211f;border-color:#9b5d55}
.progress{height:2px;margin-top:28px;background:#e6dfdc}
.progress-bar{height:100%;background:#99786f;transition:width .5s}
.dialogue{text-align:center;min-height:230px;display:flex;flex-direction:column;justify-content:center}
.dialogue-speaker{font-size:10px;letter-spacing:4px;color:#88615b;margin-bottom:24px}
.dialogue-text{min-height:90px;font-size:19px;line-height:2;color:#d8c5c0;white-space:pre-line}
.dialogue-options{margin-top:22px;display:flex;flex-direction:column;gap:8px}
.ending-line{text-align:center;color:#9a756e;font-size:13px;line-height:2;min-height:52px;margin-top:22px;white-space:pre-line}
.final-wait{text-align:center;font-size:20px;letter-spacing:4px;color:#9a756e;opacity:0;animation:waitAppear 1.4s forwards}
.result-wrap{text-align:center}
.result-line{
  min-height:34px;font-size:15px;line-height:2.1;color:#696360;
  white-space:pre-line;margin:10px 0
}
body.horror .result-line{color:#bca9a4}
.result-label{font-size:10px;letter-spacing:4px;color:#9a756e;margin:22px 0 18px}
.cursor{display:inline-block;width:7px;height:17px;margin-left:2px;vertical-align:-2px;background:#9a756e;animation:blink .8s infinite}
@keyframes blink{50%{opacity:0}}
@keyframes waitAppear{from{opacity:0}to{opacity:1}}
#noise{
  position:fixed;inset:0;z-index:9999;pointer-events:none;opacity:0;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.15) 0,rgba(255,255,255,.15) 1px,
  rgba(0,0,0,.18) 1px,rgba(0,0,0,.18) 3px);mix-blend-mode:screen
}
#noise.active{animation:staticBurst .7s steps(7)}
@keyframes staticBurst{0%{opacity:0}15%{opacity:.3}30%{opacity:.05}47%{opacity:.24}68%{opacity:.08}100%{opacity:0}}
body.shake #app{animation:screenShake .55s}
@keyframes screenShake{
  0%,100%{transform:translate(0)}20%{transform:translate(-3px,1px)}
  40%{transform:translate(3px,-2px)}60%{transform:translate(-2px,2px)}
  80%{transform:translate(2px,-1px)}
}
#darkTransition{
  position:fixed;inset:0;z-index:3000;pointer-events:none;opacity:0;
  background:radial-gradient(circle,rgba(95,30,25,.02),rgba(8,3,3,.94));
  transition:opacity 5s
}
#darkTransition.active{opacity:.58}
#whisper{
  position:fixed;left:50%;bottom:11%;transform:translateX(-50%);z-index:4000;
  color:#884a43;font-size:12px;letter-spacing:3px;opacity:0;
  pointer-events:none;white-space:nowrap
}
#whisper.show{animation:whisperAppear 4s forwards}
@keyframes whisperAppear{
  0%{opacity:0}20%{opacity:.65}40%{opacity:.13}65%{opacity:.48}100%{opacity:0}
}
#quick2{
  position:fixed;inset:0;z-index:6000;display:flex;justify-content:center;align-items:center;
  background:rgba(5,3,3,.97);opacity:0;pointer-events:none;transition:opacity .15s
}
#quick2.show{opacity:1;pointer-events:auto}
.quick-box{width:650px;max-width:90vw;text-align:center;color:#ddcbc6}
.quick-small{font-size:10px;letter-spacing:5px;color:#906d67;margin-bottom:28px}
.quick-title{font-size:21px;line-height:2;margin-bottom:28px}
.quick-option{
  display:block;width:100%;max-width:430px;margin:8px auto;padding:12px;
  background:rgba(49,24,22,.72);color:#d1bdb8;border:1px solid #68413c;
  font-family:inherit;cursor:pointer
}
.quick-timer{width:100%;max-width:430px;height:2px;margin:25px auto 0;background:#382321}
.quick-timer-bar{width:100%;height:100%;background:#985b53}
@keyframes timerTwo{from{width:100%}to{width:0}}
@media(max-width:600px){
  #app{padding:14px}.card{padding:27px 21px}h1{font-size:22px}
  .question{font-size:18px}.dialogue-text{font-size:17px}.result-line{font-size:14px}
}
</style>
</head>
<body class="normal">
<div id="noise"></div>
<div id="darkTransition"></div>
<div id="whisper"></div>

<!-- 第11題：獨立於「共10題」之外，真正限時2秒 -->
<div id="quick2">
  <div class="quick-box">
    <div class="quick-small">第 11 題｜請立即回答</div>
    <div class="quick-title">如果我現在就在門外，你覺得我會做什麼？</div>
    <button class="quick-option" onclick="quickAnswer(0)">A．敲門</button>
    <button class="quick-option" onclick="quickAnswer(1)">B．等你開門</button>
    <button class="quick-option" onclick="quickAnswer(2)">C．直接離開</button>
    <button class="quick-option" onclick="quickAnswer(3)">D．不知道</button>
    <div class="quick-timer"><div class="quick-timer-bar" id="quickTimerBar"></div></div>
  </div>
</div>

<div id="app"></div>

<script>
/* =========================================================
   第三十七版
   1. 前10題完整保留
   2. 第10題後保留隱藏反映
   3. 第11題獨立計算，2秒限時，不列入「共10題」
   4. 第11題A固定「猜對了」+三下敲門
   5. 第11題逾時：「不想回我嗎?T^T」
   6. 結果頁恢復，並隨機多版本、逐行打字
   7. 補充題1改為「我再問你一次。你喜歡我嗎？」
   8. 補充題2：是否一個人
   9. 補充題3：所在地，不再重問有沒有人
   10. 補充題4：依補2/補3分支
   11. 補充題5：「你喜不喜歡我?」
   12. 補5非「喜歡」答案會轉成喜歡，不會卡死
   13. 補充階段不使用雜訊；補3保留腳步聲
   ========================================================= */

const normalQuestions=[
 {q:"當你情緒低落時，你最希望喜歡的人怎麼做？",a:["陪我聊聊天。","先給我一點空間。","直接問我發生了什麼。","陪在旁邊，不一定要說話。"]},
 {q:"你認為戀人之間需要知道彼此每天的行程嗎？",a:["不用，彼此都有自己的生活。","大概知道就好。","如果對方願意，我會想知道。","重要的事情可以互相說。"]},
 {q:"如果對方一整天沒有主動找你，你會？",a:["做自己的事情。","晚一點再傳訊息。","有點想知道他在忙什麼。","如果和平常差很多，會問問。"]},
 {q:"如果對方說今天想一個人，你會？",a:["尊重他的決定。","告訴他需要時可以找我。","有點失落，但還是會給空間。","等他自己願意說。"]},
 {q:"如果你傳了一則訊息，對方兩個小時都沒有回，你會？",a:["沒關係，他可能在忙。","偶爾看一下手機。","有點期待通知。","如果很反常，會稍微擔心。"]},
 {q:"你覺得戀人應該知道彼此的手機密碼嗎？",a:["不用。","知道也沒關係，但不需要查看。","如果彼此願意可以交換。","我比較重視信任，而不是密碼。"]},
 {q:"如果對方突然取消原本約好的見面，你會？",a:["沒關係，下次再約。","問問是不是發生了什麼。","會有一點失望。","看取消的理由。"]},
 {q:"如果你發現對方已讀了訊息，卻沒有回覆，你會？",a:["等他有時間再回。","過一陣子再看看。","會稍微想一下是不是說錯了什麼。","如果一直沒有回，會再問一次。"]},
 {q:"平常很快回你的人，突然六個小時沒有回覆，你會？",a:["他可能真的很忙。","等明天再看看。","會覺得有一點奇怪。","會傳一句「還好嗎？」"]},
 {q:"你認為一段健康的關係最重要的是什麼？",a:["信任。","溝通。","陪伴。","彼此尊重。"]}
];

const normalFeedback=[
 ["你似乎比較重視陪伴，而不是立即得到答案。","你會給對方空間。","你希望對方直接理解你的情緒。","你在意有人安靜地陪著你。"],
 ["你重視自己的生活界線。","你願意分享，但不希望被要求交代。","你對彼此的生活有一定程度的好奇。","你傾向把重要的事情說清楚。"],
 ["你不太容易被單次的沉默影響。","你會先觀察，再決定要不要聯絡。","你會注意對方的動向。","異常的改變會讓你想確認對方是否安好。"],
 ["你願意尊重對方的獨處時間。","你會留下聯絡的可能。","你雖然失落，但仍會給空間。","你比較傾向等對方主動。"],
 ["你會把沒有回覆理解成可能的忙碌。","你會留意手機，但不一定會追問。","你會期待通知。","你會根據平常的習慣判斷是否異常。"],
 ["你把信任和界線分得很清楚。","你接受透明，但不認為查看是必要的。","你願意在雙方同意下分享。","你更看重互相信任。"],
 ["你能接受計畫改變。","你會先確認原因。","你會感到失望，但不一定追究。","你會依照情況判斷。"],
 ["你傾向給對方時間。","你會再觀察。","你可能會反思自己是不是說了什麼。","你會希望得到一個明確回覆。"],
 ["你會先相信對方可能正在忙。","你願意等待。","你會注意和平常不同的地方。","你會主動確認狀況。"],
 ["你把關係建立在多個因素上，而不是單一答案。","你很重視說清楚。","你在意彼此的陪伴。","你重視界線與尊重。"]
];

/* 多個測驗結果版本：每次完成10題會隨機選一組。
   不改變玩家答案，只改變呈現方式。 */
const resultVersions=[
 {
  title:"你似乎是一個很重視陪伴的人。",
  lines:["你會在意對方的反應，也願意給彼此一些空間。","對你來說，靠近一個人並不代表要失去自己的界線。","你希望被理解，也希望關係裡有足夠的信任。"]
 },
 {
  title:"你對一段關係的安全感，來自彼此的理解。",
  lines:["你不一定需要對方時時刻刻陪著你。","但當平常的狀態突然改變，你會察覺。","你希望重要的事情可以說清楚，而不是讓彼此猜測。"]
 },
 {
  title:"你看起來比自己想像中更在意細節。",
  lines:["一個人的語氣、回覆速度，甚至平常的習慣，都可能被你注意到。","這不代表你一定缺乏安全感。","只是你會記住那些對你來說重要的變化。"]
 },
 {
  title:"你希望關係裡有靠近，也有距離。",
  lines:["你願意陪著重要的人，但不希望任何一方被困住。","你重視信任，也重視對方能不能尊重你的選擇。","對你而言，真正舒服的關係應該可以讓人做自己。"]
 },
 {
  title:"你的答案裡，有一種很安靜的在意。",
  lines:["你未必會立刻追問，也未必會把所有情緒說出口。","但當一個人對你真的重要，你會記得很多小地方。","你可能比自己承認的，更希望對方能注意到你。"]
 },
 {
  title:"你對關係的期待其實很簡單。",
  lines:["有人願意聽你說話，也願意在你需要時留下來。","同時，你也希望自己能保有選擇與呼吸的空間。","比起轟轟烈烈，你更在意長久而穩定的信任。"]
 }
];

let phase="normal";
let current=0;
let normalAnswers=[];
let supplementAnswers=[];
let audioCtx=null;
let quickTimer=null;
let quickResolved=false;
let resultIndex=0;
let playStart=Date.now();

const storageKey="relationship_v37_memory";

function getMemory(){
 try{
  return JSON.parse(localStorage.getItem(storageKey))||
   {plays:0,endings:{open:0,closed:0,unknown:0,stop:0},choices:{},seenAll:false}
 }catch(e){
  return {plays:0,endings:{open:0,closed:0,unknown:0,stop:0},choices:{},seenAll:false}
 }
}
function saveMemory(m){try{localStorage.setItem(storageKey,JSON.stringify(m))}catch(e){}}
function beginPlay(){
 let m=getMemory();m.plays=(m.plays||0)+1;saveMemory(m);playStart=Date.now();
}

function enterNormalMode(){
 document.body.classList.remove("horror","shake");
 document.body.classList.add("normal");
}
function enterHorrorMode(){
 document.body.classList.remove("normal","shake");
 document.body.classList.add("horror");
}
function clearEffects(){
 document.getElementById("darkTransition").classList.remove("active");
 document.getElementById("noise").classList.remove("active");
 document.body.classList.remove("shake");
}

function initAudio(){
 try{
  if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==="suspended")audioCtx.resume();
 }catch(e){}
}
function tone(f,d,v,type="sine"){
 if(!audioCtx)return;
 let o=audioCtx.createOscillator(),g=audioCtx.createGain();
 o.type=type;o.frequency.value=f;
 g.gain.setValueAtTime(.0001,audioCtx.currentTime);
 g.gain.exponentialRampToValueAtTime(v,audioCtx.currentTime+.02);
 g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+d);
 o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+d+.04);
}
function staticSound(str=.04,d=.25){
 if(!audioCtx)return;
 let b=audioCtx.createBuffer(1,audioCtx.sampleRate*d,audioCtx.sampleRate),
     data=b.getChannelData(0);
 for(let i=0;i<data.length;i++)data[i]=(Math.random()*2-1)*str;
 let s=audioCtx.createBufferSource(),g=audioCtx.createGain();
 g.gain.value=.6;s.buffer=b;s.connect(g);g.connect(audioCtx.destination);s.start();
}
function lowHum(d=2.2,v=.025){
 if(!audioCtx)return;
 let o=audioCtx.createOscillator(),g=audioCtx.createGain();
 o.type="sine";o.frequency.value=47;
 g.gain.setValueAtTime(.0001,audioCtx.currentTime);
 g.gain.exponentialRampToValueAtTime(v,audioCtx.currentTime+.5);
 g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+d);
 o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+d+.1);
}
function knock(v=.28){
 tone(83,.12,v);
 setTimeout(()=>tone(61,.08,v*.35),65);
}
function footstep(v=.12){
 tone(72,.08,v);
 setTimeout(()=>tone(58,.07,v*.7),95);
 setTimeout(()=>tone(72,.07,v*.8),205);
}
function threeKnocks(){
 knock(.28);setTimeout(()=>knock(.31),420);setTimeout(()=>knock(.34),840);
}
function noiseFlash(){
 let n=document.getElementById("noise");
 n.classList.remove("active");void n.offsetWidth;n.classList.add("active");
 staticSound(.045,.35);setTimeout(()=>n.classList.remove("active"),700);
}
function shake(){
 document.body.classList.remove("shake");void document.body.offsetWidth;
 document.body.classList.add("shake");setTimeout(()=>document.body.classList.remove("shake"),600);
}
function whisper(t){
 let e=document.getElementById("whisper");
 e.textContent=t;e.classList.remove("show");void e.offsetWidth;e.classList.add("show");
}

function home(){
 enterNormalMode();clearEffects();
 document.getElementById("app").innerHTML=`
 <div class="card">
  <h1>親密關係傾向測驗</h1>
  <div class="subtitle">RELATIONSHIP & ATTACHMENT TEST</div>
  <div class="description">
   <p>歡迎參與本次匿名情感傾向測驗。</p>
   <p>以下問題沒有標準答案，請依照你的第一直覺回答。</p>
   <p>前10題為主要測驗；之後還會有幾個需要你回答的小問題。</p>
   <p style="color:#aaa;font-size:12px;margin-top:28px">本測驗僅供娛樂使用，不代表正式心理評估。</p>
  </div>
  <button class="start-btn" onclick="startTest()">開始測驗</button>
 </div>`;
}
home();

function startTest(){
 initAudio();beginPlay();
 phase="normal";current=0;normalAnswers=[];supplementAnswers=[];
 enterNormalMode();clearEffects();showNormalQuestion();
}

function showNormalQuestion(){
 if(current>=normalQuestions.length){
  showQuick2();
  return;
 }
 let q=normalQuestions[current];
 document.getElementById("app").innerHTML=`
 <div class="card">
  <div class="question-number">第 ${current+1} 題 / 共 10 題</div>
  <div class="question">${q.q}</div>
  <div class="options" id="options"></div>
  <div class="feedback" id="feedback"></div>
  <div class="progress"><div class="progress-bar" style="width:${(current/10)*100}%"></div></div>
 </div>`;
 let box=document.getElementById("options");
 q.a.forEach((t,i)=>{
  let b=document.createElement("button");
  b.className="option";
  b.textContent=String.fromCharCode(65+i)+"．"+t;
  b.onclick=()=>chooseNormal(i);
  box.appendChild(b);
 });
}
function chooseNormal(i){
 let buttons=document.querySelectorAll("#options .option");
 buttons.forEach(b=>b.disabled=true);
 buttons[i].classList.add("selected");
 normalAnswers.push(i);
 document.getElementById("feedback").textContent=normalFeedback[current][i];

 /* 只保留第10題後的隱藏反映 */
 if(current===9)setTimeout(()=>whisper("你的答案，我都記得。"),650);

 buttons.forEach((b,j)=>{
  if(j!==i)setTimeout(()=>b.classList.add("fade"),100);
 });
 current++;
 setTimeout(showNormalQuestion,720);
}

/* =========================================================
   第11題
   - 不計入前10題
   - 2秒
   - 逾時固定文字
   ========================================================= */
function showQuick2(){
 enterHorrorMode();
 let p=document.getElementById("quick2");
 p.classList.add("show");
 lowHum(2.2,.035);

 let bar=document.getElementById("quickTimerBar");
 bar.style.animation="none";void bar.offsetWidth;
 bar.style.animation="timerTwo 2s linear forwards";

 clearTimeout(quickTimer);
 quickResolved=false;

 quickTimer=setTimeout(()=>{
  if(!quickResolved)finishQuick2();
 },2000);
}
function quickAnswer(i){
 if(quickResolved)return;
 quickResolved=true;
 clearTimeout(quickTimer);
 hideQuick2();

function calculateResultType(){
 let counts=[0,0,0,0];
 normalAnswers.forEach(x=>counts[x]++);
 let max=Math.max(...counts);
 return counts.indexOf(max);
}

function typeLineByLine(lines,done){
 let container=document.getElementById("resultLines");
 if(!container){if(done)done();return}
 let index=0;

 function next(){
  if(index>=lines.length){
   if(done)done();
   return;
  }
  let p=document.createElement("div");
  p.className="result-line";
  container.appendChild(p);

  let text=lines[index],i=0;
  let cursor=document.createElement("span");
  cursor.className="cursor";
  p.appendChild(cursor);

  let timer=setInterval(()=>{
   if(i<text.length){
    cursor.remove();
    p.textContent+=text[i++];
    p.appendChild(cursor);
   }else{
    clearInterval(timer);
    cursor.remove();
    index++;
    setTimeout(next,520);
   }
  },48);
 }
 next();
}

 if(phase==="normal")setTimeout(showResult,1100);
 else setTimeout(fakeEnding,950);
}

function fakeEnding(){
 enterHorrorMode();
 document.getElementById("app").innerHTML=`
 <div class="card">
  <h1>測驗結束</h1>
  <div class="description" style="text-align:center">
   <p>所有問題均已完成。</p>
   <p style="color:#9a756e;margin-top:35px">……</p>
  </div>
 </div>`;
 setTimeout(()=>whisper("你還會回來。"),1200);
 setTimeout(finalEndingGlitch,2300);
}

function finalEndingGlitch(){
 setTimeout(()=>lowHum(2.6,.035),200);
 setTimeout(()=>knock(.34),900);
 setTimeout(()=>knock(.38),1700);
 setTimeout(()=>knock(.42),2500);
 setTimeout(noiseFlash,3200);
 setTimeout(shake,3700);
 setTimeout(noiseFlash,4100);
 setTimeout(returnNormalRed,4700);
}

function returnNormalRed(){
 enterNormalMode();clearEffects();
 document.getElementById("app").innerHTML=`
 <div class="card">

  </div>

 </div>`;
}
