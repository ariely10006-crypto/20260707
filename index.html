<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>親密關係傾向測驗</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    min-height:100%;
}

body{
    min-height:100vh;
    font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;
    background:#f1eeeb;
    color:#45403d;
    transition:background 3s ease,color 3s ease;
    overflow-x:hidden;
}

#app{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:25px;
    transition:transform .15s ease;
}

.card{
    width:680px;
    max-width:94vw;
    padding:42px;
    background:rgba(255,255,255,.97);
    border:1px solid #ddd7d3;
    box-shadow:0 15px 50px rgba(45,30,25,.08);

    transition:
        background 3s ease,
        border-color 3s ease,
        box-shadow 3s ease;
}

h1{
    margin:0 0 9px;
    text-align:center;
    font-size:27px;
    font-weight:400;
    letter-spacing:4px;
}

.subtitle{
    text-align:center;
    color:#aaa19d;
    font-size:11px;
    letter-spacing:2px;
    margin-bottom:34px;
}

.description{
    font-size:15px;
    line-height:2;
    color:#696360;
}

.start-btn{
    display:block;
    margin:34px auto 0;
    padding:12px 42px;
    background:#fff;
    color:#514a47;
    border:1px solid #aaa29d;
    cursor:pointer;
    font-family:inherit;
    transition:
        background .25s,
        border .25s,
        transform .15s;
}

.start-btn:hover{
    background:#eee8e4;
    border-color:#80665e;
}

.start-btn:active{
    transform:scale(.98);
}

.question-number{
    color:#aaa19d;
    font-size:12px;
    letter-spacing:1px;
    margin-bottom:22px;
}

.question{
    font-size:20px;
    line-height:1.8;
    margin-bottom:25px;
    white-space:pre-line;
}

.feedback{
    min-height:38px;
    margin-top:18px;
    font-size:13px;
    line-height:1.8;
    color:#827873;
    text-align:center;
    opacity:0;
    transition:opacity .5s ease;
}

.feedback.show{
    opacity:1;
}

.options{
    display:flex;
    flex-direction:column;
    gap:9px;
}

.option{
    width:100%;
    padding:14px 16px;
    text-align:left;
    background:#fff;
    color:#403b39;
    border:1px solid #d8d2cf;
    cursor:pointer;
    font-family:inherit;

    transition:
        background .25s,
        border .25s,
        opacity .35s,
        transform .12s;
}

.option:hover{
    background:#f5efec;
    border-color:#a98b82;
}

.option:active{
    transform:scale(.995);
}

.option.selected{
    background:#eee5e1;
    border-color:#927067;
}

.option.fade{
    opacity:0;
    pointer-events:none;
}

.option:disabled{
    cursor:default;
}

.progress{
    height:2px;
    margin-top:28px;
    background:#e6dfdc;
}

.progress-bar{
    height:100%;
    background:#99786f;
    transition:width .5s ease;
}


/* =========================
   恐怖模式
========================= */

body.horror{
    background:
        radial-gradient(
            circle at 50% 40%,
            #4b2927 0%,
            #291514 50%,
            #090505 100%
        );
    color:#ddd0cc;
}

body.horror .card{
    background:rgba(27,14,14,.95);
    border-color:#67433e;
    box-shadow:0 25px 90px rgba(0,0,0,.65);
}

body.horror h1,
body.horror .question{
    color:#dfccc7;
}

body.horror .subtitle,
body.horror .question-number{
    color:#98716b;
}

body.horror .description{
    color:#bca9a4;
}

body.horror .feedback{
    color:#a9857d;
}

body.horror .option{
    background:#241413;
    color:#d6c4bf;
    border-color:#62413c;
}

body.horror .option:hover{
    background:#38201e;
}

body.horror .option.selected{
    background:#38201e;
    border-color:#a05e55;
}

body.horror .progress{
    background:#3c2422;
}

body.horror .progress-bar{
    background:#985a52;
}

body.horror .start-btn{
    background:#241413;
    color:#d6c4bf;
    border-color:#68423d;
}


/* =========================
   黑屏
========================= */

#blackout{
    position:fixed;
    inset:0;
    z-index:10000;
    background:#000;
    opacity:0;
    pointer-events:none;
    transition:opacity .15s;
}

#blackout.show{
    opacity:1;
}


/* =========================
   畫面晃動
========================= */

body.shake #app{
    animation:screenShake .55s;
}

@keyframes screenShake{
    0%{transform:translate(0,0);}
    20%{transform:translate(-3px,1px);}
    40%{transform:translate(3px,-2px);}
    60%{transform:translate(-2px,2px);}
    80%{transform:translate(2px,-1px);}
    100%{transform:translate(0,0);}
}


/* =========================
   對話
========================= */

.dialogue{
    text-align:center;
    min-height:230px;

    display:flex;
    flex-direction:column;
    justify-content:center;
}

.dialogue-speaker{
    font-size:10px;
    letter-spacing:4px;
    color:#88615b;
    margin-bottom:24px;
}

.dialogue-text{
    min-height:90px;
    font-size:19px;
    line-height:2;
    color:#d8c5c0;
    white-space:pre-line;
}

.dialogue-options{
    margin-top:22px;
    display:flex;
    flex-direction:column;
    gap:8px;
}


/* =========================
   異常文字
========================= */

#whisper{
    position:fixed;
    left:50%;
    bottom:11%;
    transform:translateX(-50%);
    z-index:4000;

    color:#884a43;
    font-size:12px;
    letter-spacing:3px;

    opacity:0;
    pointer-events:none;
    white-space:nowrap;
}

#whisper.show{
    animation:whisperAppear 4s forwards;
}

@keyframes whisperAppear{
    0%{opacity:0;}
    20%{opacity:.65;}
    40%{opacity:.13;}
    65%{opacity:.48;}
    100%{opacity:0;}
}


/* =========================
   三秒問題
========================= */

#threeSecond{
    position:fixed;
    inset:0;
    z-index:6000;

    display:flex;
    justify-content:center;
    align-items:center;

    background:rgba(5,3,3,.97);

    opacity:0;
    pointer-events:none;

    transition:opacity .25s;
}

#threeSecond.show{
    opacity:1;
    pointer-events:auto;
}

.three-box{
    width:650px;
    max-width:90vw;
    text-align:center;
    color:#ddcbc6;
}

.three-small{
    font-size:10px;
    letter-spacing:5px;
    color:#906d67;
    margin-bottom:28px;
}

.three-title{
    font-size:21px;
    line-height:2;
    margin-bottom:28px;
}

.three-option{
    display:block;
    width:100%;
    max-width:430px;
    margin:8px auto;
    padding:12px;

    background:rgba(49,24,22,.72);
    color:#d1bdb8;
    border:1px solid #68413c;

    font-family:inherit;
    cursor:pointer;
}

.three-option:hover{
    background:#452522;
}

.three-timer{
    width:100%;
    max-width:430px;
    height:2px;
    margin:25px auto 0;
    background:#382321;
}

.three-timer-bar{
    width:100%;
    height:100%;
    background:#985b53;
    animation:timerThree 3s linear forwards;
}

@keyframes timerThree{
    from{width:100%;}
    to{width:0%;}
}


/* =========================
   第11題
========================= */

.single-answer{
    width:220px;
    margin:35px auto 0;
    text-align:center;
}


/* =========================
   手機
========================= */

@media(max-width:600px){

    #app{
        padding:14px;
    }

    .card{
        padding:27px 21px;
    }

    h1{
        font-size:22px;
    }

    .question{
        font-size:18px;
    }

    .dialogue-text{
        font-size:17px;
    }
}
</style>
</head>


<body>

<div id="blackout"></div>

<div id="whisper"></div>


<!-- 最後三秒問題 -->

<div id="threeSecond">

    <div class="three-box">

        <div class="three-small">
            請立即回答
        </div>

        <div class="three-title">
            如果你現在回頭，<br>
            你覺得房間裡會多出什麼？
        </div>

        <button class="three-option" onclick="threeAnswer(0)">
            一個人
        </button>

        <button class="three-option" onclick="threeAnswer(1)">
            一個影子
        </button>

        <button class="three-option" onclick="threeAnswer(2)">
            什麼都沒有
        </button>

        <button class="three-option" onclick="threeAnswer(3)">
            我不想回頭看
        </button>

        <div class="three-timer">
            <div class="three-timer-bar"></div>
        </div>

    </div>

</div>


<div id="app"></div>


<script>

/* =========================================================
   第一階段 10 題
========================================================= */

const normalQuestions=[

{
    q:"當你情緒低落時，你最希望喜歡的人怎麼做？",
    a:[
        "陪我聊聊天。",
        "先給我一點空間。",
        "直接問我發生了什麼。",
        "陪在旁邊，不一定要說話。"
    ],
    feedback:[
        "原來你需要的是陪伴啊。",
        "原來你不喜歡被逼著說出來。",
        "你會希望對方直接看見你的情緒。",
        "你比較在意有人在，而不是一定要說什麼。"
    ]
},

{
    q:"你認為戀人之間需要知道彼此每天的行程嗎？",
    a:[
        "不用，彼此都有自己的生活。",
        "大概知道就好。",
        "如果對方願意，我會想知道。",
        "重要的事情可以互相說。"
    ],
    feedback:[
        "原來你還是很重視彼此的界線。",
        "知道一點就夠了嗎？",
        "原來你會想知道他的生活。",
        "你希望兩個人之間保持一些連結。"
    ]
},

{
    q:"如果對方一整天沒有主動找你，你會？",
    a:[
        "做自己的事情。",
        "晚一點再傳訊息。",
        "有點想知道他在忙什麼。",
        "如果和平常差很多，會問問。"
    ],
    feedback:[
        "你似乎不太會因為這種事情不安。",
        "你會等一下看看。",
        "原來你還是會注意他的動向。",
        "你會注意到和平常不一樣的地方。"
    ]
},

{
    q:"如果對方說今天想一個人，你會？",
    a:[
        "尊重他的決定。",
        "告訴他需要時可以找我。",
        "有點失落，但還是會給空間。",
        "等他自己願意說。"
    ],
    feedback:[
        "你會把他的選擇放在前面。",
        "你會留一扇門給他。",
        "原來你其實會有一點在意。",
        "你願意等他自己開口。"
    ]
},

{
    q:"如果你傳了一則訊息，對方兩個小時都沒有回，你會？",
    a:[
        "沒關係，他可能在忙。",
        "偶爾看一下手機。",
        "有點期待通知。",
        "如果很反常，會稍微擔心。"
    ],
    feedback:[
        "你似乎很容易相信對方。",
        "原來你還是會偷偷看一下。",
        "你其實有在等。",
        "你會注意到細微的變化。"
    ]
},

{
    q:"你覺得戀人應該知道彼此的手機密碼嗎？",
    a:[
        "不用。",
        "知道也沒關係，但不需要查看。",
        "如果彼此願意可以交換。",
        "我比較重視信任，而不是密碼。"
    ],
    feedback:[
        "原來你很重視自己的私人空間。",
        "知道和查看，對你來說是不一樣的。",
        "只要是彼此同意就可以嗎？",
        "你更在意的是信任本身。"
    ]
},

{
    q:"如果對方突然取消原本約好的見面，你會？",
    a:[
        "沒關係，下次再約。",
        "問問是不是發生了什麼。",
        "會有一點失望。",
        "看取消的理由。"
    ],
    feedback:[
        "你似乎不太會把事情想得太嚴重。",
        "原來你第一個想到的是他是不是出了什麼事。",
        "你會失望，但不一定會責怪他。",
        "你會先看事情的原因。"
    ]
},

{
    q:"如果你發現對方已讀了訊息，卻沒有回覆，你會？",
    a:[
        "等他有時間再回。",
        "過一陣子再看看。",
        "會稍微想一下是不是說錯了什麼。",
        "如果一直沒有回，會再問一次。"
    ],
    feedback:[
        "你願意讓他慢慢回。",
        "原來你會先觀察。",
        "你會開始回想自己剛才說了什麼。",
        "你不太喜歡一直等著。"
    ]
},

{
    q:"平常很快回你的人，突然六個小時沒有回覆，你會？",
    a:[
        "他可能真的很忙。",
        "等明天再看看。",
        "會覺得有一點奇怪。",
        "會傳一句「還好嗎？」"
    ],
    feedback:[
        "你第一個想到的還是他可能在忙。",
        "你願意再等一段時間。",
        "你注意到了。",
        "原來你會主動確認他是不是還好。"
    ]
},

{
    q:"你認為一段健康的關係最重要的是什麼？",
    a:[
        "信任。",
        "溝通。",
        "陪伴。",
        "彼此尊重。"
    ],
    feedback:[
        "信任啊……原來這對你很重要。",
        "你似乎很在意兩個人能不能說清楚。",
        "原來你最在意的是有人陪著。",
        "你希望彼此都能保留自己的空間。"
    ]
}

];


/* =========================================================
   補充題
========================================================= */

const supplementQuestions=[

{
    q:"你現在一個人嗎？",
    a:[
        "是。",
        "不是。",
        "不確定。",
        "……"
    ],
    feedback:[
        "原來你現在是一個人。",
        "你發現我了？",
        "連你自己都不確定嗎？",
        "……你不想回答這個問題。"
    ]
},

{
    q:"你現在在哪？",
    a:[
        "在家。",
        "在學校。",
        "在外面。",
        "其他地方。"
    ],
    feedback:[
        "原來你現在在家。",
        "原來你還在學校。",
        "原來你現在在外面。",
        "原來你現在在其他地方。"
    ]
}

];


/* =========================================================
   狀態
========================================================= */

let phase="normal";
let current=0;

let normalAnswers=[];
let supplementAnswers=[];

let audioCtx=null;

let threeTimer=null;
let elevenTimer=null;


/* =========================================================
   音效初始化
========================================================= */

function initAudio(){

    if(!audioCtx){

        audioCtx=new(
            window.AudioContext ||
            window.webkitAudioContext
        )();

    }

    if(audioCtx.state==="suspended"){
        audioCtx.resume();
    }
}


/* =========================================================
   一般音
========================================================= */

function tone(
    frequency,
    duration,
    volume,
    type="sine"
){

    if(!audioCtx)return;

    const oscillator=
        audioCtx.createOscillator();

    const gain=
        audioCtx.createGain();

    oscillator.type=type;
    oscillator.frequency.value=frequency;

    gain.gain.setValueAtTime(
        .0001,
        audioCtx.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        volume,
        audioCtx.currentTime+.015
    );

    gain.gain.exponentialRampToValueAtTime(
        .0001,
        audioCtx.currentTime+duration
    );

    oscillator.connect(gain);
    gain.connect(audioCtx.destination);

    oscillator.start();

    oscillator.stop(
        audioCtx.currentTime+
        duration+
        .05
    );
}


/* =========================================================
   敲門聲
   ※ 不使用雜訊
========================================================= */

function knock(power=1){

    if(!audioCtx)return;

    /*
     * 第一聲
     */
    tone(
        105,
        .16,
        .28*power,
        "triangle"
    );

    /*
     * 第二層低頻，讓敲門更厚
     */
    setTimeout(
        ()=>{
            tone(
                68,
                .19,
                .20*power,
                "sine"
            );
        },
        45
    );
}


/* =========================================================
   連續敲門
========================================================= */

function loudKnockSeries(){

    setTimeout(
        ()=>knock(1.25),
        0
    );

    setTimeout(
        ()=>knock(1.45),
        650
    );

    setTimeout(
        ()=>knock(1.65),
        1350
    );
}


/* =========================================================
   腳步聲
   ※ 只用低頻，不使用雜訊
========================================================= */

function footsteps(){

    if(!audioCtx)return;

    const steps=[
        0,
        480,
        960,
        1500,
        2040
    ];

    steps.forEach(
        (time,index)=>{

            setTimeout(
                ()=>{

                    tone(
                        58,
                        .17,
                        .13 + index*.018,
                        "sine"
                    );

                    setTimeout(
                        ()=>{
                            tone(
                                43,
                                .11,
                                .09 + index*.012,
                                "sine"
                            );
                        },
                        55
                    );

                },
                time
            );

        }
    );
}


/* =========================================================
   低頻
========================================================= */

function lowHum(
    duration=2,
    volume=.025
){

    if(!audioCtx)return;

    const oscillator=
        audioCtx.createOscillator();

    const gain=
        audioCtx.createGain();

    oscillator.type="sine";
    oscillator.frequency.value=47;

    gain.gain.setValueAtTime(
        .0001,
        audioCtx.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        volume,
        audioCtx.currentTime+.4
    );

    gain.gain.exponentialRampToValueAtTime(
        .0001,
        audioCtx.currentTime+duration
    );

    oscillator.connect(gain);
    gain.connect(audioCtx.destination);

    oscillator.start();

    oscillator.stop(
        audioCtx.currentTime+
        duration+
        .1
    );
}


/* =========================================================
   畫面閃黑
========================================================= */

function flashBlack(){

    const black=
        document.getElementById("blackout");

    black.classList.add("show");

    setTimeout(
        ()=>{
            black.classList.remove("show");
        },
        500
    );
}


/* =========================================================
   長黑
========================================================= */

function longBlack(){

    const black=
        document.getElementById("blackout");

    black.classList.add("show");
}


/* =========================================================
   晃動
========================================================= */

function shake(){

    document.body.classList.remove("shake");

    void document.body.offsetWidth;

    document.body.classList.add("shake");

    setTimeout(
        ()=>{
            document.body.classList.remove("shake");
        },
        600
    );
}


/* =========================================================
   異常文字
========================================================= */

function whisper(text){

    const element=
        document.getElementById("whisper");

    element.textContent=text;

    element.classList.remove("show");

    void element.offsetWidth;

    element.classList.add("show");
}


/* =========================================================
   首頁
========================================================= */

function home(){

    document.body.className="";

    document.getElementById("app").innerHTML=`

        <div class="card">

            <h1>
                親密關係傾向測驗
            </h1>

            <div class="subtitle">
                RELATIONSHIP & ATTACHMENT TEST
            </div>

            <div class="description">

                <p>
                    歡迎參與本次匿名情感傾向測驗。
                </p>

                <p>
                    以下問題沒有標準答案，
                    請依照你的第一直覺回答。
                </p>

                <p>
                    測驗約需 3～5 分鐘。
                </p>

                <p style="
                    color:#aaa;
                    font-size:12px;
                    margin-top:28px;
                ">
                    本測驗僅供娛樂使用，
                    不代表正式心理評估。
                </p>

            </div>

            <button
                class="start-btn"
                onclick="startTest()"
            >
                開始測驗
            </button>

        </div>
    `;
}

home();


/* =========================================================
   開始測驗
========================================================= */

function startTest(){

    initAudio();

    phase="normal";
    current=0;

    normalAnswers=[];
    supplementAnswers=[];

    clearTimeout(elevenTimer);
    clearTimeout(threeTimer);

    document.body.className="";

    showQuestion();
}


/* =========================================================
   顯示一般題
========================================================= */

function showQuestion(){

    let q;
    let total;

    if(phase==="normal"){

        total=11;

        if(current>=10){

            showEleven();
            return;
        }

        q=normalQuestions[current];

    }
    else{

        total=5;

        if(current===0 || current===1){

            q=supplementQuestions[current];

        }
        else if(current===2){

            q=getBranchQuestion();

        }
        else if(current===3){

            q=getFourthQuestion();

        }
        else if(current===4){

            q=getFifthQuestion();

        }
        else{

            afterSupplements();
            return;
        }
    }


    const percentage=
        (current/total)*100;


    document.getElementById("app").innerHTML=`

        <div class="card">

            <div class="question-number">

                ${
                    phase==="normal"
                    ? `第 ${current+1} 題 / 共 11 題`
                    : `補充問題 ${current+1} / 5`
                }

            </div>

            <div class="question">
                ${q.q}
            </div>

            <div
                class="options"
                id="options"
            ></div>

            <div
                class="feedback"
                id="feedback"
            ></div>

            <div class="progress">

                <div
                    class="progress-bar"
                    style="width:${percentage}%"
                ></div>

            </div>

        </div>
    `;


    const container=
        document.getElementById("options");


    q.a.forEach(
        (text,index)=>{

            const button=
                document.createElement("button");

            button.className="option";

            button.textContent=
                String.fromCharCode(65+index)
                +". "
                +text;

            button.onclick=()=>{
                chooseAnswer(index);
            };

            container.appendChild(button);
        }
    );
}

/* =========================================================
   一般題回答
========================================================= */

function chooseAnswer(index){

    const buttons=
        document.querySelectorAll(".option");

    buttons.forEach(
        button=>{
            button.disabled=true;
        }
    );


    let q;

    if(phase==="normal"){

        normalAnswers[current]=index;

        q=normalQuestions[current];

    }
    else{

        supplementAnswers[current]=index;

        if(current===0 || current===1){

            q=supplementQuestions[current];

        }
        else if(current===2){

            q=getBranchQuestion();

        }
        else if(current===3){

            q=getFourthQuestion();

        }
        else{

            q=getFifthQuestion();

        }
    }


    buttons[index].classList.add("selected");


    buttons.forEach(
        (button,i)=>{

            if(i!==index){

                setTimeout(
                    ()=>{
                        button.classList.add("fade");
                    },
                    100
                );

            }

        }
    );


    /*
     * 顯示「正在讀你的回答」的文字
     */

    const feedback=
        document.getElementById("feedback");


    if(feedback && q.feedback){

        feedback.textContent=
            q.feedback[index] || "……";

        setTimeout(
            ()=>{
                feedback.classList.add("show");
            },
            180
        );

    }


    /*
     * 第 9 題稍微異常
     */

    if(
        phase==="normal" &&
        current===8
    ){

        setTimeout(
            ()=>{
                lowHum(.8,.012);
            },
            400
        );

    }


    /*
     * 第 10 題之後準備進入第 11 題
     */

    if(
        phase==="normal" &&
        current===9
    ){

        setTimeout(
            ()=>{
                lowHum(1.1,.016);
            },
            500
        );

    }


    /*
     * 補充題第 4 題之後，
     * 第 5 題準備出現腳步聲
     */

    if(
        phase==="supplement" &&
        current===3
    ){

        setTimeout(
            ()=>{
                footsteps();
            },
            450
        );

    }


    /*
     * 補充題第 5 題回答後：
     * 腳步聲 + 最後問題
     */

    if(
        phase==="supplement" &&
        current===4
    ){

        setTimeout(
            ()=>{
                footsteps();
            },
            350
        );

        current++;

        setTimeout(
            ()=>{
                finalDoorQuestion();
            },
            2800
        );

        return;
    }


    current++;


    const delay=
        phase==="supplement"
        ? 1500
        : 700;


    setTimeout(
        ()=>{
            showQuestion();
        },
        delay
    );
}
