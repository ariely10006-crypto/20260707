<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>親密關係傾向測驗</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    min-height:100%;
}

body{
    min-height:100vh;
    font-family:
        "Noto Sans TC",
        "Microsoft JhengHei",
        sans-serif;

    background:#f1eeeb;
    color:#45403d;

    transition:
        background 6s ease,
        color 6s ease;

    overflow-x:hidden;
}


/* ==============================
   主容器
============================== */

#app{
    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:25px;

    transition:
        transform .18s ease;
}

.card{
    width:680px;
    max-width:94vw;

    padding:42px;

    background:rgba(255,255,255,.97);

    border:1px solid #ddd7d3;

    box-shadow:
        0 15px 50px rgba(45,30,25,.08);

    transition:
        background 6s ease,
        border-color 6s ease,
        box-shadow 6s ease;
}


/* ==============================
   文字
============================== */

h1{
    margin:0 0 9px;

    text-align:center;

    font-size:27px;
    font-weight:400;

    letter-spacing:4px;
}

.subtitle{
    text-align:center;

    color:#aaa19d;

    font-size:11px;

    letter-spacing:2px;

    margin-bottom:34px;
}

.description{
    font-size:15px;

    line-height:2;

    color:#696360;
}

.question-number{
    color:#aaa19d;

    font-size:12px;

    letter-spacing:1px;

    margin-bottom:22px;
}

.question{
    font-size:20px;

    line-height:1.8;

    margin-bottom:25px;
}

.feedback{
    min-height:28px;

    margin-top:18px;

    font-size:13px;

    line-height:1.8;

    color:#8c8581;
}


/* ==============================
   按鈕
============================== */

.start-btn{
    display:block;

    margin:34px auto 0;

    padding:12px 42px;

    background:#fff;

    color:#514a47;

    border:1px solid #aaa29d;

    cursor:pointer;

    font-family:inherit;

    transition:
        background .25s,
        border .25s,
        transform .15s;
}

.start-btn:hover{
    background:#eee8e4;
    border-color:#80665e;
}

.start-btn:active{
    transform:scale(.98);
}


.options{
    display:flex;

    flex-direction:column;

    gap:9px;
}

.option{
    width:100%;

    padding:14px 16px;

    text-align:left;

    background:#fff;

    color:#403b39;

    border:1px solid #d8d2cf;

    cursor:pointer;

    font-family:inherit;

    transition:
        background .25s,
        border .25s,
        opacity .35s,
        transform .12s;
}

.option:hover{
    background:#f5efec;
    border-color:#a98b82;
}

.option:active{
    transform:scale(.995);
}

.option.selected{
    background:#eee5e1;
    border-color:#927067;
}

.option.fade{
    opacity:0;
    pointer-events:none;
}

.option:disabled{
    cursor:default;
}


/* ==============================
   進度
============================== */

.progress{
    height:2px;

    margin-top:28px;

    background:#e6dfdc;
}

.progress-bar{
    height:100%;

    background:#99786f;

    transition:width .5s ease;
}


/* ==============================
   前段雜訊
============================== */

#noise{
    position:fixed;

    inset:0;

    z-index:9999;

    pointer-events:none;

    opacity:0;

    background:
        repeating-linear-gradient(
            0deg,
            rgba(255,255,255,.15) 0px,
            rgba(255,255,255,.15) 1px,
            rgba(0,0,0,.18) 1px,
            rgba(0,0,0,.18) 3px
        );

    mix-blend-mode:screen;
}

#noise.active{
    animation:
        staticBurst .65s steps(7);
}

@keyframes staticBurst{
    0%{opacity:0;}
    15%{opacity:.28;}
    30%{opacity:.05;}
    47%{opacity:.20;}
    68%{opacity:.08;}
    100%{opacity:0;}
}


/* ==============================
   畫面輕微晃動
============================== */

body.shake #app{
    animation:
        screenShake .55s;
}

@keyframes screenShake{
    0%{
        transform:translate(0,0);
    }

    20%{
        transform:translate(-2px,1px);
    }

    40%{
        transform:translate(2px,-1px);
    }

    60%{
        transform:translate(-1px,1px);
    }

    80%{
        transform:translate(1px,-1px);
    }

    100%{
        transform:translate(0,0);
    }
}


/* ==============================
   紅黑恐怖模式
============================== */

body.horror{
    background:
        radial-gradient(
            circle at 50% 40%,
            #4a2927 0%,
            #291615 52%,
            #0d0707 100%
        );

    color:#ddd0cc;
}

body.horror .card{
    background:rgba(27,14,14,.95);

    border-color:#67433e;

    box-shadow:
        0 25px 90px rgba(0,0,0,.63);
}

body.horror h1,
body.horror .question{
    color:#dfccc7;
}

body.horror .subtitle,
body.horror .question-number{
    color:#98716b;
}

body.horror .description{
    color:#bca9a4;
}

body.horror .option{
    background:#241413;
    color:#d6c4bf;
    border-color:#62413c;
}

body.horror .option:hover{
    background:#38201e;
}

body.horror .progress{
    background:#3c2422;
}

body.horror .progress-bar{
    background:#985a52;
}

body.horror .start-btn{
    background:#241413;
    color:#d6c4bf;
    border-color:#68423d;
}


/* ==============================
   慢慢變暗覆蓋層
============================== */

#darkTransition{
    position:fixed;

    inset:0;

    z-index:3000;

    pointer-events:none;

    opacity:0;

    background:
        radial-gradient(
            circle,
            rgba(95,30,25,.02),
            rgba(8,3,3,.92)
        );

    transition:opacity 6s ease;
}

#darkTransition.active{
    opacity:.58;
}


/* ==============================
   門外對話
============================== */

.dialogue{
    text-align:center;

    min-height:230px;

    display:flex;

    flex-direction:column;

    justify-content:center;
}

.dialogue-speaker{
    font-size:10px;

    letter-spacing:4px;

    color:#88615b;

    margin-bottom:24px;
}

.dialogue-text{
    min-height:90px;

    font-size:19px;

    line-height:2;

    color:#d8c5c0;

    white-space:pre-line;
}

.dialogue-options{
    margin-top:22px;

    display:flex;

    flex-direction:column;

    gap:8px;
}


/* ==============================
   小異常文字
============================== */

#whisper{
    position:fixed;

    left:50%;
    bottom:11%;

    transform:translateX(-50%);

    z-index:4000;

    color:#884a43;

    font-size:12px;

    letter-spacing:3px;

    opacity:0;

    pointer-events:none;

    white-space:nowrap;
}

#whisper.show{
    animation:
        whisperAppear 4s forwards;
}

@keyframes whisperAppear{
    0%{opacity:0;}
    20%{opacity:.65;}
    40%{opacity:.13;}
    65%{opacity:.48;}
    100%{opacity:0;}
}


/* ==============================
   三秒問題
============================== */

#threeSecond{
    position:fixed;

    inset:0;

    z-index:6000;

    display:flex;

    justify-content:center;
    align-items:center;

    background:rgba(5,3,3,.96);

    opacity:0;

    pointer-events:none;

    transition:opacity .35s;
}

#threeSecond.show{
    opacity:1;
    pointer-events:auto;
}

.three-box{
    width:650px;

    max-width:90vw;

    text-align:center;

    color:#ddcbc6;
}

.three-small{
    font-size:10px;

    letter-spacing:5px;

    color:#906d67;

    margin-bottom:28px;
}

.three-title{
    font-size:21px;

    line-height:2;

    margin-bottom:28px;
}

.three-option{
    display:block;

    width:100%;

    max-width:430px;

    margin:8px auto;

    padding:12px;

    background:rgba(49,24,22,.72);

    color:#d1bdb8;

    border:1px solid #68413c;

    font-family:inherit;

    cursor:pointer;
}

.three-timer{
    width:100%;

    max-width:430px;

    height:2px;

    margin:25px auto 0;

    background:#382321;
}

.three-timer-bar{
    width:100%;

    height:100%;

    background:#985b53;

    animation:
        timerThree 3s linear forwards;
}

@keyframes timerThree{
    from{width:100%;}
    to{width:0%;}
}


/* ==============================
   假結束
============================== */

body.normal{
    background:#f1eeeb;
    color:#45403d;
}

body.normal .card{
    background:rgba(255,255,255,.97);

    border-color:#ddd7d3;

    box-shadow:
        0 15px 50px rgba(45,30,25,.08);
}


/* ==============================
   手機
============================== */

@media(max-width:600px){

    #app{
        padding:14px;
    }

    .card{
        padding:27px 21px;
    }

    h1{
        font-size:22px;
    }

    .question{
        font-size:18px;
    }

    .dialogue-text{
        font-size:17px;
    }
}

</style>
</head>


<body>

<div id="noise"></div>
<div id="darkTransition"></div>
<div id="whisper"></div>

<!-- 3 秒問題 -->

<div id="threeSecond">

    <div class="three-box">

        <div class="three-small">
            請立即回答
        </div>

        <div class="three-title">
            如果你現在回頭，<br>
            你覺得房間裡會多出什麼？
        </div>

        <button class="three-option"
                onclick="threeAnswer(0)">
            一個人
        </button>

        <button class="three-option"
                onclick="threeAnswer(1)">
            一個影子
        </button>

        <button class="three-option"
                onclick="threeAnswer(2)">
            什麼都沒有
        </button>

        <button class="three-option"
                onclick="threeAnswer(3)">
            我不想回頭看
        </button>

        <div class="three-timer">
            <div class="three-timer-bar"></div>
        </div>

    </div>

</div>


<div id="app"></div>


<script>

/* =========================================================
   題目
========================================================= */

const normalQuestions = [

{
    q:"當你情緒低落時，你最希望喜歡的人怎麼做？",
    a:[
        "陪我聊聊天。",
        "先給我一點空間。",
        "直接問我發生了什麼。",
        "陪在旁邊，不一定要說話。"
    ]
},

{
    q:"你認為戀人之間需要知道彼此每天的行程嗎？",
    a:[
        "不用，彼此都有自己的生活。",
        "大概知道就好。",
        "如果對方願意，我會想知道。",
        "重要的事情可以互相說。"
    ]
},

{
    q:"如果對方一整天沒有主動找你，你會？",
    a:[
        "做自己的事情。",
        "晚一點再傳訊息。",
        "有點想知道他在忙什麼。",
        "如果和平常差很多，會問問。"
    ]
},

{
    q:"如果對方說今天想一個人，你會？",
    a:[
        "尊重他的決定。",
        "告訴他需要時可以找我。",
        "有點失落，但還是會給空間。",
        "等他自己願意說。"
    ]
},

{
    q:"如果你傳了一則訊息，對方兩個小時都沒有回，你會？",
    a:[
        "沒關係，他可能在忙。",
        "偶爾看一下手機。",
        "有點期待通知。",
        "如果很反常，會稍微擔心。"
    ]
},

{
    q:"你覺得戀人應該知道彼此的手機密碼嗎？",
    a:[
        "不用。",
        "知道也沒關係，但不需要查看。",
        "如果彼此願意可以交換。",
        "我比較重視信任，而不是密碼。"
    ]
},

{
    q:"如果對方突然取消原本約好的見面，你會？",
    a:[
        "沒關係，下次再約。",
        "問問是不是發生了什麼。",
        "會有一點失望。",
        "看取消的理由。"
    ]
},

{
    q:"如果你發現對方已讀了訊息，卻沒有回覆，你會？",
    a:[
        "等他有時間再回。",
        "過一陣子再看看。",
        "會稍微想一下是不是說錯了什麼。",
        "如果一直沒有回，會再問一次。"
    ]
},

{
    q:"平常很快回你的人，突然六個小時沒有回覆，你會？",
    a:[
        "他可能真的很忙。",
        "等明天再看看。",
        "會覺得有一點奇怪。",
        "會傳一句「還好嗎？」"
    ]
},

{
    q:"你知道對方的手機還有電，但訊息一直沒有回覆，你會？",
    a:[
        "那也可能只是沒看。",
        "應該有自己的事情。",
        "會有點疑惑。",
        "會想知道他是不是故意不回。"
    ]
},

{
    q:"如果你在晚上 11:47 傳了一句「晚安」，一直沒有收到回覆，你會？",
    a:[
        "他應該睡了。",
        "明天再說。",
        "可能會再看一次手機。",
        "希望至少知道他沒事。"
    ]
},

{
    q:"隔天你發現，對方凌晨 2:13 曾經在線上，你會？",
    a:[
        "可能只是短暫上線。",
        "不會特別在意。",
        "會覺得有一點奇怪。",
        "會想問他昨天為什麼那麼晚還醒著。"
    ]
},

{
    q:"如果對方臨時改變原本的計畫，你通常會？",
    a:[
        "配合看看。",
        "先問原因。",
        "會有一點失望。",
        "希望下次可以早點說。"
    ]
},

{
    q:"你認為一段健康的關係最重要的是什麼？",
    a:[
        "信任。",
        "溝通。",
        "陪伴。",
        "彼此尊重。"
    ]
},

{
    q:"如果你和喜歡的人意見不同，你通常會？",
    a:[
        "先聽對方怎麼想。",
        "一起找一個折衷的方法。",
        "表達自己的想法。",
        "等情緒平穩後再討論。"
    ]
}

];


const supplementQuestions = [

{
    q:"如果你的伴侶希望知道你每天去了哪裡，你會覺得？",
    a:[
        "這很正常，偶爾分享就好。",
        "可以說，但不需要事事交代。",
        "如果對方一直追問，我會有點不舒服。",
        "我會希望彼此保有自己的空間。"
    ]
},

{
    q:"如果你沒有及時回覆訊息，對方一直問你去了哪裡，你會？",
    a:[
        "解釋自己剛才在做什麼。",
        "告訴對方自己現在有事情。",
        "覺得有點煩，但還是會回答。",
        "希望對方理解我不可能隨時在線。"
    ]
},

{
    q:"如果對方說：「我只是想知道你現在在哪裡。」你會怎麼想？",
    a:[
        "他可能只是擔心我。",
        "我會直接告訴他。",
        "要看他用什麼方式問。",
        "如果這變成習慣，我會覺得不舒服。"
    ]
},

{
    q:"如果你發現對方總能很快知道你今天去了哪些地方，你會？",
    a:[
        "覺得只是剛好。",
        "問問他怎麼知道的。",
        "開始注意這件事。",
        "覺得有點不舒服。"
    ]
},

{
    q:"如果你正在做這份測驗，而你最在乎的人突然問你：「你現在一個人嗎？」",
    a:[
        "是。",
        "不是。",
        "我不知道。",
        "……為什麼問這個？"
    ]
}

];


/* =========================================================
   狀態
========================================================= */

let phase = "normal";
let current = 0;

let normalAnswers = [];
let supplementAnswers = [];

let doorPath = [];

let audioCtx = null;

let threeTimer = null;


/* =========================================================
   音效
========================================================= */

function initAudio(){

    if(!audioCtx){

        audioCtx =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();
    }

    if(audioCtx.state === "suspended"){
        audioCtx.resume();
    }
}


/* 基本聲音 */

function tone(
    frequency,
    duration,
    volume,
    type="sine"
){

    if(!audioCtx) return;

    const oscillator =
        audioCtx.createOscillator();

    const gain =
        audioCtx.createGain();

    oscillator.type = type;

    oscillator.frequency.value =
        frequency;

    gain.gain.setValueAtTime(
        .0001,
        audioCtx.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        volume,
        audioCtx.currentTime + .025
    );

    gain.gain.exponentialRampToValueAtTime(
        .0001,
        audioCtx.currentTime + duration
    );

    oscillator.connect(gain);
    gain.connect(audioCtx.destination);

    oscillator.start();

    oscillator.stop(
        audioCtx.currentTime +
        duration +
        .04
    );
}


/* 雜訊 */

function staticSound(
    strength=.035,
    duration=.18
){

    if(!audioCtx) return;

    const buffer =
        audioCtx.createBuffer(
            1,
            audioCtx.sampleRate * duration,
            audioCtx.sampleRate
        );

    const data =
        buffer.getChannelData(0);

    for(let i=0;i<data.length;i++){

        data[i] =
            (Math.random()*2-1) *
            strength;
    }

    const source =
        audioCtx.createBufferSource();

    const gain =
        audioCtx.createGain();

    gain.gain.value = .65;

    source.buffer = buffer;

    source.connect(gain);
    gain.connect(audioCtx.destination);

    source.start();
}


/* 低頻 */

function lowHum(
    duration=2.2,
    volume=.025
){

    if(!audioCtx) return;

    const oscillator =
        audioCtx.createOscillator();

    const gain =
        audioCtx.createGain();

    oscillator.type="sine";

    oscillator.frequency.value=47;

    gain.gain.setValueAtTime(
        .0001,
        audioCtx.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        volume,
        audioCtx.currentTime+.55
    );

    gain.gain.exponentialRampToValueAtTime(
        .0001,
        audioCtx.currentTime+duration
    );

    oscillator.connect(gain);
    gain.connect(audioCtx.destination);

    oscillator.start();

    oscillator.stop(
        audioCtx.currentTime+
        duration+
        .1
    );
}


/* 敲門 */

function knock(volume=.18){

    if(!audioCtx) return;

    tone(
        83,
        .12,
        volume,
        "sine"
    );

    setTimeout(
        ()=>{
            tone(
                61,
                .08,
                volume*.28,
                "sine"
            );
        },
        65
    );
}


/* =========================================================
   視覺效果
========================================================= */

function noiseFlash(){

    const noise =
        document.getElementById("noise");

    noise.classList.remove("active");

    void noise.offsetWidth;

    noise.classList.add("active");

    staticSound(.045,.35);

    setTimeout(
        ()=>{
            noise.classList.remove("active");
        },
        700
    );
}


function shake(){

    document.body.classList.remove("shake");

    void document.body.offsetWidth;

    document.body.classList.add("shake");

    setTimeout(
        ()=>{
            document.body.classList.remove("shake");
        },
        600
    );
}


function whisper(text){

    const element =
        document.getElementById("whisper");

    element.textContent=text;

    element.classList.remove("show");

    void element.offsetWidth;

    element.classList.add("show");
}


/* =========================================================
   首頁
========================================================= */

function home(){

    document.body.className="normal";

    document.getElementById("app").innerHTML=`

        <div class="card">

            <h1>
                親密關係傾向測驗
            </h1>

            <div class="subtitle">
                RELATIONSHIP & ATTACHMENT TEST
            </div>

            <div class="description">

                <p>
                    歡迎參與本次匿名情感傾向測驗。
                </p>

                <p>
                    以下問題沒有標準答案，
                    請依照你的第一直覺回答。
                </p>

                <p>
                    測驗約需 3～5 分鐘。
                </p>

                <p style="
                    color:#aaa;
                    font-size:12px;
                    margin-top:28px;
                ">
                    本測驗僅供娛樂使用，
                    不代表正式心理評估。
                </p>

            </div>

            <button
                class="start-btn"
                onclick="startTest()"
            >
                開始測驗
            </button>

        </div>
    `;
}

home();


/* =========================================================
   開始
========================================================= */

function startTest(){

    initAudio();

    phase="normal";
    current=0;

    normalAnswers=[];
    supplementAnswers=[];
    doorPath=[];

    document.body.className="normal";

    showQuestion();
}


/* =========================================================
   顯示題目
========================================================= */

function showQuestion(){

    const list =
        phase==="normal"
        ? normalQuestions
        : supplementQuestions;

    if(current >= list.length){

        if(phase==="normal"){
            showNormalResult();
        }
        else{
            afterSupplements();
        }

        return;
    }


    const q=list[current];

    const total=list.length;

    const percentage =
        (current / total) * 100;


    document.getElementById("app").innerHTML=`

        <div class="card">

            <div class="question-number">

                ${
                    phase==="normal"
                    ? `第 ${current+1} 題 / 共 15 題`
                    : `補充問題 ${current+1} / 5`
                }

            </div>

            <div class="question">
                ${q.q}
            </div>

            <div
                class="options"
                id="options"
            ></div>

            <div
                class="feedback"
                id="feedback"
            ></div>

            <div class="progress">

                <div
                    class="progress-bar"
                    style="width:${percentage}%"
                ></div>

            </div>

        </div>
    `;


    const container =
        document.getElementById("options");


    q.a.forEach(
        (text,index)=>{

            const button =
                document.createElement("button");

            button.className="option";

            button.textContent =
                String.fromCharCode(65+index)
                + ". "
                + text;

            button.onclick =
                ()=>{
                    chooseAnswer(index);
                };

            container.appendChild(button);
        }
    );
}


/* =========================================================
   回答
========================================================= */

function chooseAnswer(index){

    const buttons =
        document.querySelectorAll(".option");

    buttons.forEach(
        button=>{
            button.disabled=true;
        }
    );


    if(phase==="normal"){

        normalAnswers.push(index);

    }else{

        supplementAnswers.push(index);

    }


    buttons[index].classList.add("selected");


    buttons.forEach(
        (button,i)=>{

            if(i!==index){

                setTimeout(
                    ()=>{
                        button.classList.add("fade");
                    },
                    100
                );
            }
        }
    );


    /* ---------------------------
       前 15 題
    --------------------------- */

    if(phase==="normal"){

        /*
         * 少量異常。
         * 不每題出現。
         */

        if(
            current===2 ||
            current===6 ||
            current===10 ||
            current===13
        ){

            setTimeout(
                ()=>{
                    noiseFlash();
                },
                300
            );
        }


        if(current===9){

            setTimeout(
                ()=>{
                    lowHum(1.2,.012);
                },
                500
            );
        }


        current++;

        setTimeout(
            ()=>{
                showQuestion();
            },
            560
        );

        return;
    }


    /* ---------------------------
       補充題
    --------------------------- */

    const questionNumber=current+1;


    if(questionNumber===1){

        setTimeout(
            ()=>{
                knock(.13);
            },
            900
        );
    }


    if(questionNumber===2){

        setTimeout(
            ()=>{
                whisper("已經知道了。");
            },
            800
        );

        setTimeout(
            ()=>{
                knock(.16);
            },
            2300
        );

        setTimeout(
            ()=>{
                knock(.16);
            },
            2450
        );
    }


    if(questionNumber===3){

        setTimeout(
            ()=>{
                whisper(
                    "你不用回答得這麼仔細。"
                );
            },
            700
        );
    }


    if(questionNumber===4){

        setTimeout(
            ()=>{
                whisper(
                    "正在確認……"
                );
            },
            650
        );

        setTimeout(
            ()=>{
                knock(.20);
            },
            1800
        );

        setTimeout(
            ()=>{
                knock(.20);
            },
            3200
        );

        setTimeout(
            ()=>{
                knock(.20);
            },
            4600
        );
    }


    if(questionNumber===5){

        setTimeout(
            ()=>{
                whisper("好的。");
            },
            700
        );
    }


    current++;


    setTimeout(
        ()=>{
            showQuestion();
        },
        800
    );
}

/* =========================================================
   補充題開始
========================================================= */

function startSupplements(){

    phase="supplement";
    current=0;

    document.body.classList.add("horror");

    showQuestion();
}


/* =========================================================
   五題之後
========================================================= */

function afterSupplements(){

    /*
     * 第五題回答本身也會影響開場。
     */

    const lastAnswer =
        supplementAnswers[4];


    let firstLine;


    if(lastAnswer===0){

        firstLine =
            "你說你一個人。";

    }
    else if(lastAnswer===1){

        firstLine =
            "你說你不是一個人。";

    }
    else if(lastAnswer===2){

        firstLine =
            "你不知道自己是不是一個人。";

    }
    else{

        firstLine =
            "你問我為什麼要知道。";
    }


    showDialogue(
        "補充資料已完成。",
        ()=>{
            setTimeout(
                ()=>{
                    doorDialogueStart(
                        firstLine
                    );
                },
                1800
            );
        }
    );
}


/* =========================================================
   對話系統
========================================================= */

function showDialogue(
    text,
    next=null,
    options=[]
){

    document.getElementById("app").innerHTML=`

        <div class="card">

            <div class="dialogue">

                <div class="dialogue-speaker">
                    SYSTEM
                </div>

                <div class="dialogue-text">
                    ${text}
                </div>

                <div
                    class="dialogue-options"
                    id="dialogueOptions"
                ></div>

            </div>

        </div>
    `;


    const box =
        document.getElementById(
            "dialogueOptions"
        );


    if(options.length>0){

        options.forEach(
            option=>{

                const button =
                    document.createElement(
                        "button"
                    );

                button.className="option";

                button.textContent=
                    option.text;

                button.onclick=
                    option.action;

                box.appendChild(button);
            }
        );

    }
    else if(next){

        setTimeout(
            next,
            1200
        );
    }
}


/* =========================================================
   門外對話第一段
========================================================= */

function doorDialogueStart(firstLine){

    /*
     * 讓不同答案影響門外第一句話。
     */

    let text="";


    if(
        firstLine.includes("一個人")
    ){

        text =
        `${firstLine}\n\n你剛才有聽見嗎？`;

    }
    else if(
        firstLine.includes("不是")
    ){

        text =
        `${firstLine}\n\n那我等一下再問一次。`;

    }
    else if(
        firstLine.includes("不知道")
    ){

        text =
        `${firstLine}\n\n沒關係。\n你再聽一次就知道了。`;

    }
    else{

        text =
        `${firstLine}\n\n我只是想確認一件事情。`;
    }


    showDialogue(
        text,
        null,
        [
            {
                text:"有",
                action:()=>doorAnswer("heard")
            },

            {
                text:"沒有",
                action:()=>doorAnswer("notheard")
            },

            {
                text:"不確定",
                action:()=>doorAnswer("unsure")
            }
        ]
    );
}


/* =========================================================
   玩家回答「有 / 沒有 / 不確定」
========================================================= */

function doorAnswer(type){

    doorPath.push(type);


    if(type==="heard"){

        /*
         * 玩家說有。
         */

        setTimeout(
            ()=>{
                knock(.20);
            },
            300
        );


        setTimeout(
            ()=>{

                showDialogue(
                    "有。\n\n那你應該知道我在哪裡了。",
                    ()=>{
                        setTimeout(
                            ()=>{
                                knock(.20);
                                nextDoorChoice();
                            },
                            1300
                        );
                    }
                );

            },
            850
        );

        return;
    }


    if(type==="notheard"){

        /*
         * 玩家說沒有。
         */

        showDialogue(
            "沒有嗎？\n\n沒關係。\n我剛才敲得太輕了。",
            ()=>{
                setTimeout(
                    ()=>{
                        knock(.24);

                        setTimeout(
                            ()=>{
                                nextDoorChoice();
                            },
                            1300
                        );
                    },
                    700
                );
            }
        );

        return;
    }


    /*
     * 不確定
     */

    showDialogue(
        "不確定也沒關係。\n\n再聽一次就好了。",
        ()=>{
            setTimeout(
                ()=>{
                    knock(.18);

                    setTimeout(
                        ()=>{
                            knock(.18);
                        },
                        850
                    );

                    setTimeout(
                        ()=>{
                            nextDoorChoice();
                        },
                        1900
                    );
                },
                900
            );
        }
    );
}


/* =========================================================
   第二次對話選擇
========================================================= */

function nextDoorChoice(){

    showDialogue(
        "我在外面。\n\n你不用開門。\n我只是想跟你說幾句話。",
        null,
        [
            {
                text:"我會回答你。",
                action:()=>doorSecondAnswer("yes")
            },

            {
                text:"你是誰？",
                action:()=>doorSecondAnswer("who")
            },

            {
                text:"離開。",
                action:()=>doorSecondAnswer("leave")
            }
        ]
    );
}


/* =========================================================
   第二次回答
========================================================= */

function doorSecondAnswer(type){

    if(type==="yes"){

        showDialogue(
            "很好。\n\n我就知道你會回答。",
            ()=>{
                setTimeout(
                    ()=>{
                        doorFinalQuestion();
                    },
                    1700
                );
            }
        );

        return;
    }


    if(type==="who"){

        showDialogue(
            "你不是一直都知道嗎？\n\n……算了。",
            ()=>{
                setTimeout(
                    ()=>{
                        knock(.19);
                        doorFinalQuestion();
                    },
                    1600
                );
            }
        );

        return;
    }


    /*
     * 玩家選擇離開。
     */

    showDialogue(
        "好。\n\n那我不說了。",
        ()=>{
            setTimeout(
                ()=>{
                    knock(.23);

                    setTimeout(
                        ()=>{
                            showDialogue(
                                "但是我還在這裡。",
                                ()=>{
                                    setTimeout(
                                        ()=>{
                                            doorFinalQuestion();
                                        },
                                        1500
                                    );
                                }
                            );
                        },
                        1100
                    );
                },
                1400
            );
        }
    );
}


/* =========================================================
   最後一道門外問題
========================================================= */

function doorFinalQuestion(){

    showDialogue(
        "最後一個問題。\n\n如果我現在敲門，\n你會開門嗎？",
        null,
        [
            {
                text:"會。",
                action:()=>doorFinalAnswer("open")

            {
                text:"不會。",
                action:()=>doorFinalAnswer("no")
            },

                action:()=>doorFinalAnswer("unknown")
            },

            {
                text:"不要再問了。",
                action:()=>doorFinalAnswer("stop")
            }
        ]
    );
}


/* =========================================================
   最後回答
========================================================= */

function doorFinalAnswer(type){

    let text="";


    if(type==="open"){

        text =
        "……\n\n那我就不敲了。";

    }
    else if(type==="no"){

        text =
        "不會嗎？\n\n沒關係。";

    else if(type==="unknown"){

        "不知道。\n\n那就先不要決定。";

    }
    else{

    );
}

function showThreeSecondQuestion(){

function threeAnswer(answer){

}


function hideThreeSecond(){
