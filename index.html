<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>親密關係傾向測驗</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#f1eeeb;color:#45403d;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;transition:background 4s,color 4s}
#app{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}.card{width:680px;max-width:94vw;padding:40px;background:#fff;border:1px solid #ddd7d3;box-shadow:0 15px 50px #0001}h1{text-align:center;font-weight:400;letter-spacing:4px}.subtitle{text-align:center;color:#aaa;font-size:11px;letter-spacing:2px;margin-bottom:30px}.description{line-height:2;color:#696360}.start-btn,.option{font:inherit;cursor:pointer}.start-btn{display:block;margin:30px auto 0;padding:12px 42px;background:#fff;border:1px solid #aaa}.question-number{color:#aaa;font-size:12px;margin-bottom:20px}.question{font-size:20px;line-height:1.8;margin-bottom:24px}.options{display:flex;flex-direction:column;gap:9px}.option{width:100%;padding:14px;text-align:left;background:#fff;border:1px solid #d8d2cf}.option.selected{background:#eee5e1;border-color:#927067}.option.fade{opacity:0;pointer-events:none}.feedback{min-height:42px;margin-top:15px;color:#8c8581;font-size:13px}.progress{height:2px;background:#e6dfdc;margin-top:25px}.progress-bar{height:100%;background:#99786f}body.horror{background:radial-gradient(circle,#4b2927,#090505 75%);color:#ddd}body.horror .card{background:#1b0e0ef5;border-color:#67433e;box-shadow:0 25px 90px #000b}body.horror h1,body.horror .question{color:#dfccc7}body.horror .description{color:#bca9a4}body.horror .option{background:#241413;color:#d6c4bf;border-color:#62413c}body.horror .start-btn{background:#241413;color:#d6c4bf;border-color:#68423d}.dialogue{text-align:center;min-height:220px;display:flex;flex-direction:column;justify-content:center}.dialogue-text{white-space:pre-line;min-height:80px;font-size:19px;line-height:2;color:#d8c5c0}.dialogue-options{margin-top:20px;display:flex;flex-direction:column;gap:8px}#noise{position:fixed;inset:0;pointer-events:none;z-index:9999;opacity:0;background:repeating-linear-gradient(0deg,#fff2 0 1px,#0003 1px 3px)}#noise.active{animation:noise .6s steps(7)}@keyframes noise{0%,100%{opacity:0}20%{opacity:.3}45%{opacity:.05}65%{opacity:.25}}body.shake #app{animation:shake .5s}@keyframes shake{20%{transform:translate(-4px,2px)}40%{transform:translate(4px,-2px)}60%{transform:translate(-3px,1px)}80%{transform:translate(2px,-1px)}}#whisper{position:fixed;bottom:12%;left:50%;transform:translateX(-50%);color:#a55a52;opacity:0;z-index:4000}#whisper.show{animation:whisper 3s}@keyframes whisper{20%{opacity:.7}60%{opacity:.3}100%{opacity:0}}#three{position:fixed;inset:0;background:#080303f5;z-index:5000;display:none;align-items:center;justify-content:center;color:#ddd}.threebox{text-align:center;width:650px;max-width:90vw}.threebox button{display:block;width:100%;max-width:430px;margin:8px auto;padding:12px;background:#281514;color:#ddd;border:1px solid #68413c;font:inherit}.timer{height:2px;max-width:430px;margin:22px auto;background:#382321}.timer i{display:block;height:100%;background:#985b53;animation:timer 3s linear}@keyframes timer{to{width:0}}
</style>
</head>
<body>
<div id="noise"></div><div id="whisper"></div>
<div id="three"><div class="threebox"><p>請立即回答</p><h2>如果你現在回頭，<br>你覺得房間裡會多出什麼？</h2><button onclick="threeAnswer(0)">一個人</button><button onclick="threeAnswer(1)">一個影子</button><button onclick="threeAnswer(2)">什麼都沒有</button><button onclick="threeAnswer(3)">我不想回頭看</button><div class="timer"><i></i></div></div></div>
<div id="app"></div>
<script>
const normal=[
["當你情緒低落時，你最希望喜歡的人怎麼做？",["陪我聊聊天。","先給我一點空間。","直接問我發生了什麼。","陪在旁邊，不一定要說話。"]],
["你認為戀人之間需要知道彼此每天的行程嗎？",["不用，彼此都有自己的生活。","大概知道就好。","如果對方願意，我會想知道。","重要的事情可以互相說。"]],
["如果對方一整天沒有主動找你，你會？",["做自己的事情。","晚一點再傳訊息。","有點想知道他在忙什麼。","如果和平常差很多，會問問。"]],
["如果對方說今天想一個人，你會？",["尊重他的決定。","告訴他需要時可以找我。","有點失落，但還是會給空間。","等他自己願意說。"]],
["如果你傳了一則訊息，對方兩個小時都沒有回，你會？",["沒關係，他可能在忙。","偶爾看一下手機。","有點期待通知。","如果很反常，會稍微擔心。"]],
["你覺得戀人應該知道彼此的手機密碼嗎？",["不用。","知道也沒關係，但不需要查看。","如果彼此願意可以交換。","我比較重視信任，而不是密碼。"]],
["如果對方突然取消原本約好的見面，你會？",["沒關係，下次再約。","問問是不是發生了什麼。","會有一點失望。","看取消的理由。"]],
["如果你發現對方已讀了訊息，卻沒有回覆，你會？",["等他有時間再回。","過一陣子再看看。","會稍微想一下是不是說錯了什麼。","如果一直沒有回，會再問一次。"]],
["平常很快回你的人，突然六個小時沒有回覆，你會？",["他可能真的很忙。","等明天再看看。","會覺得有一點奇怪。","會傳一句「還好嗎？」"]],
["你認為一段健康的關係最重要的是什麼？",["信任。","溝通。","陪伴。","彼此尊重。"]]
];
const loc=["在家","在學校","在外面","不想告訴你"];
let phase="home",n=0,ans=[],branch=0,audio=null,timer=null;
function audioInit(){try{audio||(audio=new(window.AudioContext||window.webkitAudioContext)());audio.resume()}catch(e){}}
function tone(f,d,v){if(!audio)return;let o=audio.createOscillator(),g=audio.createGain();o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+d)}
function knock(v=.55){tone(75,.13,v);setTimeout(()=>tone(55,.08,v*.5),60)}
function noise(){let x=document.getElementById("noise");x.classList.remove("active");void x.offsetWidth;x.classList.add("active");setTimeout(()=>x.classList.remove("active"),700)}
function shake(){document.body.classList.remove("shake");void document.body.offsetWidth;document.body.classList.add("shake")}
function whisper(t){let x=document.getElementById("whisper");x.textContent=t;x.classList.remove("show");void x.offsetWidth;x.classList.add("show")}
function type(t,done){let e=document.getElementById("typing");if(!e)return;let i=0;e.textContent="";let q=setInterval(()=>{e.textContent+=t[i++];if(i>=t.length){clearInterval(q);done&&done()}},42)}
function home(){document.body.className="";document.getElementById("app").innerHTML='<div class="card"><h1>親密關係傾向測驗</h1><div class="subtitle">RELATIONSHIP & ATTACHMENT TEST</div><div class="description"><p>歡迎參與本次匿名情感傾向測驗。</p><p>以下問題沒有標準答案，請依照你的第一直覺回答。</p><p>測驗約需 3～5 分鐘。</p><p style="color:#aaa;font-size:12px">本測驗僅供娛樂使用，不代表正式心理評估。</p></div><button class="start-btn" onclick="start()">開始測驗</button></div>'}
function start(){audioInit();phase="normal";n=0;ans=[];document.body.className="";showNormal()}
function showNormal(){if(n===10){show11();return}let q=normal[n];render(q[0],q[1],"第 "+(n+1)+" 題 / 共 11 題",i=>{ans.push(i);n++;if(n===8)noise();setTimeout(showNormal,600)})}
function render(title,opts,label,callback){document.getElementById("app").innerHTML='<div class="card"><div class="question-number">'+label+'</div><div class="question">'+title+'</div><div class="options" id="opts"></div><div class="feedback" id="fb"></div></div>';opts.forEach((x,i)=>{let b=document.createElement("button");b.className="option";b.textContent=String.fromCharCode(65+i)+". "+x;b.onclick=()=>{document.querySelectorAll(".option").forEach(z=>z.disabled=true);b.classList.add("selected");document.getElementById("fb").textContent=["你似乎很重視彼此的空間。","你傾向透過溝通確認關係。","你會注意對方的變化。","你習慣先確認狀況再決定。"][i];callback(i)};document.getElementById("opts").appendChild(b)})}
function show11(){document.body.className="horror";document.getElementById("app").innerHTML='<div class="card"><div class="question-number">第 11 題 / 共 11 題</div><div class="question" style="text-align:center">你喜歡我嗎？</div><button class="start-btn" onclick="answer11()">喜歡</button></div>'}
function answer11(){document.getElementById("app").innerHTML='<div class="card"><div class="dialogue"><div id="typing" class="dialogue-text"></div></div></div>';type("我也喜歡你。",result)}
function result(){document.body.className="horror";let c=[0,0,0,0];ans.forEach(x=>c[x]++);let i=c.indexOf(Math.max(...c));let t=["信任空間型","溝通確認型","敏感觀察型","穩定陪伴型"][i];document.getElementById("app").innerHTML='<div class="card"><h1>測驗完成</h1><div class="description"><p style="text-align:center;font-size:22px;color:#c39a92">'+t+'</p><p style="text-align:center">還有 5 項補充問題需要確認。</p></div><button class="start-btn" onclick="supp1()">繼續</button></div>'}
function supp1(){document.body.className="horror";render("你現在一個人嗎?",["是","不是","不確定","不想回答"],"補充問題 1 / 5",()=>{setTimeout(supp2,650)})}
function supp2(){render("你現在在哪?",loc,"補充問題 2 / 5",i=>{branch=i;setTimeout(showBranchIntro,650)})}
function showBranchIntro(){let a=["你說你在家……\n那你現在離門很近吧？","還在學校？\n那你身邊現在有人嗎？","在外面啊……\n你確定知道自己現在在哪裡嗎？","不想告訴我？\n沒關係，反正我知道。"][branch];document.getElementById("app").innerHTML='<div class="card"><div class="dialogue"><div id="typing" class="dialogue-text"></div></div></div>';type(a,()=>setTimeout(branchQ1,1200))}
function branchQ1(){let q=[["如果現在門外有人敲門，你會先做什麼？",["看看是誰。","先不出聲。","問「誰？」","離門遠一點。"]],["如果放學後有人一直站在校門附近看著你，你會？",["先離開。","找同學一起走。","觀察一下。","找大人幫忙。"]],["如果你走在外面，身後突然傳來三下敲擊聲，你會？",["回頭看看。","繼續走。","找人多的地方。","停下來聽。"]],["如果我不問你在哪，卻說出了你附近的一個地方，你會？",["覺得是巧合。","開始覺得奇怪。","停止測驗。","問我怎麼知道。"]]][branch];render(q[0],q[1],"補充問題 3 / 5",()=>setTimeout(branchQ2,900))}
function branchQ2(){let q=[["如果門外的人知道你的名字，你會？",["覺得奇怪。","繼續不出聲。","問他怎麼知道。","離開門邊。"]],["如果那個人叫出了你的名字，你會？",["不理他。","問他是誰。","立刻離開。","找人陪我。"]],["如果那個聲音跟著你一起移動，你會？",["加快腳步。","找安全的地方。","確認是不是巧合。","找人陪我。"]],["如果下一句話剛好提到你正在看的東西，你會？",["覺得不可能。","繼續看。","停止測驗。","問我是不是在看你。"]]][branch];render(q[0],q[1],"補充問題 4 / 5",()=>setTimeout(branchQ3,900))}
function branchQ3(){let q=[["如果他說自己只是來找你，你會相信嗎？",["可能會。","不會。","不知道。","我不想回答。"]],["如果手機收到「我看到你了。」你會？",["確認是誰。","不回覆。","把手機收起來。","找身邊的人。"]],["如果手機突然跳出「別回頭。」你會？",["不回頭。","確認訊息來源。","找附近的人。","離開那裡。"]],["如果我說「不用告訴我了」，你會？",["鬆一口氣。","更想知道我怎麼知道。","直接離開。","不再回答。"]]][branch];render(q[0],q[1],"補充問題 5 / 5",()=>setTimeout(doorStart,1000))}
function doorStart(){document.getElementById("app").innerHTML='<div class="card"><div class="dialogue"><div id="typing" class="dialogue-text"></div><div id="opts" class="dialogue-options"></div></div></div>';type("你剛才有聽見嗎？",()=>{let o=[["有",()=>door("有")],["沒有",()=>door("沒有")],["不確定",()=>door("不確定")]];o.forEach(x=>{let b=document.createElement("button");b.className="option";b.textContent=x[0];b.onclick=x[1];document.getElementById("opts").appendChild(b)})})}
function door(a){setTimeout(()=>knock(.75),300);let t=a==="有"?"嗯……我也聽到了。":a==="沒有"?"你沒有聽見？\n那再一次。":"不確定也沒關係。\n再聽一次。";setTimeout(()=>showDoor2(t),900)}
function showDoor2(t){document.getElementById("app").innerHTML='<div class="card"><div class="dialogue"><div id="typing" class="dialogue-text"></div></div></div>';type(t,()=>setTimeout(()=>{knock(.8);setTimeout(doorChoice,900)},600))}
function doorChoice(){document.getElementById("app").innerHTML='<div class="card"><div class="dialogue"><div id="typing" class="dialogue-text"></div><div id="opts" class="dialogue-options"></div></div></div>';type("我就在門外。\n你不用開門。\n我只是想跟你說幾句話。",()=>{["我會回答你。","你是誰？","離開。"].forEach(x=>{let b=document.createElement("button");b.className="option";b.textContent=x;b.onclick=()=>finalQ();document.getElementById("opts").appendChild(b)})})}
function finalQ(){document.getElementById("app").innerHTML='<div class="card"><div class="dialogue"><div id="typing" class="dialogue-text"></div><div id="opts" class="dialogue-options"></div></div></div>';type("最後一個問題。\n如果我現在敲門，你會開門嗎？",()=>{["會。","不會。","我不知道。","不要再問了。"].forEach(x=>{let b=document.createElement("button");b.className="option";b.textContent=x;b.onclick=()=>endTalk();document.getElementById("opts").appendChild(b)})})}
function endTalk(){document.getElementById("app").innerHTML='<div class="card"><div class="dialogue"><div id="typing" class="dialogue-text"></div></div></div>';type("……好。",()=>setTimeout(()=>{document.getElementById("app").innerHTML='<div class="card"><div class="dialogue"><div id="typing" class="dialogue-text"></div></div></div>';type("以後見。",()=>setTimeout(finale,1000))},700))}
function finale(){document.getElementById("app").innerHTML='<div class="card"><div class="dialogue"><div class="dialogue-text">……</div></div></div>';knock(.85);setTimeout(()=>knock(.9),800);setTimeout(()=>knock(.95),1600);setTimeout(()=>{document.getElementById("three").style.display="flex";timer=setTimeout(finishThree,3000)},2400)}
function threeAnswer(i){clearTimeout(timer);document.getElementById("three").style.display="none";whisper(["你選得很快。","你真的不想回頭嗎？","嗯……什麼都沒有。","那就別回頭。"][i]);setTimeout(fakeEnd,900)}
function finishThree(){document.getElementById("three").style.display="none";whisper("時間到了。");setTimeout(fakeEnd,900)}
function fakeEnd(){document.body.className="horror";document.getElementById("app").innerHTML='<div class="card"><h1>測驗結束</h1><div class="description" style="text-align:center"><p>所有問題均已完成。</p><p>感謝你的參與。</p></div></div>';setTimeout(()=>{noise();setTimeout(shake,400);setTimeout(noise,800);setTimeout(home,1500)},1700)}
home();
</script>
</body>
</html>
