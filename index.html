<!DOCTYPE html>
<html lang="zh-TW">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>親密關係傾向測驗</title>

<style>

*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    min-height:100%;
}

body{

    min-height:100vh;

    font-family:
        "Noto Sans TC",
        "Microsoft JhengHei",
        sans-serif;

    background:#f2efed;

    color:#403b39;

    transition:
        background 3s ease,
        color 3s ease;

    overflow-x:hidden;
}


/* =========================
   主畫面
========================= */

#app{

    min-height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    padding:25px;

    transition:transform .15s;
}


.card{

    width:680px;

    max-width:94vw;

    padding:42px;

    background:
        rgba(255,255,255,.97);

    border:
        1px solid #ddd7d3;

    box-shadow:
        0 15px 45px
        rgba(50,35,30,.08);

    transition:
        background 3s,
        border 3s,
        box-shadow 3s;
}


h1{

    margin:0 0 8px;

    text-align:center;

    font-size:27px;

    font-weight:400;

    letter-spacing:3px;
}


.subtitle{

    text-align:center;

    color:#aaa19d;

    font-size:12px;

    letter-spacing:1px;

    margin-bottom:34px;
}


.description{

    color:#696360;

    font-size:15px;

    line-height:2;
}


.start-btn{

    display:block;

    margin:34px auto 0;

    padding:12px 42px;

    background:#fff;

    color:#514a47;

    border:
        1px solid #aaa29d;

    cursor:pointer;

    font-family:inherit;

    transition:.25s;
}


.start-btn:hover{

    background:#eee8e4;

    border-color:#866b63;
}


/* =========================
   題目
========================= */

.question-number{

    color:#aaa19d;

    font-size:12px;

    margin-bottom:23px;

    letter-spacing:1px;
}


.question{

    font-size:20px;

    line-height:1.8;

    margin-bottom:25px;
}


.options{

    display:flex;

    flex-direction:column;

    gap:9px;
}


.option{

    width:100%;

    padding:14px 16px;

    text-align:left;

    background:#fff;

    color:#403b39;

    border:
        1px solid #d8d2cf;

    cursor:pointer;

    font-family:inherit;

    transition:
        background .2s,
        border .2s,
        opacity .35s,
        transform .15s;
}


.option:hover{

    background:#f5efec;

    border-color:#a98b82;
}


.option:active{

    transform:scale(.995);
}


.option.selected{

    background:#eee6e2;

    border-color:#97736a;
}


.option:disabled{

    cursor:default;
}


.option.fade{

    opacity:0;

    pointer-events:none;
}


.feedback{

    min-height:26px;

    margin-top:18px;

    color:#8d8581;

    font-size:13px;

    line-height:1.7;
}


.progress{

    height:2px;

    margin-top:28px;

    background:#e6dfdc;
}


.progress-bar{

    height:100%;

    background:#99786f;

    transition:width .45s;
}


/* =========================
   前段偶發異常
========================= */

#noise{

    position:fixed;

    inset:0;

    z-index:9999;

    pointer-events:none;

    opacity:0;

    background:

        repeating-linear-gradient(
            0deg,
            rgba(255,255,255,.14) 0px,
            rgba(255,255,255,.14) 1px,
            rgba(0,0,0,.16) 1px,
            rgba(0,0,0,.16) 3px
        );

    mix-blend-mode:screen;
}


#noise.active{

    animation:
        staticBurst .75s steps(7);
}


@keyframes staticBurst{

    0%{
        opacity:0;
    }

    20%{
        opacity:.32;
    }

    35%{
        opacity:.08;
    }

    55%{
        opacity:.27;
    }

    75%{
        opacity:.05;
    }

    100%{
        opacity:0;
    }
}


/* =========================
   輕微晃動
========================= */

body.shake #app{

    animation:
        screenShake .55s;
}


@keyframes screenShake{

    0%{
        transform:translate(0,0);
    }

    20%{
        transform:translate(-2px,1px);
    }

    40%{
        transform:translate(2px,-1px);
    }

    60%{
        transform:translate(-1px,1px);
    }

    80%{
        transform:translate(1px,-1px);
    }

    100%{
        transform:translate(0,0);
    }
}


/* =========================
   暗紅模式
========================= */

body.red{

    background:

        radial-gradient(
            circle at 50% 40%,
            #482725,
            #251413 68%,
            #0d0707
        );

    color:#ddd0cc;
}


body.red .card{

    background:
        rgba(27,14,14,.96);

    border-color:#63413c;

    box-shadow:
        0 25px 90px
        rgba(0,0,0,.6);
}


body.red h1,
body.red .question{

    color:#dcc9c4;
}


body.red .question-number{

    color:#98716b;
}


body.red .option{

    background:#251514;

    color:#d5c4c0;

    border-color:#62403b;
}


body.red .option:hover{

    background:#38201e;
}


body.red .feedback{

    color:#a98a84;
}


/* =========================
   小字異常
========================= */

#whisper{

    position:fixed;

    left:50%;

    bottom:10%;

    transform:
        translateX(-50%);

    z-index:100;

    color:#79433c;

    font-size:12px;

    letter-spacing:3px;

    opacity:0;

    pointer-events:none;
}


#whisper.show{

    animation:
        whisperAppear 3.8s forwards;
}


@keyframes whisperAppear{

    0%{
        opacity:0;
    }

    20%{
        opacity:.62;
    }

    45%{
        opacity:.12;
    }

    65%{
        opacity:.48;
    }

    100%{
        opacity:0;
    }
}


/* =========================
   3 秒問題
========================= */

#threeSecondQuestion{

    position:fixed;

    inset:0;

    z-index:5000;

    display:flex;

    justify-content:center;

    align-items:center;

    background:
        rgba(8,5,5,.94);

    opacity:0;

    pointer-events:none;

    transition:opacity .35s;
}


#threeSecondQuestion.show{

    opacity:1;

    pointer-events:auto;
}


.three-box{

    width:650px;

    max-width:90vw;

    text-align:center;

    color:#e0cfca;
}


.three-small{

    font-size:11px;

    letter-spacing:4px;

    color:#92736e;

    margin-bottom:28px;
}


.three-title{

    font-size:22px;

    line-height:2;

    margin-bottom:28px;
}


.three-option{

    display:block;

    width:100%;

    max-width:420px;

    margin:8px auto;

    padding:12px;

    color:#cdbab5;

    background:
        rgba(50,25,23,.65);

    border:
        1px solid #67413c;

    font-family:inherit;

    cursor:pointer;
}


.three-timer{

    width:100%;

    max-width:420px;

    height:2px;

    margin:25px auto 0;

    background:#3c2826;
}


.three-timer-bar{

    width:100%;

    height:100%;

    background:#95635c;

    animation:
        threeTimer 3s linear forwards;
}


@keyframes threeTimer{

    from{
        width:100%;
    }

    to{
        width:0%;
    }
}


/* =========================
   正常恢復
========================= */

body.normal-again{

    background:#f2efed;

    color:#403b39;
}


body.normal-again .card{

    background:
        rgba(255,255,255,.97);

    border-color:#ddd7d3;

    box-shadow:
        0 15px 45px
        rgba(50,35,30,.07);
}


/* =========================
   手機
========================= */

@media(max-width:600px){

    #app{
        padding:14px;
    }

    .card{
        padding:27px 22px;
    }

    .question{
        font-size:18px;
    }

    h1{
        font-size:23px;
    }
}

</style>

</head>


<body>


<div id="noise"></div>

<div id="whisper"></div>


<!-- 3 秒問題 -->

<div id="threeSecondQuestion">

    <div class="three-box">

        <div class="three-small">
            請立即回答
        </div>

        <div class="three-title">

            如果你現在回頭，<br>

            你覺得房間裡會多出什麼？

        </div>

        <button
            class="three-option"
            onclick="threeAnswer()"
        >
            一個人
        </button>

        <button
            class="three-option"
            onclick="threeAnswer()"
        >
            一個影子
        </button>

        <button
            class="three-option"
            onclick="threeAnswer()"
        >
            什麼都沒有
        </button>

        <button
            class="three-option"
            onclick="threeAnswer()"
        >
            我不想回頭看
        </button>

        <div class="three-timer">

            <div class="three-timer-bar"></div>

        </div>

    </div>

</div>


<div id="app"></div>


<script>


/* =====================================================
   前 15 題
   全部保持正常心理測驗
===================================================== */

const normalQuestions = [

{
q:"當你情緒低落時，你最希望喜歡的人怎麼做？",
a:[
"陪我聊聊天。",
"先給我一點空間。",
"直接問我發生了什麼。",
"陪在旁邊，不一定要說話。"
]
},

{
q:"你認為戀人之間需要知道彼此每天的行程嗎？",
a:[
"不用，彼此都有自己的生活。",
"大概知道就好。",
"如果對方願意，我會想知道。",
"重要的事情可以互相說。"
]
},

{
q:"如果對方一整天沒有主動找你，你會？",
a:[
"做自己的事情。",
"晚一點再傳訊息。",
"有點想知道他在忙什麼。",
"如果和平常差很多，會問問。"
]
},

{
q:"如果對方說今天想一個人，你會？",
a:[
"尊重他的決定。",
"告訴他需要時可以找我。",
"有點失落，但還是會給空間。",
"等他自己願意說。"
]
},

{
q:"如果你傳了一則訊息，對方兩個小時都沒有回，你會？",
a:[
"沒關係，他可能在忙。",
"偶爾看一下手機。",
"有點期待通知。",
"如果很反常，會稍微擔心。"
]
},

{
q:"你覺得戀人應該知道彼此的手機密碼嗎？",
a:[
"不用。",
"知道也沒關係，但不需要查看。",
"如果彼此願意可以交換。",
"我比較重視信任，而不是密碼。"
]
},

{
q:"如果對方突然取消原本約好的見面，你會？",
a:[
"沒關係，下次再約。",
"問問是不是發生了什麼。",
"會有一點失望。",
"看取消的理由。"
]
},

{
q:"如果你發現對方已讀了訊息，卻沒有回覆，你會？",
a:[
"等他有時間再回。",
"過一陣子再看看。",
"會稍微想一下是不是說錯了什麼。",
"如果一直沒有回，會再問一次。"
]
},

{
q:"平常很快回你的人，突然六個小時沒有回覆，你會？",
a:[
"他可能真的很忙。",
"等明天再看看。",
"會覺得有一點奇怪。",
"會傳一句「還好嗎？」"
]
},

{
q:"你知道對方的手機還有電，但訊息一直沒有回覆，你會？",
a:[
"那也可能只是沒看。",
"應該有自己的事情。",
"會有點疑惑。",
"會想知道他是不是故意不回。"
]
},

{
q:"如果你在晚上 11:47 傳了一句「晚安」，一直沒有收到回覆，你會？",
a:[
"他應該睡了。",
"明天再說。",
"可能會再看一次手機。",
"希望至少知道他沒事。"
]
},

{
q:"隔天你發現，對方凌晨 2:13 曾經在線上，你會？",
a:[
"可能只是短暫上線。",
"不會特別在意。",
"會覺得有一點奇怪。",
"會想問他昨天為什麼那麼晚還醒著。"
]
},

{
q:"如果對方臨時改變原本的計畫，你通常會？",
a:[
"配合看看。",
"先問原因。",
"會有一點失望。",
"希望下次可以早點說。"
]
},

{
q:"你認為一段健康的關係最重要的是什麼？",
a:[
"信任。",
"溝通。",
"陪伴。",
"彼此尊重。"
]
},

{
q:"如果你和喜歡的人意見不同，你通常會？",
a:[
"先聽對方怎麼想。",
"一起找一個折衷的方法。",
"表達自己的想法。",
"等情緒平穩後再討論。"
]
}

];


/* =====================================================
   後 5 題
===================================================== */

const supplementQuestions = [

{
q:"如果你的伴侶希望知道你每天去了哪裡，你會覺得？",
a:[
"這很正常，偶爾分享就好。",
"可以說，但不需要事事交代。",
"如果對方一直追問，我會有點不舒服。",
"我會希望彼此保有自己的空間。"
]
},

{
q:"如果你沒有及時回覆訊息，對方一直問你去了哪裡，你會？",
a:[
"解釋自己剛才在做什麼。",
"告訴對方自己現在有事情。",
"覺得有點煩，但還是會回答。",
"希望對方理解我不可能隨時在線。"
]
},

{
q:"如果對方說：「我只是想知道你現在在哪裡。」你會怎麼想？",
a:[
"他可能只是擔心我。",
"我會直接告訴他。",
"要看他用什麼方式問。",
"如果這變成習慣，我會覺得不舒服。"
]
},

{
q:"如果你發現對方總能很快知道你今天去了哪些地方，你會？",
a:[
"覺得只是剛好。",
"問問他怎麼知道的。",
"開始注意這件事。",
"覺得有點不舒服。"
]
},

{
q:"如果你正在做這份測驗，而你最在乎的人突然問你：「你現在一個人嗎？」",
a:[
"是。",
"不是。",
"我不知道。",
"……為什麼問這個？"
]
}

];


/* =====================================================
   狀態
===================================================== */

let phase="normal";

let current=0;

let answers=[];

let audioCtx=null;

let threeUsed=false;


/* =====================================================
   音效
===================================================== */

function initAudio(){

    if(!audioCtx){

        audioCtx =
            new(
                window.AudioContext ||
                window.webkitAudioContext
            )();

    }

    if(audioCtx.state==="suspended"){

        audioCtx.resume();

    }
}


function tone(
    freq,
    duration,
    volume,
    type="sine"
){

    if(!audioCtx)return;

    const osc =
        audioCtx.createOscillator();

    const gain =
        audioCtx.createGain();

    osc.type=type;

    osc.frequency.value=freq;

    gain.gain.setValueAtTime(
        .001,
        audioCtx.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        volume,
        audioCtx.currentTime+.03
    );

    gain.gain.exponentialRampToValueAtTime(
        .001,
        audioCtx.currentTime+duration
    );

    osc.connect(gain);

    gain.connect(audioCtx.destination);

    osc.start();

    osc.stop(
        audioCtx.currentTime+
        duration+
        .04
    );
}


/* 輕微電子雜訊 */

function staticSound(
    strength=.025,
    duration=.18
){

    if(!audioCtx)return;

    const buffer =
        audioCtx.createBuffer(
            1,
            audioCtx.sampleRate*duration,
            audioCtx.sampleRate
        );

    const data =
        buffer.getChannelData(0);

    for(
        let i=0;
        i<data.length;
        i++
    ){

        data[i]=
            (Math.random()*2-1)
            *strength;

    }

    const source =
        audioCtx.createBufferSource();

    const gain =
        audioCtx.createGain();

    gain.gain.value=.65;

    source.buffer=buffer;

    source.connect(gain);

    gain.connect(
        audioCtx.destination
    );

    source.start();
}


/* 低頻 */

function lowHum(){

    if(!audioCtx)return;

    const osc =
        audioCtx.createOscillator();

    const gain =
        audioCtx.createGain();

    osc.type="sine";

    osc.frequency.value=47;

    gain.gain.value=.0001;

    gain.gain.exponentialRampToValueAtTime(
        .022,
        audioCtx.currentTime+.6
    );

    gain.gain.exponentialRampToValueAtTime(
        .0001,
        audioCtx.currentTime+2
    );

    osc.connect(gain);

    gain.connect(
        audioCtx.destination
    );

    osc.start();

    osc.stop(
        audioCtx.currentTime+2.1
    );
}


/* 敲門 */

function knock(volume=.2){

    tone(
        78,
        .18,
        volume,
        "sine"
    );

    setTimeout(
        ()=>{
            tone(
                61,
                .12,
                volume*.32,
                "sine"
            );
        },
        70
    );
}


/* =====================================================
   視覺
===================================================== */

function noiseFlash(){

    const noise =
        document.getElementById("noise");

    noise.classList.remove("active");

    void noise.offsetWidth;

    noise.classList.add("active");

    staticSound(.04,.4);

    setTimeout(
        ()=>{
            noise.classList.remove("active");
        },
        800
    );
}


function shake(){

    document.body.classList.remove("shake");

    void document.body.offsetWidth;

    document.body.classList.add("shake");

    setTimeout(
        ()=>{
            document.body.classList.remove("shake");
        },
        600
    );
}


function whisper(text){

    const w =
        document.getElementById("whisper");

    w.textContent=text;

    w.classList.remove("show");

    void w.offsetWidth;

    w.classList.add("show");
}


/* =====================================================
   首頁
===================================================== */

function home(){

    document.getElementById("app").innerHTML=`

    <div class="card">

        <h1>
        親密關係傾向測驗
        </h1>

        <div class="subtitle">
        RELATIONSHIP & ATTACHMENT TEST
        </div>

        <div class="description">

            <p>
            歡迎參與本次匿名情感傾向測驗。
            </p>

            <p>
            以下問題沒有標準答案，
            請依照第一直覺回答。
            </p>

            <p>
            測驗約需 3～5 分鐘。
            </p>

            <p style="
                font-size:12px;
                color:#aaa;
                margin-top:24px;
            ">
            本測驗僅供娛樂使用，
            不代表正式心理評估。
            </p>

        </div>

        <button
            class="start-btn"
            onclick="startTest()"
        >
            開始測驗
        </button>

    </div>

    `;
}


home();


/* =====================================================
   開始正式測驗
===================================================== */

function startTest(){

    initAudio();

    phase="normal";

    current=0;

    answers=[];

    threeUsed=false;

    document.body.className="";

    showQuestion();
}


/* =====================================================
   題目
===================================================== */

function showQuestion(){

    const list =
        phase==="normal"
        ? normalQuestions
        : supplementQuestions;

    if(current>=list.length){

        if(phase==="normal"){

            showNormalResult();

        }else{

            finalEnding();

        }

        return;
    }


    const q=list[current];


    const total=list.length;


    const percent=
        current/
        total*
        100;


    document.getElementById("app").innerHTML=`

    <div class="card">

        <div class="question-number">

            ${phase==="normal"
                ? "第 "+(current+1)+" 題 / 共 15 題"
                : "補充問題 "+(current+1)+" / 5"}

        </div>

        <div class="question">

            ${q.q}

        </div>

        <div
            class="options"
            id="options"
        ></div>

        <div
            class="feedback"
            id="feedback"
        ></div>

        <div class="progress">

            <div
                class="progress-bar"
                style="width:${percent}%"
            ></div>

        </div>

    </div>

    `;


    const box=
        document.getElementById(
            "options"
        );


    q.a.forEach(
        (text,index)=>{

            const button=
                document.createElement(
                    "button"
                );

            button.className="option";

            button.textContent=
                String.fromCharCode(65+index)
                +". "
                +text;

            button.onclick=
                ()=>{
                    choose(index);
                };

            box.appendChild(button);

        }
    );
}


/* =====================================================
   回答
===================================================== */

function choose(index){

    answers.push(index);


    const buttons=
        document.querySelectorAll(
            ".option"
        );


    buttons.forEach(
        b=>{
            b.disabled=true;
        }
    );


    buttons[index]
        .classList
        .add("selected");


    buttons.forEach(
        (b,i)=>{

            if(i!==index){

                setTimeout(
                    ()=>{
                        b.classList.add("fade");
                    },
                    100
                );

            }

        }
    );


    /* =========================
       正常測驗
    ========================= */

    if(phase==="normal"){

        /*
           前 15 題完全正常，
           只有少數題出現網站異常。
        */

        if(
            current===2 ||
            current===5 ||
            current===8 ||
            current===13
        ){

            setTimeout(
                ()=>{
                    noiseFlash();
                },
                350
            );

        }


        /*
           第 9 題：
           很短的低頻。
        */

        if(current===8){

            setTimeout(
                ()=>{
                    lowHum();
                },
                500
            );

        }


        /*
           第 15 題結束後
        */

        current++;

        setTimeout(
            ()=>{
                showQuestion();
            },
            550
        );

        return;
    }


    /* =========================
       補充問題
    ========================= */

    if(phase==="supplement"){

        /* 第一題 */

        if(current===0){

            setTimeout(
                ()=>{
                    knock(.13);
                },
                850
            );

        }


        /* 第二題 */

        if(current===1){

            setTimeout(
                ()=>{
                    whisper(
                        "已經知道了。"
                    );
                },
                900
            );

            setTimeout(
                ()=>{
                    knock(.17);
                },
                2300
            );

            setTimeout(
                ()=>{
                    knock(.17);
                },
                2450
            );

        }


        /* 第三題 */

        if(current===2){

            setTimeout(
                ()=>{
                    whisper(
                        "你不用回答得這麼仔細。"
                    );
                },
                750
            );

        }


        /* 第四題 */

        if(current===3){

            setTimeout(
                ()=>{
                    whisper(
                        "正在確認……"
                    );
                },
                600
            );

            setTimeout(
                ()=>{
                    knock(.23);
                },
                1900
            );

            setTimeout(
                ()=>{
                    knock(.23);
                },
                3300
            );

            setTimeout(
                ()=>{
                    knock(.23);
                },
                4700
            );

        }


        /* 第五題 */

        if(current===4){

            setTimeout(
                ()=>{
                    whisper(
                        "好的。"
                    );
                },
                600
            );

            setTimeout(
                ()=>{
                    whisper(
                        "那就繼續吧。"
                    );
                },
                2400
            );

        }


        current++;


        setTimeout(
            ()=>{
                showQuestion();
            },
            750
        );

    }

}
