<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>親密關係傾向測驗｜V25 整合版</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{min-height:100vh;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;background:#f1eeeb;color:#45403d;transition:background 2.5s ease,color 2.5s ease;overflow-x:hidden}
body.horror{background:radial-gradient(circle at 50% 40%,#4b2927 0%,#291514 50%,#090505 100%);color:#ddd0cc}
#app{min-height:100vh;display:flex;justify-content:center;align-items:center;padding:25px}
.card{width:680px;max-width:94vw;padding:42px;background:rgba(255,255,255,.97);border:1px solid #ddd7d3;box-shadow:0 15px 50px rgba(45,30,25,.08);transition:.8s}
body.horror .card{background:rgba(27,14,14,.95);border-color:#67433e;box-shadow:0 25px 90px rgba(0,0,0,.65)}
h1{margin:0 0 9px;text-align:center;font-size:27px;font-weight:400;letter-spacing:4px}
.subtitle{text-align:center;color:#aaa19d;font-size:11px;letter-spacing:2px;margin-bottom:34px}
.question-number{color:#aaa19d;font-size:12px;letter-spacing:1px;margin-bottom:22px}
.question{font-size:20px;line-height:1.8;margin-bottom:25px}
.description{font-size:15px;line-height:2;color:#696360}
body.horror h1,body.horror .question{color:#dfccc7}
body.horror .description{color:#bca9a4}
.start-btn{display:block;margin:34px auto 0;padding:12px 42px;background:#fff;color:#514a47;border:1px solid #aaa29d;cursor:pointer;font:inherit}
body.horror .start-btn{background:#241413;color:#d6c4bf;border-color:#68423d}
.options{display:flex;flex-direction:column;gap:9px}
.option{width:100%;padding:14px 16px;text-align:left;background:#fff;color:#403b39;border:1px solid #d8d2cf;cursor:pointer;font:inherit;transition:.25s}
.option:hover{background:#f5efec;border-color:#a98b82}
.option.selected{background:#eee5e1;border-color:#927067}
body.horror .option{background:#241413;color:#d6c4bf;border-color:#62413c}
body.horror .option:hover{background:#38201e}
.feedback{min-height:28px;margin-top:18px;font-size:13px;line-height:1.8;color:#8c8581}
body.horror .feedback{color:#aa8b85}
.she-reply{min-height:28px;margin-top:7px;font-size:13px;line-height:1.8;color:#8b5d55;opacity:0;transition:opacity .5s}
.she-reply.show{opacity:1}
.progress{height:2px;margin-top:28px;background:#e6dfdc}
.progress-bar{height:100%;background:#99786f;transition:width .5s ease}
body.horror .progress{background:#3c2422}
body.horror .progress-bar{background:#985a52}
#noise{position:fixed;inset:0;z-index:9999;pointer-events:none;opacity:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.15) 0 1px,rgba(0,0,0,.18) 1px 3px);mix-blend-mode:screen}
#noise.active{animation:staticBurst .7s steps(7)}
@keyframes staticBurst{0%{opacity:0}15%{opacity:.3}30%{opacity:.05}47%{opacity:.24}68%{opacity:.08}100%{opacity:0}}
#dark{position:fixed;inset:0;z-index:3000;pointer-events:none;opacity:0;background:radial-gradient(circle,rgba(95,30,25,.02),rgba(8,3,3,.94));transition:opacity 5s}
#dark.active{opacity:.58}
#whisper{position:fixed;left:50%;bottom:11%;transform:translateX(-50%);z-index:4000;color:#884a43;font-size:12px;letter-spacing:3px;opacity:0;pointer-events:none;white-space:nowrap}
#whisper.show{animation:whisper 4s forwards}
@keyframes whisper{0%{opacity:0}20%{opacity:.65}40%{opacity:.13}65%{opacity:.48}100%{opacity:0}}
#timer{position:fixed;inset:0;z-index:6000;display:flex;justify-content:center;align-items:center;background:rgba(5,3,3,.96);opacity:0;pointer-events:none;transition:.18s}
#timer.show{opacity:1;pointer-events:auto}
.timer-box{width:650px;max-width:90vw;text-align:center;color:#ddcbc6}
.timer-label{font-size:10px;letter-spacing:5px;color:#906d67;margin-bottom:28px}
.timer-title{font-size:21px;line-height:2;margin-bottom:24px}
.timer-option{display:block;width:100%;max-width:430px;margin:8px auto;padding:12px;background:rgba(49,24,22,.72);color:#d1bdb8;border:1px solid #68413c;font:inherit;cursor:pointer}
.track{width:100%;max-width:430px;height:2px;margin:25px auto 0;background:#382321}
.bar{width:100%;height:100%;background:#985b53}
.bar.two{animation:two 2s linear forwards}
@keyframes two{from{width:100%}to{width:0}}
.dialogue{text-align:center;min-height:230px;display:flex;flex-direction:column;justify-content:center}
.dialogue-text{min-height:90px;font-size:19px;line-height:2;color:#d8c5c0;white-space:pre-line}
.dialogue-options{margin-top:22px;display:flex;flex-direction:column;gap:8px}
.note{text-align:center;color:#9a756e;font-size:11px;line-height:1.9;margin-top:20px}
@media(max-width:600px){#app{padding:14px}.card{padding:27px 21px}h1{font-size:22px}.question{font-size:18px}.dialogue-text{font-size:17px}}
</style>
</head>
<body>
<div id="noise"></div><div id="dark"></div><div id="whisper"></div>
<div id="timer"><div class="timer-box"><div class="timer-label">請立即回答</div><div class="timer-title" id="timerTitle"></div><div id="timerOptions"></div><div class="track"><div class="bar" id="timerBar"></div></div></div></div>
<div id="app"></div>

<script>
const normalQuestions=[
["當你情緒低落時，你最希望喜歡的人怎麼做？",["陪我聊聊天。","先給我一點空間。","直接問我發生了什麼。","陪在旁邊，不一定要說話。"]],
["你認為戀人之間需要知道彼此每天的行程嗎？",["不用，彼此都有自己的生活。","大概知道就好。","如果對方願意，我會想知道。","重要的事情可以互相說。"]],
["如果對方一整天沒有主動找你，你會？",["做自己的事情。","晚一點再傳訊息。","有點想知道他在忙什麼。","如果和平常差很多，會問問。"]],
["如果對方說今天想一個人，你會？",["尊重他的決定。","告訴他需要時可以找我。","有點失落，但還是會給空間。","等他自己願意說。"]],
["如果你傳了一則訊息，對方兩個小時都沒有回，你會？",["沒關係，他可能在忙。","偶爾看一下手機。","有點期待通知。","如果很反常，會稍微擔心。"]],
["你覺得戀人應該知道彼此的手機密碼嗎？",["不用。","知道也沒關係，但不需要查看。","如果彼此願意可以交換。","我比較重視信任，而不是密碼。"]],
["如果對方突然取消原本約好的見面，你會？",["沒關係，下次再約。","問問是不是發生了什麼。","會有一點失望。","看取消的理由。"]],
["如果你發現對方已讀了訊息，卻沒有回覆，你會？",["等他有時間再回。","過一陣子再看看。","會稍微想一下是不是說錯了什麼。","如果一直沒有回，會再問一次。"]],
["平常很快回你的人，突然六個小時沒有回覆，你會？",["他可能真的很忙。","等明天再看看。","會覺得有一點奇怪。","會傳一句「還好嗎？」"]],
["你認為一段健康的關係最重要的是什麼？",["信任。","溝通。","陪伴。","彼此尊重。"]]
];
const feedback=[
["你似乎比較重視陪伴，而不是立即得到答案。","你會給對方空間。","你希望對方直接理解你的情緒。","你在意有人安靜地陪著你。"],
["你重視自己的生活界線。","你願意分享，但不希望被要求交代。","你對彼此的生活有一定程度的好奇。","你傾向把重要的事情說清楚。"],
["你不太容易被單次的沉默影響。","你會先觀察，再決定要不要聯絡。","你會注意對方的動向。","異常的改變會讓你想確認對方是否安好。"],
["你願意尊重對方的獨處時間。","你會留下聯絡的可能。","你雖然失落，但仍會給空間。","你比較傾向等對方主動。"],
["你會把沒有回覆理解成可能的忙碌。","你會留意手機，但不一定會追問。","你會期待通知。","你會根據平常的習慣判斷是否異常。"],
["你把信任和界線分得很清楚。","你接受透明，但不認為查看是必要的。","你願意在雙方同意下分享。","你更看重互相信任。"],
["你能接受計畫改變。","你會先確認原因。","你會感到失望，但不一定追究。","你會依照情況判斷。"],
["你傾向給對方時間。","你會再觀察。","你可能會反思自己是不是說了什麼。","你會希望得到一個明確回覆。"],
["你會先相信對方可能正在忙。","你願意等待。","你會注意和平常不同的地方。","你會主動確認狀況。"],
["你把關係建立在多個因素上，而不是單一答案。","你很重視說清楚。","你在意彼此的陪伴。","你重視界線與尊重。"]
];

const s1={
q:"你喜歡我嘛",
a:["喜歡","不喜歡","不知道","討厭"],
r:[
"我也喜歡你。",
"不喜歡......你怎麼可以這樣，我會再問你的，希望下次會是我滿意的答案。",
"不知道......為什麼?沒關係，我喜歡你也可以。",
"討厭，真狠啊。沒事，我喜歡你。"
]};
const s2={
q:"你現在是一個人嗎?",
a:["是","不是","為什麼這樣問?","......"],
r:[
"那你要注意安全喔。",
"告訴我，還有誰在你身邊。",
"因為我想更了解你。",
"不想回答我嗎?"
]};
const s3={q:"你現在在哪?",a:["在家","在學校","在外面","......"],
r:["嗯，你家真好看，支線4-1，你覺得我在哪裡呢?","嗯，我有看到你喔，支線4-2，你有看到我嗎?","好巧啊!我也在外面，支線4-3，猜猜我在哪?","不說嗎?那讓我來猜猜看，支線4-4，真不告訴我嗎?"]};

const branches={
1:{q:"你覺得我在哪裡呢?",a:["在自己家裡","在外面","不知道","......"],r:["真厲害，猜對一半囉~","好像也沒說錯。","真的嗎?不知道?確定嗎?","你在逃避嗎?其實你知道的對吧!"]},
2:{q:"你有看到我嗎?",a:["有","沒有","你是誰?","......"],r:["騙子，我好傷心啊，竟然騙我，你根本沒看到我，對吧?","怎麼會沒有呢?我就在這啊。","忘了我嗎?明明說過會記得我的。","你好冷漠啊TAT"]},
3:{q:"猜猜我在哪?",a:["在你家","在我身後?","在我看不到的地方?","……"],r:["猜對一半囉～","回頭看看呀。","是你不想看到我吧!T_T","不敢猜嗎？"]},
4:{q:"真不告訴我嗎?",a:["不知道","......","滾...","在你心裡"],r:["不想說就不說嘛，敷衍我幹嘛，真過分。","還是不說嗎?沒關係我會知道的。","真過分( ; _ ; )/~~~","............"]}
};

let n=0, answers=[], branchKey=null, audio=null, timer=null, locked=false;
const A=()=>{try{audio ||= new(window.AudioContext||window.webkitAudioContext)();if(audio.state==="suspended")audio.resume()}catch(e){}};
function tone(f,d=.1,v=.15){if(!audio)return;let o=audio.createOscillator(),g=audio.createGain();o.frequency.value=f;g.gain.setValueAtTime(.0001,audio.currentTime);g.gain.exponentialRampToValueAtTime(v,audio.currentTime+.015);g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+d);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+d+.03)}
function knock(v=.3){tone(82,.12,v);setTimeout(()=>tone(60,.09,v*.5),70)}
function staticFlash(){let x=document.getElementById("noise");x.classList.remove("active");void x.offsetWidth;x.classList.add("active");setTimeout(()=>x.classList.remove("active"),700)}
function horror(){document.body.classList.add("horror")}
function normal(){document.body.classList.remove("horror")}
function say(t){let x=document.getElementById("whisper");x.textContent=t;x.classList.remove("show");void x.offsetWidth;x.classList.add("show")}
function render(title,q,opts,cb,sub=""){
document.getElementById("app").innerHTML=`<div class="card"><div class="question-number">${title}</div><div class="question">${q}</div><div class="options" id="opts"></div><div class="feedback" id="fb"></div><div class="she-reply" id="rp"></div>${sub?`<div class="note">${sub}</div>`:""}</div>`;
let box=document.getElementById("opts");opts.forEach((t,i)=>{let b=document.createElement("button");b.className="option";b.textContent=String.fromCharCode(65+i)+". "+t;b.onclick=()=>cb(i,b);box.appendChild(b)});
}
function home(){normal();document.getElementById("app").innerHTML=`<div class="card"><h1>親密關係傾向測驗</h1><div class="subtitle">RELATIONSHIP & ATTACHMENT TEST</div><div class="description"><p>歡迎參與本次匿名情感傾向測驗。</p><p>以下問題沒有標準答案，請依照你的第一直覺回答。</p><p>測驗約需 3～5 分鐘。</p><p style="color:#aaa;font-size:12px;margin-top:28px;">本測驗僅供娛樂使用，不代表正式心理評估。</p></div><button class="start-btn" onclick="start()">開始測驗</button></div>`}
function start(){A();n=0;answers=[];showNormal()}
function showNormal(){if(n>=10){show11();return}let q=normalQuestions[n];render(`第 ${n+1} 題 / 共 10 題`,q[0],q[1],(i,b)=>{b.classList.add("selected");document.querySelectorAll(".option").forEach(x=>x.disabled=true);document.getElementById("fb").textContent=feedback[n][i];document.getElementById("rp").textContent="……知道了。";document.getElementById("rp").classList.add("show");answers[n]=i;setTimeout(()=>{n++;showNormal()},900)})}
function show11(){
horror();locked=false;document.getElementById("app").innerHTML=`<div class="card"><div class="question-number">第 11 題</div><div class="question" style="text-align:center;">如果我現在就在門外，你覺得我會做什麼？</div><div class="note">限時 2 秒</div></div>`;
setTimeout(open11,120)
}
function open11(){
if(locked)return;let L=document.getElementById("timer");document.getElementById("timerTitle").textContent="如果我現在就在門外，你覺得我會做什麼？";let box=document.getElementById("timerOptions");box.innerHTML="";
["敲門","等你開門","直接離開","不知道"].forEach((t,i)=>{let b=document.createElement("button");b.className="timer-option";b.textContent=String.fromCharCode(65+i)+"．"+t;b.onclick=()=>answer11(i);box.appendChild(b)});
let bar=document.getElementById("timerBar");bar.className="bar";void bar.offsetWidth;bar.classList.add("two");L.classList.add("show");timer=setTimeout(()=>answer11(null),2000)
}
function answer11(i){
if(locked)return;locked=true;clearTimeout(timer);document.getElementById("timer").classList.remove("show");
let text=i===null?"不想回我嗎?T^T":["猜對了","幫幫我嘛~","這麼討厭我T_T","真的不知道嗎?"][i];
document.getElementById("app").innerHTML="";if(i===0){knock(.35);setTimeout(knock,180);setTimeout(knock,360)}
setTimeout(()=>dialogue(text,()=>supp1()),700)
}
function dialogue(text,next,opts=[]){
horror();document.getElementById("app").innerHTML=`<div class="card"><div class="dialogue"><div class="dialogue-text">${text}</div><div class="dialogue-options" id="dopts"></div></div></div>`;
let box=document.getElementById("dopts");if(opts.length)opts.forEach(o=>{let b=document.createElement("button");b.className="option";b.textContent=o.t;b.onclick=o.a;box.appendChild(b)});else setTimeout(next,1100)
}
function supp1(){render("補充問題 1 / 5",s1.q,s1.a,(i,b)=>{b.classList.add("selected");document.querySelectorAll(".option").forEach(x=>x.disabled=true);document.getElementById("fb").textContent=s1.r[i];setTimeout(supp2,1000)})}
function supp2(){render("補充問題 2 / 5",s2.q,s2.a,(i,b)=>{b.classList.add("selected");document.querySelectorAll(".option").forEach(x=>x.disabled=true);document.getElementById("fb").textContent=s2.r[i];setTimeout(supp3,1000)})}
function supp3(){render("補充問題 3 / 5",s3.q,s3.a,(i,b)=>{b.classList.add("selected");document.querySelectorAll(".option").forEach(x=>x.disabled=true);document.getElementById("fb").textContent=s3.r[i];branchKey=i+1;setTimeout(()=>showBranch(branchKey),1000)})}
function showBranch(k){let q=branches[k];render("補充問題 4 / 5",q.q,q.a,(i,b)=>{b.classList.add("selected");document.querySelectorAll(".option").forEach(x=>x.disabled=true);document.getElementById("fb").textContent=q.r[i];setTimeout(supp5,1100)})}
let like=["喜歡","不喜歡","不知道","討厭"];
function supp5(){horror();like=["喜歡","不喜歡","不知道","討厭"];renderLike()}
function renderLike(){
document.getElementById("app").innerHTML=`<div class="card"><div class="question-number">補充問題 5 / 5</div><div class="question" style="text-align:center;">再次問你一次。<br>你喜歡我嗎?</div><div class="options" id="like"></div><div class="feedback" id="lfb"></div><div class="she-reply show" id="lrp"></div>`;
let box=document.getElementById("like");like.forEach((t,i)=>{let b=document.createElement("button");b.className="option";b.style.textAlign="center";b.textContent=t;b.onclick=()=>likeAnswer(i);box.appendChild(b)})
}
function likeAnswer(i){
if(like[i]!=="喜歡"){
document.getElementById("lfb").textContent="嗯。那我再問你一次。";
document.getElementById("lrp").textContent="希望下次會是我滿意的答案。";
like[i]="喜歡";renderLike();return
}
document.getElementById("lfb").textContent="我就知道。";
document.getElementById("lrp").textContent="這樣就好了。";
document.getElementById("like").innerHTML="";
setTimeout(end,1500)
}
function end(){horror();document.getElementById("app").innerHTML=`<div class="card"><div class="dialogue"><div class="dialogue-text">……</div><div class="note">所有問題均已完成。</div></div></div>`;setTimeout(()=>knock(.3),1000);setTimeout(()=>knock(.34),1900);setTimeout(()=>knock(.38),2800);setTimeout(staticFlash,3900);setTimeout(home,5200)}
home();
</script>
</body>
</html>
