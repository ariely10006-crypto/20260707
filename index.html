<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Relationship Test</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: "Microsoft JhengHei", sans-serif;
    color: #333;
    background: #f7f5f5;
    transition: background 2s ease, color 2s ease;
    overflow-x: hidden;
}

.container {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.card {
    width: 700px;
    max-width: 95vw;
    padding: 42px;
    background: rgba(255,255,255,.96);
    border: 1px solid #ddd;
    box-shadow: 0 12px 40px rgba(0,0,0,.06);
    position: relative;
    z-index: 2;
}

h1 {
    text-align: center;
    font-size: 27px;
    font-weight: 400;
    letter-spacing: 3px;
}

.subtitle {
    text-align: center;
    color: #999;
    font-size: 13px;
    margin-bottom: 35px;
}

.description {
    color: #666;
    line-height: 2;
}

button {
    font-family: inherit;
}

.start-btn {
    display: block;
    margin: 35px auto 0;
    padding: 13px 42px;
    background: white;
    border: 1px solid #aaa;
    cursor: pointer;
    transition: .25s;
}

.start-btn:hover {
    background: #f3eaea;
    border-color: #855555;
}

.question-number {
    color: #999;
    font-size: 13px;
    margin-bottom: 22px;
}

.question {
    font-size: 20px;
    line-height: 1.8;
    margin-bottom: 25px;
}

.option {
    width: 100%;
    padding: 14px 16px;
    margin: 8px 0;
    text-align: left;
    background: white;
    border: 1px solid #d8d8d8;
    cursor: pointer;
    transition: .2s;
}

.option:hover {
    background: #f7eeee;
    border-color: #a87878;
}

.option:disabled {
    cursor: default;
}

.progress {
    margin-top: 30px;
    height: 3px;
    background: #e6dddd;
}

.progress-bar {
    height: 100%;
    width: 0%;
    background: #956666;
    transition: width .4s ease;
}

.status {
    min-height: 20px;
    margin-top: 18px;
    color: #999;
    font-size: 12px;
}

/* ===== 微妙變化 ===== */

body.late {
    background:
        radial-gradient(circle at center,
        #f2eaea,
        #e4d4d4);
}

body.dark {
    background:
        radial-gradient(circle at center,
        #4a2929,
        #1b0d0d);
    color: #c9adad;
}

body.dark .card {
    background: rgba(27,14,14,.96);
    border-color: #603737;
    box-shadow: 0 20px 70px rgba(0,0,0,.5);
}

body.dark .question,
body.dark h1 {
    color: #d2b8b8;
}

body.dark .option {
    background: #251515;
    color: #cdb1b1;
    border-color: #633939;
}

body.dark .option:hover {
    background: #341b1b;
}

body.dark .status {
    color: #896767;
}

/* ===== 雪花屏 ===== */

.noise {
    position: fixed;
    inset: 0;
    z-index: 10;
    pointer-events: none;
    opacity: 0;
    background:
        repeating-radial-gradient(
            circle at 17% 32%,
            rgba(255,255,255,.8) 0 1px,
            rgba(0,0,0,.8) 1px 2px,
            transparent 2px 4px
        );
    mix-blend-mode: screen;
}

.noise.active {
    animation: staticNoise 1s steps(7);
}

@keyframes staticNoise {
    0%   { opacity: 0; }
    10%  { opacity: .55; }
    20%  { opacity: .15; }
    32%  { opacity: .7; }
    43%  { opacity: .08; }
    55%  { opacity: .48; }
    70%  { opacity: .12; }
    85%  { opacity: .55; }
    100% { opacity: 0; }
}

/* ===== 最後結局 ===== */

.final {
    line-height: 2.2;
}

.final-line {
    opacity: 0;
    animation: appear 1.8s forwards;
}

@keyframes appear {
    to {
        opacity: 1;
    }
}

.ending-btn {
    margin-top: 20px;
}

/* 手機 */

@media(max-width:600px) {
    .card {
        padding: 27px;
    }

    .question {
        font-size: 18px;
    }
}
</style>
</head>

<body>

<div class="noise" id="noise"></div>

<div class="container">
<div class="card">
<div id="app"></div>
</div>
</div>

<script>

/* =========================================
   題目
========================================= */

const questions = [

{
    q:"如果喜歡的人沒有馬上回覆你的訊息，你通常會？",
    a:[
        "先做自己的事情。",
        "過一陣子再看看。",
        "會稍微注意一下。",
        "如果很久沒回，會問問對方是不是還好。"
    ]
},

{
    q:"你認為一段健康的關係最重要的是？",
    a:[
        "信任。",
        "陪伴。",
        "溝通。",
        "彼此尊重。"
    ]
},

{
    q:"如果對方今天看起來心情不好，你會？",
    a:[
        "先給他一些空間。",
        "問問發生了什麼。",
        "陪他做點別的事情。",
        "等他願意說再聽。"
    ]
},

{
    q:"你覺得戀人需要自己的私人空間嗎？",
    a:[
        "當然需要。",
        "需要，但也要保持聯絡。",
        "我比較喜歡分享生活。",
        "只要互相信任就好。"
    ]
},

{
    q:"如果兩個人發生爭執，你通常會？",
    a:[
        "先冷靜。",
        "盡快把事情說清楚。",
        "看情況。",
        "等彼此情緒穩定再談。"
    ]
},

{
    q:"如果對方突然一天沒有主動聯絡你，你會？",
    a:[
        "不太在意。",
        "會有點想念。",
        "可能主動傳訊息。",
        "如果和平常差很多，我會問問。"
    ]
},

{
    q:"如果對方說「我今天想一個人」，你會？",
    a:[
        "尊重他。",
        "問問是不是發生了什麼。",
        "有點失落，但會給空間。",
        "等他準備好再陪他。"
    ]
},

{
    q:"如果你發現對方刪掉了一則訊息，你會？",
    a:[
        "不會特別在意。",
        "有點好奇。",
        "可能會問問。",
        "如果很反常，會注意一下。"
    ]
},

/* 從這裡開始，只有一點點異常 */

{
    q:"如果平常很快回覆你的人，突然六個小時沒有回覆，你會？",
    a:[
        "可能只是忙。",
        "可能沒看到。",
        "會有一點擔心。",
        "會想確認他是不是還好。"
    ]
},

{
    q:"如果你知道對方手機還有電，但一直沒有回覆，你會？",
    a:[
        "繼續等。",
        "晚一點再看看。",
        "有點疑惑。",
        "可能會傳一則訊息。"
    ]
},

{
    q:"如果你晚上 11:47 傳了一句「晚安」，直到凌晨都沒有收到回覆，你會？",
    a:[
        "明天再看看。",
        "他可能睡著了。",
        "會有一點在意。",
        "希望至少知道他沒事。"
    ]
},

{
    q:"如果隔天早上，你發現對方昨晚其實在線上，你會？",
    a:[
        "可能只是剛好上線。",
        "不會特別在意。",
        "會覺得有點奇怪。",
        "可能找機會問問。"
    ]
},

{
    q:"如果你突然發現，剛才某一題的答案和你記得的不一樣，你會？",
    a:[
        "可能是我記錯了。",
        "再想一下。",
        "覺得有點奇怪。",
        "回頭確認。"
    ]
},

{
    q:"如果一個人知道你什麼時候在線上，你會覺得？",
    a:[
        "很正常。",
        "要看是誰。",
        "有一點不自在。",
        "如果沒有告訴他，我會覺得奇怪。"
    ]
},

{
    q:"如果你知道有人正在等你的回答，你會怎麼做？",
    a:[
        "有空再回。",
        "盡量不要讓他等太久。",
        "會有一點壓力。",
        "我會很想知道他為什麼一直等。"
    ]
}

];


/* =========================================
   狀態
========================================= */

let current = 0;
let answers = [];
let audioCtx = null;


/* =========================================
   初始畫面
========================================= */

function home(){

    document.getElementById("app").innerHTML = `

        <h1>戀愛關係傾向測驗</h1>

        <div class="subtitle">
            Relationship & Attachment Test
        </div>

        <div class="description">

            <p>
                這是一份簡單的戀愛關係心理測驗。
            </p>

            <p>
                請按照第一直覺回答，
                沒有正確或錯誤的答案。
            </p>

            <p>
                測驗約需 3～5 分鐘。
            </p>

            <p style="font-size:12px;color:#aaa;">
                本測驗僅供娛樂參考，
                不代表正式心理評估。
            </p>

        </div>

        <button class="start-btn"
                onclick="startTest()">
            開始測驗
        </button>
    `;
}

home();


/* =========================================
   音效系統
========================================= */

function initAudio(){

    if(!audioCtx){
        audioCtx =
            new (window.AudioContext ||
                 window.webkitAudioContext)();
    }

    if(audioCtx.state === "suspended"){
        audioCtx.resume();
    }
}


/* 很輕的電流雜訊 */

function staticSound(){

    if(!audioCtx) return;

    const buffer =
        audioCtx.createBuffer(
            1,
            audioCtx.sampleRate * .35,
            audioCtx.sampleRate
        );

    const data = buffer.getChannelData(0);

    for(let i=0;i<data.length;i++){
        data[i] =
            (Math.random()*2-1) * .018;
    }

    const source =
        audioCtx.createBufferSource();

    const gain =
        audioCtx.createGain();

    gain.gain.value = .25;

    source.buffer = buffer;

    source.connect(gain);
    gain.connect(audioCtx.destination);

    source.start();
}


/* 敲門 */

function knock(){

    if(!audioCtx) return;

    const osc =
        audioCtx.createOscillator();

    const gain =
        audioCtx.createGain();

    osc.type = "sine";
    osc.frequency.value = 110;

    gain.gain.setValueAtTime(
        .001,
        audioCtx.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        .35,
        audioCtx.currentTime + .025
    );

    gain.gain.exponentialRampToValueAtTime(
        .001,
        audioCtx.currentTime + .22
    );

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start();
    osc.stop(audioCtx.currentTime+.23);
}


/* =========================================
   開始
========================================= */

function startTest(){

    initAudio();

    current = 0;
    answers = [];

    showQuestion();
}


/* =========================================
   題目
========================================= */

function showQuestion(){

    if(current >= questions.length){
        showResult();
        return;
    }

    const q = questions[current];

    const percent =
        (current / questions.length) * 100;

    document.getElementById("app").innerHTML = `

        <div class="question-number">
            第 ${current+1} / ${questions.length} 題
        </div>

        <div class="question">
            ${q.q}
        </div>

        <div id="options"></div>

        <div class="status" id="status"></div>

        <div class="progress">
            <div class="progress-bar"
                 style="width:${percent}%">
            </div>
        </div>
    `;

    const box =
        document.getElementById("options");

    q.a.forEach((text,index)=>{

        const btn =
            document.createElement("button");

        btn.className = "option";

        btn.textContent = text;

        btn.onclick =
            ()=>answer(index);

        box.appendChild(btn);
    });
}


/* =========================================
   回答
========================================= */

function answer(index){

    answers.push(index);

    document
        .querySelectorAll(".option")
        .forEach(btn=>{
            btn.disabled = true;
        });

    /*
       前面非常快
       後面稍微拉長
    */

    let delay = 450;

    if(current >= 8)
        delay = 650;

    if(current === 10)
        delay = 850;

    if(current === 12)
        delay = 700;

    /*
       第 13 題：
       非常短的雪花
    */

    if(current === 12){

        setTimeout(()=>{
            staticSound();
            showNoise();
        },250);
    }

    /*
       第 14 題：
       不變色
    */

    if(current === 13){

        setTimeout(()=>{
            staticSound();
        },300);
    }

    current++;

    setTimeout(()=>{
        showQuestion();
    },delay);
}


/* =========================================
   雪花屏
========================================= */

function showNoise(){

    const noise =
        document.getElementById("noise");

    noise.classList.remove("active");

    /*
       強制重新播放動畫
    */

    void noise.offsetWidth;

    noise.classList.add("active");

    setTimeout(()=>{
        noise.classList.remove("active");
    },1000);
}


/* =========================================
   結果
========================================= */

function showResult(){

    document.body.className = "";

    document.getElementById("app").innerHTML = `

        <h1>測驗完成</h1>

        <div class="description">

            <p>
                你的回答已經完成分析。
            </p>

            <p>
                結果顯示，你在親密關係中
                相當重視信任與穩定的互動。
            </p>

            <p>
                你也會注意到對方行為上的細微變化。
            </p>

        </div>

        <button class="start-btn"
                onclick="completeResult()">
            查看完整結果
        </button>
    `;
}


/* =========================================
   看似正常的結果
========================================= */

function completeResult(){

    document.getElementById("app").innerHTML = `

        <h1>你的關係傾向</h1>

        <div class="description">

            <p>
                <strong>穩定陪伴型</strong>
            </p>

            <p>
                你通常願意相信自己在乎的人，
                同時也會在意關係中的細節。
            </p>

            <p>
                對你而言，
                陪伴並不一定代表時時刻刻在一起，
                而是知道對方仍然在那裡。
            </p>

        </div>

        <button class="start-btn"
                onclick="additionalIntro()">
            繼續
        </button>
    `;
}


/* =========================================
   補充問題
========================================= */

function additionalIntro(){

    document.body.classList.add("late");

    document.getElementById("app").innerHTML = `

        <h1>還有一件事</h1>

        <div class="description">

            <p>
                分析完成後，
                系統發現有一個項目需要再次確認。
            </p>

            <p>
                只需要回答一個問題。
            </p>

        </div>

        <button class="start-btn"
                onclick="extra1()">
            繼續
        </button>
    `;
}


function extra1(){

    document.getElementById("app").innerHTML = `

        <div class="question">
            如果你傳出的訊息一直沒有收到回覆，
            你通常會等多久？
        </div>

        <button class="option"
                onclick="extra2()">
            幾個小時
        </button>

        <button class="option"
                onclick="extra2()">
            半天左右
        </button>

        <button class="option"
                onclick="extra2()">
            一整天
        </button>

        <button class="option"
                onclick="extra2()">
            直到對方回覆
        </button>
    `;
}


function extra2(){

    document.body.classList.add("late");

    document.getElementById("app").innerHTML = `

        <div class="question">
            如果你知道對方的手機還有電，
            但他沒有回覆呢？
        </div>

        <button class="option"
                onclick="extra3()">
            他可能只是忙。
        </button>

        <button class="option"
                onclick="extra3()">
            等他有空。
        </button>

        <button class="option"
                onclick="extra3()">
            有點奇怪。
        </button>

        <button class="option"
                onclick="extra3()">
            想知道他在做什麼。
        </button>
    `;
}


function extra3(){

    document.body.classList.add("dark");

    document.getElementById("app").innerHTML = `

        <div class="question">
            最後一個問題。
        </div>

        <div class="question">
            你現在是一個人嗎？
        </div>

        <button class="option"
                onclick="ending('yes')">
            是
        </button>

        <button class="option"
                onclick="ending('no')">
            不是
        </button>
    `;
}


/* =========================================
   最後
========================================= */

function ending(answer){

    const app =
        document.getElementById("app");

    app.innerHTML = `

        <div class="final">

            <p>
                好。
            </p>

            <p class="final-line"
               style="animation-delay:2s">
                測驗真的結束了。
            </p>

        </div>
    `;

    /*
       第一次敲門
    */

    setTimeout(()=>{
        knock();
    },5000);


    /*
       不馬上解釋
    */

    setTimeout(()=>{

        app.innerHTML += `

            <p class="final-line"
               style="animation-delay:.1s">
               ……
            </p>
        `;

    },6500);


    /*
       第二次
    */

    setTimeout(()=>{
        knock();
        knock();
    },9000);


    /*
       開始讓玩家懷疑
    */

    setTimeout(()=>{

        app.innerHTML += `

            <p class="final-line"
               style="animation-delay:.1s">
               剛才有聲音嗎？
            </p>
        `;

    },10500);


    /*
       很久之後才出現最後一句
    */

    setTimeout(()=>{

        app.innerHTML += `

            <p class="final-line"
               style="animation-delay:.1s">
               不用去看。
            </p>
        `;

    },14500);


    /*
       最後
    */

    setTimeout(()=>{

        app.innerHTML += `

            <p class="final-line"
               style="animation-delay:.1s">
               它已經知道你在這裡了。
            </p>
        `;

    },18500);

}

</script>

</body>
</html>
