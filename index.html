<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>親密關係傾向測驗</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    min-height:100%;
}

body{
    min-height:100vh;
    font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;
    background:#f1eeeb;
    color:#393535;
    transition:
        background 2.5s ease,
        color 2.5s ease;
    overflow-x:hidden;
}

#app{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:25px;
}

.card{
    width:680px;
    max-width:94vw;
    padding:42px;
    background:rgba(255,255,255,.96);
    border:1px solid #ddd7d3;
    box-shadow:0 15px 45px rgba(50,35,30,.08);
    transition:
        background 1.5s,
        border 1.5s,
        box-shadow 1.5s;
}

h1{
    margin:0 0 8px;
    text-align:center;
    font-size:27px;
    font-weight:400;
    letter-spacing:3px;
}

.subtitle{
    text-align:center;
    color:#aaa19d;
    font-size:12px;
    letter-spacing:1px;
    margin-bottom:34px;
}

.description{
    color:#696360;
    font-size:15px;
    line-height:2;
}

.start-btn{
    display:block;
    margin:34px auto 0;
    padding:12px 42px;
    background:#fff;
    color:#514a47;
    border:1px solid #aaa29d;
    cursor:pointer;
    font-family:inherit;
    transition:.25s;
}

.start-btn:hover{
    background:#eee8e4;
    border-color:#866b63;
}

.question-number{
    color:#aaa19d;
    font-size:12px;
    margin-bottom:23px;
    letter-spacing:1px;
}

.question{
    font-size:20px;
    line-height:1.8;
    margin-bottom:25px;
}

.options{
    display:flex;
    flex-direction:column;
    gap:8px;
}

.option{
    width:100%;
    padding:14px 16px;
    text-align:left;
    background:#fff;
    color:#403b39;
    border:1px solid #d8d2cf;
    cursor:pointer;
    font-family:inherit;
    transition:
        background .2s,
        border .2s,
        opacity .4s,
        transform .15s;
}

.option:hover{
    background:#f5efec;
    border-color:#a98b82;
}

.option:active{
    transform:scale(.995);
}

.option.selected{
    background:#eee6e2;
    border-color:#97736a;
}

.option:disabled{
    cursor:default;
}

.option.fade{
    opacity:0;
    pointer-events:none;
}

.feedback{
    min-height:25px;
    margin-top:18px;
    color:#8d8581;
    font-size:13px;
    line-height:1.7;
}

.progress{
    height:2px;
    margin-top:28px;
    background:#e6dfdc;
}

.progress-bar{
    height:100%;
    background:#99786f;
    transition:width .45s;
}


/* ===== 後段 ===== */

body.late{
    background:#d8ceca;
}

body.late .card{
    border-color:#bea69e;
}


/* ===== 深色 ===== */

body.dark{
    background:
        radial-gradient(
            circle at 50% 35%,
            #51322f,
            #261716 65%,
            #100909
        );

    color:#ddd0cc;
}

body.dark .card{
    background:rgba(29,17,16,.95);
    border-color:#68423c;
    box-shadow:0 25px 90px rgba(0,0,0,.55);
}

body.dark h1,
body.dark .question{
    color:#dcc9c4;
}

body.dark .question-number{
    color:#96736d;
}

body.dark .option{
    background:#271716;
    color:#d3c1bd;
    border-color:#67423d;
}

body.dark .option:hover{
    background:#3a211f;
}

body.dark .feedback{
    color:#a68a84;
}


/* ===== 雪花 ===== */

#noise{
    position:fixed;
    inset:0;
    z-index:9999;
    pointer-events:none;
    opacity:0;
    background:
        repeating-linear-gradient(
            0deg,
            rgba(255,255,255,.22) 0px,
            rgba(255,255,255,.22) 1px,
            rgba(0,0,0,.22) 1px,
            rgba(0,0,0,.22) 3px
        );
    mix-blend-mode:screen;
}

#noise.active{
    animation:staticBurst 1s steps(9);
}

@keyframes staticBurst{
    0%{opacity:0}
    8%{opacity:.7}
    16%{opacity:.15}
    25%{opacity:.85}
    34%{opacity:.12}
    43%{opacity:.65}
    52%{opacity:.1}
    63%{opacity:.8}
    73%{opacity:.18}
    84%{opacity:.6}
    100%{opacity:0}
}


/* ===== 輕微畫面晃動 ===== */

body.shake #app{
    animation:screenShake .55s;
}

@keyframes screenShake{
    0%{transform:translate(0,0)}
    15%{transform:translate(-3px,1px)}
    30%{transform:translate(3px,-1px)}
    45%{transform:translate(-2px,2px)}
    60%{transform:translate(2px,-2px)}
    75%{transform:translate(-1px,1px)}
    100%{transform:translate(0,0)}
}


/* ===== 小文字 ===== */

#whisper{
    position:fixed;
    left:50%;
    bottom:9%;
    transform:translateX(-50%);
    z-index:100;
    color:#74423c;
    font-size:12px;
    letter-spacing:3px;
    opacity:0;
    pointer-events:none;
}

#whisper.show{
    animation:whisperAppear 4s forwards;
}

@keyframes whisperAppear{
    0%{opacity:0}
    20%{opacity:.65}
    42%{opacity:.15}
    62%{opacity:.5}
    100%{opacity:0}
}


/* ===== 正常恢復 ===== */

body.normal-again{
    background:#f1eeeb;
    color:#393535;
}

body.normal-again .card{
    background:rgba(255,255,255,.97);
    border-color:#ddd7d3;
    box-shadow:0 15px 45px rgba(50,35,30,.07);
}


/* ===== 手機 ===== */

@media(max-width:600px){

    #app{
        padding:14px;
    }

    .card{
        padding:27px 22px;
    }

    .question{
        font-size:18px;
    }

    h1{
        font-size:23px;
    }
}
</style>
</head>


<body>

<div id="noise"></div>

<script>

f:[

},

{
q:"最後一題：如果你知道有人正在看著你回答，你會？",
a:[

"我會開始注意周圍。",
"我會想知道……他在哪裡？"
],
f:[
"這只是一個假設。",
"不用把問題想得太複雜。",
"……你現在是不是看了一下四周？",
"那個問題沒有要求你找到答案。"
]
}

];


/* =====================================================
   狀態
===================================================== */

let current = 0;
let answers = [];
let audioCtx = null;


/* =====================================================
   Audio
===================================================== */

function initAudio(){

    if(!audioCtx){

        audioCtx =
        new(
            window.AudioContext ||
            window.webkitAudioContext
        )();

    }

    if(audioCtx.state === "suspended"){
        audioCtx.resume();
    }
}


function tone(freq,duration,volume,type="sine"){

    if(!audioCtx)return;

    const osc =
        audioCtx.createOscillator();

    const gain =
        audioCtx.createGain();

    osc.type = type;
    osc.frequency.value = freq;

    gain.gain.setValueAtTime(
        .001,
        audioCtx.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        volume,
        audioCtx.currentTime+.03
    );

    gain.gain.exponentialRampToValueAtTime(
        .001,
        audioCtx.currentTime+duration
    );

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start();

    osc.stop(
        audioCtx.currentTime+
        duration+
        .04
    );
}


function lowHum(){

    if(!audioCtx)return;

    const osc =
        audioCtx.createOscillator();

    const gain =
        audioCtx.createGain();

    osc.type="sine";
    osc.frequency.value=48;

    gain.gain.value=.0001;

    gain.gain.exponentialRampToValueAtTime(
        .035,
        audioCtx.currentTime+1
    );

    gain.gain.exponentialRampToValueAtTime(
        .0001,
        audioCtx.currentTime+3
    );

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start();

    osc.stop(
        audioCtx.currentTime+3.1
    );
}


function staticSound(strength=.035,duration=.3){

    if(!audioCtx)return;

    const buffer =
        audioCtx.createBuffer(
            1,
            audioCtx.sampleRate*duration,
            audioCtx.sampleRate
        );

    const data =
        buffer.getChannelData(0);

    for(let i=0;i<data.length;i++){

        data[i] =
            (Math.random()*2-1)
            *strength;

    }

    const source =
        audioCtx.createBufferSource();

    const gain =
        audioCtx.createGain();

    gain.gain.value=.7;

    source.buffer=buffer;

    source.connect(gain);
    gain.connect(audioCtx.destination);

    source.start();
}


function knock(volume=.3){

    tone(
        84,
        .23,
        volume,
        "sine"
    );

    setTimeout(
        ()=>{
            tone(
                67,
                .15,
                volume*.35,
                "sine"
            );
        },
        80
    );
}


/* =====================================================
   Visual effects
===================================================== */

function noiseFlash(){

    const n =
        document.getElementById("noise");

    n.classList.remove("active");

    void n.offsetWidth;

    n.classList.add("active");

    staticSound(.085,.8);

    setTimeout(
        ()=>{
            n.classList.remove("active");
        },
        1000
    );
}


function shake(){

    document.body.classList.remove("shake");

    void document.body.offsetWidth;

    document.body.classList.add("shake");

    setTimeout(
        ()=>{
            document.body.classList.remove("shake");
        },
        600
    );
}


function whisper(text){

    const w =
        document.getElementById("whisper");

    w.textContent=text;

    w.classList.remove("show");

    void w.offsetWidth;

    w.classList.add("show");
}


/* =====================================================
   Home
===================================================== */

function home(){

document.getElementById("app").innerHTML=`

<div class="card">

<h1>親密關係傾向測驗</h1>

<div class="subtitle">
RELATIONSHIP & ATTACHMENT TEST
</div>

<div class="description">

<p>
歡迎參與本次匿名情感傾向測驗。
</p>

<p>
以下問題沒有標準答案，
請依照第一直覺回答。
</p>

測驗約需 3～5 分鐘。
</p>

<p style="
font-size:12px;
color:#aaa;
margin-top:24px;
">
本測驗僅供娛樂使用，
不代表正式心理評估。

<button
class="start-btn"
onclick="startTest()"
>
開始測驗
</button>

</div>

`;

}

home();


/* =====================================================
   Start
===================================================== */

function startTest(){

    initAudio();

    current=0;
    answers=[];

    document.body.className="";

    lowHum();

    showQuestion();
}


/* =====================================================
   題目
===================================================== */

function showQuestion(){

    if(current>=questions.length){

        showResult();

        return;
    }

    const q=questions[current];

    const percent =
        current/
        questions.length*
        100;

    document.getElementById("app").innerHTML=`

<div class="card">

<div class="question-number">

第 ${current+1} 題 /
共 ${questions.length} 題

</div>

<div class="question">
${q.q}
</div>

<div
class="options"
id="options"
></div>

<div
class="feedback"
id="feedback"
></div>

<div class="progress">

<div
class="progress-bar"
style="width:${percent}%"
></div>

</div>

</div>

`;

    const box =
        document.getElementById("options");

    q.a.forEach(
        (text,index)=>{

            const btn =
                document.createElement("button");

            btn.className="option";

            btn.textContent =
                String.fromCharCode(65+index)
                + ". "
                + text;

            btn.onclick =
                ()=>{
                    choose(index);
                };

            box.appendChild(btn);

        }
    );
}


/* =====================================================
   Answer
===================================================== */

function choose(index){

    answers.push(index);

    const q=questions[current];

    const buttons =
        document.querySelectorAll(".option");

    buttons.forEach(
        b=>b.disabled=true
    );

    buttons[index]
        .classList.add("selected");

    buttons.forEach(
        (b,i)=>{

            if(i!==index){

                setTimeout(
                    ()=>{
                        b.classList.add("fade");
                    },
                    150
                );

            }

        }
    );

    document.getElementById(
        "feedback"
    ).textContent=q.f[index];


    /* ===== 第 6 題：極輕微 ===== */

    if(current===5){

        if(index===1){

            setTimeout(
                ()=>{
                    staticSound(.025,.12);
                },
                450
            );

        }

    }


    /* ===== 第 8 題 ===== */

    if(current===7){

        setTimeout(
            ()=>{
                lowHum();
            },
            350
        );

    }


    /* ===== 第 9 題 ===== */

    if(current===8){

        document.body.classList.add("late");

        setTimeout(
            ()=>{
                staticSound(.04,.18);
            },
            600
        );

    }


    /* ===== 第 10 題 ===== */

    if(current===9){

        setTimeout(
            ()=>{
                tone(
                    61,
                    .5,
                    .05,
                    "sine"
                );
            },
            650
        );

    }


    /* ===== 第 11 題 ===== */

    if(current===10){

        setTimeout(
            ()=>{
                noiseFlash();
            },
            650
        );

    }


    /* ===== 第 12 題 ===== */

    if(current===11){

        setTimeout(
            ()=>{
                whisper("你剛才看過手機。");
            },
            900
        );

    }


    /* ===== 第 13 題 ===== */

    if(current===12){

        document.body.classList.add("dark");

        setTimeout(
            ()=>{
                lowHum();
            },
            300
        );

        setTimeout(
            ()=>{
                strangeMetal();
            },
            1000
        );

    }


    /* ===== 第 14 題 ===== */

    if(current===13){

        setTimeout(
            ()=>{
                staticSound(.045,.2);
            },
            600
        );

        if(index===2){

            setTimeout(
                ()=>{
                    whisper("你還記得嗎？");
                },
                1100
            );

        }

    }


    /* ===== 第 15 題 ===== */

    if(current===14){

        setTimeout(
            ()=>{
                knock(.24);
            },
            850
        );

    }


    current++;

    let delay=520;

    if(current>=9){
        delay=650;
    }

    if(current>=12){
        delay=720;
    }

    setTimeout(
        ()=>{
            showQuestion();
        },
        delay
    );
}
