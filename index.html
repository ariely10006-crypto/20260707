<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>親密關係傾向測驗｜V23</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    font-family:
        "Noto Sans TC",
        "Microsoft JhengHei",
        sans-serif;
    background:#090909;
    color:#eee;
}

body{
    overflow-x:hidden;
}

button{
    font-family:inherit;
}

/* =========================
   背景
========================= */

#background{
    position:fixed;
    inset:0;
    z-index:-5;
    background:
        radial-gradient(
            circle at 50% 40%,
            rgba(90,90,90,.12),
            transparent 45%
        ),
        #090909;
    transition:1s;
}

#background.dark{
    background:#000;
}

#background.red{
    background:
        radial-gradient(
            circle at 50% 50%,
            rgba(110,0,0,.12),
            transparent 55%
        ),
        #050505;
}

/* =========================
   主容器
========================= */

#app{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:24px;
}

.screen{
    width:min(760px,100%);
    min-height:560px;

    display:none;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    text-align:center;

    padding:40px 28px;

    animation:fadeIn .7s ease;
}

.screen.active{
    display:flex;
}

@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(15px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* =========================
   開始畫面
========================= */

.logo{
    font-size:14px;
    letter-spacing:5px;
    opacity:.45;
    margin-bottom:25px;
}

h1{
    font-size:clamp(28px,6vw,48px);
    font-weight:500;
    letter-spacing:4px;
    margin:0 0 20px;
}

.subtitle{
    color:#999;
    line-height:1.9;
    max-width:580px;
}

.start-warning{
    margin-top:28px;
    font-size:13px;
    color:#777;
}

.main-btn{
    margin-top:35px;

    border:1px solid #555;
    background:#111;
    color:#eee;

    padding:14px 42px;

    border-radius:4px;

    cursor:pointer;

    transition:.25s;
}

.main-btn:hover{
    background:#222;
    border-color:#999;
    transform:translateY(-2px);
}

.version{
    position:fixed;
    right:15px;
    bottom:12px;
    font-size:11px;
    opacity:.25;
}

/* =========================
   測驗畫面
========================= */

#quizScreen{
    justify-content:flex-start;
    padding-top:35px;
}

.topbar{
    width:100%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:25px;
}

.question-number{
    font-size:13px;
    color:#888;
}

.progress-wrap{
    flex:1;
    height:3px;
    background:#222;
    margin-left:20px;
    overflow:hidden;
}

.progress{
    height:100%;
    width:0%;
    background:#aaa;
    transition:.5s;
}

.question-box{
    width:100%;
    margin-top:45px;
}

.question{
    font-size:clamp(21px,4vw,30px);
    line-height:1.6;
    margin-bottom:40px;
}

.options{
    width:100%;
    display:flex;
    flex-direction:column;
    gap:12px;
}

.option{
    width:100%;

    background:#111;
    border:1px solid #292929;

    color:#ddd;

    padding:16px 18px;

    cursor:pointer;

    text-align:left;

    border-radius:3px;

    transition:.2s;
}

.option:hover{
    background:#1b1b1b;
    border-color:#666;
    transform:translateX(3px);
}

.option.selected{
    background:#252525;
    border-color:#aaa;
}

.hint{
    margin-top:28px;
    color:#555;
    font-size:12px;
}

/* =========================
   特殊題
========================= */

#specialTimer{
    margin-top:20px;
    font-size:13px;
    color:#777;
    min-height:20px;
}

#specialTimer.warning{
    color:#aaa;
}

.special-question .question{
    letter-spacing:1px;
}

/* =========================
   黑畫面
========================= */

#blackout{
    position:fixed;
    inset:0;
    z-index:9999;

    background:#000;

    opacity:0;
    pointer-events:none;

    transition:opacity .08s linear;
}

#blackout.show{
    opacity:1;
    pointer-events:auto;
}

/* =========================
   中間提示
========================= */

#messageScreen{
    position:fixed;
    inset:0;
    z-index:5000;

    background:#000;

    display:none;

    justify-content:center;
    align-items:center;

    text-align:center;
}

#messageScreen.show{
    display:flex;
}

#messageText{
    font-size:18px;
    color:#aaa;
    letter-spacing:2px;
}

/* =========================
   補充題
========================= */

#bonusScreen{
    justify-content:flex-start;
    padding-top:50px;
}

.bonus-title{
    font-size:28px;
    letter-spacing:4px;
    margin-bottom:12px;
}

.bonus-description{
    color:#777;
    font-size:13px;
    line-height:1.8;
    margin-bottom:35px;
}

.bonus-question{
    width:100%;
}

.bonus-question h2{
    font-size:22px;
    line-height:1.7;
    font-weight:400;
    margin-bottom:30px;
}

/* =========================
   結果
========================= */

#resultScreen{
    padding-top:30px;
}

.result-label{
    font-size:12px;
    letter-spacing:5px;
    color:#666;
    margin-bottom:20px;
}

.result-title{
    font-size:38px;
    letter-spacing:5px;
    margin-bottom:18px;
}

.result-subtitle{
    color:#999;
    margin-bottom:35px;
}

.result-card{
    width:100%;
    border:1px solid #292929;
    background:#0e0e0e;
    padding:25px;
    text-align:left;
    line-height:1.9;
}

.result-card h3{
    font-weight:400;
    color:#aaa;
    margin-top:0;
}

.result-card p{
    color:#bbb;
}

.score-area{
    width:100%;
    margin-top:25px;
}

.score-row{
    display:flex;
    align-items:center;
    gap:12px;
    margin:12px 0;
}

.score-name{
    width:80px;
    color:#888;
    font-size:13px;
}

.score-bar{
    flex:1;
    height:5px;
    background:#222;
}

.score-fill{
    height:100%;
    width:0%;
    background:#888;
    transition:1s;
}

.result-note{
    margin-top:28px;
    color:#555;
    font-size:12px;
    line-height:1.8;
}

/* =========================
   雜訊效果
========================= */

.noise{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:4000;

    opacity:0;

    background-image:
        repeating-linear-gradient(
            0deg,
            rgba(255,255,255,.025) 0px,
            rgba(255,255,255,.025) 1px,
            transparent 1px,
            transparent 3px
        );

    transition:.1s;
}

.noise.active{
    opacity:.35;
}

/* =========================
   手機
========================= */

@media(max-width:600px){

    #app{
        padding:12px;
    }

    .screen{
        min-height:600px;
        padding:30px 18px;
    }

    h1{
        letter-spacing:2px;
    }

    .question-box{
        margin-top:35px;
    }

    .question{
        font-size:21px;
    }

    .option{
        padding:15px;
    }

    .result-title{
        font-size:30px;
    }
}
</style>
</head>

<body>

<div id="background"></div>

<div id="app">

    <!-- =========================
         開始
    ========================== -->

    <section id="startScreen" class="screen active">

        <div class="logo">
            RELATIONSHIP TEST
        </div>

        <h1>親密關係傾向測驗</h1>

        <p class="subtitle">
            有些問題，你知道答案。<br>
            有些問題，你只是從來沒有想過。
        </p>

        <p class="start-warning">
            建議獨自完成測驗。
        </p>

        <button class="main-btn" onclick="startTest()">
            開始測驗
        </button>

    </section>


    <!-- =========================
         正式測驗
    ========================== -->

    <section id="quizScreen" class="screen">

        <div class="topbar">

            <div id="questionNumber" class="question-number">
                01 / 15
            </div>

            <div class="progress-wrap">
                <div id="progress" class="progress"></div>
            </div>

        </div>

        <div class="question-box">

            <div id="question" class="question"></div>

            <div id="options" class="options"></div>

            <div id="specialTimer"></div>

            <div class="hint">
                請選擇最接近你想法的答案。
            </div>

        </div>

    </section>


    <!-- =========================
         補充題
    ========================== -->

    <section id="bonusScreen" class="screen">

        <div class="bonus-title">
            補充題
        </div>

        <div class="bonus-description">
            接下來的問題不會影響主要結果。<br>
            你可以選擇回答，也可以選擇離開。
        </div>

        <div class="bonus-question">

            <h2 id="bonusQuestion"></h2>

            <div id="bonusOptions" class="options"></div>

        </div>

    </section>


    <!-- =========================
         結果
    ========================== -->

    <section id="resultScreen" class="screen">

        <div class="result-label">
            YOUR RESULT
        </div>

        <div id="resultTitle" class="result-title">
            ——
        </div>

        <div id="resultSubtitle" class="result-subtitle">
            ——
        </div>

        <div class="result-card">

            <h3>你的關係傾向</h3>

            <p id="resultDescription"></p>

            <div class="score-area">

                <div class="score-row">
                    <div class="score-name">安全感</div>
                    <div class="score-bar">
                        <div id="safeScore" class="score-fill"></div>
                    </div>
                </div>

                <div class="score-row">
                    <div class="score-name">依附感</div>
                    <div class="score-bar">
                        <div id="attachScore" class="score-fill"></div>
                    </div>
                </div>

                <div class="score-row">
                    <div class="score-name">獨立性</div>
                    <div class="score-bar">
                        <div id="independentScore" class="score-fill"></div>
                    </div>
                </div>

            </div>

        </div>

        <div class="result-note">
            這是一份互動式心理傾向測驗，
            結果僅代表本次作答的傾向，不代表正式心理診斷。
        </div>

        <button class="main-btn" onclick="location.reload()">
            再測一次
        </button>

    </section>

</div>

<div class="version">
    V23
</div>

<div id="blackout"></div>

<div id="messageScreen">
    <div id="messageText"></div>
</div>

<div id="noise" class="noise"></div>


<script>

/* =========================================================
   V23
   親密關係傾向測驗
========================================================= */


/* =========================================================
   題目
========================================================= */

const questions = [

    {
        text:"如果你喜歡的人很久沒有回覆訊息，你通常會？",
        options:[
            ["先做自己的事情，等對方有空再回",0,2],
            ["開始想是不是自己說錯了什麼",1,0],
            ["忍不住一直確認對方有沒有上線",2,0],
            ["直接問對方是不是不想理我",3,0]
        ]
    },

    {
        text:"當你和重要的人發生爭執，你比較傾向？",
        options:[
            ["冷靜後再談",0,2],
            ["希望馬上把事情說清楚",1,1],
            ["害怕對方因此離開自己",2,0],
            ["乾脆先把自己關起來",1,3]
        ]
    },

    {
        text:"你覺得一段關係裡最重要的是？",
        options:[
            ["信任",0,3],
            ["陪伴",1,2],
            ["安全感",2,1],
            ["彼此需要",3,0]
        ]
    },

    {
        text:"如果對方需要一點自己的空間，你會？",
        options:[
            ["尊重對方",0,3],
            ["雖然有點失落，但可以理解",1,2],
            ["忍不住想知道原因",2,1],
            ["覺得是不是自己做錯了什麼",3,0]
        ]
    },

    {
        text:"你比較害怕哪一件事情？",
        options:[
            ["失去自己的生活",3,0],
            ["被誤解",2,1],
            ["被忽略",1,2],
            ["被重要的人離開",0,3]
        ]
    },

    {
        text:"當你喜歡一個人時，你通常會？",
        options:[
            ["保持自己的生活節奏",0,3],
            ["慢慢增加相處時間",1,2],
            ["很容易把注意力放在對方身上",2,1],
            ["幾乎把對方放在生活中心",3,0]
        ]
    },

    {
        text:"如果對方突然變得冷淡，你第一個想法通常是？",
        options:[
            ["可能只是最近比較忙",0,3],
            ["是不是發生了什麼事",1,2],
            ["是不是對我失去興趣了",2,1],
            ["他是不是準備離開我了",3,0]
        ]
    },

    {
        text:"你會不會因為害怕破壞關係，而不敢說出真正的想法？",
        options:[
            ["幾乎不會",0,3],
            ["偶爾會",1,2],
            ["常常會",2,1],
            ["很常如此",3,0]
        ]
    },

    {
        text:"如果你發現自己越來越依賴一個人，你會？",
        options:[
            ["提醒自己保留自己的生活",0,3],
            ["接受這份依賴",1,2],
            ["開始擔心自己會不會太依賴",2,1],
            ["很難控制自己",3,0]
        ]
    },

    {
        text:"你比較希望喜歡的人如何對待你？",
        options:[
            ["尊重我的界線",0,3],
            ["願意陪著我",1,2],
            ["讓我確定自己很重要",2,1],
            ["讓我感覺自己是不可取代的",3,0]
        ]
    },

    /* =====================================================
       第11題
       特殊限時題
    ===================================================== */

    {
        special:true,

        text:"現在不要想太久。\n如果那個你最在意的人突然說：『我想離開一陣子。』\n你第一個反應是？",

        options:[
            ["好，我尊重你。",0,3],
            ["為什麼？發生什麼事了？",1,2],
            ["不要走。",2,1],
            ["你是不是不要我了？",3,0]
        ]
    },

    {
        text:"如果一段關係讓你變得不像自己，你會？",
        options:[
            ["重新找回自己的生活",0,3],
            ["試著和對方討論",1,2],
            ["先忍耐看看",2,1],
            ["很難離開",3,0]
        ]
    },

    {
        text:"你覺得『被需要』和『被愛』是一樣的嗎？",
        options:[
            ["不一樣",0,3],
            ["有些相似",1,2],
            ["很難分開",2,1],
            ["我常常把它們當成同一件事",3,0]
        ]
    },

    {
        text:"當你一個人的時候，你通常能夠？",
        options:[
            ["享受自己的時間",0,3],
            ["做自己的事情",1,2],
            ["偶爾覺得空虛",2,1],
            ["很希望有人陪著",3,0]
        ]
    },

    {
        text:"最後一題。\n如果一段關係讓你感到安心，你會？",
        options:[
            ["珍惜它，也保留自己",0,3],
            ["投入更多時間",1,2],
            ["很害怕失去它",2,1],
            ["希望永遠不要改變",3,0]
        ]
    }

];


/* =========================================================
   補充題
========================================================= */

const bonusQuestions = [

    {
        text:"如果你知道一個重要的人正在難過，你會？",
        options:[
            ["陪著他",0],
            ["問他需不需要幫忙",1],
            ["不知道該怎麼辦，但會留下來",2],
            ["先觀察他的狀態",3]
        ]
    },

    {
        text:"你比較容易記住別人說過的哪一種話？",
        options:[
            ["鼓勵我的話",0],
            ["重要的承諾",1],
            ["傷人的話",2],
            ["一句很普通但突然讓我在意的話",3]
        ]
    },

    {
        text:"如果你可以知道某個人的真實想法，你會想知道嗎？",
        options:[
            ["會",0],
            ["看情況",1],
            ["可能會",2],
            ["不知道",3]
        ]
    },

    {
        text:"如果有人突然問你：『你真的相信我嗎？』",
        options:[
            ["我會直接回答",0],
            ["先問為什麼這樣問",1],
            ["開始思考自己是不是忽略了什麼",2],
            ["會有一點不安",3]
        ]
    },

    /* =====================================================
       補充題5
       腳步聲
       不加入雜訊
    ===================================================== */

    {
        text:"如果你聽見身後傳來腳步聲，你會？",
        options:[
            ["回頭看看",0],
            ["先停下來聽",1],
            ["加快腳步",2],
            ["不敢回頭",3]
        ],

        footsteps:true
    }

];


/* =========================================================
   狀態
========================================================= */

let currentQuestion = 0;
let answers = [];

let bonusIndex = 0;
let bonusAnswers = [];

let safe = 0;
let attach = 0;
let independent = 0;

let specialTimer = null;
let specialAnswered = false;

let audioContext = null;


/* =========================================================
   DOM
========================================================= */

const startScreen = document.getElementById("startScreen");
const quizScreen = document.getElementById("quizScreen");
const bonusScreen = document.getElementById("bonusScreen");
const resultScreen = document.getElementById("resultScreen");

const questionNumber = document.getElementById("questionNumber");
const progress = document.getElementById("progress");

const question = document.getElementById("question");
const options = document.getElementById("options");

const specialTimerDisplay =
    document.getElementById("specialTimer");

const blackout =
    document.getElementById("blackout");

const background =
    document.getElementById("background");

const noise =
    document.getElementById("noise");

const messageScreen =
    document.getElementById("messageScreen");

const messageText =
    document.getElementById("messageText");


/* =========================================================
   音效系統
========================================================= */

function initAudio(){

    if(audioContext) return;

    try{

        audioContext =
            new (window.AudioContext ||
            window.webkitAudioContext)();

    }catch(e){

        audioContext = null;

    }

}


function playTone(
    frequency = 440,
    duration = .15,
    volume = .04,
    type = "sine"
){

    if(!audioContext) return;

    const osc =
        audioContext.createOscillator();

    const gain =
        audioContext.createGain();

    osc.type = type;

    osc.frequency.value =
        frequency;

    gain.gain.setValueAtTime(
        volume,
        audioContext.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        .001,
        audioContext.currentTime + duration
    );

    osc.connect(gain);
    gain.connect(audioContext.destination);

    osc.start();

    osc.stop(
        audioContext.currentTime + duration
    );
}


/* =========================================================
   敲門聲
========================================================= */

function playKnock(){

    if(!audioContext) return;

    playTone(110,.09,.10,"sine");

    setTimeout(()=>{
        playTone(100,.09,.09,"sine");
    },130);

    setTimeout(()=>{
        playTone(95,.12,.10,"sine");
    },270);

}


/* =========================================================
   腳步聲
========================================================= */

function playFootsteps(){

    if(!audioContext) return;

    playTone(90,.07,.045,"triangle");

    setTimeout(()=>{
        playTone(75,.07,.04,"triangle");
    },260);

    setTimeout(()=>{
        playTone(90,.07,.045,"triangle");
    },520);

}


/* =========================================================
   啟動
========================================================= */

function startTest(){

    initAudio();

    if(audioContext &&
       audioContext.state === "suspended"){

        audioContext.resume();

    }

    startScreen.classList.remove("active");
    quizScreen.classList.add("active");

    currentQuestion = 0;
    answers = [];

    showQuestion();

}


/* =========================================================
   顯示題目
========================================================= */

function showQuestion(){

    clearTimeout(specialTimer);

    specialTimerDisplay.textContent="";
    specialTimerDisplay.classList.remove("warning");

    specialAnswered = false;

    const q =
        questions[currentQuestion];

    questionNumber.textContent =
        String(currentQuestion + 1).padStart(2,"0")
        + " / "
        + String(questions.length).padStart(2,"0");

    progress.style.width =
        ((currentQuestion) /
        questions.length * 100) + "%";

    question.innerHTML =
        q.text.replace(/\n/g,"<br>");

    options.innerHTML="";

    q.options.forEach((item,index)=>{

        const btn =
            document.createElement("button");

        btn.className="option";

        btn.textContent=item[0];

        btn.onclick=()=>{

            chooseAnswer(index);

        };

        options.appendChild(btn);

    });

    /* =========================
       特殊第11題
    ========================== */

    if(q.special){

        background.classList.add("red");

        startSpecialTimer();

    }else{

        background.classList.remove("red");

    }

}


/* =========================================================
   選答案
========================================================= */

function chooseAnswer(index){

    if(specialAnswered) return;

    specialAnswered = true;

    const q =
        questions[currentQuestion];

    const selected =
        q.options[index];

    answers.push(selected);

    safe += selected[1];

    attach += selected[2];

    independent +=
        Math.max(0,3-selected[1]);

    playTone(220,.08,.025,"sine");

    if(q.special){

        clearTimeout(specialTimer);

    }

    nextQuestion();

}


/* =========================================================
   下一題
========================================================= */

function nextQuestion(){

    currentQuestion++;

    if(currentQuestion >= questions.length){

        progress.style.width="100%";

        setTimeout(()=>{

            startBonus();

        },500);

        return;

    }

    setTimeout(()=>{

        showQuestion();

    },180);

}


/* =========================================================
   第11題特殊倒數
========================================================= */

function startSpecialTimer(){

    let timeLeft = 1.0;

    specialTimerDisplay.textContent =
        "……";

    specialTimer =
        setInterval(()=>{

            timeLeft -= .1;

            if(timeLeft <= .4){

                specialTimerDisplay.classList.add(
                    "warning"
                );

            }

            if(timeLeft <= 0){

                clearInterval(specialTimer);

                specialTimeout();

                return;

            }

        },100);

}


/* =========================================================
   第11題超時
========================================================= */

function specialTimeout(){

    if(specialAnswered) return;

    specialAnswered = true;

    /* 黑畫面 */

    blackout.classList.add("show");

    background.classList.remove("red");

    playKnock();

    setTimeout(()=>{

        currentQuestion++;

        blackout.classList.remove("show");

        if(currentQuestion >= questions.length){

            startBonus();

        }else{

            showQuestion();

        }

    },700);

}


/* =========================================================
   補充題開始
========================================================= */

function startBonus(){

    quizScreen.classList.remove("active");

    bonusScreen.classList.add("active");

    bonusIndex = 0;

    bonusAnswers = [];

    background.classList.remove("red");

    showBonusQuestion();

}


/* =========================================================
   補充題
========================================================= */

function showBonusQuestion(){

    const q =
        bonusQuestions[bonusIndex];

    document.getElementById(
        "bonusQuestion"
    ).innerHTML =
        q.text.replace(/\n/g,"<br>");

    const container =
        document.getElementById(
            "bonusOptions"
        );

    container.innerHTML="";

    q.options.forEach((item,index)=>{

        const btn =
            document.createElement("button");

        btn.className="option";

        btn.textContent=item[0];

        btn.onclick=()=>{

            bonusAnswers.push(item[1]);

            if(q.footsteps){

                playFootsteps();

            }else{

                playTone(
                    180,
                    .08,
                    .025,
                    "sine"
                );

            }

            nextBonus();

        };

        container.appendChild(btn);

    });

}


/* =========================================================
   補充題下一題
========================================================= */

function nextBonus(){

    bonusIndex++;

    if(bonusIndex >= bonusQuestions.length){

        finishTest();

        return;

    }

    setTimeout(()=>{

        showBonusQuestion();

    },250);

}


/* =========================================================
   結果
========================================================= */

function finishTest(){

    bonusScreen.classList.remove("active");

    resultScreen.classList.add("active");

    background.classList.remove("red");

    calculateResult();

}


/* =========================================================
   結果分析
========================================================= */

function calculateResult(){

    const total =
        safe +
        attach +
        independent;

    let title;
    let subtitle;
    let description;

    /*
       用整體傾向決定結果。
    */

    if(independent >= attach &&
       independent >= safe){

        title = "自由型";

        subtitle =
            "你重視親密，也重視自己的空間。";

        description =
            "你通常希望關係建立在信任與尊重之上。"
            + "你可以在乎一個人，但不希望因此失去自己的生活。"
            + "對你而言，健康的關係不是完全綁在一起，"
            + "而是兩個完整的人願意一起走。";

    }else if(attach > independent &&
             attach >= safe){

        title = "深情型";

        subtitle =
            "你很容易認真對待一段關係。";

        description =
            "當你真正重視一個人時，你會投入很多情感。"
            + "你很在意對方的反應，也容易記住關係中的細節。"
            + "你的優點是重感情，但有時候也需要提醒自己："
            + "在乎別人的同時，也不要忘記自己的感受。";

    }else{

        title = "安心型";

        subtitle =
            "你傾向用信任建立親密感。";

        description =
            "你通常不需要時時確認對方是否還在。"
            + "你相信關係需要溝通，也相信彼此應該保有自己的空間。"
            + "對你來說，真正的親密並不是沒有距離，"
            + "而是即使有距離，也依然知道彼此存在。";

    }


    document.getElementById(
        "resultTitle"
    ).textContent=title;

    document.getElementById(
        "resultSubtitle"
    ).textContent=subtitle;

    document.getElementById(
        "resultDescription"
    ).textContent=description;


    /*
       分數轉百分比
    */

    const safePercent =
        Math.min(
            100,
            Math.round(
                safe /
                Math.max(1,questions.length * 3)
                * 100
            )
        );

    const attachPercent =
        Math.min(
            100,
            Math.round(
                attach /
                Math.max(1,questions.length * 3)
                * 100
            )
        );

    const independentPercent =
        Math.min(
            100,
            Math.round(
                independent /
                Math.max(1,questions.length * 3)
                * 100
            )
        );


    setTimeout(()=>{

        document.getElementById(
            "safeScore"
        ).style.width =
            safePercent + "%";

        document.getElementById(
            "attachScore"
        ).style.width =
            attachPercent + "%";

        document.getElementById(
            "independentScore"
        ).style.width =
            independentPercent + "%";

    },300);

}


/* =========================================================
   鍵盤支援
========================================================= */

document.addEventListener(
    "keydown",
    e=>{

        if(!quizScreen.classList.contains("active"))
            return;

        const buttons =
            document.querySelectorAll(
                "#options .option"
            );

        let index = -1;

        if(e.key >= "1" &&
           e.key <= "4"){

            index =
                Number(e.key)-1;

        }

        if(index >= 0 &&
           buttons[index]){

            buttons[index].click();

        }

    }
);


/* =========================================================
   防止意外選取
========================================================= */

document.addEventListener(
    "contextmenu",
    e=>{

        /*
           保留一般瀏覽器功能，
           不阻止使用者操作。
        */

    }
);


/* =========================================================
   初始狀態
========================================================= */

background.classList.remove("red");

</script>
