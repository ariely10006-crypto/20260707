/* =========================================================

   ========================================================= */

function initAudio(){
    if(!audioCtx){
        audioCtx = new(
            window.AudioContext ||
            window.webkitAudioContext
        )();
    }

    if(audioCtx.state === "suspended"){
        audioCtx.resume();
    }
}

function tone(
    frequency,
    duration,
    volume,
    type = "sine"
){
    if(!audioCtx){
        return;
    }

    const oscillator = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    oscillator.type = type;
    oscillator.frequency.value = frequency;

    gain.gain.setValueAtTime(
        .0001,
        audioCtx.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        volume,
        audioCtx.currentTime + .025
    );

    gain.gain.exponentialRampToValueAtTime(
        .0001,
        audioCtx.currentTime + duration
    );

    oscillator.connect(gain);
    gain.connect(audioCtx.destination);

    oscillator.start();

    oscillator.stop(
        audioCtx.currentTime + duration + .04
    );
}

function staticSound(
    strength = .035,
    duration = .18
){
    if(!audioCtx){
        return;
    }

    const buffer = audioCtx.createBuffer(
        1,
        audioCtx.sampleRate * duration,
        audioCtx.sampleRate
    );

    const data = buffer.getChannelData(0);

    for(let i = 0;i < data.length;i++){
        data[i] = (
            Math.random() * 2 - 1
        ) * strength;
    }

    const source = audioCtx.createBufferSource();
    const gain = audioCtx.createGain();

    gain.gain.value = .65;

    source.buffer = buffer;

    source.connect(gain);
    gain.connect(audioCtx.destination);

    source.start();
}

function lowHum(
    duration = 2.2,
    volume = .025
){
    if(!audioCtx){
        return;
    }

    const oscillator = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    oscillator.type = "sine";
    oscillator.frequency.value = 47;

    gain.gain.setValueAtTime(
        .0001,
        audioCtx.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        volume,
        audioCtx.currentTime + .55
    );

    gain.gain.exponentialRampToValueAtTime(
        .0001,
        audioCtx.currentTime + duration
    );

    oscillator.connect(gain);
    gain.connect(audioCtx.destination);

    oscillator.start();

    oscillator.stop(
        audioCtx.currentTime + duration + .1
    );
}

function knock(volume = .28){
    if(!audioCtx){
        return;

    tone(83,.12,volume,"sine");

    setTimeout(()=>{
        tone(
            61,
            .08,
            volume * .35,
            "sine"
        );
    },65);
}

function footstep(volume = .12){
    if(!audioCtx){
        return;
    }

    tone(72,.08,volume,"sine");

    setTimeout(()=>{
        tone(
            58,
            .07,
            volume * .7,
            "sine"

    },95);

    setTimeout(()=>{

            volume * .8,

}

function shake(){
    document.body.classList.remove("shake");

        document.body.classList.remove("shake");

function startTest(){

/* =========================================================
   題目
   ========================================================= */

function showQuestion(){
    const list =
        phase === "normal"
        ?
        normalQuestions
        :
        supplementQuestions;

    if(current >= list.length){

        if(phase === "normal"){
            showEleven();

            return;
        }

        afterSupplements();

        return;
    }

    const q = list[current];

    let displayQuestion = q.q;

    if(
        phase === "supplement" &&
        current === 4
    ){
        const q3 = supplementAnswers[2];

        if(q3 === 0){
            displayQuestion = "那你現在在哪裡？";
        }

        else if(q3 === 1){
            displayQuestion =
                "那你現在在哪裡？";
        }

        else if(q3 === 2){
            displayQuestion =
                "那你現在在哪裡？";
        }

        else{
            displayQuestion =
                "那你在哪裡？";
        }
    }

    /*
       題數顯示永遠維持：
       前10題 = 共10題
       第11題 = 不顯示共11題
    */

    const numberText =
        phase === "normal"
        ?
        `第 ${current + 1} 題 / 共 10 題`
        :
        `補充問題 ${current + 1} / 5`;

    const percentage =
        (current / list.length) * 100;

    document.getElementById("app").innerHTML = `
        <div class="card">

            <div class="question-number">
                ${numberText}
            </div>

            <div class="question">
                ${displayQuestion}
            </div>

            <div
                class="options"
                id="options"
            ></div>

            <div
                class="feedback"
                id="feedback"
            ></div>

            <div class="progress">
                <div
                    class="progress-bar"
                    style="width:${percentage}%"
                ></div>
            </div>

        </div>
    `;

    const container =
        document.getElementById("options");

    q.a.forEach((text,index)=>{

        const button =
            document.createElement("button");

        button.className = "option";

        button.textContent =
            String.fromCharCode(65 + index) +
            ". " +
            text;

        button.onclick = ()=>{
            chooseAnswer(index);
        };

        container.appendChild(button);
    });
}

/* =========================================================
   特殊順序判定
   ========================================================= */

function checkSpecialSequence(){
    /*
       第一條：
       第3、6、8、10題皆選 B
       觸發隱藏結局。
    */

    const sequenceA =
        normalAnswers.length >= 10 &&
        normalAnswers[2] === 1 &&
        normalAnswers[5] === 1 &&
        normalAnswers[7] === 1 &&
        normalAnswers[9] === 1;

    /*
       第二條：
       A → B → C → D → A
       只看前五題。
    */

    const sequenceB =
        normalAnswers.length >= 5 &&
        normalAnswers[0] === 0 &&
        normalAnswers[1] === 1 &&
        normalAnswers[2] === 2 &&
        normalAnswers[3] === 3 &&
        normalAnswers[4] === 0;

    /*
       第三條：
       四個連續相同答案。
    */

    let fourSame = false;

    for(
        let i = 0;
        i <= normalAnswers.length - 4;
        i++
    ){
        if(
            normalAnswers[i] ===
            normalAnswers[i + 1] &&
            normalAnswers[i] ===
            normalAnswers[i + 2] &&
            normalAnswers[i] ===
            normalAnswers[i + 3]
        ){
            fourSame = true;

            break;
        }
    }

    return {
        sequenceA,
        sequenceB,
        fourSame
    };
}

/* =========================================================
   最終開門問題
   ========================================================= */

function doorFinalQuestion(){

    const special =
        checkSpecialSequence();

    if(
        special.sequenceA ||
        special.sequenceB ||
        special.fourSame
    ){
        specialSequenceEnding();

        return;
    }

    let extra = "";

    const memory = getMemory();

    if(memory.plays >= 5){
        extra =
            "\n\n這次……你還要換一個答案嗎？";
    }

    showDialogue(
        "最後一個問題。\n\n如果我現在敲門，\n你會開門嗎？" +
        extra,
        null,
        [
            {
                text:"會。",
                action:()=>{
                    doorFinalAnswer("open");
                }
            },
            {
                text:"不會。",
                action:()=>{
                    doorFinalAnswer("closed");
                }
            },
            {
                text:"我不知道。",
                action:()=>{
                    doorFinalAnswer("unknown");
                }
            },
            {
                text:"不要再問了。",
                action:()=>{
                    doorFinalAnswer("stop");
                }
            }
        ]
    );
}

function doorFinalAnswer(type){

    const memory = getMemory();

    memory.endings[type] =
        (memory.endings[type] || 0) + 1;

    saveMemory(memory);

    if(
        memory.endings.open > 0 &&
        memory.endings.closed > 0 &&
        memory.endings.unknown > 0 &&
        memory.endings.stop > 0
    ){
        memory.seenAll = true;

        saveMemory(memory);
    }

    if(type === "open"){
        endingOpen();
    }

    else if(type === "closed"){
        endingClosed();
    }

    else if(type === "unknown"){
        endingUnknown();
    }

    else{
        endingStop();
    }
}

            "\n\n你已經看過所有結局了。\n\n……至少你以為是。";

    else if(
        memory.plays >= 5

            "\n\n你又回來了。";
    }

    else if(
        memory.plays >= 2
    ){
        extra =
            "\n\n你以前也做過這個選擇。";

    document.getElementById(
        "app"
    ).innerHTML = `
        <div class="card">

            <div class="dialogue">

function showThreeSecondQuestion(){

    enterHorrorMode();

    const popup =
        document.getElementById(
            "threeSecond"
        );

    const title =
        document.getElementById(
            "threeTitle"
        );

    title.innerHTML =
        "如果我現在就在門外，<br>" +
        "你覺得我會做什麼？";

    popup.classList.add("show");

    lowHum(3,.035);

    const bar =
        document.getElementById(
            "threeTimerBar"
        );

    bar.style.animation = "none";

    void bar.offsetWidth;

    bar.style.animation =
        "timerThree 3s linear forwards";

    clearTimeout(threeTimer);

    threeResolved = false;

    threeTimer = setTimeout(()=>{
        if(!threeResolved){
            finishThreeSecond();
        }
    },3000);
}

function threeAnswer(answer){

    if(threeResolved){
        return;
    }

    threeResolved = true;

    clearTimeout(threeTimer);

    const responses = [
        "你回答得很快。",
        "你真的這樣想嗎？",
        "你還是不相信我。",
        "你不想回答我嗎？"
    ];

    hideThreeSecond();

    whisper(
        responses[answer]
    );

    setTimeout(
        fakeEnding,
        1100
    );
}

function finishThreeSecond(){

    threeResolved = true;

    hideThreeSecond();

    whisper(
        "你不想回答我嗎？"
    );

    setTimeout(
        fakeEnding,
        1100
    );
}

function hideThreeSecond(){

    document
        .getElementById("threeSecond")
        .classList.remove("show");
