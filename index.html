<!DOCTYPE html>
<html lang="zh-Hant">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>親密關係傾向測驗</title>


<style>

/* =========================================================
   基礎
========================================================= */

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    min-height:100%;
}

body{

    min-height:100vh;

    font-family:
        "Noto Sans TC",
        "Microsoft JhengHei",
        sans-serif;

    background:#f1eeeb;

    color:#45403d;

    transition:
        background 5s ease,
        color 5s ease;

    overflow-x:hidden;
}


/* =========================================================
   主畫面
========================================================= */

#app{

    min-height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    padding:25px;

    transition:
        transform .15s ease;
}


.card{

    width:680px;

    max-width:94vw;

    padding:42px;

    background:
        rgba(255,255,255,.97);

    border:
        1px solid #ddd7d3;

    box-shadow:
        0 15px 50px
        rgba(45,30,25,.08);

    transition:

        background 5s ease,

        border-color 5s ease,

        box-shadow 5s ease;
}


/* =========================================================
   標題
========================================================= */

h1{

    margin:
        0 0 9px;

    text-align:center;

    font-size:27px;

    font-weight:400;

    letter-spacing:4px;
}


.subtitle{

    text-align:center;

    color:#aaa19d;

    font-size:11px;

    letter-spacing:2px;

    margin-bottom:34px;
}


.description{

    font-size:15px;

    line-height:2;

    color:#696360;
}


/* =========================================================
   開始按鈕
========================================================= */

.start-btn{

    display:block;

    margin:
        34px auto 0;

    padding:
        12px 42px;

    background:#fff;

    color:#514a47;

    border:
        1px solid #aaa29d;

    cursor:pointer;

    font-family:inherit;

    transition:

        background .25s,

        border .25s,

        transform .15s;
}


.start-btn:hover{

    background:#eee8e4;

    border-color:#80665e;
}


.start-btn:active{

    transform:scale(.98);
}


/* =========================================================
   題目
========================================================= */

.question-number{

    color:#aaa19d;

    font-size:12px;

    letter-spacing:1px;

    margin-bottom:22px;
}


.question{

    font-size:20px;

    line-height:1.8;

    margin-bottom:25px;
}


.feedback{

    min-height:28px;

    margin-top:18px;

    font-size:13px;

    line-height:1.8;

    color:#8c8581;
}


/* =========================================================
   選項
========================================================= */

.options{

    display:flex;

    flex-direction:column;

    gap:9px;
}


.option{

    width:100%;

    padding:14px 16px;

    text-align:left;

    background:#fff;

    color:#403b39;

    border:
        1px solid #d8d2cf;

    cursor:pointer;

    font-family:inherit;

    transition:

        background .25s,

        border .25s,

        opacity .35s,

        transform .12s;
}


.option:hover{

    background:#f5efec;

    border-color:#a98b82;
}


.option:active{

    transform:scale(.995);
}


.option.selected{

    background:#eee5e1;

    border-color:#927067;
}


.option.fade{

    opacity:0;

    pointer-events:none;
}


.option:disabled{

    cursor:default;
}


/* =========================================================
   進度條
========================================================= */

.progress{

    height:2px;

    margin-top:28px;

    background:#e6dfdc;
}


.progress-bar{

    height:100%;

    background:#99786f;

    transition:
        width .5s ease;
}


/* =========================================================
   紅黑恐怖模式
========================================================= */

body.horror{

    background:

        radial-gradient(

            circle at 50% 40%,

            #4b2927 0%,

            #291514 50%,

            #090505 100%
        );

    color:#ddd0cc;
}


body.horror .card{

    background:
        rgba(27,14,14,.95);

    border-color:#67433e;

    box-shadow:
        0 25px 90px
        rgba(0,0,0,.65);
}


body.horror h1,
body.horror .question{

    color:#dfccc7;
}


body.horror .subtitle,
body.horror .question-number{

    color:#98716b;
}


body.horror .description{

    color:#bca9a4;
}


body.horror .feedback{

    color:#a98983;
}


body.horror .option{

    background:#241413;

    color:#d6c4bf;

    border-color:#62413c;
}


body.horror .option:hover{

    background:#38201e;
}


body.horror .option.selected{

    background:#4b2521;

    border-color:#a16a61;
}


body.horror .progress{

    background:#3c2422;
}


body.horror .progress-bar{

    background:#985a52;
}


body.horror .start-btn{

    background:#241413;

    color:#d6c4bf;

    border-color:#68423d;
}


body.horror .start-btn:hover{

    background:#38201e;
}


/* =========================================================
   雪花
========================================================= */

#noise{

    position:fixed;

    inset:0;

    z-index:9999;

    pointer-events:none;

    opacity:0;

    background:

        repeating-linear-gradient(

            0deg,

            rgba(255,255,255,.15)
            0px,

            rgba(255,255,255,.15)
            1px,

            rgba(0,0,0,.18)
            1px,

            rgba(0,0,0,.18)
            3px
        );

    mix-blend-mode:screen;
}


#noise.active{

    animation:
        staticBurst .7s steps(7);
}


@keyframes staticBurst{

    0%{
        opacity:0;
    }

    15%{
        opacity:.30;
    }

    30%{
        opacity:.05;
    }

    47%{
        opacity:.24;
    }

    68%{
        opacity:.08;
    }

    100%{
        opacity:0;
    }
}


/* =========================================================
   畫面晃動
========================================================= */

body.shake #app{

    animation:
        screenShake .55s;
}


@keyframes screenShake{

    0%{
        transform:translate(0,0);
    }

    20%{
        transform:translate(-3px,1px);
    }

    40%{
        transform:translate(3px,-2px);
    }

    60%{
        transform:translate(-2px,2px);
    }

    80%{
        transform:translate(2px,-1px);
    }

    100%{
        transform:translate(0,0);
    }
}


/* =========================================================
   黑暗轉場
========================================================= */

#darkTransition{

    position:fixed;

    inset:0;

    z-index:3000;

    pointer-events:none;

    opacity:0;

    background:

        radial-gradient(

            circle,

            rgba(95,30,25,.02),

            rgba(8,3,3,.94)
        );

    transition:
        opacity 6s ease;
}


#darkTransition.active{

    opacity:.58;
}


/* =========================================================
   對話
========================================================= */

.dialogue{

    text-align:center;

    min-height:230px;

    display:flex;

    flex-direction:column;

    justify-content:center;
}


.dialogue-speaker{

    font-size:10px;

    letter-spacing:4px;

    color:#88615b;

    margin-bottom:24px;
}


.dialogue-text{

    min-height:90px;

    font-size:19px;

    line-height:2;

    color:#d8c5c0;

    white-space:pre-line;
}


.dialogue-options{

    margin-top:22px;

    display:flex;

    flex-direction:column;

    gap:8px;
}


/* =========================================================
   異常文字
========================================================= */

#whisper{

    position:fixed;

    left:50%;

    bottom:11%;

    transform:translateX(-50%);

    z-index:4000;

    color:#884a43;

    font-size:12px;

    letter-spacing:3px;

    opacity:0;

    pointer-events:none;

    white-space:nowrap;
}


#whisper.show{

    animation:
        whisperAppear 4s forwards;
}


@keyframes whisperAppear{

    0%{
        opacity:0;
    }

    20%{
        opacity:.75;
    }

    40%{
        opacity:.13;
    }

    65%{
        opacity:.55;
    }

    100%{
        opacity:0;
    }
}


/* =========================================================
   第11題
========================================================= */

#elevenOverlay{

    position:fixed;

    inset:0;

    z-index:7000;

    display:flex;

    justify-content:center;

    align-items:center;

    background:

        radial-gradient(

            circle at center,

            #4a2725 0%,

            #211010 50%,

            #070303 100%
        );

    opacity:0;

    pointer-events:none;

    transition:
        opacity .12s linear;
}


#elevenOverlay.show{

    opacity:1;

    pointer-events:auto;
}


.eleven-box{

    width:650px;

    max-width:90vw;

    text-align:center;

    color:#ddcbc6;
}


.eleven-number{

    font-size:10px;

    letter-spacing:5px;

    color:#956d66;

    margin-bottom:30px;
}


.eleven-question{

    font-size:24px;

    line-height:1.8;

    margin-bottom:16px;

    color:#ead8d3;
}


.eleven-small{

    font-size:12px;

    color:#9d7771;

    margin-bottom:25px;
}


.eleven-button{

    width:230px;

    padding:13px;

    background:#291312;

    color:#e0cbc6;

    border:
        1px solid #75463f;

    cursor:pointer;

    font-family:inherit;

    transition:

        background .15s,

        border .15s,

        transform .1s;
}


.eleven-button:hover{

    background:#47211e;

    border-color:#a56b61;
}


.eleven-button:active{

    transform:scale(.98);
}


.eleven-timer{

    width:230px;

    height:2px;

    margin:25px auto 0;

    background:#39201e;
}


.eleven-timer-bar{

    width:100%;

    height:100%;

    background:#a15850;

    animation:
        elevenTimer 1s linear forwards;
}


@keyframes elevenTimer{

    from{
        width:100%;
    }

    to{
        width:0%;
    }
}


/* =========================================================
   最終限時題
========================================================= */

#threeSecond{

    position:fixed;

    inset:0;

    z-index:6000;

    display:flex;

    justify-content:center;

    align-items:center;

    background:
        rgba(5,3,3,.97);

    opacity:0;

    pointer-events:none;

    transition:
        opacity .25s;
}


#threeSecond.show{

    opacity:1;

    pointer-events:auto;
}


.three-box{

    width:650px;

    max-width:90vw;

    text-align:center;

    color:#ddcbc6;
}


.three-small{

    font-size:10px;

    letter-spacing:4px;

    color:#906d67;

    margin-bottom:28px;
}


.three-title{

    font-size:21px;

    line-height:2;

    margin-bottom:10px;
}


.three-subtitle{

    color:#a57c75;

    font-size:12px;

    margin-bottom:25px;
}


.three-option{

    display:block;

    width:100%;

    max-width:430px;

    margin:8px auto;

    padding:12px;

    background:
        rgba(49,24,22,.72);

    color:#d1bdb8;

    border:
        1px solid #68413c;

    font-family:inherit;

    cursor:pointer;
}


.three-timer{

    width:100%;

    max-width:430px;

    height:2px;

    margin:25px auto 0;

    background:#382321;
}


.three-timer-bar{

    width:100%;

    height:100%;

    background:#985b53;

    animation:
        timerThree 1s linear forwards;
}


@keyframes timerThree{

    from{
        width:100%;
    }

    to{
        width:0%;
    }
}


/* =========================================================
   喜歡強制題
========================================================= */

.love-box{

    text-align:center;
}


.love-question{

    font-size:23px;

    line-height:1.9;

    margin-bottom:12px;
}


.love-subtitle{

    font-size:12px;

    color:#a47b74;

    margin-bottom:28px;
}


.love-options{

    display:flex;

    flex-direction:column;

    gap:9px;

    max-width:460px;

    margin:auto;
}


.love-option{

    padding:13px;

    background:#241413;

    color:#d9c4bf;

    border:
        1px solid #62413c;

    cursor:pointer;

    font-family:inherit;

    transition:.25s;
}


.love-option:hover{

    background:#3b1d1a;
}


.love-option.changed{

    animation:
        answerChanged .6s;
}


@keyframes answerChanged{

    0%{
        opacity:.2;
        transform:translateX(-8px);
    }

    50%{
        opacity:.5;
        transform:translateX(8px);
    }

    100%{
        opacity:1;
        transform:translateX(0);
    }
}


/* =========================================================
   手機
========================================================= */

@media(max-width:600px){

    #app{

        padding:14px;
    }


    .card{

        padding:
            27px 21px;
    }


    h1{

        font-size:22px;
    }


    .question{

        font-size:18px;
    }


    .dialogue-text{

        font-size:17px;
    }


    .eleven-question{

        font-size:21px;
    }

}

</style>

</head>


<body>


<!-- =======================================================
     效果層
======================================================= -->

<div id="noise"></div>

<div id="darkTransition"></div>

<div id="whisper"></div>


<!-- =======================================================
     第11題
======================================================= -->

<div id="elevenOverlay">

    <div class="eleven-box">

        <div class="eleven-number">
            第 11 題
        </div>

        <div class="eleven-question">
            你喜歡我嗎？
        </div>

        <div class="eleven-small">
            你不想回答我嗎？
        </div>

        <button
            class="eleven-button"
            onclick="answerEleven()"
        >
            喜歡
        </button>

        <div class="eleven-timer">

            <div
                class="eleven-timer-bar"
            ></div>

        </div>

    </div>

</div>


<!-- =======================================================
     最終一秒限時題
======================================================= -->

<div id="threeSecond">

    <div class="three-box">

        <div class="three-small">
            請立即回答
        </div>

        <div class="three-title">
            如果你現在回頭，<br>
            你覺得房間裡會多出什麼？
        </div>

        <div class="three-subtitle">
            你不想回答我嗎？
        </div>

        <button
            class="three-option"
            onclick="threeAnswer(0)"
        >
            一個人
        </button>

        <button
            class="three-option"
            onclick="threeAnswer(1)"
        >
            一個影子
        </button>

        <button
            class="three-option"
            onclick="threeAnswer(2)"
        >
            什麼都沒有
        </button>

        <button
            class="three-option"
            onclick="threeAnswer(3)"
        >
            我不想回頭看
        </button>

        <div class="three-timer">

            <div class="three-timer-bar"></div>

        </div>

    </div>

</div>


<div id="app"></div>


<script>


/* =========================================================
   正常題目 1～10
========================================================= */

const normalQuestions = [

{
    q:"當你情緒低落時，你最希望喜歡的人怎麼做？",

    a:[
        "陪我聊聊天。",
        "先給我一點空間。",
        "直接問我發生了什麼。",
        "陪在旁邊，不一定要說話。"
    ]
},

{
    q:"你認為戀人之間需要知道彼此每天的行程嗎？",

    a:[
        "不用，彼此都有自己的生活。",
        "大概知道就好。",
        "如果對方願意，我會想知道。",
        "重要的事情可以互相說。"
    ]
},

{
    q:"如果對方一整天沒有主動找你，你會？",

    a:[
        "做自己的事情。",
        "晚一點再傳訊息。",
        "有點想知道他在忙什麼。",
        "如果和平常差很多，會問問。"
    ]
},

{
    q:"如果對方說今天想一個人，你會？",

    a:[
        "尊重他的決定。",
        "告訴他需要時可以找我。",
        "有點失落，但還是會給空間。",
        "等他自己願意說。"
    ]
},

{
    q:"如果你傳了一則訊息，對方兩個小時都沒有回，你會？",

    a:[
        "沒關係，他可能在忙。",
        "偶爾看一下手機。",
        "有點期待通知。",
        "如果很反常，會稍微擔心。"
    ]
},

{
    q:"你覺得戀人應該知道彼此的手機密碼嗎？",

    a:[
        "不用。",
        "知道也沒關係，但不需要查看。",
        "如果彼此願意可以交換。",
        "我比較重視信任，而不是密碼。"
    ]
},

{
    q:"如果對方突然取消原本約好的見面，你會？",

    a:[
        "沒關係，下次再約。",
        "問問是不是發生了什麼。",
        "會有一點失望。",
        "看取消的理由。"
    ]
},

{
    q:"如果你發現對方已讀了訊息，卻沒有回覆，你會？",

    a:[
        "等他有時間再回。",
        "過一陣子再看看。",
        "會稍微想一下是不是說錯了什麼。",
        "如果一直沒有回，會再問一次。"
    ]
},

{
    q:"平常很快回你的人，突然六個小時沒有回覆，你會？",

    a:[
        "他可能真的很忙。",
        "等明天再看看。",
        "會覺得有一點奇怪。",
        "會傳一句「還好嗎？」"
    ]
},

{
    q:"你認為一段健康的關係最重要的是什麼？",

    a:[
        "信任。",
        "溝通。",
        "陪伴。",
        "彼此尊重。"
    ]
}

];


/* =========================================================
   補充題 1～5
========================================================= */

const supplementQuestions = [

{
    q:"如果你的伴侶希望知道你每天去了哪裡，你會覺得？",

    a:[
        "這很正常，偶爾分享就好。",
        "可以說，但不需要事事交代。",
        "如果對方一直追問，我會有點不舒服。",
        "我會希望彼此保有自己的空間。"
    ]
},

{
    q:"如果你沒有及時回覆訊息，對方一直問你去了哪裡，你會？",

    a:[
        "解釋自己剛才在做什麼。",
        "告訴對方自己現在有事情。",
        "覺得有點煩，但還是會回答。",
        "希望對方理解我不可能隨時在線。"
    ]
},

{
    q:"如果對方說：「我只是想知道你現在在哪裡。」你會怎麼想？",

    a:[
        "他可能只是擔心我。",
        "我會直接告訴他。",
        "要看他用什麼方式問。",
        "如果這變成習慣，我會覺得不舒服。"
    ]
},

{
    q:"如果你發現對方總能很快知道你今天去了哪些地方，你會？",

    a:[
        "覺得只是剛好。",
        "問問他怎麼知道的。",
        "開始注意這件事。",
        "覺得有點不舒服。"
    ]
},

{
    q:"你現在是一個人嗎？",

    a:[
        "是。",
        "不是。",
        "我不知道。",
        "……為什麼問這個？"
    ]
}

];


/* =========================================================
   狀態
========================================================= */

let phase="normal";

let current=0;

let normalAnswers=[];

let supplementAnswers=[];

let audioCtx=null;

let threeTimer=null;

let elevenTimer=null;

let loveAnswers=[];


/* =========================================================
   音效初始化
========================================================= */

function initAudio(){

    if(!audioCtx){

        audioCtx=
            new(
                window.AudioContext ||
                window.webkitAudioContext
            )();
    }

    if(audioCtx.state==="suspended"){

        audioCtx.resume();
    }
}


/* =========================================================
   基本音效
========================================================= */

function tone(
    frequency,
    duration,
    volume,
    type="sine"
){

    if(!audioCtx) return;

    const oscillator=
        audioCtx.createOscillator();

    const gain=
        audioCtx.createGain();

    oscillator.type=type;

    oscillator.frequency.value=
        frequency;

    gain.gain.setValueAtTime(
        .0001,
        audioCtx.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        volume,
        audioCtx.currentTime+.025
    );

    gain.gain.exponentialRampToValueAtTime(
        .0001,
        audioCtx.currentTime+duration
    );

    oscillator.connect(gain);

    gain.connect(audioCtx.destination);

    oscillator.start();

    oscillator.stop(
        audioCtx.currentTime+
        duration+
        .04
    );
}


/* =========================================================
   雜訊
========================================================= */

function staticSound(
    strength=.035,
    duration=.18
){

    if(!audioCtx) return;

    const buffer=
        audioCtx.createBuffer(
            1,
            audioCtx.sampleRate*duration,
            audioCtx.sampleRate
        );

    const data=
        buffer.getChannelData(0);

    for(
        let i=0;
        i<data.length;
        i++
    ){

        data[i]=
            (Math.random()*2-1)*
            strength;
    }

    const source=
        audioCtx.createBufferSource();

    const gain=
        audioCtx.createGain();

    gain.gain.value=.65;

    source.buffer=buffer;

    source.connect(gain);

    gain.connect(audioCtx.destination);

    source.start();
}


/* =========================================================
   低頻
========================================================= */

function lowHum(
    duration=2.2,
    volume=.025
){

    if(!audioCtx) return;

    const oscillator=
        audioCtx.createOscillator();

    const gain=
        audioCtx.createGain();

    oscillator.type="sine";

    oscillator.frequency.value=47;

    gain.gain.setValueAtTime(
        .0001,
        audioCtx.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        volume,
        audioCtx.currentTime+.55
    );

    gain.gain.exponentialRampToValueAtTime(
        .0001,
        audioCtx.currentTime+duration
    );

    oscillator.connect(gain);

    gain.connect(audioCtx.destination);

    oscillator.start();

    oscillator.stop(
        audioCtx.currentTime+
        duration+
        .1
    );
}

/* =========================================================
   最後限時題回答
========================================================= */

function threeAnswer(answer){

    clearTimeout(threeTimer);


    hideThreeSecond();


    /*
     * 不論選哪個，
     * 異常文字固定。
     */

    whisper();


    /*
     * 額外依照選項給不同細微音效
     */

    if(answer===0){

        tone(
            58,
            .35,
            .025,
            "sine"
        );

    }
    else if(answer===1){

        tone(
            72,
            .25,
            .02,
            "sine"
        );

    }
    else if(answer===2){

        tone(
            45,
            .40,
            .025,
            "sine"
        );

    }
    else{

        footstep();

    }


    setTimeout(
        ()=>{
            fakeEnding();
        },
        1100
    );
}


/* =========================================================
   最後限時題逾時
========================================================= */

function finishThreeSecond(){

    hideThreeSecond();


    whisper();


    setTimeout(
        ()=>{
            fakeEnding();
        },
        1100
    );
}


/* =========================================================
   隱藏限時題
========================================================= */

function hideThreeSecond(){

    document
        .getElementById("threeSecond")
        .classList
        .remove("show");
}


/* =========================================================
   假結束
========================================================= */

function fakeEnding(){

    document.body.className="horror";


    document.getElementById("app").innerHTML=`

        <div class="card">

            <h1>
                測驗結束
            </h1>

            <div class="subtitle">

                </p>

        </div>

    setTimeout(

    );
}


/* =========================================================

========================================================= */

function finalEndingGlitch(){

    );

    );

        },

    );

    );

    );

/* =========================================================
   再次測驗
   重要：
   這裡恢復正常白色頁面
========================================================= */

function returnNormalPage(){

     * 再次測驗介面恢復正常顏色。
     */

            <h1>
                親密關係傾向測驗

/* =========================================================
   404
========================================================= */

function go404(){

    /*
     * 再次測試不重新開始。
     *
     * 直接前往不存在的路徑。
     */

    window.location.href=
        "/20260707/retest/";
}


/* =========================================================
   第六補充題
   喜歡／不喜歡／不知道／討厭
========================================================= */

function showLoveQuestion(){

    document.body.className="horror";


    loveAnswers=[

        "喜歡",
        "不喜歡",
        "不知道",
        "討厭"

    ];


    renderLoveQuestion();
}


/* =========================================================
   顯示第六題
========================================================= */

function renderLoveQuestion(){

    document.getElementById("app").innerHTML=`

        <div class="card">

            <div class="love-box">

                <div class="question-number">
                    補充問題 6 / 6
                </div>

                <div class="love-question">
                    你喜歡我嗎？
                </div>

                <div class="love-subtitle">
                    請選擇一個答案。
                </div>

                <div
                    class="love-options"
                    id="loveOptions"
                ></div>

            </div>

        </div>
    `;


    const container=
        document.getElementById(
            "loveOptions"
        );


    loveAnswers.forEach(
        (answer,index)=>{

            const button=
                document.createElement(
                    "button"
                );


            button.className=
                "love-option";


            button.textContent=
                answer;


            button.onclick=
                ()=>{
                    chooseLoveAnswer(
                        index
                    );
                };


            container.appendChild(button);

        }
    );
}


/* =========================================================
   喜歡題邏輯
========================================================= */

function chooseLoveAnswer(index){

    const buttons=
        document.querySelectorAll(
            ".love-option"
        );


    /*
     * 原本就是「喜歡」
     * 不需要改變。
     */

    if(
        loveAnswers[index]==="喜歡"
    ){

        buttons[index].classList.add(
            "changed"
        );


        tone(
            310,
            .22,
            .025,
            "sine"
        );


        setTimeout(
            ()=>{
                loveQuestionFinished();
            },
            700
        );


        return;
    }


    /*
     * 任何其他答案
     * 都會被改成喜歡。
     */

    loveAnswers[index]="喜歡";


    buttons[index].textContent=
        "喜歡";


    buttons[index].classList.add(
        "changed"
    );


    tone(
        95,
        .20,
        .035,
        "sine"
    );


    setTimeout(
        ()=>{
            buttons[index].classList.remove(
                "changed"
            );
        },
        650
    );


    /*
     * 玩家仍然可以繼續點其他選項。
     */

    const allLove=
        loveAnswers.every(
            value=>value==="喜歡"
        );


    if(allLove){

        setTimeout(
            ()=>{
                loveQuestionFinished();
            },
            800
        );

    }
}


/* =========================================================
   喜歡題結束
========================================================= */

function loveQuestionFinished(){

    document.body.className="horror";


    document.getElementById("app").innerHTML=`

        <div class="card">

            <div class="dialogue">

                <div class="dialogue-speaker">
                    ……
                </div>

                <div class="dialogue-text">
                    這樣就對了。
                </div>

            </div>

        </div>
    `;


    setTimeout(
        ()=>{
            loveFinalSequence();
        },
        1500
    );
}


/* =========================================================
   喜歡題後劇情
========================================================= */

function loveFinalSequence(){

    showDialogue(

        "四個答案都一樣了。\n\n" +
        "現在你應該知道要怎麼回答了。",

        ()=>{

            setTimeout(
                ()=>{
                    finalDoorSequence();
                },
                1200
            );

        }

    );
}
