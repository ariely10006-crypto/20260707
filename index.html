<!doctype html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>親密關係傾向測驗</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;background:#f1eeeb;color:#45403d;transition:2s;overflow-x:hidden}#app{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:22px}.card{width:680px;max-width:94vw;padding:40px;background:#fff;border:1px solid #ddd7d3;box-shadow:0 15px 50px #2d1e1914}h1{text-align:center;font-weight:400;letter-spacing:4px}.subtitle{text-align:center;color:#aaa;font-size:11px;letter-spacing:2px;margin-bottom:30px}.description{line-height:2;color:#696360}.start-btn,.option{font-family:inherit;cursor:pointer}.start-btn{display:block;margin:30px auto;padding:12px 42px;background:#fff;border:1px solid #aaa;color:#514a47}.question-number{color:#aaa;font-size:12px;margin-bottom:20px}.question{font-size:20px;line-height:1.8;margin-bottom:22px}.options{display:flex;flex-direction:column;gap:9px}.option{width:100%;padding:14px 16px;text-align:left;background:#fff;border:1px solid #d8d2cf;color:#403b39}.option:hover{background:#f5efec}.option.selected{background:#eee5e1;border-color:#927067}.option.fade{opacity:0;pointer-events:none}.feedback{min-height:28px;margin-top:18px;color:#8c8581;line-height:1.8}.progress{height:2px;background:#e6dfdc;margin-top:28px}.progress-bar{height:100%;background:#99786f}body.horror{background:radial-gradient(circle at 50% 40%,#4b2927,#291514 50%,#090505);color:#ddd0cc}body.horror .card{background:#1b0e0ef2;border-color:#67433e;box-shadow:0 25px 90px #000a}body.horror h1,body.horror .question{color:#dfccc7}body.horror .option{background:#241413;color:#d6c4bf;border-color:#62413c}body.horror .feedback{color:#aa8b85}.dialogue{text-align:center;min-height:230px;display:flex;flex-direction:column;justify-content:center}.dialogue-speaker{font-size:10px;letter-spacing:4px;color:#88615b;margin-bottom:24px}.dialogue-text{min-height:90px;font-size:19px;line-height:2;color:#d8c5c0;white-space:pre-line}.dialogue-options{margin-top:22px;display:flex;flex-direction:column;gap:8px}#noise{position:fixed;inset:0;z-index:9999;pointer-events:none;opacity:0;background:repeating-linear-gradient(0deg,#fff2 0 1px,#0003 1px 3px);mix-blend-mode:screen}#noise.active{animation:noise .7s steps(7)}@keyframes noise{0%,100%{opacity:0}20%{opacity:.3}45%{opacity:.05}65%{opacity:.25}}#darkTransition{position:fixed;inset:0;z-index:3000;pointer-events:none;opacity:0;background:radial-gradient(circle,#5f1e1905,#080303f0);transition:opacity 5s}#darkTransition.active{opacity:.58}#whisper{position:fixed;left:50%;bottom:11%;transform:translateX(-50%);z-index:4000;color:#884a43;font-size:12px;letter-spacing:3px;opacity:0;pointer-events:none;white-space:nowrap}#whisper.show{animation:wh 4s forwards}@keyframes wh{0%{opacity:0}20%{opacity:.65}40%{opacity:.13}65%{opacity:.48}100%{opacity:0}}#twoSecond{position:fixed;inset:0;z-index:6000;display:flex;align-items:center;justify-content:center;background:#050303f5;opacity:0;pointer-events:none;transition:.15s}#twoSecond.show{opacity:1;pointer-events:auto}.two-box{width:650px;max-width:90vw;text-align:center;color:#ddcbc6}.two-small{font-size:10px;letter-spacing:5px;color:#906d67;margin-bottom:28px}.two-title{font-size:21px;line-height:2;margin-bottom:25px}.two-option{display:block;width:100%;max-width:430px;margin:8px auto;padding:12px;background:#311816ba;color:#d1bdb8;border:1px solid #68413c;font-family:inherit;cursor:pointer}.two-timer{height:2px;max-width:430px;margin:25px auto;background:#382321}.two-timer-bar{height:100%;background:#985b53}@keyframes t2{from{width:100%}to{width:0}}.result-line{opacity:0;text-align:center;font-size:17px;line-height:2;color:#bca9a4;transition:.7s;transform:translateY(5px)}.result-line.show{opacity:1;transform:none}.result-type{text-align:center;font-size:24px;letter-spacing:3px;color:#dfccc7;margin:10px 0 24px}.final-wait{text-align:center;font-size:20px;letter-spacing:4px;color:#9a756e;margin-top:25px;opacity:0;animation:wait 2s forwards}@keyframes wait{to{opacity:1}}@media(max-width:600px){.card{padding:27px 21px}.question{font-size:18px}}
</style></head><body><div id="noise"></div><div id="darkTransition"></div><div id="whisper"></div><div id="twoSecond"><div class="two-box"><div class="two-small">請立即回答</div><div class="two-title">如果我現在就在門外，你覺得我會做什麼？</div><button class="two-option" onclick="answer11(0)">A．敲門</button><button class="two-option" onclick="answer11(1)">B．等你開門</button><button class="two-option" onclick="answer11(2)">C．直接離開</button><button class="two-option" onclick="answer11(3)">D．不知道</button><div class="two-timer"><div class="two-timer-bar" id="twoBar"></div></div></div></div><div id="app"></div><script>
const N=[
['當你情緒低落時，你最希望喜歡的人怎麼做？',['陪我聊聊天。','先給我一點空間。','直接問我發生了什麼。','陪在旁邊，不一定要說話。']],
['你認為戀人之間需要知道彼此每天的行程嗎？',['不用，彼此都有自己的生活。','大概知道就好。','如果對方願意，我會想知道。','重要的事情可以互相說。']],
['如果對方一整天沒有主動找你，你會？',['做自己的事情。','晚一點再傳訊息。','有點想知道他在忙什麼。','如果和平常差很多，會問問。']],
['如果對方說今天想一個人，你會？',['尊重他的決定。','告訴他需要時可以找我。','有點失落，但還是會給空間。','等他自己願意說。']],
['如果你傳了一則訊息，對方兩個小時都沒有回，你會？',['沒關係，他可能在忙。','偶爾看一下手機。','有點期待通知。','如果很反常，會稍微擔心。']],
['你覺得戀人應該知道彼此的手機密碼嗎？',['不用。','知道也沒關係，但不需要查看。','如果彼此願意可以交換。','我比較重視信任，而不是密碼。']],
['如果對方突然取消原本約好的見面，你會？',['沒關係，下次再約。','問問是不是發生了什麼。','會有一點失望。','看取消的理由。']],
['如果你發現對方已讀了訊息，卻沒有回覆，你會？',['等他有時間再回。','過一陣子再看看。','會稍微想一下是不是說錯了什麼。','如果一直沒有回，會再問一次。']],
['平常很快回你的人，突然六個小時沒有回覆，你會？',['他可能真的很忙。','等明天再看看。','會覺得有一點奇怪。','會傳一句「還好嗎？」']],
['你認為一段健康的關係最重要的是什麼？',['信任。','溝通。','陪伴。','彼此尊重。']]
];
const F=[['你似乎比較重視陪伴，而不是立即得到答案。','你會給對方空間。','你希望對方直接理解你的情緒。','你在意有人安靜地陪著你。'],['你重視自己的生活界線。','你願意分享，但不希望被要求交代。','你對彼此的生活有一定程度的好奇。','你傾向把重要的事情說清楚。'],['你不太容易被單次的沉默影響。','你會先觀察，再決定要不要聯絡。','你會注意對方的動向。','異常的改變會讓你想確認對方是否安好。'],['你願意尊重對方的獨處時間。','你會留下聯絡的可能。','你雖然失落，但仍會給空間。','你比較傾向等對方主動。'],['你會把沒有回覆理解成可能的忙碌。','你會留意手機，但不一定會追問。','你會期待通知。','你會根據平常的習慣判斷是否異常。'],['你把信任和界線分得很清楚。','你接受透明，但不認為查看是必要的。','你願意在雙方同意下分享。','你更看重互相信任。'],['你能接受計畫改變。','你會先確認原因。','你會感到失望，但不一定追究。','你會依照情況判斷。'],['你傾向給對方時間。','你會再觀察。','你可能會反思自己是不是說了什麼。','你會希望得到一個明確回覆。'],['你會先相信對方可能正在忙。','你願意等待。','你會注意和平常不同的地方。','你會主動確認狀況。'],['你把關係建立在多個因素上，而不是單一答案。','你很重視說清楚。','你在意彼此的陪伴。','你重視界線與尊重。']];
/* 最終五題：補1沿用原補1；補2～5依最後決定 */
const S=[
['如果你的伴侶希望知道你每天去了哪裡，你會覺得？',['這很正常，偶爾分享就好。','可以說，但不需要事事交代。','如果對方一直追問，我會有點不舒服。','我會希望彼此保有自己的空間。']],
['你現在是一個人嗎？',['是。','不是。','為什麼要問這個？','……']],
['你現在在哪裡？',['在家。','在房間。','在學校。','不告訴你。']],
['如果你發現對方總能很快知道你今天去了哪些地方，你會？',['覺得只是剛好。','問問他怎麼知道的。','開始注意這件事。','覺得有點不舒服。']],
['你喜不喜歡我？',['喜歡','不喜歡','不知道','討厭']]
];
let phase='normal',i=0,A=[],SA=[],timer=null,locked=false,audio=null,likes=['喜歡','不喜歡','不知道','討厭'];
function audioOn(){try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();audio.resume()}catch(e){}}
function tone(f,d,v){if(!audio)return;let o=audio.createOscillator(),g=audio.createGain();o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+d)}
function knock(){tone(75,.12,.25)}function triple(){knock();setTimeout(knock,500);setTimeout(knock,1000)}function hum(){tone(47,1.6,.025)}
function whisper(t){let e=document.getElementById('whisper');e.textContent=t;e.classList.remove('show');void e.offsetWidth;e.classList.add('show')}
function noise(){let e=document.getElementById('noise');e.classList.remove('active');void e.offsetWidth;e.classList.add('active')}
function mode(h){document.body.classList.toggle('horror',h)}
function home(){mode(false);app.innerHTML='<div class="card"><h1>親密關係傾向測驗</h1><div class="subtitle">RELATIONSHIP & ATTACHMENT TEST</div><div class="description"><p>歡迎參與本次匿名情感傾向測驗。</p><p>以下問題沒有標準答案，請依照你的第一直覺回答。</p><p>測驗約需 3～5 分鐘。</p><p style="color:#aaa;font-size:12px">本測驗僅供娛樂使用，不代表正式心理評估。</p></div><button class="start-btn" onclick="start()">開始測驗</button></div>'}home();
function start(){audioOn();phase='normal';i=0;A=[];SA=[];mode(false);show()}
function show(){let list=phase==='normal'?N:S;if(i>=list.length){return phase==='normal'?show11():showLike()}let q=list[i],num=phase==='normal'?`第 ${i+1} 題 / 共 10 題`:`補充問題 ${i+1} / 5`;app.innerHTML=`<div class="card"><div class="question-number">${num}</div><div class="question">${q[0]}</div><div class="options" id="opts"></div><div class="feedback" id="fb"></div><div class="progress"><div class="progress-bar" style="width:${i/list.length*100}%"></div></div></div>`;q[1].forEach((x,k)=>{let b=document.createElement('button');b.className='option';b.textContent=String.fromCharCode(65+k)+'．'+x;b.onclick=()=>choose(k);opts.appendChild(b)})}
function choose(k){let bs=document.querySelectorAll('.option');bs.forEach(b=>b.disabled=true);bs[k].classList.add('selected');let fb=document.getElementById('fb');if(phase==='normal'){A.push(k);fb.textContent=F[i][k];if(i===9)setTimeout(()=>whisper('你的答案，我都記得。'),600)}else{SA.push(k);if(i===1)fb.textContent=['那要注意安全。','還有誰在？','因為我想更了解你。','……你為什麼不回答？'][k];if(i===2)fb.textContent='嗯，我知道';if(i===3){if(SA[1]===0)setTimeout(()=>{tone(65,.1,.1);setTimeout(()=>tone(55,.1,.08),180)},500);else if(SA[1]===1)setTimeout(knock,500);else setTimeout(hum,500)}};bs.forEach((b,n)=>{if(n!==k)setTimeout(()=>b.classList.add('fade'),100)});i++;setTimeout(show,720)}
function show11(){mode(true);let p=document.getElementById('twoSecond');p.classList.add('show');let bar=document.getElementById('twoBar');bar.style.animation='none';void bar.offsetWidth;bar.style.animation='t2 2s linear forwards';locked=false;clearTimeout(timer);hum();timer=setTimeout(()=>{if(!locked)timeout11()},2000)}
function answer11(k){if(locked)return;locked=true;clearTimeout(timer);document.getElementById('twoSecond').classList.remove('show');let r=['猜對了','幫幫我嘛~','這麼討厭我T_T','真的不知道嗎?'];whisper(r[k]);if(k===0)triple();setTimeout(showResult,1200)}
function timeout11(){locked=true;document.getElementById('twoSecond').classList.remove('show');whisper('你不想回我嗎?T^T');setTimeout(showResult,1200)}
function showResult(){mode(false);let R=[['穩定型',['你通常願意給對方空間。','你重視信任，也不希望關係變成束縛。','即使在意，你仍會試著先理解對方。']],['溫和關心型',['你很在意對方的感受。','當關係出現異常時，你會慢慢注意到。','你希望有人陪伴，也希望彼此能說清楚。']],['觀察型',['你不會因為一次沉默就立刻下結論。','你會觀察對方平常的習慣，再判斷事情是否不對勁。','你在關係裡有自己的界線。']],['重視陪伴型',['你很看重有人願意留在身邊。','比起華麗的承諾，你更容易被實際的陪伴打動。','你希望喜歡的人能理解你的情緒。']]];let r=R[Math.floor(Math.random()*R.length)];app.innerHTML='<div class="card"><h1>你的測驗結果</h1><div class="subtitle">RESULT</div><div class="result-type">'+r[0]+'</div><div id="rl"></div></div>';r[1].forEach((x,k)=>{let e=document.createElement('div');e.className='result-line';e.textContent=x;rl.appendChild(e);setTimeout(()=>e.classList.add('show'),500+k*1100)});setTimeout(soft,500+r[1].length*1100+700)}
function soft(){mode(true);let lines=['原來你是這樣想的。','謝謝你願意把這些答案告訴我。','不管你剛才選了什麼，我都記得。','如果有一天你覺得累了，也可以先停一下。','不用急著回答我。','我會在這裡等你。'];app.innerHTML='<div class="card"><div class="dialogue"><div class="dialogue-speaker">……</div><div class="dialogue-text" id="soft"></div></div></div>';lines.forEach((x,k)=>setTimeout(()=>soft.textContent+=(k?'\n':'')+x,500+k*750));setTimeout(()=>{mode(false);document.getElementById('darkTransition').classList.add('active');setTimeout(()=>{document.getElementById('darkTransition').classList.remove('active');mode(true);showSuppNotice()},2800)},500+lines.length*750+700)}
function showSuppNotice(){app.innerHTML='<div class="card"><h1>補充確認</h1><div class="description"><p>還有幾項資料需要確認。</p><p>這些問題不會改變原始測驗的分類。</p><p style="color:#9a756e">我還有幾個問題想問你。</p></div><button class="start-btn" onclick="startSupp()">繼續</button></div>'}
function startSupp(){phase='supplement';i=0;SA=[];mode(true);show()}
function showLike(){mode(true);likes=['喜歡','不喜歡','不知道','討厭'];app.innerHTML='<div class="card"><div class="question-number">補充問題 5</div><div class="question" style="text-align:center">你喜不喜歡我？</div><div class="options" id="likes"></div><div class="feedback" id="lf"></div></div>';renderLikes()}
function renderLikes(){likes.innerHTML='';likes.forEach((x,k)=>{let b=document.createElement('button');b.className='option';b.textContent=String.fromCharCode(65+k)+'．'+x;b.onclick=()=>like(k);likes.appendChild(b)})}
function like(k){let x=likes[k],f=document.getElementById('lf');if(x==='喜歡'){document.querySelectorAll('#likes .option').forEach(b=>b.disabled=true);f.textContent='嗯。這樣就好了。';setTimeout(()=>showDialogue('我就知道。',doorStart),900);return}let R={'不喜歡':['……不喜歡？','你真的要這樣回答我嗎？','我有點難過。','可是我明明一直都在等你。','再想一次。'],'不知道':['不知道？','你連這個都不知道嗎？','明明答案就在那裡。','你只是還不願意說。','沒關係，我可以等。'],'討厭':['……討厭？','你真的討厭我？','這句話我不喜歡。','再說一次。','不要這樣回答我。']};f.textContent=R[x][0];noise();setTimeout(()=>{likes[k]='喜歡';renderLikes();document.getElementById('lf').textContent='……好。這樣就好了。'},1000)}
function showDialogue(t,next,os=[]){mode(true);app.innerHTML='<div class="card"><div class="dialogue"><div class="dialogue-speaker">……</div><div class="dialogue-text">'+t+'</div><div class="dialogue-options" id="dos"></div></div></div>';if(os.length)os.forEach(o=>{let b=document.createElement('button');b.className='option';b.textContent=o.t;b.onclick=o.a;dos.appendChild(b)});else if(next)setTimeout(next,1100)}
function doorStart(){showDialogue('我記得你剛才的回答。\n\n剛才……門那邊是不是有聲音？',null,[{t:'好像有。',a:()=>door(0)},{t:'沒有吧。',a:()=>door(1)},{t:'我不知道。',a:()=>door(2)}])}
function door(k){if(k===0){knock();setTimeout(()=>showDialogue('……對。\n\n就在那裡。',nextDoor),900)}else if(k===1){showDialogue('沒有嗎？\n\n可能是我聽錯了。',()=>{setTimeout(knock,500);setTimeout(nextDoor,1300)})}else showDialogue('不知道也沒關係。\n\n再聽一次就好了。',()=>{knock();setTimeout(knock,700);setTimeout(nextDoor,1600)})}
function nextDoor(){showDialogue('我在外面。\n\n你不用開門。\n\n我只是想跟你說幾句話。',null,[{t:'我會回答你。',a:()=>finalQ()},{t:'你是誰？',a:()=>showDialogue('你真的還不知道嗎？',finalQ)},{t:'離開。',a:()=>showDialogue('好。\n\n我先不說話。',finalQ)}])}
function finalQ(){showDialogue('最後一個問題。\n\n如果我現在敲門，你會開門嗎？',null,[{t:'會。',a:()=>ending('open')},{t:'不會。',a:()=>ending('closed')},{t:'我不知道。',a:()=>ending('unknown')},{t:'不要再問了。',a:()=>ending('stop')}])}
function ending(t){let x=t==='open'?'門已經打開了。\n\n可是你什麼時候答應讓我進來的？':t==='closed'?'門可以一直關著。\n\n你總會再回來的。':t==='unknown'?'現在呢？':'有些答案，不需要說出來。';showDialogue(t==='open'?'那我進來了。':t==='closed'?'我會等。':t==='unknown'?'那我替你決定。':'我不問了。',()=>endText(x))}
function endText(x){app.innerHTML='<div class="card"><div class="dialogue"><div class="dialogue-speaker">……</div><div class="dialogue-text">'+x+'</div><div class="final-wait">我永遠等你。</div></div></div>';setTimeout(fake,3000)}
function fake(){app.innerHTML='<div class="card"><h1>測驗結束</h1><div class="description" style="text-align:center"><p>所有問題均已完成。</p><p>……</p></div></div>';setTimeout(()=>{noise();knock();setTimeout(knock,700);setTimeout(()=>{mode(false);app.innerHTML='<div class="card"><h1>親密關係傾向測驗</h1><div class="description"><p>歡迎再次進行測驗。</p><p>如果剛才的結果不符合你的想法，可以重新測試一次。</p></div><button class="start-btn" onclick="location.reload()">再次測試</button></div>'},2200)},1200)}
</script></body></html>
